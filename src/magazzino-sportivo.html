const dlg=$('#dlg'),form=$('#dlgForm');let _submit=null;
function openDlg(html,onSubmit){form.innerHTML=html;_submit=onSubmit;dlg.showModal();const f=form.querySelector('input,select,textarea');if(f)f.focus()}
function closeDlg(){dlg.close();_submit=null}
form.addEventListener('submit',async e=>{e.preventDefault();const btn=e.submitter;if(btn&&btn.value==='cancel'){closeDlg();return}
  if(!_submit)return closeDlg();const fd=Object.fromEntries(new FormData(form).entries());fd._all=new FormData(form);
  form.querySelectorAll('button').forEach(b=>b.disabled=true);
  const ok=await _submit(fd,btn&&btn.value);form.querySelectorAll('button').forEach(b=>b.disabled=false);if(ok!==false)closeDlg()});
dlg.addEventListener('click',e=>{if(e.target===dlg)closeDlg()});
form.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing)return;
  const t=e.target;if(!t||!/^(INPUT|SELECT)$/.test(t.tagName)||t.type==='checkbox')return;
  const principale=form.querySelector('.dlg-actions .primary');if(!principale)return;
  e.preventDefault();form.requestSubmit(principale)});
const actions=(label,extra='')=>`<div class="dlg-actions">${extra}<button class="btn" value="cancel" formnovalidate>Annulla</button><button class="btn primary" value="ok">${label}</button></div>`;

/* Serve sia per crearne una sia per correggerne una: quello che cambia e' il
   titolo, i valori di partenza, e se alla fine si aggiunge o si salva. */
function dlgRichiesta(aid,rid){
  const D=derive();const a=S.atlete[aid];const arts=[...(D.set.articoli||[])].sort(perNome);
  const vecchia=rid?S.richieste[rid]:null;
  const sizesFor=n=>{const x=arts.find(z=>z.nome===n);return x?x.taglie:[]};
  const first=vecchia?vecchia.articolo:(arts[0]?arts[0].nome:'');
  openDlg(`<h2>${vecchia?'Modifica richiesta':'Nuova richiesta'}</h2><p class="sub">${esc(fullName(a))} · ${esc(teamLabel(a.squadra))}</p>
  <div class="field"><label for="rArt">Articolo</label><select id="rArt" name="articolo">${arts.map(x=>`<option value="${esc(x.nome)}"${x.nome===first?' selected':''}>${esc(artLabel(x.nome))}</option>`).join('')}</select></div>
  <div class="two"><div class="field"><label for="rTg">Taglia</label><select id="rTg" name="taglia">${sizesFor(first).map(t=>`<option${vecchia&&vecchia.taglia===t?' selected':''}>${esc(t)}</option>`).join('')}</select></div>
  <div class="field" id="fMod"><label for="rMod">Tipo di divisa</label><select id="rMod" name="modello">${modelliSceglibili(aid).map(m=>`<option value="${esc(m.v)}"${vecchia&&(vecchia.modello||'')===m.v?' selected':''}>${esc(m.t)}</option>`).join('')}</select></div></div>
  <div class="field" id="fNum"><label for="rNum">Numero desiderato (facoltativo)</label><input type="number" id="rNum" name="numero" min="0" max="99" inputmode="numeric" value="${vecchia&&vecchia.numeroDesiderato!=null?esc(vecchia.numeroDesiderato):''}"></div>
  <div class="field"><label for="rNote">Nota</label><input type="text" id="rNote" name="note" maxlength="200" value="${esc((vecchia&&vecchia.note)||'')}"></div>
  ${vecchia?actions('Salva'):actions('Aggiungi richiesta',`<button class="btn" value="again" style="margin-right:auto">Aggiungi e continua</button>`)}`,
  async(fd,btn)=>{
    const isNum=D.conNumero(fd.articolo);
    const corpo={articolo:fd.articolo,taglia:fd.taglia,modello:isNum?fd.modello:'',
      numeroDesiderato:isNum&&fd.numero!==''?Number(fd.numero):null,note:fd.note||''};
    if(vecchia){
      const ok=await w(()=>S.db.doc('richieste/'+rid).update(corpo));
      if(ok)toast('Richiesta modificata');
      return ok}
    const ok=await w(()=>S.db.collection('richieste').add({atletaId:aid,...corpo,ordine:Date.now()}));
    if(ok){toast('Richiesta aggiunta');if(btn==='again'){form.querySelector('#rNum').value='';form.querySelector('#rNote').value='';return false}}
    return ok});
  const upd=()=>{const n=$('#rArt').value;const tenuta=$('#rTg').value;
    $('#rTg').innerHTML=sizesFor(n).map(t=>`<option${t===tenuta?' selected':''}>${esc(t)}</option>`).join('');const isN=D.conNumero(n);$('#fMod').style.display=isN?'':'none';$('#fNum').style.display=isN?'':'none'};
  $('#rArt').addEventListener('change',upd);upd();
}
/* Consegna senza passare da una richiesta. In palestra, con l'atleta davanti,
   segnare prima la richiesta e poi consegnarla erano due passaggi per una cosa
   sola. Qui si sceglie il capo e si registra.

   E' anche l'unico posto dove la divisa si sceglie a mano, una per una: la
   consegna che parte da una richiesta propone lei quale capo prendere. */
/* Un movimento scritto a mano. Serve per il materiale che esce dal magazzino verso
   qualcuno che non e' un atleta: un allenatore, un dirigente, un esterno, o lo
   smaltimento di una scorta vecchia. Il magazzino cala lo stesso; quello che
   cambia e' che non finisce nella dotazione di nessuno.

   Solo materiale: una divisa da gara e' un capo fisico con un numero e un
   proprietario, e si assegna dalla scheda dell'atleta. */
function dlgMovimento(nomeFuori){
  const D=derive();
  const arts=(D.set.articoli||[]).filter(x=>!D.conNumero(x.nome)).sort(perNome);
  if(!arts.length){toast('Nessun articolo di materiale disponibile');return}
  const taglieDi=n=>{const x=arts.find(z=>z.nome===n);const t=new Set(x?x.taglie:[]);
    for(const k of Object.keys(D.stock))if(k.startsWith(n+'|'))t.add(k.split('|')[1]);
    return [...t].sort((p,q)=>szIdx(p)-szIdx(q))};
  const vociTaglia=n=>{const t=taglieDi(n);
    if(!t.length)return '<option value="">nessuna taglia</option>';
    return t.map(x=>{const st=(D.stock[D.key(n,x)]||{ora:0}).ora;
      return `<option value="${esc(x)}">${x==='UNICA'?'taglia unica':esc(x)} — ${st} in magazzino</option>`}).join('')};
  const first=arts[0].nome;
  // Raggruppati per squadra: in un elenco di centoquaranta nomi di fila non si
  // trova niente.
  const vociAtleti=()=>D.perServire.map(sq=>{
    const dentro=Object.entries(S.atlete).filter(([,x])=>x.squadra===sq.nome&&puoRicevere(x))
      .sort((x,y)=>norm(fullName(x[1])).localeCompare(norm(fullName(y[1]))));
    if(!dentro.length)return '';
    return `<optgroup label="${esc(teamLabel(sq.nome))}">`
      +dentro.map(([id,x])=>`<option value="${esc(id)}">${esc(fullName(x))}</option>`).join('')+`</optgroup>`}).join('');

  openDlg(`<h2>Registra movimento</h2><p class="sub">Per il materiale che entra o esce dal magazzino al di fuori delle richieste: consegne a un atleta, allo staff o a esterni, oppure scorte da smaltire.</p>
  <div class="field"><label for="mTipo">Cosa succede</label><select id="mTipo" name="tipo">
    <option value="CONSEGNA">Esce dal magazzino</option>
    <option value="RIENTRO">Torna in magazzino</option></select></div>
  <div class="field"><label for="mArt">Articolo</label><select id="mArt" name="articolo">${arts.map(x=>`<option value="${esc(x.nome)}">${esc(artLabel(x.nome))}</option>`).join('')}</select></div>
  <div class="two"><div class="field"><label for="mTg">Taglia</label><select id="mTg" name="taglia">${vociTaglia(first)}</select></div>
  <div class="field"><label for="mQta">Quanti pezzi</label><input type="number" id="mQta" name="qta" min="1" max="999" value="1" inputmode="numeric"></div></div>
  <div class="field"><label for="mChi" id="lChi">A chi</label><select id="mChi" name="chi">
    <option value="">Fuori squadra: indicare il nome</option>${vociAtleti()}</select></div>
  <div class="field" id="fFuori"><label for="mFuori">Nome e ruolo</label><input type="text" id="mFuori" name="a" maxlength="80" placeholder="per esempio: allenatore della prima squadra"></div>
  <div class="field"><label for="mNote">Nota</label><input type="text" id="mNote" name="note" maxlength="200"></div>
  ${actions('Registra')}`, async fd=>{
    const aid=fd.chi||'';
    const chi=(fd.a||'').trim();
    if(!aid&&!chi){toast('Selezionare un atleta oppure indicare il destinatario');return false}
    const tg=fd.taglia;if(!tg){toast('Selezionare la taglia');return false}
    const qta=Math.max(1,Number(fd.qta)||1);
    const st=(D.stock[D.key(fd.articolo,tg)]||{ora:0}).ora;
    if(fd.tipo==='CONSEGNA'&&st<qta&&!await chiedi(`In magazzino ne risultano ${st}. Registrare comunque l’uscita di ${qta}?`))return false;
    // Consegnando a un atleta si chiudono le sue richieste per quella cosa:
    // se no restano aperte e finiscono anche fra quelle da ordinare.
    const chiuse=aid&&fd.tipo==='CONSEGNA'?richiesteCoperte(aid,fd.articolo,tg,qta):[];
    if(aid&&fd.tipo==='RIENTRO'){const ha=((D.dotazione[aid]||{})[D.key(fd.articolo,tg)])||0;
      if(qta>ha){toast(ha?`Risultano consegnati solo ${ha} pezzi a questo atleta`:'A questo atleta non risulta consegnato questo articolo');return false}}
    const ok=await w(()=>insieme(async()=>{
      await mov({tipo:fd.tipo,articolo:fd.articolo,taglia:tg,qta,
        atletaId:aid||null,a:aid?'':chi,note:fd.note||'',...(chiuse.length?{richieste:chiuse.map(fotoRichiesta)}:{})});
      for(const rid of chiuse)await S.db.doc('richieste/'+rid).delete()}));
    const nome=aid?fullName(S.atlete[aid]):chi;
    if(ok)toast((fd.tipo==='CONSEGNA'?`${qta} ${qta===1?'pezzo consegnato':'pezzi consegnati'} a ${nome}`:`${qta} ${qta===1?'pezzo rientrato':'pezzi rientrati'} da ${nome}`)
      +(chiuse.length?`, ${chiuse.length===1?'richiesta chiusa':chiuse.length+' richieste chiuse'}`:''));
    return ok});

  if(nomeFuori){$('#mChi').value='';$('#mFuori').value=nomeFuori}
  const agg=()=>{$('#mTg').innerHTML=vociTaglia($('#mArt').value);
    $('#lChi').textContent=$('#mTipo').value==='CONSEGNA'?'A chi':'Da chi';
    $('#fFuori').style.display=$('#mChi').value?'none':''};
  $('#mArt').addEventListener('change',agg);
  $('#mTipo').addEventListener('change',agg);
  $('#mChi').addEventListener('change',agg);
  agg();
}
function dlgDiretta(aid){
  const D=derive();const a=S.atlete[aid];
  if(!puoRicevere(a)){toast(a&&a.inUscita?'L\u2019atleta \u00e8 in uscita: non riceve altre consegne':'L\u2019atleta non \u00e8 attivo: non riceve consegne');return}
  const arts=(D.set.articoli||[]).filter(x=>x.distribuibile!==false).sort(perNome);
  if(!arts.length){toast('Non c’è nessun articolo da consegnare');return}

  // Le divise libere del lotto scelto: in magazzino, oppure in rientro da
  // qualcun altro (in quel caso si registra anche la sua restituzione).
  const lottoVero=v=>D.modelloPer({atletaId:aid,modello:v||''});
  const occupati=D.occ[a.squadra]||new Set();
  const libere=mod=>Object.entries(S.divise)
    .filter(([id,d])=>!d.dismessa&&(d.modello||'STANDARD')===mod&&(!d.holder||d.daRestituire)
      &&!occupati.has(Number(d.numero))&&numeroDaDare(D,a.squadra,aid,d))
    .sort((x,y)=>szIdx(x[1].taglia)-szIdx(y[1].taglia)||x[1].numero-y[1].numero);
  const vociDivisa=mod=>{const l=libere(mod);
    if(!l.length)return `<option value="">nessuna disponibile col numero libero in ${esc(teamLabel(a.squadra))}</option>`;
    return l.map(([id,d])=>{const stato=[d.holder?'da ritirare a '+fullName(S.atlete[d.holder]):'',
      D.prenDivisa[id]?'già promessa a '+fullName(S.atlete[S.richieste[D.prenDivisa[id]].atletaId]):''].filter(Boolean);
      return `<option value="${esc(id)}">${esc(d.taglia)} n.${d.numero}${stato.length?' — '+esc(stato.join(', ')):''}</option>`}).join('')};

  const taglieDi=n=>{const x=arts.find(z=>z.nome===n);const t=new Set(x?x.taglie:[]);
    for(const k of Object.keys(D.stock))if(k.startsWith(n+'|'))t.add(k.split('|')[1]);
    return [...t].sort((p,q)=>szIdx(p)-szIdx(q))};
  const vociTaglia=n=>{const t=taglieDi(n);
    if(!t.length)return '<option value="">nessuna taglia</option>';
    return t.map(x=>{const st=(D.stock[D.key(n,x)]||{ora:0}).ora;
      return `<option value="${esc(x)}">${x==='UNICA'?'taglia unica':esc(x)} — ${st} in magazzino</option>`}).join('')};

  const first=arts[0].nome;
  openDlg(`<h2>Consegna diretta</h2><p class="sub">${esc(fullName(a))} · ${esc(teamLabel(a.squadra))}. Registra la consegna adesso, senza passare da una richiesta.</p>
  <div class="field"><label for="dArt">Articolo</label><select id="dArt" name="articolo">${arts.map(x=>`<option value="${esc(x.nome)}">${esc(artLabel(x.nome))}</option>`).join('')}</select></div>
  <div class="field" id="dfMod"><label for="dMod">Tipo di divisa</label><select id="dMod" name="modello">${modelliSceglibili(aid).map(m=>`<option value="${esc(m.v)}">${esc(m.t)}</option>`).join('')}</select></div>
  <div class="field" id="dfCapo"><label for="dCapo">Quale capo</label><select id="dCapo" name="divisaId"></select></div>
  <div class="two" id="dfMat"><div class="field"><label for="dTg">Taglia</label><select id="dTg" name="taglia">${vociTaglia(first)}</select></div>
  <div class="field"><label for="dQta">Quanti pezzi</label><input type="number" id="dQta" name="qta" min="1" max="99" value="1" inputmode="numeric"></div></div>
  <div id="dfRit"></div>
  ${actions('Registra consegna')}`, async fd=>{
    const art=fd.articolo;const isNum=D.conNumero(art);
    // La richiesta aperta per la stessa cosa, se c'e', si chiude da sola: se no
    // resterebbe li' a chiedere una cosa gia' consegnata.
    const rid=D.order.find(x=>{const r=S.richieste[x];
      if(!r||r.atletaId!==aid||r.articolo!==art)return false;
      // Per le divise conta anche il lotto: un libero non chiude la richiesta
      // della divisa della squadra.
      return isNum?D.modelloPer(r)===lottoVero(fd.modello):r.taglia===fd.taglia});
    const foto=rid?fotoRichiesta(rid):null;
    if(isNum){
      const did=fd.divisaId;if(!did){toast('Selezionare il capo da consegnare');return false}
      const d=S.divise[did];
      // La regola vale anche qui: dentro una squadra un numero non si ripete.
      const occ=(D.occ[a.squadra]||new Set());
      if(occ.has(Number(d.numero))&&!(S.divise[did].holder===aid)){
        toast(`Il numero ${d.numero} è già assegnato a un altro atleta in ${teamLabel(a.squadra)}`);return false}
      const rit=fd._all.getAll('rit');
      const ok=await w(()=>insieme(async()=>{
        if(d.holder&&d.holder!==aid)
          await mov({tipo:'RIENTRO',atletaId:d.holder,articolo:art,taglia:d.taglia,divisaId:did,numero:d.numero,prevHolder:d.holder,prevDR:!!d.daRestituire,prevTC:d.tagliaChiesta||null,note:'Ritirata per riassegnarla'});
        await S.db.doc('divise/'+did).update({holder:aid,daRestituire:false,tagliaChiesta:null});
        await mov({tipo:'CONSEGNA',atletaId:aid,articolo:art,taglia:d.taglia,divisaId:did,numero:d.numero,prevHolder:null,prevDR:false,...(foto?{richiesta:foto}:{})});
        for(const oid of rit){const od=S.divise[oid];if(!od||od.holder!==aid)continue;
          await S.db.doc('divise/'+oid).update({holder:null,daRestituire:false,tagliaChiesta:null});
          await mov({tipo:'RIENTRO',atletaId:aid,articolo:art,taglia:od.taglia,divisaId:oid,numero:od.numero,prevHolder:aid,prevDR:!!od.daRestituire,prevTC:od.tagliaChiesta||null,note:'Restituita al cambio'})}
        if(rid)await S.db.doc('richieste/'+rid).delete()}));
      if(ok)toast(`Consegnata la ${d.taglia} n.${d.numero}${rid?', richiesta chiusa':''}`);
      return ok}
    const tg=fd.taglia;if(!tg){toast('Selezionare la taglia');return false}
    const qta=Math.max(1,Number(fd.qta)||1);
    const st=(D.stock[D.key(art,tg)]||{ora:0}).ora;
    const altra=collegati(aid).find(x=>Object.entries(D.dotazione[x]||{}).some(([k,v])=>v>0&&k.split('|')[0]===art));
    if(altra&&!await chiedi(`${fullName(a)} ha già ricevuto questo articolo con la scheda di ${teamLabel(S.atlete[altra].squadra)}. Registrare comunque la consegna?`))return false;
    if(st<qta&&!await chiedi(`In magazzino ne risultano ${st}. Registrare comunque la consegna di ${qta}?`))return false;
    const ok=await w(()=>insieme(async()=>{
      await mov({tipo:'CONSEGNA',atletaId:aid,articolo:art,taglia:tg,qta,...(foto?{richiesta:foto}:{})});
      if(rid)await S.db.doc('richieste/'+rid).delete()}));
    if(ok)toast(`${qta} ${qta===1?'pezzo consegnato':'pezzi consegnati'}${rid?', richiesta chiusa':''}`);
    return ok});

  // Divisa o materiale cambiano mezza finestra: si mostra solo quello che serve.
  const agg=()=>{const n=$('#dArt').value;const isN=D.conNumero(n);
    $('#dfMod').style.display=isN?'':'none';
    $('#dfCapo').style.display=isN?'':'none';
    $('#dfMat').style.display=isN?'none':'';
    if(isN){const lot=lottoVero($('#dMod').value);
      $('#dCapo').innerHTML=vociDivisa(lot);
      const own=ownReturning(aid,lot);
      $('#dfRit').innerHTML=own.length?`<p class="sub" style="margin:8px 0 4px">${esc(a.nome)} deve restituire:</p>`
        +own.map(id=>`<label class="check" style="margin:4px 0"><input type="checkbox" name="rit" value="${esc(id)}" checked>${chip(S.divise[id])} ritirata adesso</label>`).join(''):'';
    }else{$('#dTg').innerHTML=vociTaglia(n);$('#dfRit').innerHTML=''}};
  $('#dArt').addEventListener('change',agg);
  $('#dMod').addEventListener('change',agg);
  agg();
}
/* La taglia chiesta non c'e'. Invece di aspettare l'ordine si puo' dare quella
   accanto, e in palestra e' quello che si fa. Qui si vede cosa c'e' davvero,
   partendo dalle taglie piu' vicine a quella chiesta.

   Nell'elenco entrano solo i capi il cui numero e' libero nella squadra: e' la
   regola che non si tocca, un numero non si ripete fra compagne. */
function dlgAltraTaglia(rid){
  const D=derive();const r=S.richieste[rid];if(!r)return;
  const a=S.atlete[r.atletaId];const mod=D.modelloPer(r);
  const occupati=D.occ[a.squadra]||new Set();
  const vicine=Object.entries(S.divise)
    .filter(([id,d])=>!d.dismessa&&(d.modello||'STANDARD')===mod&&(!d.holder||d.daRestituire)
      &&!occupati.has(Number(d.numero))&&numeroDaDare(D,a.squadra,r.atletaId,d))
    .sort((x,y)=>Math.abs(szIdx(x[1].taglia)-szIdx(r.taglia))-Math.abs(szIdx(y[1].taglia)-szIdx(r.taglia))
      ||szIdx(x[1].taglia)-szIdx(y[1].taglia)||x[1].numero-y[1].numero);
  if(!vicine.length){toast('Non c’è nessun capo di questo lotto col numero libero in squadra');return}

  const distanza=t=>{const n=szIdx(t)-szIdx(r.taglia);
    return n===0?'la taglia chiesta':n===1?'una taglia in più':n===-1?'una taglia in meno'
      :n>0?n+' taglie in più':(-n)+' taglie in meno'};

  openDlg(`<h2>Altra taglia</h2>
  <p class="sub">${esc(fullName(a))} · ${esc(teamLabel(a.squadra))} ha chiesto una <b>${esc(r.taglia)}</b>${r.numeroDesiderato!=null?` col n.${esc(r.numeroDesiderato)}`:''}, e non ne è disponibile nessuna. Sono elencate le maglie disponibili, a partire dalle taglie più vicine; compaiono solo i numeri liberi in ${esc(teamLabel(a.squadra))}.</p>
  <div class="field"><label for="atCapo">Quale capo</label><select id="atCapo" name="divisaId">${vicine.map(([id,d])=>{
    const stato=[d.holder?'da ritirare a '+fullName(S.atlete[d.holder]):'',
      D.prenDivisa[id]?'già promessa a '+fullName(S.atlete[S.richieste[D.prenDivisa[id]].atletaId]):''].filter(Boolean);
    return `<option value="${esc(id)}">${esc(d.taglia)} n.${d.numero} — ${distanza(d.taglia)}${stato.length?' — '+esc(stato.join(', ')):''}</option>`}).join('')}</select></div>
  <div id="atAvviso"></div>
  <label class="check" id="atProvv" style="margin:6px 0 2px"><input type="checkbox" name="provv" checked> Consegna provvisoria: la maglia va sostituita all’arrivo della taglia richiesta</label>
  ${actions('Consegna questa')}`, async fd=>{
    const did=fd.divisaId;const d=S.divise[did];if(!d)return false;
    const diversa=d.taglia!==r.taglia;
    // Provvisoria vuol dire: gliela diamo adesso, ma la richiesta resta
    // aperta e il capo e' gia' segnato da cambiare.
    const provv=diversa&&fd.provv==='on';
    if(diversa&&!await chiedi(provv
      ?`Consegnare una ${d.taglia} in via provvisoria? La richiesta della ${r.taglia} resta aperta e viene riproposta quando la taglia è disponibile.`
      :`Consegnare una ${d.taglia} al posto della ${r.taglia} chiesta? La richiesta si chiude qui.`))return false;
    const rit=ownReturning(r.atletaId,mod).filter(x=>x!==did);
    const foto=fotoRichiesta(rid);
    const ok=await w(()=>insieme(async()=>{
      if(d.holder&&d.holder!==r.atletaId)
        await mov({tipo:'RIENTRO',atletaId:d.holder,articolo:r.articolo,taglia:d.taglia,divisaId:did,numero:d.numero,prevHolder:d.holder,prevDR:!!d.daRestituire,prevTC:d.tagliaChiesta||null,note:'Ritirata per riassegnarla'});
      // La taglia diversa resta scritta sul capo: cosi' si vede sulla scheda
      // dell'atleta e non si perde quando la richiesta sparisce.
      await S.db.doc('divise/'+did).update({holder:r.atletaId,daRestituire:provv,
        tagliaChiesta:diversa?r.taglia:null});
      await mov({tipo:'CONSEGNA',atletaId:r.atletaId,articolo:r.articolo,taglia:d.taglia,divisaId:did,numero:d.numero,
        prevHolder:null,prevDR:false,note:diversa?`Taglia ${d.taglia} al posto della ${r.taglia} chiesta`:'',
        ...(provv?{}:{richiesta:foto})});
      for(const oid of rit){const od=S.divise[oid];if(!od||od.holder!==r.atletaId)continue;

/* Chi lascia la squadra non sparisce con un clic. Prima si segna, capo per
   capo, cosa ha riportato indietro: quello che torna rientra in magazzino
   davvero, con il suo movimento. Finche' manca qualcosa l'atleta resta "in
   uscita" - scritto in chiaro negli elenchi - e si cancella solo quando non
   ha piu' niente in mano.

   Cancellandolo, il suo nome viene scritto sui movimenti che lo riguardano:
   se no il registro direbbe "Atleta rimosso" su consegne e rientri che invece
   raccontano una storia precisa. */
function coseInMano(id){
  const D=derive();const fuori=[];
  for(const did of (D.perAtleta[id]||[])){const d=S.divise[did];if(!d)continue;
    fuori.push({tipo:'divisa',id:did,divisa:d,
      etichetta:`Divisa ${d.taglia} n.${d.numero}${d.daRestituire?' (già segnata da cambiare)':''}`})}
  for(const [k,v] of Object.entries(D.dotazione[id]||{})){if(v<=0)continue;
    const [art,tg]=k.split('|');
    fuori.push({tipo:'materiale',articolo:art,taglia:tg,qta:v,
      etichetta:`${artLabel(art)}${tg&&tg!=='UNICA'?' '+tg:''}${v>1?' ×'+v:''}`})}
  return fuori;
}

async function eliminaAtleta(id){
  const a=S.atlete[id];if(!a)return false;
  const inMano=coseInMano(id);
  if(inMano.length)return dlgUscita(id);
  return cancellaDavvero(id);
}

function dlgMat(art,tg){

/* ============ modelli Excel ============
   Quattro fogli per riempire il programma senza digitare niente a mano. Si
   scaricano gia' pieni di quello che c'e' dentro: cosi' lo stesso file serve
   sia da modello da compilare, sia da controllo di quello che c'e', sia da
   modifica di massa da rimandare indietro.

   L'ordine conta, ed e' scritto nelle istruzioni di ogni foglio: prima gli
   articoli, poi le squadre con gli atleti, poi le divise, poi le richieste. */
const COL=(r,i)=>String((r&&r[i])??'').trim();
const KEY=s=>norm(s).replace(/\s+/g,' ').trim();
/* Il nome di un foglio Excel come lo scrive la parte Rust: al massimo 31
   caratteri, senza : \ / ? * [ ]. Serve saperlo anche qui, per ritrovare la
   squadra quando il file torna indietro. */
const nomeFoglioExcel=n=>String(n??'').replace(/[:\\/?*\[\]]/g,' ').trim().slice(0,31)||'Foglio';
/* Un nome di foglio per squadra, tutti diversi fra loro e diversi da
   "Istruzioni": due squadre che si accorciano uguale non devono scontrarsi. */
function fogliSquadre(nomi){
  const usati=new Set([KEY('Istruzioni')]);
  return nomi.map(nome=>{const base=nomeFoglioExcel(nome);let n=base,i=2;
    while(usati.has(KEY(n))){const suf=` (${i++})`;n=base.slice(0,31-suf.length).trim()+suf}
    usati.add(KEY(n));return n});
}
/* La taglia scritta in un foglio ricondotta a una di quelle dell'articolo,
   senza badare a maiuscole e spazi. null se l'articolo non la prevede: una
   taglia inventata (o una data, se Excel ha trasformato "5-6") non deve
   diventare una taglia nuova. */
function tagliaArticolo(a,t){
  const v=normTaglia(t);if(!v)return '';
  const k=x=>norm(String(x)).replace(/\s+/g,'');
  const ts=(a&&a.taglie)||[];
  if(!ts.length)return k(v)==='unica'?'UNICA':null;
  return ts.find(x=>k(x)===k(v))||null;
}
/* Da un nome scritto nel foglio all'articolo: vale il nome interno, il codice
   corto o il nome come si legge nel programma. */
function articoloDaNome(D,t){
  const k=KEY(t);if(!k)return null;
  return (D.set.articoli||[]).find(a=>KEY(a.nome)===k||(a.codice&&KEY(a.codice)===k)||KEY(artLabel(a.nome))===k)||null;
}
/* Dal nome (squadra, cognome, nome) all'atleta. Due atleti con lo stesso nome
   nella stessa squadra non si possono distinguere da un foglio: invece di
   scegliere a caso il primo, la chiave vale OMONIMI e la riga va segnalata. */
const OMONIMI='__omonimi__';
function indiceAtleti(){
  const m=new Map();
  for(const [id,a] of Object.entries(S.atlete)){const k=KEY(a.squadra+'|'+a.cognome+'|'+a.nome);m.set(k,m.has(k)?OMONIMI:id)}
  return m;
}
/* Le squadre create da un foglio vanno in fondo all'ordine di distribuzione,
   nell'ordine in cui compaiono: senza numero finivano in ordine alfabetico. */
function prossimoOrdine(squadre){return squadre.reduce((m,x)=>Math.max(m,Number(x.ordine)||0),0)+1}

/* ---- controlli comuni ai fogli ---- */
/* Il risultato di un caricamento, di prova o vero. "problemi" sono gli
   errori (la riga non viene caricata), "avvisi" le righe caricate che
   conviene verificare. */
function nuovoEsito(){return {creati:0,aggiornati:0,saltati:0,problemi:[],avvisi:[],squadreNuove:[],lottiNuovi:[]}}
const SI=v=>/^(s|si|x|1|vero|yes)$/.test(norm(v).trim());
const NO=v=>/^(n|no|0|falso)$/.test(norm(v).trim());
const siNoValido=v=>!String(v??'').trim()||SI(v)||NO(v);
// Excel trasforma "5-6" in una data: una taglia cosi' non e' una taglia.
const sembraData=t=>/^\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4}$/.test(String(t).trim())||/^\d{4}-\d{2}-\d{2}/.test(String(t).trim());
// Una nota non e' il posto per mail e telefoni: sono dati di minorenni.
const sembraRecapito=t=>/@|\+39|\b3\d{2}[\s.]?\d{6,7}\b/.test(String(t||''));
/* Il numero di maglia scritto in una casella: null se vuota, NaN se non e'
   un intero da 0 a 99. */
const numeroMaglia=v=>{const t=String(v??'').trim();if(t==='')return null;const n=Number(t);return Number.isInteger(n)&&n>=0&&n<=99?n:NaN};
const riga0=i=>`riga ${i+2}`;
const quali=(arr,n)=>arr.filter(Boolean).join(n||', ');

const MODELLI_EXCEL={
 articoli:{
  nome:'Articoli e magazzino',
  foglio:'Articoli',
  colonne:['Articolo','Ha un numero','Taglia','Quantità','Codice','Stagione'],
  info:['Codice taglia','Nome visualizzato','Consegnati','Prenotati','Ordinati','Magazzino finale'],
  obbligatorie:['Articolo','Taglia'],
  voci:{creati:['articolo nuovo','articoli nuovi'],aggiornati:['riga di magazzino nuova','righe di magazzino nuove']},
  istruzioni:[
   'ARTICOLI E MAGAZZINO — da caricare per primo.',
   '',
   'Una riga per ogni articolo e taglia. Le righe dello stesso articolo vanno vicine.',
   '',
   'Articolo      il nome, per esempio: TEE NERA ALLENAMENTO, BORSONE U14',
   'Ha un numero  sì solo per le divise da gara, che hanno il numero stampato;',
   '              per tutto il resto vuoto oppure no.',
   'Taglia        XS, S, M, L... oppure UNICA per borsoni, sacche e borracce.',
   '              Le taglie come 5-6 vanno scritte come testo, altrimenti Excel',
   '              le trasforma in una data.',
   'Quantità      quanti pezzi ci sono adesso in magazzino (numero intero). Le divise',
   '              con il numero non si contano qui: si caricano con il foglio Divise.',
   'Codice        facoltativo: il codice corto (A001). Se manca lo assegna il programma.',
   'Stagione      facoltativo: la stagione dell\'articolo, per esempio 2026/27.',
   '',
   'Le colonne Codice taglia, Nome visualizzato, Consegnati, Prenotati, Ordinati e',
   'Magazzino finale sono solo informative: al caricamento vengono ignorate.',
   '',
   'Il caricamento aggiunge soltanto: un articolo o una giacenza già presenti non',
   'vengono modificati. Per correggere una giacenza si usa «Correggi giacenza» in',
   'Magazzino. Prima di caricare il programma mostra cosa verrà aggiunto e quali',
   'righe contengono errori.'],
  righe(){const D=derive();const out=[];
   const mancano={};for(const [rid,pp] of Object.entries(D.prop)){if(pp.esito!=='MANCA')continue;const r=S.richieste[rid];if(!r||D.conNumero(r.articolo))continue;const k=D.key(r.articolo,r.taglia);mancano[k]=(mancano[k]||0)+1}
   for(const a of [...(D.set.articoli||[])].sort(perNome)){
    const tg=(a.taglie||[]).length?a.taglie:['UNICA'];
    for(const t of tg){const k=D.key(a.nome,t);const st=D.stock[k]||{ora:0,consegne:0,rientri:0,ordinati:0};
     const fuori=Math.max(0,(st.consegne||0)-(st.rientri||0));const p=D.prenMat[k]||0;const ord=st.ordinati||0;
     out.push([a.nome,a.conNumero?'sì':'no',t,a.conNumero?'':String(st.ora||0),a.codice||'',a.stagione||'',
      artCodiceTaglia(a.nome,t),artLabel(a.nome),a.conNumero?'':String(fuori),a.conNumero?'':String(p),a.conNumero?'':String(ord),
      a.conNumero?'':String((st.ora||0)-p-(mancano[k]||0)+ord)])}}
   return out},
  async applica(righe,prova,nr=riga0){
   const D=derive();const r=nuovoEsito();
   // Copie, non gli oggetti delle impostazioni: si scrive tutto alla fine.
   const art=new Map((D.set.articoli||[]).map(a=>[KEY(a.nome),{...a,taglie:[...(a.taglie||[])]}]));
   const esistenti=new Set(art.keys());
   let cambiato=false;const visti=new Set();
   const kt=x=>norm(String(x)).replace(/\s+/g,'');
   for(const [i,riga] of righe.entries()){
    const q=nr(i);
    const nome=COL(riga,0).toUpperCase();
    if(!nome){if(riga.some(c=>String(c??'').trim()))r.problemi.push(`${q}: manca il nome dell'articolo`);else r.saltati++;continue}
    if(!siNoValido(COL(riga,1))){r.problemi.push(`${q}: «Ha un numero» vale "${COL(riga,1)}"; valori ammessi: sì, no oppure vuoto`);continue}
    const conNum=SI(COL(riga,1));
    const scritta=normTaglia(COL(riga,2)||'UNICA');
    if(sembraData(scritta)){r.problemi.push(`${q}: la taglia "${scritta}" sembra una data (Excel trasforma per esempio 5-6 in una data): va scritta come testo`);continue}
    if(scritta.length>20){r.problemi.push(`${q}: la taglia "${scritta}" è troppo lunga`);continue}
    const qs=COL(riga,3);const qn=qs===''?0:Number(qs.replace(',','.'));
    if(!Number.isInteger(qn)||qn<0){r.problemi.push(`${q}: quantità "${qs}" non valida: serve un numero intero, zero o più`);continue}
    const cod=COL(riga,4).toUpperCase(),stag=COL(riga,5);
    if(cod&&!/^[A-Z0-9_-]{1,12}$/.test(cod)){r.problemi.push(`${q}: codice "${cod}" non valido: solo lettere e cifre, al massimo 12 caratteri`);continue}
    if(stag&&!/^\d{4}\/\d{2}$/.test(stag))r.avvisi.push(`${q}: stagione "${stag}" non nel formato 2026/27`);
    const kr=KEY(nome)+'|'+kt(scritta);
    if(visti.has(kr)){r.avvisi.push(`${q}: ${nome} ${scritta} compare più volte nel foglio: riga ignorata`);r.saltati++;continue}
    visti.add(kr);
    let a=art.get(KEY(nome));
    if(!a){a={nome,conNumero:conNum,taglie:[]};art.set(KEY(nome),a);r.creati++;cambiato=true}
    else if(esistenti.has(KEY(nome))&&!!a.conNumero!==conNum&&COL(riga,1))
      r.avvisi.push(`${q}: ${nome} nel programma ${a.conNumero?'ha':'non ha'} il numero stampato: impostazione non modificata`);
    // La taglia com'e' gia' scritta sull'articolo, se c'e': "5-6 ANNI" e "5-6
    // anni" sono la stessa taglia.
    let taglia=a.taglie.find(x=>kt(x)===kt(scritta));
    if(!taglia){taglia=scritta;a.taglie.push(taglia);cambiato=true;
      if(esistenti.has(KEY(nome)))r.avvisi.push(`${q}: ${nome}: taglia nuova ${scritta}, verrà aggiunta all'articolo`)}
    if(cod){const altro=[...art.values()].find(x=>x!==a&&String(x.codice||'').toUpperCase()===cod);
      if(altro)r.avvisi.push(`${q}: il codice ${cod} è già dell'articolo ${altro.nome}: non assegnato a ${nome}`);
      else if(a.codice&&String(a.codice).toUpperCase()!==cod)r.avvisi.push(`${q}: ${nome} ha già il codice ${a.codice}: non modificato`);
      else if(!a.codice){a.codice=cod;cambiato=true}}
    if(stag&&!a.stagione){a.stagione=stag;cambiato=true}
    if(a.conNumero){if(qn>0)r.avvisi.push(`${q}: ${nome} ha il numero stampato: le quantità si caricano con il foglio Divise`);continue}
    const esiste=Object.values(S.materiale).some(m=>KEY(m.articolo)===KEY(a.nome)&&kt(m.taglia)===kt(taglia));
    if(esiste){const ora=(D.stock[D.key(a.nome,taglia)]||{ora:0}).ora;
      if(qs!==''&&qn!==ora)r.avvisi.push(`${q}: ${nome} ${taglia}: nel foglio ${qn}, nel programma ${ora}. La giacenza non viene modificata: per correggerla si usa «Correggi giacenza» in Magazzino`);
      r.saltati++;continue}
    if(!prova)await S.db.collection('materiale').add({articolo:a.nome,taglia,iniziale:qn,precedente:false});
    r.aggiornati++}
   if(cambiato&&!prova)await S.db.doc('settings/main').update({articoli:[...art.values()]});
   return r}},

 atlete:{
  nome:'Squadre e atleti',
  foglio:'Atleti',
  colonne:['Squadra','Cognome','Nome','Note','Attivo'],
  info:['Divise','In uscita','Gioca anche in'],
  obbligatorie:['Squadra','Cognome','Nome'],
  voci:{creati:['atleta nuovo','atleti nuovi']},
  istruzioni:[
   'SQUADRE E ATLETI — da caricare dopo gli articoli.',
   '',
   'Una riga per atleta. Le squadre che non esistono vengono create,',
   'nell\'ordine in cui compaiono qui, in fondo all\'ordine di distribuzione.',
   '',
   'Squadra   per esempio: UNDER 14, PRIMA SQUADRA',
   'Cognome   obbligatorio',
   'Nome      obbligatorio',
   'Note      facoltativo',
   'Attivo    facoltativo: no per un atleta non attivo in questa stagione.',
   '',
   'Le colonne Divise, In uscita e Gioca anche in sono solo informative: al',
   'caricamento vengono ignorate.',
   '',
   'Un atleta già presente nella stessa squadra viene ignorato: il caricamento',
   'ripetuto dello stesso foglio non crea doppioni e non modifica i dati esistenti.',
   '',
   'Non inserire indirizzi email, numeri di telefono o date delle visite mediche:',
   'il programma non li utilizza e si tratta di dati di atleti spesso minorenni.',
   'Una nota che sembra contenere un recapito non viene caricata.'],
  righe(){const D=derive();
   return Object.entries(S.atlete)
    .sort((a,b)=>(D.teamIdx[a[1].squadra]??99)-(D.teamIdx[b[1].squadra]??99)||norm(a[1].cognome).localeCompare(norm(b[1].cognome)))
    .map(([id,a])=>[a.squadra,a.cognome,a.nome,a.note||'',a.attiva===false?'no':'',
      (D.perAtleta[id]||[]).map(x=>{const d=S.divise[x];return`${d.taglia} n.${d.numero}${(d.modello||'STANDARD')!=='STANDARD'?' '+d.modello.toLowerCase():''}${d.daRestituire?' (da cambiare)':''}`}).join(', '),
      a.inUscita?'sì':'',ancheIn(id).join(', ')])},
  async applica(righe,prova,nr=riga0){
   const D=derive();const r=nuovoEsito();
   const squadre=[...(D.set.squadre||[])];
   const viste=new Set(squadre.map(x=>KEY(x.nome)));
   const gia=new Map(Object.values(S.atlete).map(a=>[KEY(a.squadra+'|'+a.cognome+'|'+a.nome),a]));
   const visti=new Set();let sqScritte=false;
   for(const [i,riga] of righe.entries()){
    const q=nr(i);
    const sq=COL(riga,0).toUpperCase();const cog=COL(riga,1);const nom=COL(riga,2);
    if(!sq||!cog||!nom){if(sq||cog||nom)r.problemi.push(`${q}: ${quali([!sq&&'la squadra',!cog&&'il cognome',!nom&&'il nome'])} ${[!sq,!cog,!nom].filter(Boolean).length===1?'manca':'mancano'}`);else r.saltati++;continue}
    if(!siNoValido(COL(riga,4))){r.problemi.push(`${q}: «Attivo» vale "${COL(riga,4)}"; valori ammessi: sì, no oppure vuoto`);continue}
    if(/[0-9@#]/.test(cog+nom))r.avvisi.push(`${q}: ${cog} ${nom}: il nome contiene cifre o simboli, da verificare`);
    let nota=COL(riga,3);
    if(sembraRecapito(nota)){r.avvisi.push(`${q}: ${cog} ${nom}: la nota sembra contenere un recapito e non viene caricata (il programma non conserva dati personali)`);nota=''}
    const k=KEY(sq+'|'+cog+'|'+nom);
    if(visti.has(k)){r.avvisi.push(`${q}: ${cog} ${nom} (${sq}) compare più volte nel foglio: riga ignorata`);r.saltati++;continue}
    visti.add(k);
    const esiste=gia.get(k);
    if(esiste){if(COL(riga,4)&&(esiste.attiva===false)!==NO(COL(riga,4)))r.avvisi.push(`${q}: ${cog} ${nom}: nel foglio lo stato attivo è diverso da quello nel programma; non modificato`);
      r.saltati++;continue}
    const altrove=Object.values(S.atlete).filter(a=>KEY(a.cognome+'|'+a.nome)===KEY(cog+'|'+nom)&&KEY(a.squadra)!==KEY(sq));
    if(altrove.length)r.avvisi.push(`${q}: ${cog} ${nom} è già in ${altrove.map(a=>teamLabel(a.squadra)).join(', ')}: viene creata una seconda scheda (atleta in due squadre?)`);
    if(!viste.has(KEY(sq))){squadre.push({nome:sq,includi:true,modelloDivisa:'STANDARD',ordine:prossimoOrdine(squadre)});viste.add(KEY(sq));r.squadreNuove.push(sq)}
    if(!prova){
      // Le squadre prima degli atleti: se il caricamento si interrompe a meta',
      // gli atleti gia' scritti hanno comunque la loro squadra.
      if(r.squadreNuove.length&&!sqScritte){await S.db.doc('settings/main').update({squadre});sqScritte=true}
      await S.db.collection('atlete').add({squadra:sq,cognome:cog,nome:nom,attiva:!NO(COL(riga,4)),note:nota});
    }
    r.creati++}
   if(!prova&&r.squadreNuove.length)await S.db.doc('settings/main').update({squadre});
   return r}},

 divise:{
  nome:'Divise da gara',
  foglio:'Divise',
  colonne:['Modello','Taglia','Numero','Squadra','Cognome','Nome','Da cambiare','Note'],
  info:['Stato','Prenotata per'],
  obbligatorie:['Taglia','Numero'],
  voci:{creati:['divisa nuova','divise nuove']},
  istruzioni:[
   'DIVISE DA GARA — da caricare dopo gli atleti.',
   '',
   'Una riga per ogni capo fisico. Due divise con lo stesso numero ma taglia',
   'diversa sono due capi diversi, ed è normale averle entrambe.',
   '',
   'Modello       il lotto: STANDARD per le divise normali, LIBERO per le maglie',
   '              da libero, comuni a tutte le squadre. Altri nomi creano altri',
   '              lotti (per esempio PRIMA SQUADRA): nella schermata Squadre si',
   '              indica sulla riga di ogni squadra quale lotto utilizza.',
   'Taglia        XXS, XS, S, M, L, XL, XXL',
   'Numero        il numero stampato sulla maglia, da 0 a 99',
   'Squadra       vuoto se la divisa è in magazzino. Se è assegnata a un atleta,',
   'Cognome       indicarne squadra, cognome e nome: deve essere un atleta',
   'Nome          già caricato con il foglio Atleti.',
   'Da cambiare   sì se l\'atleta la sta restituendo (taglia sbagliata, cambio',
   '              squadra): il numero resta libero per la sua squadra.',
   'Note          facoltativo',
   '',
   'Le colonne Stato e Prenotata per sono solo informative: al caricamento',
   'vengono ignorate.',
   '',
   'All\'interno di una squadra un numero non si ripete: una divisa con un numero',
   'già in uso nella squadra dell\'atleta viene caricata e segnalata come numero doppio.'],
  righe(){const D=derive();
   return Object.entries(S.divise).filter(([,d])=>!d.dismessa)
   .sort((a,b)=>(a[1].modello||'').localeCompare(b[1].modello||'')||szIdx(a[1].taglia)-szIdx(b[1].taglia)||a[1].numero-b[1].numero)
   .map(([id,d])=>{const a=d.holder?S.atlete[d.holder]:null;const pr=D.prenDivisa[id];
    return [d.modello||'STANDARD',d.taglia,String(d.numero),a?a.squadra:'',a?a.cognome:'',a?a.nome:'',
     d.daRestituire?'sì':'',d.note||'',
     !d.holder?'in magazzino':d.daRestituire?'da cambiare':'in uso',pr&&S.richieste[pr]?fullName(S.atlete[S.richieste[pr].atletaId]):'']})},
  async applica(righe,prova,nr=riga0){
   const D=derive();const r=nuovoEsito();
   const modelli=[...(D.set.modelli||['STANDARD'])];
   const perNome=indiceAtleti();
   // Il capo si riconosce da modello, taglia, numero **e da chi lo tiene**: due
   // liberi di squadre diverse possono portare lo stesso numero, ed e' normale.
   const chiave=(m,t,n,h)=>`${m}|${t}|${n}|${h||''}`;
   const gia=new Set(Object.values(S.divise).filter(d=>!d.dismessa).map(d=>chiave(d.modello||'STANDARD',KEY(d.taglia),Number(d.numero),d.holder)));
   // I numeri in uso in ogni squadra, compresi quelli caricati da questo foglio.
   const inUso={};
   for(const d of Object.values(S.divise)){if(d.dismessa||!d.holder||d.daRestituire)continue;const a=S.atlete[d.holder];if(!a)continue;
     (inUso[a.squadra]=inUso[a.squadra]||new Map()).set(Number(d.numero),d.holder)}
   const visti=new Set();
   for(const [i,riga] of righe.entries()){
    const q=nr(i);
    const mod=(COL(riga,0)||'STANDARD').toUpperCase();const tg=normTaglia(COL(riga,1));
    if(!tg){r.problemi.push(`${q}: manca la taglia`);continue}
    if(sembraData(tg)){r.problemi.push(`${q}: la taglia "${tg}" sembra una data: va scritta come testo`);continue}
    // Una casella vuota non e' il numero 0.
    const num=numeroMaglia(COL(riga,2));
    if(num===null){r.problemi.push(`${q}: manca il numero`);continue}
    if(Number.isNaN(num)){r.problemi.push(`${q}: numero "${COL(riga,2)}" non valido: serve un numero intero da 0 a 99`);continue}
    if(!siNoValido(COL(riga,6))){r.problemi.push(`${q}: «Da cambiare» vale "${COL(riga,6)}"; valori ammessi: sì, no oppure vuoto`);continue}
    if(!SZ.includes(tg))r.avvisi.push(`${q}: taglia ${tg} non fra quelle consuete (${SZ.join(', ')})`);
    const sq=COL(riga,3).toUpperCase();const cog=COL(riga,4);const nom=COL(riga,5);
    let holder=null;
    if(sq||cog||nom){
     if(!sq||!cog||!nom){r.problemi.push(`${q}: per assegnare la divisa servono squadra, cognome e nome dell'atleta`);continue}
     holder=perNome.get(KEY(sq+'|'+cog+'|'+nom))||null;
     if(holder===OMONIMI){r.problemi.push(`${q}: in ${sq} ci sono due atleti di nome ${cog} ${nom}: la divisa va assegnata a mano`);continue}
     if(!holder){r.problemi.push(`${q}: nessun atleta ${cog} ${nom} in ${sq}: la divisa non viene caricata`);continue}
     const at=S.atlete[holder];
     if(at.inUscita||at.attiva===false)r.avvisi.push(`${q}: ${cog} ${nom} è ${at.inUscita?'in uscita':'non attivo'}`)}
    const k=chiave(mod,KEY(tg),num,holder);
    if(visti.has(k)){r.avvisi.push(`${q}: la ${tg} n.${num} ${cap(mod)} compare più volte nel foglio: riga ignorata`);r.saltati++;continue}
    visti.add(k);
    if(gia.has(k)){r.saltati++;continue}
    const daCambiare=SI(COL(riga,6));
    if(holder&&!daCambiare&&!D.comuni.has(mod)){const sqA=S.atlete[holder].squadra;const chi=inUso[sqA]&&inUso[sqA].get(num);
      // La maglia esiste davvero: si carica, ma il numero doppio si segnala
      // (e poi resta evidenziato in squadra finche' non si sistema).
      if(chi&&chi!==holder)r.avvisi.push(`${q}: in ${teamLabel(sqA)} il n.${num} è già di ${fullName(S.atlete[chi])}: la divisa viene caricata, ma il numero risulterà doppio in squadra`);
      (inUso[sqA]=inUso[sqA]||new Map()).set(num,holder)}
    if(holder&&Object.values(S.divise).some(d=>!d.dismessa&&!d.holder&&(d.modello||'STANDARD')===mod&&KEY(d.taglia)===KEY(tg)&&Number(d.numero)===num))
      r.avvisi.push(`${q}: una ${tg} n.${num} ${cap(mod)} risulta anche in magazzino: verificare che non sia lo stesso capo contato due volte`);
    if(!modelli.includes(mod)){modelli.push(mod);r.lottiNuovi.push(mod)}
    if(!prova)await S.db.collection('divise').add({taglia:tg,numero:num,modello:mod,holder,daRestituire:daCambiare,note:COL(riga,7)});
    r.creati++}
   if(!prova&&r.lottiNuovi.length)await S.db.doc('settings/main').update({modelli});
   return r}},

 richieste:{
  nome:'Richieste',
  foglio:'Richieste',
  colonne:['Squadra','Cognome','Nome','Articolo','Taglia','Numero desiderato','Note','Tipo di divisa'],
  info:['Esito','Numero proposto','Motivo'],
  obbligatorie:['Squadra','Cognome','Nome','Articolo'],
  voci:{creati:['richiesta nuova','richieste nuove']},
  istruzioni:[
   'RICHIESTE — da caricare per ultimo.',
   '',
   'Una riga per ogni articolo che un atleta deve ricevere. È il foglio che i',
   'dirigenti di squadra possono compilare e rimandare indietro.',
   '',
   'Squadra, Cognome, Nome   devono corrispondere a un atleta già inserito.',
   'Articolo                 il nome, il codice corto (A001) o il nome come appare',
   '                         nel programma.',
   'Taglia                   una di quelle previste per l\'articolo.',
   'Numero desiderato        solo per le divise e solo se ne viene chiesto uno',
   '                         preciso, da 0 a 99.',
   'Note                     facoltativo.',
   'Tipo di divisa           facoltativo: LIBERO per una maglia da libero.',
   '',
   'Le colonne Esito, Numero proposto e Motivo sono solo informative: al',
   'caricamento vengono ignorate.',
   '',
   'Le righe che non corrispondono a nessun atleta o articolo vengono segnalate e',
   'non caricate. Una richiesta uguale a una già aperta, o di un articolo già',
   'consegnato in questa stagione, viene ignorata.'],
  righe(){const D=derive();
   const sq=rid=>{const a=S.atlete[S.richieste[rid].atletaId];return a?(D.teamIdx[a.squadra]??99):999};
   return D.order.map((rid,k)=>[rid,k]).sort((x,y)=>sq(x[0])-sq(y[0])||x[1]-y[1]).map(([rid])=>{const r=S.richieste[rid];const a=S.atlete[r.atletaId];if(!a)return null;
    const p=D.prop[rid]||{};const d=p.divisaId?S.divise[p.divisaId]:null;
    return [a.squadra,a.cognome,a.nome,r.articolo,r.taglia,r.numeroDesiderato==null?'':String(r.numeroDesiderato),r.note||'',r.modello||'',
     p.esito==='OK'?'pronta':p.esito==='MANCA'?'da ordinare':'esclusa',d?String(d.numero):'',p.motivo||'']}).filter(Boolean)},
  async applica(righe,prova,nr=riga0){
   const D=derive();const r=nuovoEsito();
   const perNome=indiceAtleti();
   let ordine=Object.values(S.richieste).reduce((m,x)=>Math.max(m,x.ordine||0),0);
   // Una richiesta uguale a una gia' aperta non si rifa': ricaricare lo stesso
   // foglio raddoppiava tutto.
   const chiave=x=>KEY([x.atletaId,x.articolo,x.taglia,x.modello||'',x.numeroDesiderato??''].join('|'));
   const gia=new Set(Object.values(S.richieste).map(chiave));
   const visti=new Set();
   const stag=D.set.stagione||'';const consegnati=new Set();
   for(const m of Object.values(S.movimenti)){if(m.tipo!=='CONSEGNA'||!m.atletaId||(m.stagione||'')!==stag)continue;
     consegnati.add(KEY(m.atletaId+'|'+m.articolo+'|'+(D.conNumero(m.articolo)?'':m.taglia)))}
   for(const [i,riga] of righe.entries()){
    const q=nr(i);
    const sq=COL(riga,0).toUpperCase();const cog=COL(riga,1);const nom=COL(riga,2);
    const artScritto=COL(riga,3);
    if(!sq&&!cog&&!nom&&!artScritto){r.saltati++;continue}
    if(!sq||!cog||!nom||!artScritto){r.problemi.push(`${q}: ${quali([!sq&&'la squadra',!cog&&'il cognome',!nom&&'il nome',!artScritto&&'l\'articolo'])} ${[!sq,!cog,!nom,!artScritto].filter(Boolean).length===1?'manca':'mancano'}`);continue}
    const aid=perNome.get(KEY(sq+'|'+cog+'|'+nom));
    if(aid===OMONIMI){r.problemi.push(`${q}: in ${sq} ci sono due atleti di nome ${cog} ${nom}: la richiesta va inserita a mano`);continue}
    if(!aid){r.problemi.push(`${q}: nessun atleta ${cog} ${nom} in ${sq}`);continue}
    const a=articoloDaNome(D,artScritto);
    if(!a){r.problemi.push(`${q}: articolo "${artScritto}" sconosciuto (si può indicare il nome, il codice o il nome visualizzato)`);continue}
    const tg=tagliaArticolo(a,COL(riga,4)||'UNICA');
    if(!tg){r.problemi.push(`${q}: la taglia "${COL(riga,4)}" non è prevista per ${artLabel(a.nome)} (previste: ${(a.taglie||[]).join(', ')||'unica'})`);continue}
    const numero=numeroMaglia(COL(riga,5));
    if(Number.isNaN(numero)){r.problemi.push(`${q}: numero desiderato "${COL(riga,5)}" non valido: serve un numero intero da 0 a 99`);continue}
    if(numero!==null&&!a.conNumero)r.avvisi.push(`${q}: ${artLabel(a.nome)} non ha il numero stampato: il numero desiderato viene ignorato`);
    const tipo=COL(riga,7).toUpperCase();
    if(tipo&&(!a.conNumero||!D.comuni.has(tipo))){r.problemi.push(`${q}: tipo di divisa "${tipo}" non ammesso${a.conNumero?` (ammessi: ${[...D.comuni].join(', ')} oppure vuoto)`:': l\'articolo non è una divisa'}`);continue}
    const at=S.atlete[aid];
    if(at.inUscita||at.attiva===false)r.avvisi.push(`${q}: ${cog} ${nom} è ${at.inUscita?'in uscita':'non attivo'}: la richiesta non verrà servita`);
    if(a.distribuibile===false)r.avvisi.push(`${q}: ${artLabel(a.nome)} non è più in distribuzione: la richiesta resterà esclusa`);
    const nuova={atletaId:aid,articolo:a.nome,modello:a.conNumero?tipo:'',taglia:tg,numeroDesiderato:a.conNumero?numero:null,note:COL(riga,6)};
    const k=chiave(nuova);
    if(visti.has(k)){r.avvisi.push(`${q}: la stessa richiesta compare più volte nel foglio: riga ignorata`);r.saltati++;continue}
    visti.add(k);
    if(gia.has(k)){r.saltati++;continue}
    if(consegnati.has(KEY(aid+'|'+a.nome+'|'+(a.conNumero?'':tg)))){r.avvisi.push(`${q}: ${cog} ${nom} ha già ricevuto ${artLabel(a.nome)} in questa stagione: richiesta non creata`);r.saltati++;continue}
    if(a.conNumero&&numero!==null){const chi=Object.values(S.divise).find(d=>!d.dismessa&&d.holder&&d.holder!==aid&&!d.daRestituire&&S.atlete[d.holder]&&S.atlete[d.holder].squadra===at.squadra&&Number(d.numero)===numero);
      if(chi)r.avvisi.push(`${q}: in ${teamLabel(at.squadra)} il n.${numero} è già di ${fullName(S.atlete[chi.holder])}: verrà proposto un altro numero`)}
    if(!prova)await S.db.collection('richieste').add({...nuova,ordine:++ordine});
    r.creati++}
   return r}}
};

/* Scarica il foglio, gia' pieno di quello che c'e' nel programma. */
/* ============ il modulo di distribuzione ============
   Un file solo, un foglio per squadra, le stesse colonne dappertutto: e' il
   modulo che i dirigenti compilano a mano, e da cui escono squadre, atleti e
   richieste in un colpo.

   Le colonne le decide l'elenco articoli del programma, non chi compila: cosi'
   non succede piu' che la stessa cosa si chiami "BORSONE GRANDE" in un foglio
   e "BORSONE ZAINETTO" in un altro. */

/* Le uniche risposte ammesse in una casella. Chi compila ne scrive di tutti i
   colori ("la devo sostiutire", "Ce l'ho"), quindi si guarda la sostanza. */
const MOD_RISPOSTE=['ce l’ho','mi manca','da cambiare'];
function modRisposta(v){
  const t=norm(v).replace(/[’'`]/g,'\'').trim();
  if(!t)return '';
  // "non mi manca", "non ce l'ho": una negazione rovescia il senso, meglio
  // chiedere che indovinare.
  if(/(^|\W)non(\W|$)/.test(t))return '?';
  if(t.includes('manca'))return 'manca';
  if(t.includes('cambiar')||t.includes('sostitu'))return 'cambia';
  if(t.includes('ce l'))return 'ha';
  return '?';
}
/* Nel modulo vanno solo gli articoli di quest'anno. Gli avanzi delle stagioni
   passate restano in magazzino e si possono ancora consegnare a mano, ma se
   entrassero qui il foglio avrebbe sessanta colonne invece di trenta e
   nessuno lo compilerebbe. Si riconoscono da soli: tutte le loro righe di
   magazzino sono segnate come stagioni precedenti. */
const modArticoli=D=>(D.set.articoli||[]).filter(a=>{
  if(a.distribuibile===false)return false;
  // Di questa stagione lo dice l'articolo stesso: se non lo dice, si guarda se
  // tutto quello che ne resta in magazzino e' roba di stagioni passate.
  if(a.stagione)return a.stagione===(D.set.stagione||'');
  const righe=Object.values(S.materiale).filter(m=>m.articolo===a.nome);
  return !(righe.length&&righe.every(m=>m.precedente))});
const modConTaglie=a=>(a.taglie||[]).filter(t=>t&&t!=='UNICA').length>0;

function modColonne(D){
  const c=['Cognome','Nome','Numero maglia'];
  for(const a of modArticoli(D)){
    const et=artLabel(a.nome);
    c.push(et);
    if(modConTaglie(a)){c.push(et+' taglia');c.push(et+' taglia richiesta')}
  }
  c.push('Note');
  return c;
}

/* Il foglio esce gia' con dentro gli atleti che il programma conosce, e il
   numero di maglia che hanno: chi compila trova la sua squadra e riempie solo
   le caselle, senza riscrivere i nomi. */
function modRighe(D,squadra){
  const arts=modArticoli(D);
  return Object.entries(S.atlete)
    .filter(([id,a])=>a.squadra===squadra)
    .sort((x,y)=>norm(fullName(x[1])).localeCompare(norm(fullName(y[1]))))
    .map(([id,a])=>{
      const divisa=(D.perAtleta[id]||[]).map(x=>S.divise[x])
        .find(x=>x&&(x.modello||'STANDARD')===(D.lotto[squadra]||'STANDARD'));
      const riga=[a.cognome,a.nome,divisa?String(divisa.numero):''];
      for(const art of arts){riga.push('');if(modConTaglie(art)){riga.push('');riga.push('')}}
      riga.push(a.note||'');
      return riga});
}

function modIstruzioni(D){
  const arts=modArticoli(D);
  return ['MODULO DI DISTRIBUZIONE',
   '',
   'Un foglio per squadra: il nome del foglio è il nome della squadra, che quindi',
   'non va riscritto su ogni riga. Le squadre e gli atleti non presenti vengono',
   'creati al caricamento del file.',
   '',
   'In ogni casella di un articolo va indicata una di queste tre risposte:',
   '',
   '   ce l’ho       l’atleta lo possiede già: non viene creata alcuna richiesta',
   '   mi manca      l’atleta ne ha bisogno: viene creata una richiesta',
   '   da cambiare   va sostituito: viene creata una richiesta e il capo attuale',
   '                 risulta da restituire',
   '',
   'La casella vuota equivale a "ce l’ho".',
   '',
   'Colonne:',
   '',
   'Cognome, Nome                 obbligatori',
   'Numero maglia                 il numero attuale, non quello richiesto',
   '<articolo>                    una delle tre risposte',
   '<articolo> taglia             la taglia attuale',
   '<articolo> taglia richiesta   la taglia desiderata, se diversa',
   'Note                          informazioni che non trovano posto nelle caselle',
   '',
   'Se la taglia richiesta è vuota vale la taglia attuale.',
   '',
   'Articoli in questo modulo: '+arts.map(a=>artLabel(a.nome)).join(', '),
   '',
   'Il caricamento ripetuto dello stesso file non crea duplicati: gli atleti già',
   'presenti, le richieste uguali e gli articoli già consegnati vengono ignorati.',
   '',
   'Non inserire indirizzi email, numeri di telefono o date delle visite mediche:',
   'il programma non li utilizza e si tratta di dati di atleti spesso minorenni.'];
}

async function scaricaModulo(){
  if(!window.__APP){toast('Il modulo si scarica dal programma installato');return}
  const D=derive();
  const squadre=D.perServire;
  if(!squadre.length){toast('Occorre prima inserire le squadre');return}
  if(!modArticoli(D).length){toast('Occorre prima inserire gli articoli');return}
  // Il titolo della colonna e' l'unica cosa che lega la casella all'articolo:
  // se due articoli si chiamassero uguale, al ritorno non si saprebbe di chi
  // e' quella casella. Meglio fermarsi adesso che sbagliare dopo.
  const titoli=modArticoli(D).map(a=>KEY(artLabel(a.nome)));
  const doppio=titoli.find((t,i)=>titoli.indexOf(t)!==i);
  if(doppio){const quali=modArticoli(D).filter(a=>KEY(artLabel(a.nome))===doppio).map(a=>a.nome);
    toast(`Due articoli hanno lo stesso nome visualizzato (${quali.join(' e ')}): occorre cambiare l’etichetta di uno dei due, altrimenti il modulo non può essere riletto`);return}
  const colonne=modColonne(D);
  const nomiFogli=fogliSquadre(squadre.map(s=>s.nome));
  const fogli=squadre.map((s,i)=>({nome:nomiFogli[i],intestazioni:colonne,righe:modRighe(D,s.nome)}));
  let dove;
  try{dove=await window.__APP.scegliDoveSalvare(`modulo-distribuzione-${today()}.xlsx`)}
  catch(e){toast('Apertura della finestra di salvataggio non riuscita: '+e);return}
  if(!dove)return;
  try{await window.__APP.scriviExcelFogli(dove,fogli,modIstruzioni(D))}
  catch(e){toast('Scrittura del file non riuscita: '+e);return}
  toast(`Modulo salvato: ${fogli.length} ${fogli.length===1?'squadra':'squadre'}`);
}

/* Legge il modulo compilato. Tutto quello che non torna finisce nell'elenco dei
   problemi invece di fermare il caricamento: con centocinquanta righe scritte a
   mano, fermarsi alla prima storta vuol dire non caricare mai niente. */
async function caricaModulo(){
  if(!window.__APP){toast('Il modulo si carica dal programma installato');return}
  let file;
  try{file=await window.__APP.scegliDaAprire()}
  catch(e){toast('Apertura della finestra non riuscita: '+e);return}
  if(!file)return;
  let fogli;
  try{fogli=await window.__APP.leggiExcelFogli(file)}
  catch(e){toast('Lettura del file non riuscita: '+e);return}

  const D=derive();
  const arts=modArticoli(D);
  // dal titolo della colonna all'articolo: si accetta l'etichetta o il codice
  const perTitolo={};
  for(const a of arts){perTitolo[KEY(artLabel(a.nome))]=a;perTitolo[KEY(a.nome)]=a}

  const daFare=[];const problemi=[];const colonneIgnote=new Set();const avvisiModulo=[];const vistiModulo=new Set();
  // Dal nome del foglio alla squadra: lo stesso calcolo fatto allo scarico,
  // cosi' una squadra dal nome lungo o con una barra si ritrova.
  const perFoglio={};
  const nomiSq=D.perServire.map(x=>x.nome);
  fogliSquadre(nomiSq).forEach((f,i)=>{perFoglio[KEY(f)]=nomiSq[i]});
  for(const n of nomiSq)perFoglio[KEY(n)]=perFoglio[KEY(n)]||n;
  const squadreNuove=new Set();
  for(const [nomeFoglio,righe] of fogli){
    if(KEY(nomeFoglio)===KEY('Istruzioni')||!righe.length)continue;
    // Un foglio copiato dentro Excel si chiama "U14 (2)": e' la stessa squadra.
    let squadra=perFoglio[KEY(nomeFoglio)]||perFoglio[KEY(String(nomeFoglio).replace(/\s*\(\d+\)\s*$/,''))];
    if(!squadra){squadra=String(nomeFoglio).trim().toUpperCase();squadreNuove.add(squadra)}
    const i0=righe.findIndex(r=>r.some(c=>KEY(c)===KEY('Cognome')));
    if(i0<0){problemi.push(`foglio ${nomeFoglio}: non trovo la riga dei titoli`);continue}
    const titoli=righe[i0].map(c=>String(c||'').trim());
    // ogni colonna: cosa vuol dire
    const mappa=titoli.map(t=>{
      const k=KEY(t);
      if(k===KEY('Cognome'))return{tipo:'cognome'};
      if(k===KEY('Nome'))return{tipo:'nome'};
      if(k===KEY('Numero maglia'))return{tipo:'numero'};
      if(k===KEY('Note'))return{tipo:'note'};
      const mR=t.match(/^(.*) taglia richiesta$/i);
      if(mR&&perTitolo[KEY(mR[1])])return{tipo:'tagliaRic',art:perTitolo[KEY(mR[1])]};
      const mT=t.match(/^(.*) taglia$/i);
      if(mT&&perTitolo[KEY(mT[1])])return{tipo:'taglia',art:perTitolo[KEY(mT[1])]};
      if(perTitolo[k])return{tipo:'risposta',art:perTitolo[k]};
      // Una colonna che non si riconosce non si butta via zitti: forse
      // l'articolo e' stato rinominato dopo aver consegnato il modulo, e chi
      // ha compilato si aspetta che quelle caselle contino.
      if(t)colonneIgnote.add(t);
      return{tipo:'?'}});
    if(!mappa.some(m=>m.tipo==='cognome')){problemi.push(`foglio ${nomeFoglio}: manca la colonna Cognome`);continue}

    for(let i=i0+1;i<righe.length;i++){
      const riga=righe[i];const dati={squadra,articoli:{},note:''};
      mappa.forEach((m,c)=>{const v=String(riga[c]??'').trim();
        if(m.tipo==='cognome')dati.cognome=v;
        else if(m.tipo==='nome')dati.nome=v;
        else if(m.tipo==='numero')dati.numero=v;
        else if(m.tipo==='note')dati.note=v;
        else if(m.tipo==='risposta'||m.tipo==='taglia'||m.tipo==='tagliaRic'){
          const a=(dati.articoli[m.art.nome]=dati.articoli[m.art.nome]||{art:m.art});
          if(m.tipo==='risposta')a.risposta=v;
          else if(m.tipo==='taglia')a.taglia=v;
          else a.tagliaRic=v}});
      if(!dati.cognome&&!dati.nome)continue;
      const q=`${nomeFoglio}, riga ${i+1}`;
      if(!dati.cognome||!dati.nome){problemi.push(`${q}: manca il ${dati.cognome?'nome':'cognome'} (${dati.cognome||dati.nome})`);continue}
      dati.q=q;
      if(dati.numero&&Number.isNaN(numeroMaglia(dati.numero))){avvisiModulo.push(`${q}: numero di maglia "${dati.numero}" non valido: ignorato`);dati.numero=''}
      if(sembraRecapito(dati.note)){avvisiModulo.push(`${q}: la nota sembra contenere un recapito e non viene caricata`);dati.note=''}
      const kd=KEY(squadra+'|'+dati.cognome+'|'+dati.nome);
      if(vistiModulo.has(kd)){avvisiModulo.push(`${q}: ${dati.cognome} ${dati.nome} compare più volte per ${teamLabel(squadra)}: riga ignorata`);continue}
      vistiModulo.add(kd);
      daFare.push(dati);
    }
  }
  // Una volta sola, non una per foglio: se no l'elenco si riempie di copie e
  // i problemi delle righe non si vedono piu'.
  for(const t of colonneIgnote)avvisiModulo.push(`la colonna "${t}" non corrisponde a nessun articolo ed è stata ignorata`);
  if(!daFare.length){toast(problemi.length?problemi[0]:'Il modulo non contiene righe compilate');
    mostraEsitoExcel('Modulo di distribuzione',{problemi,avvisi:avvisiModulo},'nessuna riga compilata');return}
  // Prima un giro di prova, senza scrivere: si vede cosa succederebbe.
  const prova=await eseguiModulo(D,daFare,true);
  prova.problemi.unshift(...problemi);prova.avvisi.unshift(...avvisiModulo);
  prova.squadreNuove=[...squadreNuove];
  if(!prova.creati&&!prova.aggiornati){mostraEsitoExcel('Modulo di distribuzione',prova,'nessun dato nuovo da caricare');return}
  if(!await chiedi(riepilogoCaricamento('Modulo di distribuzione',prova,{creati:['atleta nuovo','atleti nuovi'],aggiornati:['richiesta nuova o corretta','richieste nuove o corrette']})))return;
  S.busy=true;render();
  let esito;
  try{esito=await eseguiModulo(D,daFare,false)}
  catch(e){S.busy=false;render();toast('Caricamento interrotto: '+e);return}
  S.busy=false;
  esito.problemi.unshift(...problemi);esito.avvisi.unshift(...avvisiModulo);esito.squadreNuove=prova.squadreNuove;
  mostraEsitoExcel('Modulo di distribuzione',esito,sintesiEsito(esito,{creati:['atleta nuovo','atleti nuovi'],aggiornati:['richiesta','richieste']}));
}

/* Il modulo applicato davvero, o solo provato (prova=true: niente scritture,
   gli atleti nuovi hanno un segnaposto al posto dell'id). */
async function eseguiModulo(D,daFare,prova){

  const esito=nuovoEsito();
  {
    const squadre=[...(D.set.squadre||[])];
    const viste=new Set(squadre.map(x=>KEY(x.nome)));
    // Le squadre nuove si scrivono subito, prima degli atleti: se il
    // caricamento si interrompe, nessun atleta resta senza squadra.
    for(const d of daFare)if(!viste.has(KEY(d.squadra))){
      squadre.push({nome:d.squadra,includi:true,modelloDivisa:'STANDARD',ordine:prossimoOrdine(squadre)});viste.add(KEY(d.squadra))}
    if(!prova&&squadre.length!==(D.set.squadre||[]).length)await S.db.doc('settings/main').update({squadre});
    // indice degli atleti gia' dentro, per non rifarli
    const perNome=Object.fromEntries(indiceAtleti());
    // Le richieste aperte, per atleta e articolo: una uguale si salta, una con
    // la taglia cambiata si aggiorna invece di aggiungerne un'altra.
    const aperte={};
    for(const [rid,r] of Object.entries(S.richieste))(aperte[KEY(r.atletaId+'|'+r.articolo)]=aperte[KEY(r.atletaId+'|'+r.articolo)]||[]).push([rid,r]);
    // Quello gia' consegnato in questa stagione non si richiede di nuovo:
    // la consegna cancella la richiesta, e ricaricando il modulo rinasceva.
    const stag=D.set.stagione||'';
    const consegnati=new Set();
    for(const m of Object.values(S.movimenti)){
      if(m.tipo!=='CONSEGNA'||!m.atletaId||(m.stagione||'')!==stag)continue;
      consegnati.add(KEY(m.atletaId+'|'+m.articolo+'|'+(D.conNumero(m.articolo)?'':m.taglia)))}

    for(const d of daFare){
      const k=KEY(d.squadra+'|'+d.cognome+'|'+d.nome);
      let aid=perNome[k];
      if(aid===OMONIMI){esito.problemi.push(`${d.q}: in ${d.squadra} ci sono due atleti di nome ${d.cognome} ${d.nome}; la riga va inserita a mano`);continue}
      if(!aid){
        if(prova)aid='NUOVO|'+k;
        else{const nuovo=await S.db.collection('atlete').add({squadra:d.squadra,cognome:d.cognome,nome:d.nome,attiva:true,note:d.note||''});aid=nuovo.id}
        perNome[k]=aid;esito.creati++;
      }else if(d.note&&!S.atlete[aid].note){
        if(!prova)await S.db.doc('atlete/'+aid).update({note:d.note});
      }
      const at=S.atlete[aid];
      if(at&&(at.inUscita||at.attiva===false))esito.avvisi.push(`${d.q}: ${d.cognome} ${d.nome} è ${at.inUscita?'in uscita':'non attivo'}: le sue richieste non verranno servite`);
      for(const x of Object.values(d.articoli)){
        const r=modRisposta(x.risposta);
        if(r===''||r==='ha')continue;
        if(r==='?'){esito.problemi.push(`${d.q}: ${d.cognome} ${d.nome}: risposta "${x.risposta}" non riconosciuta per ${artLabel(x.art.nome)} (ammesse: ce l’ho, mi manca, da cambiare)`);continue}
        const conNum=D.conNumero(x.art.nome);
        const scritta=x.tagliaRic||x.taglia||(modConTaglie(x.art)?'':'UNICA');
        if(!scritta){esito.problemi.push(`${d.q}: ${d.cognome} ${d.nome}: manca la taglia per ${artLabel(x.art.nome)}`);continue}
        if(sembraData(scritta)){esito.problemi.push(`${d.q}: ${d.cognome} ${d.nome}: la taglia "${scritta}" sembra una data (Excel trasforma per esempio 5-6 in una data)`);continue}
        const taglia=tagliaArticolo(x.art,scritta);
        if(!taglia){esito.problemi.push(`${d.q}: ${d.cognome} ${d.nome}: la taglia "${scritta}" non è prevista per ${artLabel(x.art.nome)} (previste: ${(x.art.taglie||[]).join(', ')||'unica'})`);continue}
        if(consegnati.has(KEY(aid+'|'+x.art.nome+'|'+(conNum?'':taglia)))){esito.avvisi.push(`${d.q}: ${d.cognome} ${d.nome} ha già ricevuto ${artLabel(x.art.nome)} in questa stagione: richiesta non creata`);esito.saltati++;continue}
        const stesse=aperte[KEY(aid+'|'+x.art.nome)]||[];
        if(stesse.some(([,r])=>r.taglia===taglia)){esito.saltati++;continue}
        if(stesse.length&&!conNum){
          // stessa cosa, taglia diversa: la richiesta si corregge
          const [rid]=stesse[0];if(!prova)await S.db.doc('richieste/'+rid).update({taglia});stesse[0][1]={...stesse[0][1],taglia};
          esito.avvisi.push(`${d.q}: ${d.cognome} ${d.nome}: la richiesta di ${artLabel(x.art.nome)} passa alla taglia ${taglia}`);
          esito.aggiornati++;continue}
        const nuova={atletaId:aid,articolo:x.art.nome,taglia,modello:'',numeroDesiderato:null,note:'',ordine:Date.now()};
        const ref=prova?{id:'PROVA'}:await S.db.collection('richieste').add(nuova);
        (aperte[KEY(aid+'|'+x.art.nome)]=stesse).push([ref&&ref.id,nuova]);
        esito.aggiornati++;
        // "da cambiare" su una divisa: quella che ha adesso torna disponibile
        if(r==='cambia'&&conNum){
          // La divisa della squadra, non una maglia da libero: il modulo parla
          // della divisa da gara.
          const sue=Object.entries(S.divise).filter(([id,dv])=>dv.holder===aid&&!dv.dismessa&&stessoGenere(dv.modello,''));
          const suo=d.numero?sue.find(([,dv])=>Number(dv.numero)===Number(d.numero)):(sue.length===1?sue[0]:null);
          if(suo){if(!suo[1].daRestituire&&!prova)await S.db.doc('divise/'+suo[0]).update({daRestituire:true})}
          else esito.avvisi.push(sue.length>1&&!d.numero
            ?`${d.q}: ${d.cognome} ${d.nome}: deve cambiare la divisa ma ne ha più di una e il numero non è indicato: va segnata a mano`
            :`${d.q}: ${d.cognome} ${d.nome}: deve cambiare la divisa ma non ne risulta nessuna${d.numero?' con il n.'+d.numero:''}`);
        }
      }
    }
  }
  return esito;
}

/* Scarica il foglio, gia' pieno di quello che c'e' nel programma, con in
   fondo le colonne solo informative. */
async function scaricaModello(tipo){
  const m=MODELLI_EXCEL[tipo];if(!m)return;
  if(!window.__APP){toast('Il foglio si scarica dal programma installato');return}
  // Ogni errore arriva a chi usa il programma: prima un rifiuto della parte
  // Rust (un numero al posto di un testo) spariva senza nessun messaggio.
  try{
    const dove=await window.__APP.scegliDoveSalvare(`${m.foglio.toLowerCase()}-${today()}.xlsx`);
    if(!dove)return;
    await window.__APP.scriviExcel(dove,m.foglio,[...m.colonne,...(m.info||[])],m.righe().map(r=>r.map(c=>c==null?'':String(c))),m.istruzioni);
    toast('Foglio salvato');
  }catch(e){toast('Scrittura del file non riuscita: '+e)}
}

/* Il registro dei movimenti, solo da scaricare. */
async function scaricaMovimenti(){
  if(!window.__APP){toast('Il foglio si scarica dal programma installato');return}
  const D=derive();
  const righe=Object.values(S.movimenti).sort((a,b)=>(a.ts||0)-(b.ts||0)).map(m=>{const a=S.atlete[m.atletaId];
    // Chi non e' piu' in archivio, o non e' un atleta, ha il nome scritto sul movimento.
    return [m.data||'',cap(m.tipo||''),a?fullName(a):(m.a||''),a?teamLabel(a.squadra):'',artCodiceTaglia(m.articolo,m.taglia),artLabel(m.articolo),
      m.taglia==='UNICA'?'unica':(m.taglia||''),m.numero==null?'':String(m.numero),String(m.qta??''),m.stagione||'',m.note||'']});
  if(!righe.length){toast('Nessun movimento registrato');return}
  try{
    const dove=await window.__APP.scegliDoveSalvare(`movimenti-${today()}.xlsx`);
    if(!dove)return;
    await window.__APP.scriviExcel(dove,'Movimenti',
      ['Data','Tipo','Atleta o destinatario','Squadra','Codice','Articolo','Taglia','Numero','Quantità','Stagione','Nota'],righe,
      ['MOVIMENTI — il registro di consegne, rientri, carichi e rettifiche, dal più vecchio.',
       '',`${righe.length} movimenti al ${fmtDate(today())}. Il foglio è solo da consultare: non si ricarica.`]);
    toast('Foglio salvato');
  }catch(e){toast('Scrittura del file non riuscita: '+e)}
}

/* La domanda prima di caricare: cosa verra' aggiunto, cosa ignorato, quali
   righe hanno errori. */
function riepilogoCaricamento(nome,e,voci){
  const n=(v,k)=>`${v} ${v===1?voci[k][0]:voci[k][1]}`;
  const righe=[`Foglio «${nome}»: controllo completato.`,''];
  const da=[];
  if(e.creati)da.push(n(e.creati,'creati'));
  if(e.aggiornati&&voci.aggiornati)da.push(n(e.aggiornati,'aggiornati'));
  righe.push(`Da aggiungere: ${da.join(', ')||'niente'}.`);
  if(e.saltati)righe.push(`Già presenti, ignorati: ${e.saltati}.`);
  if(e.squadreNuove&&e.squadreNuove.length)righe.push(`Squadre nuove: ${e.squadreNuove.join(', ')}.`);
  if(e.lottiNuovi&&e.lottiNuovi.length)righe.push(`Lotti di divise nuovi: ${e.lottiNuovi.join(', ')}.`);
  if(e.problemi.length){righe.push('',`${e.problemi.length===1?'Una riga contiene errori e non verrà caricata':e.problemi.length+' righe contengono errori e non verranno caricate'}:`);
    righe.push(...e.problemi.slice(0,5).map(x=>'• '+x));if(e.problemi.length>5)righe.push(`• …e altre ${e.problemi.length-5}`)}
  if(e.avvisi.length)righe.push('',`Avvisi da verificare: ${e.avvisi.length} (l'elenco resta in Impostazioni).`);
  righe.push('','Caricare i dati validi?');
  return righe.join('\n');
}
function sintesiEsito(e,voci){
  const pezzi=[];
  if(e.creati)pezzi.push(`${e.creati} ${e.creati===1?voci.creati[0]:voci.creati[1]}`);
  if(e.aggiornati&&voci.aggiornati)pezzi.push(`${e.aggiornati} ${e.aggiornati===1?voci.aggiornati[0]:voci.aggiornati[1]}`);
  if(e.saltati)pezzi.push(`${e.saltati} già presenti`);
  if(e.problemi.length)pezzi.push(`${e.problemi.length} con errori`);
  return pezzi.join(', ')||'Niente da aggiungere';
}
/* L'esito di un caricamento: una finestra che si apre appena finito, con il
   riepilogo, le righe non caricate e gli avvisi. In fondo alle Impostazioni
   passava inosservato. Resta ricordato per poterla riaprire. */
function mostraEsitoExcel(nome,e,sintesi){
  S.app.esitoExcel={nome,problemi:e.problemi||[],avvisi:e.avvisi||[],sintesi:sintesi||'',quando:new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})};
  S.app.problemiExcel=e.problemi||[];
  render();
  finestraEsitoExcel();
}
function finestraEsitoExcel(){
  const e=S.app.esitoExcel;if(!e)return;
  const blocco=(titolo,voci,cls)=>voci.length?`<h3 class="esitoTit ${cls}">${titolo}</h3><ul class="esitoLista">${voci.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:'';
  openDlg(`<h2>Esito del caricamento</h2>
  <p class="sub">«${esc(e.nome)}», alle ${esc(e.quando)}${e.sintesi?`: ${esc(e.sintesi)}`:''}.</p>
  ${!e.problemi.length&&!e.avvisi.length?'<div class="notice">Tutte le righe sono state caricate o erano già presenti: nessun errore e nessun avviso.</div>':''}
  ${blocco(e.problemi.length===1?'Una riga non caricata':e.problemi.length+' righe non caricate',e.problemi,'bad')}
  ${blocco(e.avvisi.length===1?'Un avviso da verificare':e.avvisi.length+' avvisi da verificare',e.avvisi,'')}
  <div class="dlg-actions"><button class="btn primary" value="cancel">Chiudi</button></div>`,null);
}

/* Legge il foglio compilato, lo controlla, dice cosa succederebbe, e carica
   solo se si conferma. */
async function caricaModello(tipo){
  const m=MODELLI_EXCEL[tipo];if(!m)return;
  if(!window.__APP){toast('Il foglio si carica dal programma installato');return}
  let file,righe;
  try{file=await window.__APP.scegliDaAprire()}
  catch(e){toast('Apertura della finestra non riuscita: '+e);return}
  if(!file)return;
  try{righe=await window.__APP.leggiExcel(file)}
  catch(e){toast('Lettura del file non riuscita: '+e);return}
  if(!righe.length){toast('Il foglio è vuoto');return}

  // Le colonne si riconoscono dal titolo, non dalla posizione: una colonna
  // spostata o aggiunta non fa piu' scivolare i dati, e un foglio sbagliato
  // (le divise caricate come atleti) viene rifiutato invece di creare righe
  // senza senso.
  const iTit=righe.slice(0,5).findIndex(r=>m.obbligatorie.every(c=>r.map(KEY).includes(KEY(c))));
  if(iTit<0){toast(`Questo non sembra il foglio «${m.nome}»: mancano le colonne ${m.obbligatorie.join(', ')}`);return}
  const titoli=righe[iTit].map(KEY);
  const doppie=titoli.filter((t,k)=>t&&titoli.indexOf(t)!==k);
  if(doppie.length){toast(`Il foglio ha colonne ripetute (${[...new Set(doppie)].join(', ')}): correggere il foglio e riprovare`);return}
  const note=new Set([...m.colonne,...(m.info||[])].map(KEY));
  const ignote=righe[iTit].filter(t=>String(t??'').trim()&&!note.has(KEY(t)));
  const pos=m.colonne.map(c=>titoli.indexOf(KEY(c)));
  const tutte=righe.slice(iTit+1).map((r,k)=>({r,n:iTit+2+k}));
  const piene=tutte.filter(x=>x.r.some(c=>String(c??'').trim()));
  const dati=piene.map(x=>pos.map(k=>k<0?'':(x.r[k]??'')));
  const nr=k=>`riga ${piene[k].n}`;
  if(!dati.length){toast('Nel foglio ci sono solo le intestazioni');return}

  const prova=await m.applica(dati,true,nr);
  if(ignote.length)prova.avvisi.unshift(`colonne non riconosciute, ignorate: ${ignote.join(', ')}`);
  if(!prova.creati&&!prova.aggiornati){mostraEsitoExcel(m.nome,prova,'nessun dato nuovo da caricare');return}
  if(!await chiedi(riepilogoCaricamento(m.nome,prova,m.voci)))return;

  S.busy=true;render();
  let esito;
  try{esito=await m.applica(dati,false,nr)}
  catch(e){S.busy=false;render();toast('Caricamento interrotto: '+e);return}
  S.busy=false;
  if(ignote.length)esito.avvisi.unshift(`colonne non riconosciute, ignorate: ${ignote.join(', ')}`);
  mostraEsitoExcel(m.nome,esito,sintesiEsito(esito,m.voci));
}

  const e=S.app.esitoExcel;
  return `<h2>Fogli Excel</h2>
  <p class="sub">Ogni foglio si scarica con i dati presenti nel programma e si può ricaricare per aggiungerne di nuovi: il caricamento aggiunge soltanto, non modifica né cancella. Prima di caricare, il programma controlla ogni riga e mostra cosa verrà aggiunto, cosa verrà ignorato e quali righe contengono errori. Le colonne informative in fondo ai fogli vengono ignorate.</p>
  <div class="list" style="margin-bottom:12px"><div class="item"><div class="main">
  <div class="name">Modulo di distribuzione</div>
  <div class="meta">Da compilare a cura dei dirigenti: un foglio per squadra, con gli atleti già inseriti. Nelle caselle si indica soltanto «ce l’ho», «mi manca» o «da cambiare».</div></div>
  <div class="right"><button type="button" class="btn small" data-act="scaricaModulo">Scarica</button>
  <button type="button" class="btn small primary" data-act="caricaModulo">Carica</button></div></div></div>
  <p class="sub">I quattro fogli seguenti vanno caricati nell’ordine indicato: le richieste richiedono gli atleti, e gli atleti gli articoli.</p>
  <div class="list">`+
  Object.entries(MODELLI_EXCEL).map(([tipo,m],i)=>`<div class="item"><div class="main"><div class="name">${i+1}. ${esc(m.nome)}</div><div class="meta">${esc(m.colonne.join(' · '))}${m.info&&m.info.length?` <span class="soloInfo">· informative: ${esc(m.info.join(', '))}</span>`:''}</div></div>
  <div class="right"><button type="button" class="btn small" data-act="scaricaXls" data-v="${tipo}">Scarica</button>
  <button type="button" class="btn small primary" data-act="caricaXls" data-v="${tipo}">Carica</button></div></div>`).join('')+
  `<div class="item"><div class="main"><div class="name">Movimenti</div><div class="meta">Il registro completo, solo da consultare.</div></div>
  <div class="right"><button type="button" class="btn small" data-act="scaricaMov">Scarica</button></div></div></div>`+
  (e?`<div class="list" style="margin-top:10px"><div class="item"><div class="main"><div class="name">Ultimo caricamento: «${esc(e.nome)}», alle ${esc(e.quando)}</div>
    <div class="meta">${e.problemi.length?`<b class="neg">${e.problemi.length===1?'una riga non caricata':e.problemi.length+' righe non caricate'}</b>`:'nessuna riga scartata'}${e.avvisi.length?` · ${e.avvisi.length===1?'un avviso':e.avvisi.length+' avvisi'}`:''}</div></div>
    <div class="right"><button type="button" class="btn small" data-act="rivediEsito">Rivedi</button></div></div></div>`:'');
}

/* ============ avvio ============ */
async function boot(){
  applicaTema();
  render();
  if(!window.claude||typeof window.claude.use!=='function'){S.status='offline';render();return}
  let db=null;try{db=await window.claude.use('db')}catch(e){db=null}
  if(!db){S.status='offline';render();return}
  S.db=db;S.status='ok';
  const onErr=e=>{S.status=e&&e.code==='revoked'?'revoked':'error';toast(window.__APP?'Collegamento ai dati interrotto: riavviare il programma.':'Collegamento ai dati interrotto: ricaricare la pagina.');render()};
  db.doc('settings/main').onSnapshot(s=>{S.settings=s.exists?s.data():null;S.loaded.add('settings');changed();
    // i dati di prima non avevano il codice corto degli articoli
    setTimeout(assegnaCodiciMancanti,0)},onErr);
  for(const c of COLS)db.collection(c).onSnapshot(q=>{const m={};for(const d of q.docs)m[d.id]=d.data();S[c]=m;S.loaded.add(c);changed()},onErr);
  window.claude.use('downloads').then(d=>{S.dl=d}).catch(()=>{});
  // Qualche secondo dopo l'avvio, senza disturbare: se c'è una versione nuova
  // compare l'avviso, se non c'è non succede niente.
  if(window.__APP)setTimeout(()=>{window.__APP.cercaAggiornamento()
    .then(v=>{if(v){S.app.nuovaVersione=v;toast(`C'è la versione ${v}: la installi da Impostazioni`);render()}})
    .catch(()=>{})},4000);
}
boot();
