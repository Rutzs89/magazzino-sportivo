  colonne:['Modello','Taglia','Numero','Squadra','Cognome','Nome','Da cambiare','Note','Tipo'],
  info:['Stato','Prenotata per'],
  guida:D=>({
   Modello:{valori:D.set.modelli||['STANDARD'],libero:true,aiuto:'Il lotto della maglia, dal menu. Un nome nuovo crea un lotto nuovo.'},
   Taglia:{valori:taglieDi((D.set.articoli||[]).filter(a=>a.conNumero)),libero:true,aiuto:'La taglia stampata sull\'etichetta, dal menu.'},
   Numero:{intero:[0,99],aiuto:'Il numero stampato sulla maglia, da 0 a 99.'},
   Squadra:{valori:nomiSquadre(D),aiuto:'Vuota se la maglia è in magazzino; altrimenti la squadra dell\'atleta che la tiene, dal menu.'},
   Cognome:{valori:cognomiAtleti(),aiuto:'Vuoto se la maglia è in magazzino; altrimenti il cognome dell\'atleta, dal menu (atleti già caricati).'},
   Nome:{valori:nomiAtleti(),aiuto:'Vuoto se la maglia è in magazzino; altrimenti il nome dell\'atleta, dal menu.'},
   'Da cambiare':{...SI_NO,aiuto:'sì se l\'atleta la sta restituendo (taglia sbagliata, cambio squadra); altrimenti vuoto.'},
   Note:{lunghezza:200,aiuto:'Facoltativo.'},
   Tipo:{valori:['gara','libero'],aiuto:'Facoltativo, solo per un lotto nuovo: gara oppure libero.'}}),
  obbligatorie:['Taglia','Numero'],
  voci:{creati:['divisa nuova','divise nuove']},
  istruzioni:[
   'DIVISE DA GARA — da caricare dopo gli atleti.',
   '',
   'Una riga per ogni capo fisico. Due divise con lo stesso numero ma taglia',
   'diversa sono due capi diversi, ed è normale averle entrambe.',
   '',
   'Colonne:',
   'Modello                  il lotto: STANDARD per le divise normali, LIBERO per le',
   '                         maglie da libero. Altri nomi creano altri lotti (per',
   '                         esempio PRIMA SQUADRA, LIBERO GIOVANILI); ogni squadra',
   '                         sceglie quale lotto usa, in Magazzino -> Divise oppure',
   '                         sulla sua riga in Squadre.',
   'Taglia                   XXS, XS, S, M, L, XL, XXL',
   'Numero                   il numero stampato sulla maglia, da 0 a 99',
   'Squadra, Cognome, Nome   vuoti se la divisa è in magazzino. Per una divisa',
   '                         assegnata: l\'atleta, già caricato con il foglio Atleti.',
   'Da cambiare              sì se l\'atleta la sta restituendo (taglia sbagliata,',
   '                         cambio squadra): il numero resta libero per la sua squadra.',
   'Note                     facoltativo',
   'Tipo                     facoltativo, per un lotto nuovo: gara oppure libero. Se',
   '                         manca, un lotto il cui nome contiene LIBERO è di maglie',
   '                         da libero.',
   '',
   'Le colonne Stato e Prenotata per sono solo informative: al caricamento',
   'vengono ignorate.',
   '',
   'Numeri doppi:',
   'All\'interno di una squadra un numero non si ripete: una divisa con un numero',
   'già in uso nella squadra dell\'atleta viene caricata e segnalata come numero doppio.'],
  righe(){const D=derive();
   return Object.entries(S.divise).filter(([,d])=>!d.dismessa)
   .sort((a,b)=>(a[1].modello||'').localeCompare(b[1].modello||'')||szIdx(a[1].taglia)-szIdx(b[1].taglia)||a[1].numero-b[1].numero)
   .map(([id,d])=>{const a=d.holder?S.atlete[d.holder]:null;const pr=D.prenDivisa[id];
    return [d.modello||'STANDARD',d.taglia,String(d.numero),a?a.squadra:'',a?a.cognome:'',a?a.nome:'',
     d.daRestituire?'sì':'',d.note||'',tipoLotto(d.modello),
     !d.holder?'in magazzino':d.daRestituire?'da cambiare':'in uso',pr&&S.richieste[pr]?fullName(S.atlete[S.richieste[pr].atletaId]):'']})},
  async applica(righe,prova,nr=riga0){
   const D=derive();const r=nuovoEsito();
   const modelli=[...(D.set.modelli||['STANDARD'])];const tipiNuovi={};
   const perNome=indiceAtleti();
   // Il capo si riconosce da modello, taglia, numero **e da chi lo tiene**: due
   // liberi di squadre diverse possono portare lo stesso numero, ed e' normale.
   const chiave=(m,t,n,h)=>`${m}|${t}|${n}|${h||''}`;
   const gia=new Set(Object.values(S.divise).filter(d=>!d.dismessa).map(d=>chiave(d.modello||'STANDARD',KEY(d.taglia),Number(d.numero),d.holder)));
   // I numeri in uso in ogni squadra, compresi quelli caricati da questo foglio.
   const inUso={};
   for(const d of Object.values(S.divise)){if(d.dismessa||!d.holder||d.daRestituire)continue;const a=S.atlete[d.holder];if(!a)continue;
     (inUso[serieNumeri(D,a.squadra)]=inUso[serieNumeri(D,a.squadra)]||new Map()).set(Number(d.numero),d.holder)}
   const visti=new Set();
   for(const [i,riga] of righe.entries()){
    const q=nr(i);
    const mod=(COL(riga,0)||'STANDARD').toUpperCase();const tg=normTaglia(COL(riga,1));
    if(!tg){r.problemi.push(`${q}: manca la taglia`);continue}
    if(sembraData(tg)){r.problemi.push(`${q}: la taglia "${tg}" sembra una data: va scritta come testo`);continue}
    // Una casella vuota non e' il numero 0.
    const num=numeroMaglia(COL(riga,2));
    if(num===null){r.problemi.push(`${q}: manca il numero`);continue}
    if(Number.isNaN(num)){r.problemi.push(`${q}: numero "${COL(riga,2)}" non valido: serve un numero intero da 0 a 99`);continue}
    if(!siNoValido(COL(riga,6))){r.problemi.push(`${q}: «Da cambiare» vale "${COL(riga,6)}"; valori ammessi: sì, no oppure vuoto`);continue}
    const tipoScritto=norm(COL(riga,8));
    if(tipoScritto&&!['gara','libero'].includes(tipoScritto)){r.problemi.push(`${q}: tipo "${COL(riga,8)}" non ammesso (ammessi: gara, libero)`);continue}
    if(!SZ.includes(tg))r.avvisi.push(`${q}: taglia ${tg} non fra quelle consuete (${SZ.join(', ')})`);
    const sq=COL(riga,3).toUpperCase();const cog=COL(riga,4);const nom=COL(riga,5);
    let holder=null;
    if(sq||cog||nom){
     if(!sq||!cog||!nom){r.problemi.push(`${q}: per assegnare la divisa servono squadra, cognome e nome dell'atleta`);continue}
     holder=perNome.get(KEY(sq+'|'+cog+'|'+nom))||null;
     if(holder===OMONIMI){r.problemi.push(`${q}: in ${sq} ci sono due atleti di nome ${cog} ${nom}: la divisa va assegnata a mano`);continue}
     if(!holder){r.problemi.push(`${q}: nessun atleta ${cog} ${nom} in ${sq}: la divisa non viene caricata`);continue}
     const at=S.atlete[holder];
     if(at.inUscita||at.attiva===false)r.avvisi.push(`${q}: ${cog} ${nom} è ${at.inUscita?'in attesa di riconsegna per l’eliminazione':'non attivo'}`)}
    const k=chiave(mod,KEY(tg),num,holder);
    if(visti.has(k)){r.avvisi.push(`${q}: la ${tg} n.${num} ${cap(mod)} compare più volte nel foglio: riga ignorata`);r.saltati++;continue}
    visti.add(k);
    if(gia.has(k)){r.saltati++;continue}
    const daCambiare=SI(COL(riga,6));
    if(holder&&!daCambiare){const sqA=S.atlete[holder].squadra;const kS=serieNumeri(D,sqA);const chi=inUso[kS]&&inUso[kS].get(num);
      // La maglia esiste davvero: si carica, ma il numero doppio si segnala
      // (e poi resta evidenziato in squadra finche' non si sistema).
      if(chi&&chi!==holder)r.avvisi.push(`${q}: in ${teamLabel(sqA)} il n.${num} è già di ${fullName(S.atlete[chi])}: la divisa viene caricata, ma il numero risulterà doppio in squadra`);
      (inUso[kS]=inUso[kS]||new Map()).set(num,holder)}
    if(holder&&Object.values(S.divise).some(d=>!d.dismessa&&!d.holder&&(d.modello||'STANDARD')===mod&&KEY(d.taglia)===KEY(tg)&&Number(d.numero)===num))
      r.avvisi.push(`${q}: una ${tg} n.${num} ${cap(mod)} risulta anche in magazzino: verificare che non sia lo stesso capo contato due volte`);
    if(!modelli.includes(mod)){modelli.push(mod);r.lottiNuovi.push(mod);
      tipiNuovi[mod]=tipoScritto||(/LIBERO/.test(mod)?'libero':'gara')}
    else if(tipoScritto&&tipoScritto!==(tipiNuovi[mod]||tipoLotto(mod)))r.avvisi.push(`${q}: il lotto ${mod} è di ${TIPI_MAGLIA[tipiNuovi[mod]||tipoLotto(mod)]}: il tipo indicato viene ignorato`);
    if(!prova)await S.db.collection('divise').add({taglia:tg,numero:num,modello:mod,holder,daRestituire:daCambiare,note:COL(riga,7)});
    r.creati++}
   if(!prova&&r.lottiNuovi.length){const tipi={...(D.set.tipiLotto||{})};for(const m of D.set.modelli||[])if(!tipi[m])tipi[m]=tipoLotto(m);
     await S.db.doc('settings/main').update({modelli,tipiLotto:{...tipi,...tipiNuovi}})}
   return r}},

 richieste:{
  nome:'Richieste',
  foglio:'Richieste',
  colonne:['Squadra','Cognome','Nome','Articolo','Taglia','Numero desiderato','Note','Tipo di divisa'],
  info:['Esito','Numero proposto','Motivo'],
  guida:D=>({
   Squadra:{valori:nomiSquadre(D),aiuto:'La squadra dell\'atleta, dal menu.'},
   Cognome:{valori:cognomiAtleti(),aiuto:'Il cognome dell\'atleta, dal menu (atleti già caricati).'},
   Nome:{valori:nomiAtleti(),aiuto:'Il nome dell\'atleta, dal menu.'},
   Articolo:{valori:elencoOrdinato((D.set.articoli||[]).map(a=>a.nome)),aiuto:'L\'articolo da consegnare, dal menu.'},
   Taglia:{valori:[...taglieDi(D.set.articoli||[]).filter(t=>t!=='UNICA'),'UNICA'],aiuto:'Una delle taglie previste per l\'articolo, dal menu; UNICA per gli articoli senza taglie.'},
   'Numero desiderato':{intero:[0,99],aiuto:'Solo per le divise, e solo se viene chiesto un numero preciso: da 0 a 99.'},
   Note:NOTE_LIBERE,
   'Tipo di divisa':{valori:['LIBERO'],aiuto:'Facoltativo: LIBERO per una maglia da libero; vuoto per la divisa della squadra.'}}),
  obbligatorie:['Squadra','Cognome','Nome','Articolo'],
  voci:{creati:['richiesta nuova','richieste nuove']},
  istruzioni:[
   'RICHIESTE — da caricare per ultimo.',
   '',
   'Una riga per ogni articolo che un atleta deve ricevere. È il foglio che i',
   'dirigenti di squadra possono compilare e rimandare indietro.',
   '',
   'Colonne:',
   'Squadra, Cognome, Nome   devono corrispondere a un atleta già inserito.',
   'Articolo                 il nome, il codice corto (A001) o il nome come appare',
   '                         nel programma.',
   'Taglia                   una di quelle previste per l\'articolo.',
   'Numero desiderato        solo per le divise e solo se ne viene chiesto uno',
   '                         preciso, da 0 a 99.',
   'Note                     facoltativo.',
   'Tipo di divisa           facoltativo: LIBERO per una maglia da libero.',
   '',
   'Le colonne Esito, Numero proposto e Motivo sono solo informative: al',
   'caricamento vengono ignorate.',
   '',
   'Caricamento:',
   'Le righe che non corrispondono a nessun atleta o articolo vengono segnalate e',
   'non caricate. Una richiesta uguale a una già aperta, o di un articolo già',
   'consegnato in questa stagione, viene ignorata.'],
  righe(){const D=derive();
   const sq=rid=>{const a=S.atlete[S.richieste[rid].atletaId];return a?(D.teamIdx[a.squadra]??99):999};
   return D.order.map((rid,k)=>[rid,k]).sort((x,y)=>sq(x[0])-sq(y[0])||x[1]-y[1]).map(([rid])=>{const r=S.richieste[rid];const a=S.atlete[r.atletaId];if(!a)return null;
    const p=D.prop[rid]||{};const d=p.divisaId?S.divise[p.divisaId]:null;
    return [a.squadra,a.cognome,a.nome,r.articolo,r.taglia,r.numeroDesiderato==null?'':String(r.numeroDesiderato),r.note||'',r.modello||'',
     p.esito==='OK'?'pronta':p.esito==='MANCA'?'da ordinare':'esclusa',d?String(d.numero):'',p.motivo||'']}).filter(Boolean)},
  async applica(righe,prova,nr=riga0){
   const D=derive();const r=nuovoEsito();
   const perNome=indiceAtleti();
   let ordine=Object.values(S.richieste).reduce((m,x)=>Math.max(m,x.ordine||0),0);
   // Una richiesta uguale a una gia' aperta non si rifa': ricaricare lo stesso
   // foglio raddoppiava tutto.
   const chiave=x=>KEY([x.atletaId,x.articolo,x.taglia,x.modello||'',x.numeroDesiderato??''].join('|'));
   const gia=new Set(Object.values(S.richieste).map(chiave));
   const visti=new Set();
   const stag=D.set.stagione||'';const consegnati=new Set();
   for(const m of Object.values(S.movimenti)){if(m.tipo!=='CONSEGNA'||!m.atletaId||(m.stagione||'')!==stag)continue;
     consegnati.add(KEY(m.atletaId+'|'+m.articolo+'|'+(D.conNumero(m.articolo)?'':m.taglia)))}
   for(const [i,riga] of righe.entries()){
    const q=nr(i);
    const sq=COL(riga,0).toUpperCase();const cog=COL(riga,1);const nom=COL(riga,2);
    const artScritto=COL(riga,3);
    if(!sq&&!cog&&!nom&&!artScritto){r.saltati++;continue}
    if(!sq||!cog||!nom||!artScritto){r.problemi.push(`${q}: ${quali([!sq&&'la squadra',!cog&&'il cognome',!nom&&'il nome',!artScritto&&'l\'articolo'])} ${[!sq,!cog,!nom,!artScritto].filter(Boolean).length===1?'manca':'mancano'}`);continue}
    const aid=perNome.get(KEY(sq+'|'+cog+'|'+nom));
    if(aid===OMONIMI){r.problemi.push(`${q}: in ${sq} ci sono due atleti di nome ${cog} ${nom}: la richiesta va inserita a mano`);continue}
    if(!aid){r.problemi.push(`${q}: nessun atleta ${cog} ${nom} in ${sq}`);continue}
    const a=articoloDaNome(D,artScritto);
    if(!a){r.problemi.push(`${q}: articolo "${artScritto}" sconosciuto (si può indicare il nome, il codice o il nome visualizzato)`);continue}
    const tg=tagliaArticolo(a,COL(riga,4)||'UNICA');
    if(!tg){r.problemi.push(`${q}: la taglia "${COL(riga,4)}" non è prevista per ${artLabel(a.nome)} (previste: ${(a.taglie||[]).join(', ')||'unica'})`);continue}
    const numero=numeroMaglia(COL(riga,5));
    if(Number.isNaN(numero)){r.problemi.push(`${q}: numero desiderato "${COL(riga,5)}" non valido: serve un numero intero da 0 a 99`);continue}
    if(numero!==null&&!a.conNumero)r.avvisi.push(`${q}: ${artLabel(a.nome)} non ha il numero stampato: il numero desiderato viene ignorato`);
    const tipo=COL(riga,7).toUpperCase();
    if(tipo&&(!a.conNumero||!(tipo==='LIBERO'||D.comuni.has(tipo)))){r.problemi.push(`${q}: tipo di divisa "${tipo}" non ammesso${a.conNumero?' (ammessi: LIBERO per una maglia da libero, oppure vuoto)':': l\'articolo non è una divisa'}`);continue}
    const at=S.atlete[aid];
    if(at.inUscita||at.attiva===false)r.avvisi.push(`${q}: ${cog} ${nom} è ${at.inUscita?'in attesa di riconsegna per l’eliminazione':'non attivo'}: la richiesta non verrà servita`);
    if(a.distribuibile===false)r.avvisi.push(`${q}: ${artLabel(a.nome)} non è più in distribuzione: la richiesta resterà esclusa`);
    const nuova={atletaId:aid,articolo:a.nome,modello:a.conNumero&&tipo?D.lottiLibero[0]:'',taglia:tg,numeroDesiderato:a.conNumero?numero:null,note:COL(riga,6)};
    const k=chiave(nuova);
    if(visti.has(k)){r.avvisi.push(`${q}: la stessa richiesta compare più volte nel foglio: riga ignorata`);r.saltati++;continue}
    visti.add(k);
    if(gia.has(k)){r.saltati++;continue}
    if(consegnati.has(KEY(aid+'|'+a.nome+'|'+(a.conNumero?'':tg)))){r.avvisi.push(`${q}: ${cog} ${nom} ha già ricevuto ${artLabel(a.nome)} in questa stagione: richiesta non creata`);r.saltati++;continue}
    if(a.conNumero&&numero!==null){const chi=Object.values(S.divise).find(d=>!d.dismessa&&d.holder&&d.holder!==aid&&!d.daRestituire&&S.atlete[d.holder]&&stessaSerie(D,S.atlete[d.holder].squadra,at.squadra)&&Number(d.numero)===numero);
      if(chi)r.avvisi.push(`${q}: in ${teamLabel(at.squadra)} il n.${numero} è già di ${fullName(S.atlete[chi.holder])}: verrà proposto un altro numero`)}
    if(!prova)await S.db.collection('richieste').add({...nuova,ordine:++ordine});
    r.creati++}
   return r}}
};

/* Scarica il foglio, gia' pieno di quello che c'e' nel programma. */
/* ============ il modulo di distribuzione ============
   Un file solo, un foglio per squadra, le stesse colonne dappertutto: e' il
   modulo che i dirigenti compilano a mano, e da cui escono squadre, atleti e
   richieste in un colpo.

   Le colonne le decide l'elenco articoli del programma, non chi compila: cosi'
   non succede piu' che la stessa cosa si chiami "BORSONE GRANDE" in un foglio
   e "BORSONE ZAINETTO" in un altro. */

/* Le uniche risposte ammesse in una casella. Chi compila ne scrive di tutti i
   colori ("la devo sostiutire", "Ce l'ho"), quindi si guarda la sostanza. */
const MOD_RISPOSTE=['ce l’ho','mi manca','da cambiare','consegnato'];
function modRisposta(v){
  const t=norm(v).replace(/[’'`]/g,'\'').trim();
  if(!t)return '';
  // "non mi manca", "non ce l'ho": una negazione rovescia il senso, meglio
  // chiedere che indovinare.
  if(/(^|\W)non(\W|$)/.test(t))return '?';
  // «consegnato» scritto dopo la palestra: la consegna e' avvenuta.
  if(t.includes('consegn'))return 'consegnato';
  if(t.includes('manca'))return 'manca';
  // Radici corte apposta: nei fogli veri c'erano "la devo sostiutire" e "la
  // devo cambia" (casella troncata), e venivano scartate.
  if(t.includes('cambi')||t.includes('sost'))return 'cambia';
  if(t.includes('ce l'))return 'ha';
  return '?';
}
/* Nel modulo vanno solo gli articoli di quest'anno. Gli avanzi delle stagioni
   passate restano in magazzino e si possono ancora consegnare a mano, ma se
   entrassero qui il foglio avrebbe sessanta colonne invece di trenta e
   nessuno lo compilerebbe. Si riconoscono da soli: tutte le loro righe di
   magazzino sono segnate come stagioni precedenti. */
const modArticoli=D=>(D.set.articoli||[]).filter(a=>{
  if(a.distribuibile===false)return false;
  // Di questa stagione lo dice l'articolo stesso: se non lo dice, si guarda se
  // tutto quello che ne resta in magazzino e' roba di stagioni passate.
  if(a.stagione)return a.stagione===(D.set.stagione||'');
  const righe=Object.values(S.materiale).filter(m=>m.articolo===a.nome);
  return !(righe.length&&righe.every(m=>m.precedente))});
const modConTaglie=a=>(a.taglie||[]).filter(t=>t&&t!=='UNICA').length>0;

/* L'intestazione del modulo e' su due righe: sopra il nome dell'articolo,
   su una casella unita, sotto le sue colonne, Risposta e (se l'articolo ha
   le taglie) Taglia, cioe' la taglia da consegnare. Cognome, Nome, Numero
   maglia e Note occupano le due righe. modColonne da' la riga di sotto,
   modGruppi quella di sopra (vuoto = colonna senza articolo). */
const MOD_RISPOSTA='Risposta',MOD_TAGLIA='Taglia',MOD_PROPOSTA='Proposta';
// La divisa ha in piu' la colonna della maglia che il programma ha preparato:
// e' quella da portare in palestra, e con «consegnato» e' quella che si registra.
const modConProposta=(D,a)=>D.conNumero(a.nome);
// Il materiale ha la colonna dei pezzi (Andrea, 25/09/2026: "potrebbe capitare
// spesso" che un'atleta ne chieda piu' d'uno). Vuota vale 1. La divisa e' un
// capo solo, non ce l'ha. Un pezzo = una richiesta: il motore conta gia' cosi'.
const MOD_PEZZI='Pezzi';
const modConPezzi=(D,a)=>!D.conNumero(a.nome);
function modPezzi(D,id,art){
  const ric=Object.values(S.richieste).filter(r=>r.atletaId===id&&r.articolo===art.nome).length;
  const ha=Object.entries(D.dotazione[id]||{}).filter(([k,v])=>v>0&&k.split('|')[0]===art.nome).reduce((t,[,v])=>t+v,0);
  const n=ric||ha;return n>1?String(n):'';
}
// Pezzi scritti nella casella: vuota = 1; NaN se non e' un intero da 1 a 99.
const pezziDa=v=>{const t=String(v??'').trim();if(t==='')return 1;const n=Number(t);return Number.isInteger(n)&&n>=1&&n<=99?n:NaN};
function modColonne(D){
  const c=['Cognome','Nome','Numero maglia'];
  for(const a of modArticoli(D)){c.push(MOD_RISPOSTA);if(modConTaglie(a))c.push(MOD_TAGLIA);if(modConProposta(D,a))c.push(MOD_PROPOSTA);if(modConPezzi(D,a))c.push(MOD_PEZZI)}
  c.push('Note');
  return c;
}
function modGruppi(D){
  const g=['','',''];
  for(const a of modArticoli(D)){const et=artLabel(a.nome);g.push(et);if(modConTaglie(a))g.push(et);if(modConProposta(D,a))g.push(et);if(modConPezzi(D,a))g.push(et)}
  g.push('');
  return g;
}

/* I menu a tendina del modulo, colonna per colonna come modColonne: la
   risposta per ogni articolo e le sue taglie. */
function modMenu(D){
  const m=[
   {lunghezza:60,aiuto:'Già compilato per gli atleti presenti. Per un atleta nuovo: una riga in fondo, con cognome e nome.'},
   {lunghezza:60,aiuto:'Il nome dell\'atleta.'},
   {intero:[0,99],aiuto:'Il numero di maglia attuale, non quello richiesto: da 0 a 99.'}];
  for(const a of modArticoli(D)){
    m.push({valori:MOD_RISPOSTE,libero:true,aiuto:'ce l’ho, mi manca, da cambiare oppure consegnato, dal menu. La casella vuota vale «ce l’ho».'});
    if(modConTaglie(a))m.push({valori:(a.taglie||[]).filter(Boolean),aiuto:'La taglia, dal menu: con «mi manca» e «da cambiare» quella da consegnare, con «ce l’ho» quella posseduta, che viene registrata.'});
    if(modConProposta(D,a))m.push({lunghezza:20,aiuto:'La divisa preparata dal programma, per esempio M n.12: è quella da consegnare. Con «consegnato» viene registrata questa.'});
    if(modConPezzi(D,a))m.push({intero:[1,99],aiuto:'Quanti pezzi, se più di uno. La casella vuota vale 1.'});
  }
  m.push(NOTE_LIBERE);
  return m;
}

/* Il foglio esce gia' con dentro gli atleti che il programma conosce, e il
   numero di maglia che hanno: chi compila trova la sua squadra e riempie solo
   le caselle, senza riscrivere i nomi. */
/* Anche le risposte escono gia' scritte, con quello che il programma sa:
   chi compila cambia solo le caselle che non vanno, e ricaricando il foglio
   le righe non toccate non producono niente (decisione di Andrea, 25/09/2026:
   "ridurre al minimo i copia incolla"). Una casella resta vuota solo se del
   capo non si sa niente. */
function modRisposte(D,id,art){
  const conNum=D.conNumero(art.nome);
  const ric=Object.values(S.richieste).filter(r=>r.atletaId===id&&r.articolo===art.nome&&(!conNum||tipoLotto(r.modello||'')!=='libero'));
  if(conNum){
    const sua=(D.perAtleta[id]||[]).map(x=>S.divise[x]).find(x=>x&&tipoLotto(x.modello)!=='libero');
    if(sua&&sua.daRestituire)return ['da cambiare',ric[0]?ric[0].taglia:''];
    if(ric.length)return ['mi manca',ric[0].taglia];
    if(sua)return ['ce l’ho',sua.taglia];
    return ['',''];
  }
  // la taglia che ha, se ne ha: quella con piu' pezzi
  const ha=Object.entries(D.dotazione[id]||{}).filter(([k,v])=>v>0&&k.split('|')[0]===art.nome).sort((x,y)=>y[1]-x[1]);
  const tg=t=>t==='UNICA'?'':t;
  if(ric.length)return [ha.length?'da cambiare':'mi manca',tg(ric[0].taglia)];
  if(ha.length)return ['ce l’ho',tg(ha[0][0].split('|')[1])];
  return ['',''];
}
/* Qualcosa di quell'atleta per quell'articolo e' cambiato dopo l'istante dato:
   un movimento o una richiesta nuova. */
function cambiatoDopo(aid,art,ts){
  return Object.values(S.movimenti).some(m=>m.atletaId===aid&&m.articolo===art&&(m.ts||0)>ts)
    ||Object.values(S.richieste).some(r=>r.atletaId===aid&&r.articolo===art&&(r.ordine||0)>ts);
}
/* La fotografia nascosta: una riga per atleta, con le risposte com'erano. */
const MOD_ORIGINE='Origine';
const m0=a=>a.length;
function modOrigine(D,squadre,nomiFogli){
  const arts=modArticoli(D);
  const righe=[['magazzino-sportivo',String(Date.now())]];
  squadre.forEach((sq,i)=>{
    for(const [id,a] of Object.entries(S.atlete)){if(a.squadra!==sq.nome)continue;
      const r={a:{}};for(const art of arts){const [x,t]=modRisposte(D,id,art);const p=modConProposta(D,art)?modProposta(D,id,art):'';const n=modConPezzi(D,art)?modPezzi(D,id,art):'';if(x||t||p||n)r.a[art.nome]=[x,t,p,n]}
      righe.push([nomiFogli[i],sq.nome,a.cognome,a.nome,JSON.stringify(r)])}});
  return righe;
}
function leggiOrigine(fogli){
  const f=fogli.find(([n])=>KEY(n)===KEY(MOD_ORIGINE));if(!f)return null;
  const righe=f[1];if(!righe.length||righe[0][0]!=='magazzino-sportivo')return null;
  const o={ts:Number(righe[0][1])||0,per:new Map(),fogli:new Map()};
  for(const r of righe.slice(1)){if(!r[1])continue;
    let v={a:{}};try{v=JSON.parse(r[4]||'{}')}catch(e){}
    o.per.set(KEY(r[1]+'|'+r[2]+'|'+r[3]),{...v,foglio:r[0],squadra:r[1],cognome:r[2],nome:r[3]});
    o.fogli.set(KEY(r[0]),r[1])}
  return o;
}
/* La divisa che il motore ha preparato per la richiesta aperta dell'atleta. */
function modProposta(D,id,art){
  const rid=Object.keys(S.richieste).find(k=>{const r=S.richieste[k];return r.atletaId===id&&r.articolo===art.nome&&tipoLotto(r.modello||'')!=='libero'});
  const p=rid&&D.prop[rid];if(!p)return '';
  if(p.esito==='OK'&&p.divisaId&&S.divise[p.divisaId]){const d=S.divise[p.divisaId];return `${d.taglia} n.${d.numero}`}
  return p.esito==='MANCA'?'da ordinare':'';
}
function modRighe(D,squadra){
  const arts=modArticoli(D);
  return Object.entries(S.atlete)
    .filter(([id,a])=>a.squadra===squadra)
    .sort((x,y)=>norm(fullName(x[1])).localeCompare(norm(fullName(y[1]))))
    .map(([id,a])=>{
      const divisa=(D.perAtleta[id]||[]).map(x=>S.divise[x])
        .find(x=>x&&(x.modello||'STANDARD')===(D.lotto[squadra]||'STANDARD'));
      const riga=[a.cognome,a.nome,divisa?String(divisa.numero):''];
      for(const art of arts){const [r,t]=modRisposte(D,id,art);riga.push(r);if(modConTaglie(art))riga.push(t);if(modConProposta(D,art))riga.push(modProposta(D,id,art));if(modConPezzi(D,art))riga.push(modPezzi(D,id,art))}
      riga.push(a.note||'');
      return riga});
}

async function scaricaModulo(solo){
  if(!window.__APP){toast('Il modulo si scarica dal programma installato');return}
  const D=derive();
  const squadre=solo?D.perServire.filter(x=>x.nome===solo):D.perServire;
  if(!squadre.length){toast('Occorre prima inserire le squadre');return}
  if(!modArticoli(D).length){toast('Occorre prima inserire gli articoli');return}
  // Il titolo della colonna e' l'unica cosa che lega la casella all'articolo:
  // se due articoli si chiamassero uguale, al ritorno non si saprebbe di chi
  // e' quella casella. Meglio fermarsi adesso che sbagliare dopo.
  const titoli=modArticoli(D).map(a=>KEY(artLabel(a.nome)));
  const doppio=titoli.find((t,i)=>titoli.indexOf(t)!==i);
  if(doppio){const quali=modArticoli(D).filter(a=>KEY(artLabel(a.nome))===doppio).map(a=>a.nome);
    toast(`Due articoli hanno lo stesso nome visualizzato (${quali.join(' e ')}): occorre cambiare l’etichetta di uno dei due, altrimenti il modulo non può essere riletto`);return}
  const colonne=modColonne(D);
  const nomiFogli=fogliSquadre(squadre.map(s=>s.nome));
  const menu=modMenu(D);
  const gruppi=modGruppi(D);
  const fogli=squadre.map((s,i)=>{const righe=modRighe(D,s.nome);
    // Il foglio di una squadra sola va in palestra: le colonne degli articoli
    // che nessuna atleta di quella squadra ha o chiede si nascondono (restano nel
    // file e si rileggono). Nel file di tutte le squadre, per i dirigenti,
    // restano tutte visibili: nessuno deve cercare la colonna che gli serve.
    const nascoste=solo?colonne.map((c,k)=>k).filter(k=>gruppi[k]&&righe.every(r=>!String(r[k]||'').trim())
      &&colonne.every((c2,k2)=>gruppi[k2]!==gruppi[k]||righe.every(r=>!String(r[k2]||'').trim()))):[];
    return {nome:nomiFogli[i],intestazioni:colonne,gruppi,righe,menu,colonneNascoste:nascoste}});
  // La fotografia del foglio com'era allo scarico, in un foglio nascosto: al
  // ritorno contano solo le caselle cambiate. Prima un foglio tenuto una
  // settimana dal dirigente, ricaricato, rifaceva richieste gia' consegnate.
  fogli.push({nome:MOD_ORIGINE,nascosto:true,intestazioni:[],gruppi:[],menu:[],righe:modOrigine(D,squadre,nomiFogli)});
  let dove;
  try{dove=await window.__APP.scegliDoveSalvare(solo?`${teamLabel(solo).toLowerCase().replace(/[^a-z0-9]+/g,'-')}-${today()}.xlsx`:`modulo-distribuzione-${today()}.xlsx`)}
  catch(e){toast('Apertura della finestra di salvataggio non riuscita: '+e);return}
  if(!dove)return;
  try{await window.__APP.scriviExcelFogli(dove,fogli,guidaPerExcel(modIstruzioni(D)))}
  catch(e){toast('Scrittura del file non riuscita: '+e);return}
  toast(`Modulo salvato: ${squadre.length} ${squadre.length===1?'squadra':'squadre'}`); // non fogli: c'e' anche la fotografia nascosta
}

/* Legge il modulo compilato. Tutto quello che non torna finisce nell'elenco dei
   problemi invece di fermare il caricamento: con centocinquanta righe scritte a
   mano, fermarsi alla prima storta vuol dire non caricare mai niente. */
async function caricaModulo(){
  if(!window.__APP){toast('Il modulo si carica dal programma installato');return}
  let file;
  try{file=await window.__APP.scegliDaAprire()}
  catch(e){toast('Apertura della finestra non riuscita: '+e);return}
  if(!file)return;
  let fogli;
  try{fogli=await window.__APP.leggiExcelFogli(file)}
  catch(e){toast('Lettura del file non riuscita: '+e);return}

  const D=derive();
  const arts=modArticoli(D);
  // dal titolo della colonna all'articolo: si accetta l'etichetta o il codice
  const perTitolo={};
  for(const a of arts){perTitolo[KEY(artLabel(a.nome))]=a;perTitolo[KEY(a.nome)]=a}

  const daFare=[];const problemi=[];const colonneIgnote=new Set();const avvisiModulo=[];const vistiModulo=new Set();
  // Dal nome del foglio alla squadra: lo stesso calcolo fatto allo scarico,
  // cosi' una squadra dal nome lungo o con una barra si ritrova.
  const perFoglio={};
  const nomiSq=D.perServire.map(x=>x.nome);
  fogliSquadre(nomiSq).forEach((f,i)=>{perFoglio[KEY(f)]=nomiSq[i]});
  for(const n of nomiSq)perFoglio[KEY(n)]=perFoglio[KEY(n)]||n;
  const squadreNuove=new Set();
  const origine=leggiOrigine(fogli);
  const perSquadra={};for(const [id,a] of Object.entries(S.atlete))(perSquadra[a.squadra]=perSquadra[a.squadra]||new Map()).set(KEY(a.cognome+'|'+a.nome),id);
  const fogliLetti=new Set();
  for(const [nomeFoglio,righe] of fogli){
    if(KEY(nomeFoglio)===KEY('Istruzioni')||KEY(nomeFoglio)===KEY('Elenchi')||KEY(nomeFoglio)===KEY(MOD_ORIGINE)||!righe.length)continue;
    // Un foglio copiato dentro Excel si chiama "U14 (2)": e' la stessa squadra.
    let squadra=perFoglio[KEY(nomeFoglio)]||perFoglio[KEY(String(nomeFoglio).replace(/\s*\(\d+\)\s*$/,''))]
      ||(origine&&origine.fogli.get(KEY(nomeFoglio)));
    // Foglio rinominato: se la maggior parte dei nomi e' di una squadra che
    // c'e', e' quella. Prima diventava una squadra nuova con tutte le atlete
    // doppie (analisi del 25/09/2026).
    if(!squadra){const nomi=righe.map(r=>KEY(String(r[0]??'').trim()+'|'+String(r[1]??'').trim())).filter(k=>k!=='|');
      let meglio=null,quanti=0;
      for(const [sq,m] of Object.entries(perSquadra)){const n=nomi.filter(k=>m.has(k)).length;if(n>quanti){meglio=sq;quanti=n}}
      if(meglio&&quanti>=Math.max(2,Math.ceil(m0(nomi)/2))){squadra=meglio;avvisiModulo.push(`il foglio «${nomeFoglio}» non corrisponde a nessuna squadra, ma ${quanti} atleti su ${m0(nomi)} sono di ${teamLabel(meglio)}: letto come ${teamLabel(meglio)}`)}}
    if(!squadra){squadra=String(nomeFoglio).trim().toUpperCase();squadreNuove.add(squadra)}
    fogliLetti.add(squadra);
    const i0=righe.findIndex(r=>r.some(c=>KEY(c)===KEY('Cognome')));
    if(i0<0){problemi.push(`foglio ${nomeFoglio}: non trovo la riga dei titoli`);continue}
    // Intestazione su due righe (sopra l'articolo, sotto Risposta e Taglia)
    // oppure su una sola, come nei moduli di prima ("Felpa", "Felpa taglia",
    // "Felpa taglia richiesta"): si leggono tutti e due.
    const sotto=righe[i0+1]||[];
    const dueRighe=sotto.some(c=>KEY(c)===KEY(MOD_RISPOSTA));
    const larga=Math.max(righe[i0].length,dueRighe?sotto.length:0);
    let gruppo='';
    const colonne=Array.from({length:larga},(_,k)=>{
      const su=String(righe[i0][k]??'').trim();
      if(!dueRighe)return{t:su};
      const giu=String(sotto[k]??'').trim();
      // senza niente sotto e' una colonna alta due righe (Cognome, Note...)
      if(!giu){gruppo='';return{t:su}}
      // la casella unita ha il nome solo nella prima colonna: vale per le
      // colonne che seguono finche' non ne comincia un altro
      if(su)gruppo=su;
      return{t:giu,gruppo}});
    // ogni colonna: cosa vuol dire
    const mappa=colonne.map(({t,gruppo})=>{
      if(gruppo!==undefined){
        const art=perTitolo[KEY(gruppo)];const k=KEY(t);
        if(art&&k===KEY(MOD_RISPOSTA))return{tipo:'risposta',art};
        if(art&&k.startsWith(KEY(MOD_TAGLIA)))return{tipo:'tagliaRic',art};
        if(art&&k===KEY(MOD_PROPOSTA))return{tipo:'proposta',art};
        if(art&&k===KEY(MOD_PEZZI))return{tipo:'pezzi',art};
        if(gruppo||t)colonneIgnote.add(gruppo?`${gruppo} (${t})`:t);
        return{tipo:'?'}}
      const k=KEY(t);
      if(k===KEY('Cognome'))return{tipo:'cognome'};
      if(k===KEY('Nome'))return{tipo:'nome'};
      if(k===KEY('Numero maglia'))return{tipo:'numero'};
      if(k===KEY('Note'))return{tipo:'note'};
      const mR=t.match(/^(.*) taglia richiesta$/i);
      if(mR&&perTitolo[KEY(mR[1])])return{tipo:'tagliaRic',art:perTitolo[KEY(mR[1])]};
      const mT=t.match(/^(.*) taglia$/i);
      if(mT&&perTitolo[KEY(mT[1])])return{tipo:'taglia',art:perTitolo[KEY(mT[1])]};
      if(perTitolo[k])return{tipo:'risposta',art:perTitolo[k]};
      // Una colonna che non si riconosce non si butta via zitti: forse
      // l'articolo e' stato rinominato dopo aver consegnato il modulo, e chi
      // ha compilato si aspetta che quelle caselle contino.
      if(t)colonneIgnote.add(t);
      return{tipo:'?'}});
    if(!mappa.some(m=>m.tipo==='cognome')){problemi.push(`foglio ${nomeFoglio}: manca la colonna Cognome`);continue}

    for(let i=i0+(dueRighe?2:1);i<righe.length;i++){
      const riga=righe[i];const dati={squadra,articoli:{},note:''};
      mappa.forEach((m,c)=>{const v=String(riga[c]??'').trim();
        if(m.tipo==='cognome')dati.cognome=v;
        else if(m.tipo==='nome')dati.nome=v;
        else if(m.tipo==='numero')dati.numero=v;
        else if(m.tipo==='note')dati.note=v;
        else if(m.tipo==='risposta'||m.tipo==='taglia'||m.tipo==='tagliaRic'||m.tipo==='proposta'||m.tipo==='pezzi'){
          const a=(dati.articoli[m.art.nome]=dati.articoli[m.art.nome]||{art:m.art});
          if(m.tipo==='risposta')a.risposta=v;
          else if(m.tipo==='taglia')a.taglia=v;
          else if(m.tipo==='proposta')a.proposta=v;
          else if(m.tipo==='pezzi')a.pezzi=v;
          else a.tagliaRic=v}});
      if(!dati.cognome&&!dati.nome)continue;
      const q=`${nomeFoglio}, riga ${i+1}`;
      if(!dati.cognome||!dati.nome){problemi.push(`${q}: manca il ${dati.cognome?'nome':'cognome'} (${dati.cognome||dati.nome})`);continue}
      dati.q=q;
      if(dati.numero&&Number.isNaN(numeroMaglia(dati.numero))){avvisiModulo.push(`${q}: numero di maglia "${dati.numero}" non valido: ignorato`);dati.numero=''}
      if(sembraRecapito(dati.note)){avvisiModulo.push(`${q}: la nota sembra contenere un recapito e non viene caricata`);dati.note=''}
      const kd=KEY(squadra+'|'+dati.cognome+'|'+dati.nome);
      // Riga copiata e corretta sotto: non si sa quale sia quella buona, quindi
      // nessuna delle due. Prima valeva la prima, cioe' quella vecchia.
      if(vistiModulo.has(kd)){const prima=daFare.findIndex(x=>KEY(x.squadra+'|'+x.cognome+'|'+x.nome)===kd);
        // Uguale in tutto (un foglio copiato dentro Excel): vale una volta.
        const uguale=o=>JSON.stringify(Object.values(o.articoli).map(x=>[x.art.nome,x.risposta||'',x.tagliaRic||x.taglia||'',x.proposta||'']).sort())+'|'+(o.numero||'');
        if(prima<0||uguale(daFare[prima])===uguale(dati)){avvisiModulo.push(`${q}: ${dati.cognome} ${dati.nome} compare due volte, uguale, per ${teamLabel(squadra)}: letta una volta`);continue}
        const q0=daFare[prima].q;daFare.splice(prima,1);
        problemi.push(`${q}: ${dati.cognome} ${dati.nome} compare più volte per ${teamLabel(squadra)}${q0?` (anche ${q0.split(', ')[1]})`:''}: non caricata, va lasciata una riga sola`);continue}
      vistiModulo.add(kd);
      dati.orig=origine?origine.per.get(kd)||null:null;dati.origTs=origine?origine.ts:0;
      daFare.push(dati);
    }
  }
  // Righe che nel foglio scaricato c'erano e adesso mancano: il modulo non
  // cancella atlete, ma lo dice (le si toglie dalla scheda).
  if(origine)for(const [k,o] of origine.per){if(!fogliLetti.has(o.squadra)||vistiModulo.has(k))continue;
    avvisiModulo.push(`${teamLabel(o.squadra)}: ${o.cognome} ${o.nome} è stata tolta dal foglio; nel programma resta: se ha lasciato la squadra, usare «Elimina» dalla sua scheda`)}
  // Un'atleta scritta nel foglio di un'altra squadra: se nel foglio della sua
  // squadra di prima non c'e' piu', e' un passaggio di squadra e la si sposta;
  // se c'e' ancora, gioca in due squadre e si chiede. Prima diventava sempre
  // una scheda doppia.
  for(const d of daFare){if(perSquadra[d.squadra]&&perSquadra[d.squadra].has(KEY(d.cognome+'|'+d.nome)))continue;
    const altrove=Object.entries(perSquadra).filter(([sq,m])=>sq!==d.squadra&&m.has(KEY(d.cognome+'|'+d.nome)));
    if(altrove.length!==1)continue;const [sqPrima,m]=altrove[0];
    if(fogliLetti.has(sqPrima)&&!vistiModulo.has(KEY(sqPrima+'|'+d.cognome+'|'+d.nome))){d.sposta=m.get(KEY(d.cognome+'|'+d.nome));d.sqPrima=sqPrima}
    else d.ancheIn=sqPrima}
  // Una volta sola, non una per foglio: se no l'elenco si riempie di copie e
  // i problemi delle righe non si vedono piu'.
  for(const t of colonneIgnote)avvisiModulo.push(`la colonna "${t}" non corrisponde a nessun articolo ed è stata ignorata`);
  if(!daFare.length){toast(problemi.length?problemi[0]:'Il modulo non contiene righe compilate');
    mostraEsitoExcel('Modulo di distribuzione',{problemi,avvisi:avvisiModulo},'nessuna riga compilata');return}
  // Prima un giro di prova, senza scrivere: si vede cosa succederebbe.
  const prova=await eseguiModulo(D,daFare,true);
  prova.problemi.unshift(...problemi);prova.avvisi.unshift(...avvisiModulo);
  prova.squadreNuove=[...squadreNuove];
  if(!prova.creati&&!prova.aggiornati&&!prova.posseduti&&!prova.tolti&&!prova.consegne&&!prova.spostati){mostraEsitoExcel('Modulo di distribuzione',prova,'nessun dato nuovo da caricare');return}
  if(!await chiedi(riepilogoCaricamento('Modulo di distribuzione',prova,{creati:['atleta nuovo','atleti nuovi'],aggiornati:['richiesta nuova o corretta','richieste nuove o corrette']}),{si:'Carica'}))return;
  const r=await scriviConRete('Modulo di distribuzione',()=>eseguiModulo(D,daFare,false));
  if(!r)return;
  if(r.errore){mostraEsitoExcel('Modulo di distribuzione',{problemi:[interrotto(r.errore)],avvisi:[]},'caricamento interrotto');return}
  const esito=r.esito;
  esito.problemi.unshift(...problemi);esito.avvisi.unshift(...avvisiModulo);esito.squadreNuove=prova.squadreNuove;
  mostraEsitoExcel('Modulo di distribuzione',esito,sintesiEsito(esito,{creati:['atleta nuovo','atleti nuovi'],aggiornati:['richiesta','richieste']}));
}

/* "Ce l'ho" nel modulo: si segna che l'atleta ha gia' quel capo.
   Il materiale diventa un movimento POSSESSO, che conta fra le cose
   dell'atleta ma non tocca la giacenza (decisione di Andrea, 25/09/2026: di
   solito e' roba delle stagioni passate). La divisa, che e' un capo preciso,
   passa all'atleta se e' in magazzino, e nasce gia' sua se il programma non la
   conosceva. Se e' di un'altra atleta non si tocca: lo si dice. */
async function segnaPossesso(D,d,aid,art,taglia,conNum,prova,esito,aperte,presiQui,pezzi,pezziScritti){
  const chi=`${d.q}: ${d.cognome} ${d.nome}`;
  const nota='Dal modulo di distribuzione';
  const aperta=()=>{if((aperte[KEY(aid+'|'+art.nome)]||[]).length)
    esito.avvisi.push(`${chi}: possiede ${artLabel(art.nome)} ma ha anche una richiesta aperta per lo stesso articolo: verificare se va tolta`)};
  if(!conNum){
    // con i pezzi: si registra solo quello che manca per arrivare al numero scritto
    const ha=((D.dotazione[aid]||{})[D.key(art.nome,taglia)])||0;const vuole=pezzi||1;
    // Meno pezzi nel foglio che nel programma: non si inventa un rientro (puo'
    // essere restituito o perso), ma lo si dice. Solo se i pezzi sono scritti:
    // vuoto vale 1 e nei fogli senza la colonna avviserebbe per chiunque ne ha due.
    if(ha>vuole&&pezziScritti)esito.avvisi.push(`${chi}: ${artLabel(art.nome)} ${taglia==='UNICA'?'':taglia+' '}: nel programma ne risultano ${ha}, nel foglio ${vuole}; se ne ha restituiti, registrare il rientro dalla sua scheda`.replace(' :',':'));
    if(ha>=vuole){esito.saltati++;return}
    if(!prova)await mov({tipo:'POSSESSO',atletaId:aid,articolo:art.nome,taglia,qta:vuole-ha,note:nota});
    esito.posseduti++;aperta();return}

  const lotto=D.lotto[d.squadra]||'STANDARD';
  const num=numeroMaglia(d.numero);
  // Le divise da gara che risultano gia' sue, non le maglie da libero.
  const sue=Object.entries(S.divise).filter(([,dv])=>dv.holder===aid&&!dv.dismessa&&stessoGenere(dv.modello,''));
  if(num==null){
    if(sue.length){esito.saltati++;return}
    esito.problemi.push(`${chi}: possiede ${artLabel(art.nome)} ma manca il numero di maglia, senza il quale non si sa quale divisa sia`);return}
  if(taglia==null){
    // Senza taglia: se una sua ha quel numero e' gia' tutto a posto; se no si
    // cerca in magazzino, e solo una divisa con quel numero e' una risposta.
    if(sue.some(([,dv])=>Number(dv.numero)===num)){esito.saltati++;return}
    const inMag=Object.entries(S.divise).filter(([id,dv])=>!dv.dismessa&&!dv.fuoriUso&&!dv.holder&&!presiQui.divise.has(id)&&(dv.modello||'STANDARD')===lotto&&Number(dv.numero)===num);
    if(inMag.length!==1){
      esito.avvisi.push(inMag.length
        ?`${chi}: possiede la divisa n.${num}, ma in magazzino ce ne sono ${inMag.length} con quel numero (taglie ${inMag.map(([,dv])=>dv.taglia).join(', ')}): indicare la taglia`
        :`${chi}: possiede la divisa n.${num}, che non risulta né a suo nome né in magazzino: indicare la taglia per registrarla`);
      return}
    taglia=inMag[0][1].taglia}
  if(sue.some(([,dv])=>Number(dv.numero)===num&&dv.taglia===taglia)){esito.saltati++;return}
  const suaStesso=sue.find(([,dv])=>Number(dv.numero)===num);
  if(suaStesso){esito.avvisi.push(`${chi}: risulta già con la n.${num} in taglia ${suaStesso[1].taglia}, nel modulo è indicata la taglia ${taglia}: divisa non modificata, va verificata a mano`);return}
  // Il numero non puo' essere doppio in squadra: nemmeno segnando quello che
  // c'e' gia' si aggira la regola, meglio chiedere a chi ha compilato.
  const occ=D.occ[d.squadra]||null;
  const qui=occ?(presiQui.numeri.get(occ)||presiQui.numeri.set(occ,new Set()).get(occ)):null;
  const uguali=Object.entries(S.divise).filter(([,dv])=>!dv.dismessa&&(dv.modello||'STANDARD')===lotto&&dv.taglia===taglia&&Number(dv.numero)===num);
  const libera=uguali.find(([id,dv])=>!dv.holder&&!dv.fuoriUso&&!presiQui.divise.has(id));
  if(!libera&&uguali.some(([,dv])=>dv.holder)){
    const altra=uguali.find(([,dv])=>dv.holder)[1];
    esito.avvisi.push(`${chi}: la divisa ${taglia} n.${num} risulta a ${fullName(S.atlete[altra.holder])||'un altro atleta'}: non modificata, va verificata a mano`);return}
  if((occ&&occ.has(num))||(qui&&qui.has(num))){
    esito.avvisi.push(`${chi}: il n.${num} risulta già usato in squadra: divisa non segnata, va verificata a mano`);return}
  if(sue.length)esito.avvisi.push(`${chi}: risultava già con la n.${sue.map(([,dv])=>dv.numero).join(', n.')}; ora ha anche la n.${num}: verificare quale va restituita`);
  if(qui)qui.add(num);
  if(libera){
    presiQui.divise.add(libera[0]);
    if(!prova)await insieme(async()=>{
      await S.db.doc('divise/'+libera[0]).update({holder:aid,daRestituire:false});
      await mov({tipo:'POSSESSO',atletaId:aid,articolo:art.nome,taglia,divisaId:libera[0],numero:num,prevHolder:null,prevDR:!!libera[1].daRestituire,note:nota})});
  }else{
    // Lo stesso numero in un'altra taglia in magazzino e' normale (Andrea,
    // 25/09/2026: "sono doppioni con taglie diverse"), quindi la divisa si crea.
    // Lo si dice lo stesso: a volte e' la stessa maglia con la taglia sbagliata.
    const simile=Object.entries(S.divise).filter(([id,dv])=>!dv.dismessa&&!dv.holder&&!presiQui.divise.has(id)&&(dv.modello||'STANDARD')===lotto&&Number(dv.numero)===num);
    if(simile.length)esito.avvisi.push(`${chi}: registrata la divisa ${taglia} n.${num}; in magazzino è presente anche la n.${num} in taglia ${simile.map(([,dv])=>dv.taglia).join(', ')}: se si tratta della stessa maglia, correggerne la taglia`);
  }
  if(!libera&&!prova){
    const ref=await S.db.collection('divise').add({taglia,numero:num,modello:lotto,holder:aid,daRestituire:false,note:''});
    await mov({tipo:'POSSESSO',atletaId:aid,articolo:art.nome,taglia,divisaId:ref.id,numero:num,prevHolder:null,prevDR:false,creata:true,note:nota});
  }
  esito.posseduti++;aperta();
}

/* «Consegnato» nel modulo: la consegna fatta in palestra, registrata come dal
   pulsante Consegna di Assegnazioni (doConsegna), compreso il rientro della
   divisa da cambiare. Cosi' il foglio che va in palestra e' lo stesso che torna,
   e non serve piu' la lista a parte (Andrea, 25/09/2026: "pochi punti di
   scarico e caricamento"). Ricaricando lo stesso foglio non si consegna due volte:
   la richiesta non c'e' piu' e la consegna di questa stagione si vede. */
async function modConsegnato(D,d,aid,x,prova,esito,aperte,consegnati,presiQui,sh,ancora){
  const chi=`${d.q}: ${d.cognome} ${d.nome}`;const art=x.art;const conNum=D.conNumero(art.nome);
  const at=S.atlete[aid];
  if(at&&!puoRicevere(at)){esito.problemi.push(`${chi}: «consegnato» per ${artLabel(art.nome)}, ma l’atleta ${at.inUscita?'ha l’eliminazione in attesa di riconsegna':'non è attivo'}: consegna non registrata`);return}
  const scritta=x.tagliaRic||x.taglia||'';
  const tg=scritta?tagliaArticolo(art,scritta):(modConTaglie(art)?'':'UNICA');
  if(scritta&&!tg){esito.problemi.push(`${chi}: la taglia "${scritta}" non è prevista per ${artLabel(art.nome)}`);return}
  const k=KEY(aid+'|'+art.nome);
  const aperteQui=(aperte[k]||[]).filter(([rid,q])=>rid&&(!conNum||tipoLotto(q.modello||'')!=='libero'));
  if(!aperteQui.length){
    if(!ancora&&consegnati.has(KEY(aid+'|'+art.nome+'|'+(conNum?'':tg)))){esito.saltati++;return}
    if(conNum){esito.problemi.push(`${chi}: «consegnato» per ${artLabel(art.nome)} senza una richiesta aperta: la divisa va registrata dalla scheda dell’atleta`);return}
    if(!tg){esito.problemi.push(`${chi}: «consegnato» per ${artLabel(art.nome)} senza taglia`);return}
    // Materiale dato senza richiesta: si registra lo stesso, e' successo.
    if(!ancora&&Object.entries(D.dotazione[aid]||{}).some(([kk,v])=>v>0&&kk.split('|')[0]===art.nome))
      esito.avvisi.push(`${chi}: ${artLabel(art.nome)} consegnato senza richiesta, e l’atleta ne aveva già uno: verificare`);
    if(!prova)await mov({tipo:'CONSEGNA',atletaId:aid,articolo:art.nome,taglia:tg,qta:1,note:'Dal modulo di distribuzione'});
    consegnati.add(KEY(aid+'|'+art.nome+'|'+tg));esito.consegne++;return}
  const [rid,rq]=aperteQui[0];
  let p={};
  if(conNum){
    // La maglia della colonna Proposta, se c'e' ed e' ancora consegnabile;
    // se no quella che propone il programma adesso.
    const mod=D.modelloPer(rq);const m=String(x.proposta||'').toUpperCase().match(/^\s*([A-Z0-9-]+)\s*N\.?\s*(\d+)/);
    const libera=id=>{const dv=S.divise[id];const c=sh[id];return dv&&!dv.dismessa&&!(dv.fuoriUso&&!dv.holder)&&c&&c.holder!==aid&&!presiQui.divise.has(id)};
    let did=m?Object.keys(S.divise).find(id=>{const dv=S.divise[id];return (dv.modello||'STANDARD')===mod&&KEY(dv.taglia)===KEY(m[1])&&Number(dv.numero)===Number(m[2])&&libera(id)}):null;
    // La maglia indicata non c'e' piu': in mano all'atleta c'e' quella del
    // foglio, quindi non se ne registra un'altra al suo posto.
    if(m&&!did){esito.problemi.push(`${chi}: la divisa ${m[1]} n.${m[2]} indicata nel foglio non è più disponibile: consegna non registrata, verificare quale maglia ha ricevuto`);return}
    if(!m){const pp=D.prop[rid];did=pp&&pp.esito==='OK'&&pp.divisaId&&libera(pp.divisaId)?pp.divisaId:null;
      if(did)esito.avvisi.push(`${chi}: nel foglio manca la divisa consegnata (colonna Proposta): registrata la ${S.divise[did].taglia} n.${S.divise[did].numero} proposta ora; prima della palestra conviene riscaricare il foglio`)}
    if(!did){esito.problemi.push(`${chi}: «consegnato» per ${artLabel(art.nome)}, ma non c’è una divisa disponibile da registrare`);return}
    const c=sh[did];
    if(c.holder&&c.holder!==aid&&!c.dr){esito.problemi.push(`${chi}: la divisa ${S.divise[did].taglia} n.${S.divise[did].numero} è ancora in uso da ${fullName(S.atlete[c.holder])}: consegna non registrata`);return}
    presiQui.divise.add(did);p={divisaId:did};
  }else if(tg&&tg!==rq.taglia){
    // consegnata una taglia diversa da quella chiesta: vale quella del foglio
    if(!prova)await S.db.doc('richieste/'+rid).update({taglia:tg});
    esito.avvisi.push(`${chi}: ${artLabel(art.nome)} consegnato in taglia ${tg} invece di ${rq.taglia}`);
  }
  if(!conNum&&((D.stock[D.key(art.nome,tg||rq.taglia)]||{ora:0}).ora)<1)
    esito.avvisi.push(`${chi}: ${artLabel(art.nome)} ${tg||rq.taglia}: in magazzino non ne risultano, la giacenza va sotto zero`);
  // Materiale da cambiare: con quello nuovo rientra il vecchio, come per la
  // divisa. Prima l'atleta risultava con due felpe e il magazzino una in meno.
  // Si sa che era «da cambiare» solo dalla fotografia dello scarico: senza,
  // lo si dice e basta.
  const vecchio=!conNum?Object.entries(D.dotazione[aid]||{}).filter(([kk,v])=>v>0&&kk.split('|')[0]===art.nome).sort((a,b)=>b[1]-a[1])[0]:null;
  const tgVecchio=vecchio?vecchio[0].split('|')[1]:null;
  const rientra=!!tgVecchio&&x.prima==='cambia'&&!ancora;
  if(tgVecchio&&x.prima===undefined&&!ancora)esito.avvisi.push(`${chi}: ${artLabel(art.nome)} consegnato; l’atleta ne aveva già uno in taglia ${tgVecchio}: se lo ha restituito, registrare il rientro dalla sua scheda`);
  if(!prova){
    const ritiro=conNum?ownReturning(aid,D.modelloPer(rq)).filter(id=>id!==p.divisaId):[];
    await doConsegna(rid,p,sh,ritiro);
    if(rientra)await mov({tipo:'RIENTRO',atletaId:aid,articolo:art.nome,taglia:tgVecchio,qta:1,note:'Restituito al cambio'});
  }
  if(rientra)esito.rientri=(esito.rientri||0)+1;
  aperte[k]=(aperte[k]||[]).filter(e=>e[0]!==rid);
  consegnati.add(KEY(aid+'|'+art.nome+'|'+(conNum?'':(tg||rq.taglia))));
  esito.consegne++;
}

/* Il modulo applicato davvero, o solo provato (prova=true: niente scritture,
   gli atleti nuovi hanno un segnaposto al posto dell'id). */
async function eseguiModulo(D,daFare,prova){

  const esito=nuovoEsito();
  {
    const squadre=[...(D.set.squadre||[])];
    const viste=new Set(squadre.map(x=>KEY(x.nome)));
    // Le squadre nuove si scrivono subito, prima degli atleti: se il
    // caricamento si interrompe, nessun atleta resta senza squadra.
    for(const d of daFare)if(!viste.has(KEY(d.squadra))){
      squadre.push({nome:d.squadra,includi:true,modelloDivisa:'STANDARD',ordine:prossimoOrdine(squadre)});viste.add(KEY(d.squadra))}
    if(!prova&&squadre.length!==(D.set.squadre||[]).length)await S.db.doc('settings/main').update({squadre});
    // indice degli atleti gia' dentro, per non rifarli
    const perNome=Object.fromEntries(indiceAtleti());
    // Le richieste aperte, per atleta e articolo: una uguale si salta, una con
    // la taglia cambiata si aggiorna invece di aggiungerne un'altra.
    const aperte={};
    for(const [rid,r] of Object.entries(S.richieste))(aperte[KEY(r.atletaId+'|'+r.articolo)]=aperte[KEY(r.atletaId+'|'+r.articolo)]||[]).push([rid,r]);
    // Quello gia' consegnato in questa stagione non si richiede di nuovo:
    // la consegna cancella la richiesta, e ricaricando il modulo rinasceva.
    const stag=D.set.stagione||'';
    const consegnati=new Set();
    for(const m of Object.values(S.movimenti)){
      if(m.tipo!=='CONSEGNA'||!m.atletaId||(m.stagione||'')!==stag)continue;
      consegnati.add(KEY(m.atletaId+'|'+m.articolo+'|'+(D.conNumero(m.articolo)?'':m.taglia)))}
    // Le divise segnate "ce l'ho" durante questo caricamento: D e' fotografato
    // all'inizio, e senza questo due righe potrebbero prendersi la stessa maglia.
    const presiQui={divise:new Set(),numeri:new Map()};
    // Chi ha in mano cosa, aggiornato consegna dopo consegna: con «consegnato»
    // su molte righe le consegne si susseguono prima che arrivino i dati nuovi.
    const sh=shadow();

    for(const d of daFare){
      const k=KEY(d.squadra+'|'+d.cognome+'|'+d.nome);
      let aid=perNome[k];
      if(aid===OMONIMI){esito.problemi.push(`${d.q}: in ${d.squadra} ci sono due atleti di nome ${d.cognome} ${d.nome}; la riga va inserita a mano`);continue}
      if(!aid&&d.sposta&&S.atlete[d.sposta]){
        // passaggio di squadra: la scheda e' la stessa, cambia la squadra
        aid=d.sposta;perNome[k]=aid;
        if(!prova)await S.db.doc('atlete/'+aid).update({squadra:d.squadra});
        esito.spostati=(esito.spostati||0)+1;(esito.nomiSpostati=esito.nomiSpostati||[]).push(`${d.cognome} ${d.nome} (da ${teamLabel(d.sqPrima)} a ${teamLabel(d.squadra)})`);
        const sua=Object.values(S.divise).find(x=>x.holder===aid&&!x.dismessa&&tipoLotto(x.modello)!=='libero');
        if(sua&&(sua.modello||'STANDARD')!==(D.lotto[d.squadra]||'STANDARD'))esito.avvisi.push(`${d.q}: ${d.cognome} ${d.nome} passa a ${teamLabel(d.squadra)} con una divisa del lotto «${nomeLotto(sua.modello||'STANDARD',true)}»: se va cambiata, segnarla da cambiare`);
      }
      if(!aid&&d.ancheIn)esito.avvisi.push(`${d.q}: ${d.cognome} ${d.nome} risulta anche in ${teamLabel(d.ancheIn)}, che è ancora nel foglio: viene creata una seconda scheda (atleta in due squadre); se invece ha cambiato squadra, toglierla dal foglio di ${teamLabel(d.ancheIn)}`);
      if(!aid){
        if(prova)aid='NUOVO|'+k;
        else{const nuovo=await S.db.collection('atlete').add({squadra:d.squadra,cognome:d.cognome,nome:d.nome,attiva:true,note:d.note||''});aid=nuovo.id}
        perNome[k]=aid;esito.creati++;(esito.nomiCreati=esito.nomiCreati||[]).push(`${d.cognome} ${d.nome} (${teamLabel(d.squadra)})`);
      }else if(d.note&&!S.atlete[aid].note){
        if(!prova)await S.db.doc('atlete/'+aid).update({note:d.note});
      }
      const at=S.atlete[aid];
      if(at&&(at.inUscita||at.attiva===false))esito.avvisi.push(`${d.q}: ${d.cognome} ${d.nome} è ${at.inUscita?'in attesa di riconsegna per l’eliminazione':'non attivo'}: le sue richieste non verranno servite`);
      for(const x of Object.values(d.articoli)){
        const r=modRisposta(x.risposta);
        // Con la fotografia dello scarico contano solo le caselle cambiate: un
        // foglio tenuto una settimana non rifa' cio' che nel frattempo e' stato
        // consegnato, e una casella svuotata non vuol dire «ce l'ho».
        if(d.orig){const o=(d.orig.a||{})[x.art.nome]||['','',''];
          const ro=modRisposta(o[0]),tNow=KEY(x.tagliaRic||x.taglia||''),pNow=KEY(x.proposta||'');
          if(r===ro&&tNow===KEY(o[1]||'')&&(r!=='consegnato'||pNow===KEY(o[2]||''))&&KEY(x.pezzi||'')===KEY(o[3]||'')){esito.invariati=(esito.invariati||0)+1;continue}
          if(ro&&r===''){esito.avvisi.push(`${d.q}: ${d.cognome} ${d.nome}: la casella di ${artLabel(x.art.nome)} è stata svuotata ed è stata ignorata; per togliere una richiesta si sceglie «ce l’ho»`);continue}
          if(d.origTs&&S.atlete[aid]&&cambiatoDopo(aid,x.art.nome,d.origTs))
            esito.avvisi.push(`${d.q}: ${d.cognome} ${d.nome}: ${artLabel(x.art.nome)} è cambiato nel programma dopo lo scarico del foglio: verificare che la modifica del foglio sia ancora valida`);
          x.prima=ro}
        if(r==='?'){esito.problemi.push(`${d.q}: ${d.cognome} ${d.nome}: risposta "${x.risposta}" non riconosciuta per ${artLabel(x.art.nome)} (ammesse: ce l’ho, mi manca, da cambiare, consegnato)`);continue}
        x.n=pezziDa(x.pezzi);
        if(Number.isNaN(x.n)){esito.problemi.push(`${d.q}: ${d.cognome} ${d.nome}: pezzi "${x.pezzi}" non validi per ${artLabel(x.art.nome)} (un numero intero da 1 a 99, oppure vuoto)`);continue}
        if(r==='consegnato'){for(let i=0;i<(D.conNumero(x.art.nome)?1:x.n);i++)await modConsegnato(D,d,aid,x,prova,esito,aperte,consegnati,presiQui,sh,i>0);continue}
        // Il foglio e' la verita' per la squadra (Andrea, 25/09/2026: "se sono
        // tanti i cambiamenti"): «ce l'ho» scritto su un capo con una richiesta
        // aperta la toglie. Solo se scritto: la casella vuota non toglie niente,
        // nei fogli vecchi vuoto voleva dire "ce l'ho" e sparirebbe tutto.
        if(r==='ha'){
          const k=KEY(aid+'|'+x.art.nome);const conN=D.conNumero(x.art.nome);
          const via=(aperte[k]||[]).filter(([,q])=>!conN||tipoLotto(q.modello||'')!=='libero');
          for(const [rid,q] of via){
            if(!prova&&rid&&S.richieste[rid])await S.db.doc('richieste/'+rid).delete();
            esito.tolti++;(esito.nomiTolti=esito.nomiTolti||[]).push(`${d.cognome} ${d.nome}, ${artLabel(x.art.nome).toLowerCase()}`);esito.avvisi.push(`${d.q}: ${d.cognome} ${d.nome}: nel modulo «ce l’ho» per ${artLabel(x.art.nome)}: tolta la richiesta${q.taglia&&q.taglia!=='UNICA'?' in taglia '+q.taglia:''}`)}
          if(via.length)aperte[k]=(aperte[k]||[]).filter(e=>!via.includes(e));
          // la divisa che doveva cambiare, se ormai la tiene, non rientra piu'
          if(conN&&via.length){const dc=Object.entries(S.divise).find(([,dv])=>dv.holder===aid&&!dv.dismessa&&dv.daRestituire&&stessoGenere(dv.modello,''));
            if(dc&&!prova)await S.db.doc('divise/'+dc[0]).update({daRestituire:false})}
        }
        // "ce l'ho" (o la casella vuota) con la taglia scritta: si segna che
        // l'atleta ce l'ha. Senza taglia non c'e' niente da segnare. Un articolo
        // di taglia unica si segna solo con "ce l'ho" scritto: la casella vuota
        // vale "ce l'ho" per non costringere a riempirle tutte, non vuol dire
        // che lo si sappia davvero.
        const ha=r===''||r==='ha';
        const conNum=D.conNumero(x.art.nome);
        // nei moduli vecchi "X taglia" era la taglia attuale: e' quella che conta
        // per chi ce l'ha, quella richiesta per chi ne ha bisogno
        const scritta=(ha?x.taglia||x.tagliaRic:x.tagliaRic||x.taglia)||(modConTaglie(x.art)||r===''?'':'UNICA');
        // Divisa con "ce l'ho" e il numero ma senza taglia: la taglia la dice il
        // magazzino, se li' c'e' una sola divisa con quel numero.
        if(!scritta&&ha&&conNum&&d.numero){await segnaPossesso(D,d,aid,x.art,null,conNum,prova,esito,aperte,presiQui);continue}
        if(!scritta){if(!ha)esito.problemi.push(`${d.q}: ${d.cognome} ${d.nome}: manca la taglia per ${artLabel(x.art.nome)}`);continue}
        if(sembraData(scritta)){esito.problemi.push(`${d.q}: ${d.cognome} ${d.nome}: la taglia "${scritta}" sembra una data (Excel trasforma per esempio 5-6 in una data)`);continue}
        const taglia=tagliaArticolo(x.art,scritta);
        if(!taglia){esito.problemi.push(`${d.q}: ${d.cognome} ${d.nome}: la taglia "${scritta}" non è prevista per ${artLabel(x.art.nome)} (previste: ${(x.art.taglie||[]).join(', ')||'unica'})`);continue}
        if(ha){await segnaPossesso(D,d,aid,x.art,taglia,conNum,prova,esito,aperte,presiQui,x.n,String(x.pezzi||'').trim()!=='');continue}
        // "Da cambiare" vuol dire proprio che ce l'ha gia': che l'abbia ricevuto
        // quest'anno non conta. Prima la richiesta non nasceva (25/09/2026: una
        // divisa consegnata a mano la mattina, poi «la devo cambiare» nel modulo).
        if(r!=='cambia'&&consegnati.has(KEY(aid+'|'+x.art.nome+'|'+(conNum?'':taglia)))){esito.avvisi.push(`${d.q}: ${d.cognome} ${d.nome} ha già ricevuto ${artLabel(x.art.nome)} in questa stagione: richiesta non creata`);esito.saltati++;continue}
        const stesse=aperte[KEY(aid+'|'+x.art.nome)]||[];
        // per la divisa contano le richieste della divisa da gara, non dei liberi
        const corr=conNum?stesse.filter(([,q])=>tipoLotto(q.modello||'')!=='libero'):stesse;
        if(!conNum&&(x.n>1||corr.length>1)){
          // Materiale a piu' pezzi: una richiesta per pezzo, tutte nella taglia
          // del foglio. Pezzi in meno si tolgono solo se la casella e' cambiata
          // rispetto alla fotografia dello scarico (se no un foglio senza la
          // colonna, dove vuoto vale 1, toglierebbe richieste in blocco).
          let fatto=false;
          for(const e of corr)if(e[1].taglia!==taglia){if(!prova)await S.db.doc('richieste/'+e[0]).update({taglia});e[1]={...e[1],taglia};fatto=true}
          if(fatto){esito.aggiornati++;esito.avvisi.push(`${d.q}: ${d.cognome} ${d.nome}: le richieste di ${artLabel(x.art.nome)} passano alla taglia ${taglia}`)}
          for(let i=corr.length;i<x.n;i++){
            const nuova={atletaId:aid,articolo:x.art.nome,taglia,modello:'',numeroDesiderato:null,note:'',ordine:Date.now()+i};
            const ref=prova?{id:'PROVA'+i}:await S.db.collection('richieste').add(nuova);
            (aperte[KEY(aid+'|'+x.art.nome)]=stesse).push([ref&&ref.id,nuova]);esito.aggiornati++;fatto=true}
          if(corr.length>x.n&&d.orig){
            const via=corr.slice(x.n);
            for(const [rid] of via)if(!prova&&rid&&S.richieste[rid])await S.db.doc('richieste/'+rid).delete();
            aperte[KEY(aid+'|'+x.art.nome)]=stesse.filter(e=>!via.includes(e));
            esito.tolti+=via.length;(esito.nomiTolti=esito.nomiTolti||[]).push(`${d.cognome} ${d.nome}, ${artLabel(x.art.nome).toLowerCase()} (da ${corr.length} a ${x.n} pezzi)`);fatto=true}
          if(!fatto)esito.saltati++;
          continue}
        if(corr.some(([,r])=>r.taglia===taglia)){esito.saltati++;continue}
        if(corr.length){
          // stessa cosa, taglia diversa: la richiesta si corregge. Anche la
          // divisa: prima ne nasceva una seconda accanto alla vecchia.
          const [rid]=corr[0];if(!prova)await S.db.doc('richieste/'+rid).update({taglia});corr[0][1]={...corr[0][1],taglia};
          esito.avvisi.push(`${d.q}: ${d.cognome} ${d.nome}: la richiesta di ${artLabel(x.art.nome)} passa alla taglia ${taglia}`);
          esito.aggiornati++;continue}
        const nuova={atletaId:aid,articolo:x.art.nome,taglia,modello:'',numeroDesiderato:null,note:'',ordine:Date.now()};
        const ref=prova?{id:'PROVA'}:await S.db.collection('richieste').add(nuova);
        (aperte[KEY(aid+'|'+x.art.nome)]=stesse).push([ref&&ref.id,nuova]);
        esito.aggiornati++;
        // "da cambiare" su una divisa: quella che ha adesso torna disponibile
        if(r==='cambia'&&conNum){
          // La divisa della squadra, non una maglia da libero: il modulo parla
          // della divisa da gara.
          const sue=Object.entries(S.divise).filter(([id,dv])=>dv.holder===aid&&!dv.dismessa&&stessoGenere(dv.modello,''));
          const suo=d.numero?sue.find(([,dv])=>Number(dv.numero)===Number(d.numero)):(sue.length===1?sue[0]:null);
          if(suo){if(!suo[1].daRestituire&&!prova)await S.db.doc('divise/'+suo[0]).update({daRestituire:true})}
          else esito.avvisi.push(sue.length>1&&!d.numero
            ?`${d.q}: ${d.cognome} ${d.nome}: deve cambiare la divisa ma ne ha più di una e il numero non è indicato: va segnata a mano`
            :`${d.q}: ${d.cognome} ${d.nome}: deve cambiare la divisa ma non ne risulta nessuna${d.numero?' con il n.'+d.numero:''}`);
        }
      }
    }
  }
  return esito;
}

/* Scarica il foglio, gia' pieno di quello che c'e' nel programma, con in
   fondo le colonne solo informative. */
async function scaricaModello(tipo){
  const m=MODELLI_EXCEL[tipo];if(!m)return;
  if(!window.__APP){toast('Il foglio si scarica dal programma installato');return}
  // Ogni errore arriva a chi usa il programma: prima un rifiuto della parte
  // Rust (un numero al posto di un testo) spariva senza nessun messaggio.
  try{
    const dove=await window.__APP.scegliDoveSalvare(`${m.foglio.toLowerCase()}-${today()}.xlsx`);
    if(!dove)return;
    const colonne=[...m.colonne,...(m.info||[])];
    await window.__APP.scriviExcel(dove,m.foglio,colonne,m.righe().map(r=>r.map(c=>c==null?'':String(c))),guidaPerExcel(m.istruzioni),
      guidaColonne(m,derive()),gruppiColonne(m));
    toast('Foglio salvato');
  }catch(e){toast('Scrittura del file non riuscita: '+e)}
}
