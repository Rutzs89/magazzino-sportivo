    <p>Su ogni divisa, <b>Segna da cambiare</b> la indica come da sostituire e <b>Restituita</b> ne registra il rientro; sul materiale, <b>Restituito</b> registra il rientro dei pezzi.</p>`,vociDivise(false));
  h+=`<h2>Divise</h2>`;
  if(!divs.length)h+=`<div class="list"><p class="empty">Nessuna divisa assegnata. Si assegna con una nuova richiesta oppure con la consegna diretta.</p></div>`;
  else h+=`<div class="list">`+divs.map(([did,d])=>`<div class="item">${chip(d,'big')}<div class="main"><div class="name">${esc(nomeLotto(d.modello))}</div>
    <div class="meta">${d.daRestituire?'Da cambiare: deve essere restituita alla consegna della nuova':'In uso'}${d.tagliaChiesta?` · <b>taglia ${esc(d.taglia)}</b>, ne aveva chiesta una ${esc(d.tagliaChiesta)}`:''}${d.note?' · '+esc(d.note):''}</div></div>
    <div class="right"><button type="button" class="btn small" data-act="toggleDR" data-id="${esc(did)}">${d.daRestituire?'Non la cambia più':'Segna da cambiare'}</button>
    <button type="button" class="btn small" data-act="rientroDivisa" data-id="${esc(did)}">Restituita</button></div></div>`).join('')+`</div>`;
  h+=`<h2>Richieste aperte</h2>`;
  if(!req.length)h+=`<div class="list"><p class="empty">Nessuna richiesta aperta.</p></div>`;
  else h+=`<div class="list">`+req.map(rid=>reqRow(rid,false)).join('')+`</div>`;
  h+=`<h2>Materiale consegnato</h2>`;
  if(!dot.length)h+=`<div class="list"><p class="empty">Nessuna consegna registrata finora.</p></div>`;
  else h+=`<div class="list">`+dot.map(([k,v])=>{const [ar,tg]=k.split('|');return`<div class="item"><div class="main"><div class="name">${esc(artLabel(ar))}</div><div class="meta">${tg==='UNICA'?'Taglia unica':'Taglia '+esc(tg)} · ${v} ${v===1?'pezzo':'pezzi'}</div></div>
    <div class="right"><button type="button" class="btn small" data-act="rientroMat" data-id="${esc(id)}" data-art="${esc(ar)}" data-tg="${esc(tg)}">Restituito</button></div></div>`}).join('')+`</div>`;
  return h;
}
function reqRow(rid,withName){
  const r=S.richieste[rid];const D=derive();const p=D.prop[rid]||{};const a=S.atlete[r.atletaId];
  const isNum=D.conNumero(r.articolo);const d=p.divisaId?S.divise[p.divisaId]:null;
  const modVero=D.conNumero(r.articolo)?D.modelloPer(r):(r.modello||'');
  const what=`${esc(artLabel(r.articolo))}${modVero&&modVero!=='STANDARD'?' '+esc(modVero.toLowerCase()):''} · ${r.taglia==='UNICA'?'taglia unica':esc(r.taglia)}${r.numeroDesiderato!=null?' · chiede il n.'+esc(r.numeroDesiderato):''}`;
  // Il numero doppio riguarda le divise: sulla richiesta di una tee o di una
  // borraccia l'avviso non c'entra e confonde.
  const dp=isNum?conNumeroDoppio(D)[r.atletaId]:null;
  const extra=[];
  // Chi sta aspettando la taglia giusta intanto una divisa ce l'ha: senza
  // dirlo, la riga sembra quella di chi e' rimasto a mani vuote.
  const provvisoria=(D.perAtleta[r.atletaId]||[]).map(x=>S.divise[x])
    .find(x=>x&&x.daRestituire&&x.tagliaChiesta===r.taglia);
  if(provvisoria)extra.push(`intanto ha una ${esc(provvisoria.taglia)} n.${esc(provvisoria.numero)}, da cambiare`);
  if(d&&d.holder&&d.holder!==r.atletaId)extra.push(`in rientro da ${esc(fullName(S.atlete[d.holder]))}`);
  if(p.motivo&&p.esito!=='OK')extra.push(esc(p.motivo));else if(p.motivo)extra.push(esc(p.motivo));
  if(r.note)extra.push(esc(r.note));
  if(dp)extra.push(`<b>${dp.length===1?`il suo n.${dp[0]} è portato anche da un compagno di squadra`:`i suoi numeri ${dp.join(', ')} sono portati anche da compagni di squadra`}</b>`);
  return`<div class="item riga richiesta${dp?' conflitto':''}">${isNum?(d?chip(d,'prenotata'):'<span class="jersey rientro" aria-hidden="true"><b>?</b></span>'):''}
  <div class="main">${withName?`<div class="name"><a href="#atleta/${encodeURIComponent(r.atletaId)}">${esc(fullName(a))}</a><span class="cosa">${what}</span></div>`:`<div class="name">${what}</div>`}
  ${extra.length?`<div class="meta">${extra.join(' \u00b7 ')}</div>`:''}</div>
  <div class="right">${esitoPill(p)}<span class="slotBtn">${p.esito==='OK'
    ?`<button type="button" class="btn small primary" data-act="consegna" data-id="${esc(rid)}">Consegna</button>`
    :isNum&&p.esito==='MANCA'?`<button type="button" class="btn small" data-act="altraTaglia" data-id="${esc(rid)}">Altra taglia</button>`:''}</span>
  <button type="button" class="btn small ghost" data-act="modRichiesta" data-id="${esc(rid)}" aria-label="Modifica richiesta" title="Modifica">✎</button>
  <button type="button" class="btn small ghost" data-act="delRichiesta" data-id="${esc(rid)}" aria-label="Elimina richiesta" title="Elimina richiesta">✕</button></div></div>`;
}

/* ---- Assegnazioni ---- */
function vAssegnazioni(){
  const D=derive();const q=norm(S.ui.aQ);
  const nA=S.ui.nAss===''||S.ui.nAss==null?null:Number(S.ui.nAss);
  let ids=D.order.filter(rid=>{const r=S.richieste[rid];const a=S.atlete[r.atletaId];const p=D.prop[rid];
    // Il numero cercato puo' essere quello che l'atleta ha chiesto o quello
    // che il programma gli propone: tutti e due servono a ritrovare la riga.
    const num=nA===null||Number(r.numeroDesiderato)===nA
      ||(p&&p.divisaId&&Number(S.divise[p.divisaId].numero)===nA);
    return(!S.ui.aTeam||(a&&a.squadra===S.ui.aTeam))&&(!S.ui.aEsito||(p&&p.esito===S.ui.aEsito))&&(!S.ui.aArt||r.articolo===S.ui.aArt)&&(!q||norm(fullName(a)).includes(q))&&num});
  const all=Object.values(D.prop);const c={OK:0,MANCA:0,ESCLUSA:0};all.forEach(p=>c[p.esito]++);
  const miss={};for(const rid of D.order){const p=D.prop[rid];if(p.esito!=='MANCA')continue;const r=S.richieste[rid];const k=`${r.articolo}|${r.taglia}|${D.conNumero(r.articolo)?D.modelloPer(r):''}`;miss[k]=(miss[k]||0)+1}
  const arts=[...new Set(Object.values(S.richieste).map(r=>r.articolo))].sort(perNome);
  // Quelli gia' ordinati al fornitore non vanno ordinati di nuovo.
  for(const k of Object.keys(miss)){const [ar,tg,mo]=k.split('|');if(mo)continue;
    const giaOrd=(D.stock[D.key(ar,tg)]||{}).ordinati||0;
    miss[k]=Math.max(0,miss[k]-giaOrd);if(!miss[k])delete miss[k]}
  // Dal numero di pezzi piu' alto, come tutte le tabelle del programma; a parita'
  // per articolo e taglia.
  const mk=Object.entries(miss).sort((x,y)=>{const [a1,t1,m1]=x[0].split('|'),[a2,t2,m2]=y[0].split('|');
    return y[1]-x[1]||perNome({nome:a1},{nome:a2})||(m1||'').localeCompare(m2||'')||szIdx(t1)-szIdx(t2)});
  const pezzi=mk.reduce((n,x)=>n+x[1],0);
  // Due viste invece di una pagina sola: l'elenco delle richieste e la lista
  // della spesa. Prima "Da ordinare" era un titoletto in mezzo, e scorrendo
  // restava li' fisso come se fosse il titolo di quello che si sta guardando.
  const ordinare=S.ui.assTab==='ordinare';
  let h=`<h1>Assegnazioni</h1><div class="row-actions barraMag"><div class="seg" role="group" aria-label="Vista">
    <button type="button" id="t_assTab_richieste" data-act="assTab" data-v="richieste" aria-pressed="${!ordinare}">Richieste</button>
    <button type="button" id="t_assTab_ordinare" data-act="assTab" data-v="ordinare" aria-pressed="${ordinare}">Da ordinare${pezzi?' · '+pezzi:''}</button></div>
</div>
  <div class="stats"><div class="stat ok"><b>${c.OK}</b><span>pronte da consegnare</span></div><div class="stat bad"><b>${c.MANCA}</b><span>da ordinare</span></div><div class="stat"><b>${c.ESCLUSA}</b><span>escluse</span></div></div>`;
  if(ordinare){
    const spOrd=legenda(`<p>Il fabbisogno da ordinare al fornitore: i pezzi necessari per coprire tutte le richieste aperte, per articolo e per taglia. All'arrivo della merce i pezzi si registrano in Magazzino → Materiale, selezionando la riga dell'articolo e scegliendo <b>Registra arrivo</b>; selezionando una riga di questo elenco si apre la stessa finestra.</p>`);
    if(!mk.length)return h+spOrd+`<div class="list"><p class="empty">Nessun pezzo da ordinare: il magazzino copre tutte le richieste.</p></div>`;
    return h+spOrd+`
    <div class="table-wrap"><table><thead><tr><th>Articolo</th><th>Taglia</th><th class="num">Pezzi</th></tr></thead><tbody>`+
    mk.map(([k,n])=>{const [a,t,m]=k.split('|');return`<tr${m?'':` class="click" data-act="matRow" data-art="${esc(a)}" data-tg="${esc(t)}" tabindex="0" title="Aprire la finestra dell'articolo: ordinati, arrivo, giacenza"`}><td class="art">${esc(artLabel(a))}${m&&m!=='STANDARD'?' ('+esc(m.toLowerCase())+')':''}</td><td>${esc(t)}</td><td class="num">${n}</td></tr>`}).join('')+`</tbody></table></div>`;
  }
  h+=legenda(`<p>Per ogni richiesta aperta il programma propone un capo del magazzino, rispettando la taglia richiesta e senza ripetere un numero già presente nella squadra; quando possibile utilizza la maglia che un compagno di squadra deve sostituire. Le giacenze indicate in Magazzino tengono già conto di queste proposte.</p>
    <p><b>Consegna</b> registra la consegna del capo proposto. Se la taglia richiesta non è disponibile, <b>Altra taglia</b> consente di consegnarne una diversa, anche in via provvisoria. Le richieste si caricano da Excel (Impostazioni) oppure si inseriscono dalla scheda dell'atleta.</p>`,
    [['<span class="pill ok">pronta</span>','disponibile, pronta per la consegna'],
    ['<span class="pill bad">da ordinare</span>','giacenza insufficiente: il capo va ordinato'],
    ['<span class="pill">esclusa</span>','squadra o articolo fuori distribuzione']])+`
  <div class="filters">
    <input type="search" id="qAss" placeholder="Cerca atleta" value="${esc(S.ui.aQ)}" data-bind="aQ" autocomplete="off">
    <select id="f_aTeam" data-bind="aTeam" aria-label="Squadra">${teamOptions(S.ui.aTeam,'Tutte le squadre')}</select>
    <select id="f_aEsito" data-bind="aEsito" aria-label="Esito"><option value="">Tutti gli esiti</option>${[['OK','Pronte'],['MANCA','Da ordinare'],['ESCLUSA','Escluse']].map(([v,l])=>`<option value="${v}"${S.ui.aEsito===v?' selected':''}>${l}</option>`).join('')}</select>
    <select id="f_aArt" data-bind="aArt" aria-label="Articolo"><option value="">Tutti gli articoli</option>${arts.map(a=>`<option value="${esc(a)}"${S.ui.aArt===a?' selected':''}>${esc(artLabel(a))}</option>`).join('')}</select>
    <input type="text" id="f_nAss" class="filtroNum" maxlength="2" pattern="[0-9]*" placeholder="n. maglia" value="${esc(S.ui.nAss)}" data-bind="nAss" aria-label="Numero di maglia" inputmode="numeric">`;
  const nOk=ids.filter(rid=>D.prop[rid].esito==='OK').length;
  h+=`<span class="quante">${ids.length} ${ids.length===1?'richiesta':'richieste'}${nOk?`, ${nOk} da consegnare`:''}</span></div>`;
  if(!ids.length)return h+`<div class="list"><p class="empty">Nessuna richiesta con questi filtri.</p></div>`;
  let cur=null,buf='';const flush=()=>{if(buf)h+=`<div class="list">${buf}</div>`;buf=''};
  // L'ordine del motore mette prima chi chiede un numero preciso, di qualunque
  // squadra: raggruppando cosi' le squadre comparivano due volte.
  const sqDi=rid=>{const a=S.atlete[S.richieste[rid].atletaId];return a?(D.teamIdx[a.squadra]??99):999};
  ids=ids.map((rid,i)=>[rid,i]).sort((x,y)=>sqDi(x[0])-sqDi(y[0])||x[1]-y[1]).map(x=>x[0]);
  for(const rid of ids){const a=S.atlete[S.richieste[rid].atletaId];const t=a?a.squadra:'—';
    if(t!==cur){flush();cur=t;h+=`<div class="group-head"><h2>${esc(teamLabel(t))}</h2></div>`}
    buf+=reqRow(rid,true)}
  flush();return h;
}

/* ---- Magazzino ---- */
function vMagazzino(){
  const D=derive();
  // La barra e' identica nelle tre viste: linguette, opzione, pulsante. Cosi'
  // niente si sposta passando dall'una all'altra.
  const opzione=S.ui.magTab==='divise'
    ? `<input type="text" id="f_nDiv" class="filtroNum" maxlength="2" pattern="[0-9]*" placeholder="n. maglia" value="${esc(S.ui.nDiv)}" data-bind="nDiv" aria-label="Numero di maglia" inputmode="numeric">
       <label class="check"><input type="checkbox" id="c_inUso" data-act="toggleInUse" ${S.ui.showInUse?'checked':''}> Mostra anche le divise in uso</label>`
    : `<label class="check"><input type="checkbox" id="c_vecchie" data-act="toggleOld" ${S.ui.showOld?'checked':''}> Mostra le stagioni precedenti</label>`;
  const azione=S.ui.magTab==='divise'
    ? '<button type="button" class="btn" data-act="newLotto">Aggiungi lotto</button><button type="button" class="btn" data-act="newDivisa">Aggiungi divisa</button>'
    : '<button type="button" class="btn" data-act="newArticolo">Aggiungi articolo</button>';
  let h=`<h1>Magazzino</h1><div class="row-actions barraMag"><div class="seg" role="group" aria-label="Vista">
    <button type="button" id="t_magTab_divise" data-act="magTab" data-v="divise" aria-pressed="${S.ui.magTab==='divise'}">Divise</button>
    <button type="button" id="t_magTab_materiale" data-act="magTab" data-v="materiale" aria-pressed="${S.ui.magTab!=='divise'}">Materiale</button></div>
    <span class="opzMag">${opzione}</span>${azione}</div>`;
  h+=S.ui.magTab==='divise'
    ?legenda(`<p>Le divise da gara, per lotto e per taglia: ogni riquadro rappresenta una maglia, con numero e taglia. Selezionando un riquadro si modificano taglia, numero, lotto e nota; una maglia in magazzino può inoltre essere segnata fuori uso (resta in magazzino ma non viene mai assegnata) oppure dismessa (esce definitivamente dal magazzino). Normalmente sono visibili solo le maglie disponibili: l'opzione in alto mostra anche quelle in uso.</p>
    <p>Ogni lotto indica il tipo (divise da gara o maglie da libero) e le squadre che lo utilizzano. <b>Aggiungi lotto</b> crea un lotto nuovo; <b>Modifica lotto</b> ne cambia nome, tipo e squadre. Un lotto senza maglie si può eliminare.</p>`,
      vociDivise(true))
    :legenda(`<p>Gli articoli con le rispettive taglie. <b>Totale</b> = consegnati + in magazzino. <b>Magazzino finale</b> = in magazzino − prenotati + ordinati, cioè la giacenza prevista dopo la consegna delle richieste e l'arrivo degli ordini.</p>
      <p>Selezionando una riga si apre la finestra dell'articolo, dove in cima si sceglie cosa registrare: <b>Arrivo</b> dei pezzi, <b>Inventario</b> per correggere la giacenza con i pezzi contati, <b>Dismessi</b> per i pezzi non più utilizzabili, <b>Ordine</b> per la quantità ordinata al fornitore. Compaiono solo le caselle che servono e un solo pulsante.</p>`,
      [['<span class="pill bad">−3</span>','mancano 3 pezzi per coprire le richieste'],
      ['<span class="neg" style="color:var(--bad);font-weight:700">−2</span>','giacenza negativa: da verificare con un inventario'],
      ['<span class="pill">fuori distribuzione</span>','resta in inventario ma non viene più proposto']]);
  if(S.ui.magTab!=='divise'){
    const neg=giacenzeNegative();
    return h+(neg.length?`<div class="notice bad">${neg.join('<br>')}</div>`:'')+vMateriale()}
  if(S.ui.magTab==='divise'){
    const probl=problemiDivise();
    if(probl.length)h+=`<div class="notice bad">${probl.join('<br>')}</div>`;

    // Tutti i lotti, anche quelli ancora vuoti: prima quelli da gara, poi i liberi.
    const mods=[...new Set([...(D.set.modelli||[]),...Object.values(S.divise).map(d=>d.modello||'STANDARD')])]
      .sort((a,b)=>(tipoLotto(a)===tipoLotto(b)?0:tipoLotto(a)==='gara'?-1:1)||(a==='STANDARD'?-1:b==='STANDARD'?1:a.localeCompare(b)));
    let trovate=0;
    for(const m of mods){
      const nD=S.ui.nDiv===''||S.ui.nDiv==null?null:Number(S.ui.nDiv);
      const ents=Object.entries(S.divise).filter(([id,d])=>(d.modello||'STANDARD')===m&&!d.dismessa&&(nD===null||Number(d.numero)===nD));
      if(nD!==null&&!ents.length)continue;
      trovate+=ents.length;
      const sizes=[...new Set(ents.map(e=>e[1].taglia))].sort((a,b)=>szIdx(a)-szIdx(b));
      const free=ents.filter(([id,d])=>(!d.holder&&!d.fuoriUso||d.daRestituire)&&!D.prenDivisa[id]).length;
      const usano=D.perServire.filter(x=>tipoLotto(m)==='libero'?D.liberoDi[x.nome]===m:D.lotto[x.nome]===m).map(x=>teamLabel(x.nome));
      h+=`<div class="group-head testaLotto"><h2>${esc(nomeLotto(m,true))}</h2><span class="pill">${esc(TIPI_MAGLIA[tipoLotto(m)])}</span>
        <span>${ents.length} ${ents.length===1?'maglia':'maglie'}, ${ents.filter(([,d])=>d.holder&&!d.daRestituire).length} in uso · ${free} disponibili dopo le assegnazioni · ${usano.length?`usato da ${esc(usano.length>4?usano.slice(0,4).join(', ')+` e altre ${usano.length-4}`:usano.join(', '))}`:'nessuna squadra lo usa'}</span>
        <button type="button" class="btn small ghost" data-act="modLotto" data-v="${esc(m)}">Modifica lotto</button></div><div class="list">`;
      if(!ents.length)h+=`<p class="empty">Nessuna maglia in questo lotto: si aggiungono con «Aggiungi divisa».</p>`;
      for(const s of sizes){
        const inS=ents.filter(e=>e[1].taglia===s).sort((a,b)=>a[1].numero-b[1].numero);
        // Quelle fuori uso stanno in magazzino e si vedono, ma non sono disponibili.
        const rov=inS.filter(([id,d])=>d.fuoriUso&&!d.holder);
        const avail=inS.filter(([id,d])=>(!d.holder&&!d.fuoriUso)||d.daRestituire);
        const inuse=inS.length-avail.length-rov.length;
        const after=avail.filter(([id])=>!D.prenDivisa[id]).length;
        const shown=S.ui.showInUse?inS:[...avail,...rov];
        h+=`<div class="size-row"><div class="sz">${esc(s)}<small title="Disponibili dopo le assegnazioni proposte">${after} disponibili</small></div><div><div class="chips">${shown.map(([id,d])=>{
          const pren=D.prenDivisa[id];const inU=d.holder&&!d.daRestituire;
          return chip(inU?{...d}:d,pren?'prenotata':'',true,id).replace('class="jersey',inU?'style="opacity:.45" class="jersey':'class="jersey')}).join('')||'<span class="meta" style="color:var(--muted)">Nessuna disponibile</span>'}</div>
          <div class="meta" style="color:var(--muted);font-size:12px;margin-top:4px">${avail.length} nel magazzino o in rientro · ${inuse} in uso${rov.length?` · ${rov.length} fuori uso`:''}</div></div></div>`;
      }
      h+=`</div>`;
    }
    if(S.ui.nDiv!==''&&S.ui.nDiv!=null&&!trovate)h+=`<div class="list"><p class="empty">Nessuna divisa con il numero ${esc(S.ui.nDiv)}.</p></div>`;
    return h;
  }
  return h;
}

/* ---- Movimenti ---- */
function vMovimenti(){
  const q=norm(S.ui.mvQ);
  let ids=Object.entries(S.movimenti).filter(([id,m])=>(!S.ui.mvTipo||m.tipo===S.ui.mvTipo)&&(!q||norm((m.atletaId?fullName(S.atlete[m.atletaId]):(m.a||''))+' '+m.articolo+' '+artLabel(m.articolo)+' '+artCodice(m.articolo)).includes(q)))
    .sort((a,b)=>(b[1].ts||0)-(a[1].ts||0));
  const tot=ids.length;if(!S.ui.mvAll)ids=ids.slice(0,150);
  let h=`<h1>Movimenti</h1><div class="row-actions"><button type="button" class="btn yellow" data-act="newMov">Consegna a staff ed esterni</button>${window.__APP?'<button type="button" class="btn" data-act="scaricaMov">Scarica il registro</button>':''}</div>
  ${legenda(`<p>Il registro di tutte le entrate e le uscite di magazzino, dalla più recente: consegne, rientri, carichi e rettifiche. Le consegne registrate nelle altre schermate compaiono qui automaticamente.</p>
    <p><b>Consegna a staff ed esterni</b> registra il materiale consegnato ad allenatori, dirigenti o esterni, o rientrato da loro, indicandone il nome. Le consegne alle atlete si registrano dalla loro scheda, da Assegnazioni o dal modulo di distribuzione. <b>Annulla</b> ripristina la situazione precedente del magazzino.</p>`,
    [['<span class="pill blue">consegna</span>','uscita dal magazzino'],
     ['<span class="pill yellow">rientro</span>','rientro in magazzino'],
     ['<span class="pill ok">carico</span>','arrivo dal fornitore'],
     ['<span class="pill">rettifica</span>','correzione della giacenza dopo un inventario'],
     ['<span class="pill">già in possesso</span>','capo che l’atleta aveva già, segnato dal modulo di distribuzione: la giacenza non cambia'],
     ['<span class="pill bad">dismesso</span>','materiale non più utilizzabile: esce dal magazzino']])}
  <div class="filters"><input type="search" id="qMov" placeholder="Cerca atleta o articolo" value="${esc(S.ui.mvQ)}" data-bind="mvQ" autocomplete="off">
  <select id="f_mvTipo" data-bind="mvTipo" aria-label="Tipo"><option value="">Tutti i tipi</option>${['CONSEGNA','RIENTRO','CARICO','RETTIFICA','POSSESSO','SCARTO'].map(t=>`<option value="${t}"${S.ui.mvTipo===t?' selected':''}>${nomeTipo(t)}</option>`).join('')}</select></div>`;

    const cls=m.tipo==='CONSEGNA'?'blue':m.tipo==='RIENTRO'?'yellow':m.tipo==='CARICO'?'ok':m.tipo==='SCARTO'?'bad':'';
    const d=m.divisaId?S.divise[m.divisaId]:null;
    // Fuori squadra il nome e' scritto a mano: non c'e' nessuna scheda da aprire.
    const who=m.atletaId?`<a href="#atleta/${encodeURIComponent(m.atletaId)}">${esc(fullName(S.atlete[m.atletaId]))}</a>`
      :m.a?esc(m.a):'Magazzino';
    return`<div class="item">${d?chip({...d,daRestituire:false}):''}<div class="main"><div class="name">${who}</div>
    <div class="meta">${esc(artLabel(m.articolo))} · ${m.taglia==='UNICA'?'unica':esc(m.taglia)}${!m.divisaId?` · ${m.qta>0&&m.tipo==='RETTIFICA'?'+':''}${esc(m.qta)} pz`:''} · ${fmtDate(m.data)}${m.note?' · '+esc(m.note):''}</div></div>
    <div class="right"><span class="pill ${cls}">${nomeTipo(m.tipo)}</span><button type="button" class="btn small ghost" data-act="annulla" data-id="${esc(id)}">Annulla movimento</button></div></div>`}).join('')+`</div>`;
  if(!S.ui.mvAll&&tot>150)h+=`<div class="row-actions"><button type="button" class="btn" data-act="mvAll">Mostra tutti i ${tot} movimenti</button></div>`;
  return h;
}

/* Le due viste delgli atleti: l'elenco, e il riepilogo di cosa hanno in mano. */
/* La testata di Squadre, uguale nelle due linguette: cambiando linguetta
   filtri e pulsanti restano dove sono, e i filtri restano quelli. */
function testaSquadre(){
  const rie=S.ui.atlTab==='riepilogo';
  const spiega=rie
    ?legenda(`<p>La dotazione attuale di ogni atleta, per squadra: quanto consegnato al netto dei rientri. Ogni colonna corrisponde a un articolo; le divise sono indicate con numero e taglia.</p>
      <p>Le righe evidenziate in rosso indicano atleti con lo stesso numero di un compagno di squadra.</p>`,
      [[`<span class="numTag">8<small>M</small></span>`,'in uso'],
       [`<span class="numTag da">8<small>M</small></span>`,'da cambiare'],
       ['<span class="spunta">✓</span>','in dotazione (articolo di taglia unica)'],
       ['<span class="vuoto">—</span>','non consegnato']])
    :legenda(`<p>Ogni riga corrisponde a una squadra; con <b>+</b> si visualizzano i suoi atleti e con <b>Apri</b> si accede alla scheda dell'atleta, con la dotazione e le richieste. <b>Impostazioni</b>, sulla riga della squadra, apre la finestra con nome, lotto di divise, numeri in comune con altre squadre, ordine di distribuzione (che stabilisce anche l'ordine in cui le squadre compaiono in tutte le schermate), «in distribuzione» ed eliminazione; sulla riga ne resta scritto lo stato.</p>
      <p><b>Consegna o ritira a tutti</b> consegna o ritira un articolo per l'intera squadra; <b>Foglio delle squadre</b>, in alto, scarica il modulo di distribuzione di tutte le squadre e lo ricarica; <b>Scarica foglio</b> sulla riga di una squadra scarica solo quella. Il foglio esce già compilato: si correggono le caselle che non corrispondono, in palestra si segna «consegnato», e si ricarica con <b>Carica</b>. Le squadre e le righe evidenziate in rosso contengono un numero di maglia ripetuto.</p>`,
      vociDivise(false));
  return `<h1>Squadre</h1><div class="row-actions barraMag"><div class="seg" role="group" aria-label="Vista">
    <button type="button" id="t_atlTab_elenco" data-act="atlTab" data-v="elenco" aria-pressed="${!rie}">Atleti</button>
    <button type="button" id="t_atlTab_riepilogo" data-act="atlTab" data-v="riepilogo" aria-pressed="${rie}">Riepilogo</button></div>
    <span class="opzMag"></span>
    ${window.__APP?`<span class="gruppoFoglio" title="Il modulo di distribuzione di tutte le squadre: si scarica già compilato, si corregge o si porta in palestra, e si ricarica">Foglio delle squadre
      <button type="button" class="btn" data-act="scaricaModulo">Scarica</button><button type="button" class="btn primary" data-act="caricaModulo">Carica</button></span>`:''}
    <button type="button" class="btn" data-act="newAtleta">Aggiungi atleta</button>
    <button type="button" class="btn" data-act="newSquadra">Aggiungi squadra</button></div>`+spiega+(S.ui.atlTab!=='riepilogo'&&window.__APP?ultimoCaricamento(S.app.esitoExcel):'')+
  `<div class="filters">
    <input type="search" id="qAtl" placeholder="Cerca per nome o cognome" value="${esc(S.ui.q)}" data-bind="q" autocomplete="off">
    <select id="f_team" data-bind="team" aria-label="Squadra">${teamOptions(S.ui.team,'Tutte le squadre')}</select>
    <input type="text" id="f_nAtl" class="filtroNum" maxlength="2" pattern="[0-9]*" placeholder="n. maglia" value="${esc(S.ui.nAtl)}" data-bind="nAtl" aria-label="Numero di maglia" inputmode="numeric"></div>`;

/* Chi ha cosa, tutto in una tabella, squadra per squadra.
   Sono le consegne meno i rientri: quello che gli atleti hanno davvero in mano
   adesso, non quello che era stato previsto. */
/* I numeri che una squadra porta davvero, con chi li porta. Le divise segnate
   da cambiare non contano: quelle stanno tornando indietro e il loro numero e'
   gia' libero per un'altra. */
function numeriDiSquadra(D,squadra){
  // Tutta la serie: con un gruppo di squadre, i numeri di tutte.
  const piu=squadreDellaSerie(D,squadra).length>1;
  const per={};
  for(const [id,a] of Object.entries(S.atlete)){
    if(!stessaSerie(D,a.squadra,squadra))continue;
    for(const did of (D.perAtleta[id]||[])){
      const d=S.divise[did];if(!d||d.dismessa||d.daRestituire)continue;
      (per[Number(d.numero)]=per[Number(d.numero)]||[]).push(fullName(a)+(piu?` (${teamLabel(a.squadra)})`:''))}}
  return per;
}

/* Gli atleti che portano un numero gia' addosso a un compagno di squadra.
   Torna id -> i numeri in conflitto, cosi' ogni schermata puo' segnare la riga
   invece di lasciare l'errore scritto in un posto solo. */
function conNumeroDoppio(D){
  const fuori={};
  for(const sq of D.perServire){
    const per=numeriDiSquadra(D,sq.nome);
    for(const [n,chi] of Object.entries(per)){
      if(chi.length<2)continue;
      for(const [id,a] of Object.entries(S.atlete)){
        if(!stessaSerie(D,a.squadra,sq.nome))continue;
        if(!chi.some(c=>c===fullName(a)||c.startsWith(fullName(a)+' (')))continue;
        if(!(fuori[id]||[]).includes(Number(n)))(fuori[id]=fuori[id]||[]).push(Number(n));
      }}}
  return fuori;
}

function vRiepilogo(){
  const D=derive();
  const q=norm(S.ui.q);
  const nQ=S.ui.nAtl===''||S.ui.nAtl==null?null:Number(S.ui.nAtl);
  // Gli stessi filtri dell'elenco, e sono gli stessi anche nella memoria: si
  // cambia linguetta e si continua a guardare la stessa squadra.
  const tiene=(id,a)=>(!S.ui.team||a.squadra===S.ui.team)
    &&(!q||norm(fullName(a)).includes(q))
    &&(nQ===null||(D.perAtleta[id]||[]).some(x=>Number(S.divise[x].numero)===nQ));

  let html=testaSquadre();

  // Quali articoli compaiono davvero: inutile una colonna per chi non ha consegnato niente.
  const colonne=new Set();
  for(const dot of Object.values(D.dotazione))
    for(const [k,v] of Object.entries(dot))if(v>0)colonne.add(k.split('|')[0]);
  const arts=[...colonne].sort((a,b)=>artLabel(a).localeCompare(artLabel(b)));

  const conDivise=Object.keys(D.perAtleta).length>0;
  if(!arts.length&&!conDivise)
    return html+`<div class="list"><p class="empty">Nessuna consegna registrata finora: il riepilogo compare con le prime consegne.</p></div>`;

  const perSquadra={};
  for(const [id,a] of Object.entries(S.atlete))if(tiene(id,a))(perSquadra[a.squadra]=perSquadra[a.squadra]||[]).push([id,a]);
  const squadre=D.perServire.map(x=>x.nome).filter(n=>perSquadra[n]);
  for(const n of Object.keys(perSquadra))if(!squadre.includes(n))squadre.push(n);

  if(!squadre.length)return html+`<div class="list"><p class="empty">Nessun atleta con questi filtri.</p></div>`;
  // Il conto dei doppioni si fa su tutte le squadre, non solo su quelle
  // filtrate: se ne nascondi una con un doppione dentro, il cartello in cima
  // direbbe che va tutto bene.
  const doppioni=doppioniPerSerie(D);
  html+=doppioni.length
    ? `<div class="notice bad"><b>${doppioni.length} ${doppioni.length===1?'numero ripetuto':'numeri ripetuti'}</b> dentro una squadra o un gruppo di squadre: `
      +doppioni.map(x=>`${esc(x.serie)} n.${esc(x.numero)} (${x.chi.map(esc).join(' e ')})`).join(' \u00b7 ')+`</div>`
    : `<div class="notice ok">Nessun numero ripetuto: in ogni squadra ogni numero e\u2019 di una persona sola.</div>`;

  const doppi=conNumeroDoppio(D);
  const totali={};let totDivise=0;
  for(const sq of squadre){
    const righe=perSquadra[sq].sort((x,y)=>norm(fullName(x[1])).localeCompare(norm(fullName(y[1]))));
    const conRoba=righe.filter(([id])=>(D.perAtleta[id]||[]).length||Object.values(D.dotazione[id]||{}).some(v=>v>0));
    if(!conRoba.length)continue;
    const numeri=numeriDiSquadra(D,sq);
    const inFila=Object.keys(numeri).map(Number).sort((x,y)=>x-y);
    html+=`<div class="group-head"><h2>${esc(teamLabel(sq))}</h2><span>${conRoba.length} ${conRoba.length===1?'atleta':'atleti'} con materiale</span></div>
    ${inFila.length?`<p class="filaNumeri">Numeri in campo${squadreDellaSerie(D,sq).length>1?` (in comune con ${esc(squadreDellaSerie(D,sq).filter(x=>x!==sq).map(teamLabel).join(', '))})`:''}: ${inFila.map(n=>`<span class="numTag${numeri[n].length>1?' doppio':''}" title="${esc(numeri[n].join(', '))}">${n}</span>`).join('')}</p>`:''}
    <div class="tabellaFuori"><table class="tab riepilogo" style="--colonne:${arts.length}"><thead><tr><th class="colAtleta">Atleta</th>${conDivise?'<th class="colDivise">Divise</th>':''}${arts.map(a=>`<th class="num">${esc(artLabel(a))}</th>`).join('')}</tr></thead><tbody>`;
    for(const [id,a] of conRoba){
      const divise=(D.perAtleta[id]||[]).map(x=>S.divise[x]).filter(Boolean);
      totDivise+=divise.length;
      html+=`<tr${doppi[id]?' class="conflitto"':''}><th scope="row"><a href="#atleta/${encodeURIComponent(id)}">${esc(fullName(a))}</a>${doppi[id]?` <span class="pill bad">${doppi[id].length===1?`n.${doppi[id][0]} doppio`:`numeri doppi: ${doppi[id].join(', ')}`}</span>`:''}</th>`;
      if(conDivise)html+=`<td>${divise.map(d=>`<span class="numTag${d.daRestituire?' da':''}" title="${d.daRestituire?'da cambiare':'in uso'}">${esc(d.numero)}<small>${esc(d.taglia)}</small></span>`).join(' ')||'<span class="vuoto">—</span>'}</td>`;
      for(const art of arts){
        const voci=Object.entries(D.dotazione[id]||{}).filter(([k,v])=>v>0&&k.split('|')[0]===art);
        const n=voci.reduce((t,[,v])=>t+v,0);
        if(n)totali[art]=(totali[art]||0)+n;
        // La taglia se c'e' (il pantaloncino M), una spunta per gli articoli di
        // taglia unica (la borraccia): «sì» in ogni casella si leggeva male.
        html+=`<td class="num">${n?voci.map(([k,v])=>{const tg=k.split('|')[1];return (v>1?v+'× ':'')+(tg&&tg!=='UNICA'?esc(tg):'<span class="spunta" title="In dotazione" aria-label="in dotazione">✓</span>')}).join(', '):'<span class="vuoto">—</span>'}</td>`;
      }
      html+=`</tr>`;
    }
    html+=`</tbody></table></div>`;
  }

  html+=`<div class="group-head"><h2>In tutto</h2><span>${S.ui.team||q||nQ!==null?'somma delle righe visualizzate':'somma di tutte le squadre'}</span></div><div class="list">`;
  if(conDivise)html+=`<div class="item"><div class="main"><div class="name">Divise assegnate agli atleti</div></div><div class="right"><b>${totDivise}</b></div></div>`;
  for(const a of arts)html+=`<div class="item"><div class="main"><div class="name">${esc(artLabel(a))}</div></div><div class="right"><b>${totali[a]||0}</b></div></div>`;
  return html+`</div>`;
}

/* Il magazzino del materiale: cosa esiste e quanti ce ne sono, nello stesso
   posto. Erano due schermate, ma sono lo stesso oggetto: una diceva le taglie,
   l'altra quante ne restavano, e per cambiare una taglia bisognava cambiare
   schermata. */
function vMateriale(){
  const D=derive();const arts=D.set.articoli||[];
  // Taglie che compaiono davvero: quelle dichiarate sull'articolo piu' quelle
  // che si trovano in magazzino e che magari nessuno ha mai dichiarato.
  const taglieDi={};
  for(const a of arts)taglieDi[a.nome]=new Set(a.taglie||[]);
  // Le taglie delle stagioni passate si nascondono davvero. Il secondo giro
  // pesca dalle giacenze, che non sanno di che stagione sono: senza questo
  // elenco le rimetteva dentro tutte, e la spunta non serviva a niente.
  const passate=new Set();
  for(const m of Object.values(S.materiale)){
    if(m.precedente&&!S.ui.showOld){passate.add(D.key(m.articolo,m.taglia));continue}
    (taglieDi[m.articolo]=taglieDi[m.articolo]||new Set()).add(m.taglia)}
  for(const k of Object.keys(D.stock)){
    if(passate.has(k))continue;
    const [a,t]=k.split('|');
    (taglieDi[a]=taglieDi[a]||new Set()).add(t)}
  for(const n of Object.keys(taglieDi))if(!taglieDi[n].size)delete taglieDi[n];

  // Articoli che non stanno in anagrafica ma hanno pezzi in magazzino: capita
  // coi lasciti delle stagioni passate, e non vanno persi.
  const noti=new Set(arts.map(a=>a.nome));
  const orfani=Object.keys(taglieDi).filter(n=>!noti.has(n));

  const perFam={};
  arts.forEach((a,i)=>{const f=a.famiglia||'';(perFam[f]=perFam[f]||[]).push([a,i])});
  if(orfani.length)perFam['']=(perFam['']||[]).concat(orfani.map(n=>[{nome:n},-1]));
  const fam=Object.keys(perFam).sort((x,y)=>x===''?1:y===''?-1:x.localeCompare(y));

  // I totali stanno sugli articoli, non in una fascia in cima (Andrea,
  // 26/09/2026): la riga «Totale» di ogni tabella e i pezzi di ogni famiglia.
  const perFamPezzi={};
  const contiDi=(a,t)=>{const k=D.key(a,t);const q=D.stock[k]||{ora:0,consegne:0,rientri:0,ordinati:0};
    return {st:q.ora,fuori:Math.max(0,(q.consegne||0)-(q.rientri||0)),p:D.prenMat[k]||0,ord:q.ordinati||0,
      mancano:Object.entries(D.prop).filter(([rid,pp])=>pp.esito==='MANCA'&&S.richieste[rid].articolo===a&&S.richieste[rid].taglia===t).length}};
  for(const f of fam)for(const [a] of perFam[f]){if(D.conNumero(a.nome))continue;
    for(const t of taglieDi[a.nome]||[]){const c=contiDi(a.nome,t);
      perFamPezzi[f]=(perFamPezzi[f]||0)+Math.max(0,c.st)}}
  let h='';
  for(const f of fam){
    h+=`<div class="group-head"><h2>${f?esc(cap(f)):'Senza famiglia'}</h2><span>${perFam[f].length} ${perFam[f].length===1?'articolo':'articoli'}${perFamPezzi[f]!=null?` · ${perFamPezzi[f]} ${perFamPezzi[f]===1?'pezzo':'pezzi'} in magazzino`:''}</span></div>`;
    for(const [a,i] of perFam[f]){
      const ts=[...(taglieDi[a.nome]||[])].sort((x,y)=>szIdx(x)-szIdx(y)||x.localeCompare(y));
      const conNum=D.conNumero(a.nome);
      const conti=t=>{const k=D.key(a.nome,t);const q=D.stock[k]||{ora:0,consegne:0,rientri:0,ordinati:0};
        const st=q.ora;const fuori=Math.max(0,(q.consegne||0)-(q.rientri||0));const p=D.prenMat[k]||0;
        const ord=q.ordinati||0;const tot=st+fuori;
        const mancano=Object.entries(D.prop).filter(([rid,pp])=>pp.esito==='MANCA'&&S.richieste[rid].articolo===a.nome&&S.richieste[rid].taglia===t).length;
        // Il finale e' quello che resta quando tutte le richieste sono servite e
        // gli ordini sono arrivati: anche quelle che oggi mancano.
        return {st,fuori,p,ord,tot,dopo:st-p-mancano+ord,mancano}};
      const cella=c=>`<b class="${c.dopo<=0&&c.mancano?'neg':''}">${c.dopo}${c.mancano?` <span class="pill bad">−${c.mancano}</span>`:''}</b>`;
      // Taglia unica: i tre numeri stanno accanto al nome. Una tabella di due
      // righe per un numero solo era mezzo schermo buttato via.
      const stessoNome=norm(a.nome).replace(/\s+/g,'')===norm(artSolo(a.nome)).replace(/\s+/g,'');
      const sotto=[a.codice?`<b>${esc(a.codice)}</b>`:'',stessoNome?'':esc(a.nome),a.stagione?esc(a.stagione):''].filter(Boolean).join(' · ');
      let unica='';
      if(!conNum&&ts.length===1){
        const c=conti(ts[0]);
        unica=`<span class="artUnica" data-act="matRow" data-art="${esc(a.nome)}" data-tg="${esc(ts[0])}" tabindex="0" role="button" title="Registrare un carico, correggere la giacenza o dismettere dei pezzi">
        <span><small>Totale</small><b>${c.tot||'—'}</b></span>
        <span><small>Consegnati</small><b>${c.fuori||'—'}</b></span>
        <span><small>In magazzino</small><b>${c.st}</b></span>
        <span><small>Prenotati</small><b>${c.p||'—'}</b></span>
        <span><small>Ordinati</small><b>${c.ord||'—'}</b></span>
        <span><small>Magazzino finale</small>${cella(c)}</span>
        <span class="btn small ghost suPassaggio" aria-hidden="true">Apri</span></span>`;
      }
      h+=`<div class="artBox">
      <div class="artTesta">
        <div class="main"><div class="name">${esc(artSolo(a.nome))}${a.distribuibile===false?' <span class="pill">fuori distribuzione</span>':''}</div>
        ${sotto?`<div class="meta">${sotto}</div>`:''}</div>
        ${i>=0?`<button type="button" class="btn small modArt" data-act="modArticolo" data-i="${i}">Modifica articolo</button>`:'<span class="meta modArt">non in anagrafica</span>'}
        <div class="right">${unica}</div>
      </div>`;
      if(conNum){
        const quante=Object.values(S.divise).filter(d=>!d.dismessa).length;
        h+=`<p class="sub artNota">Ha il numero stampato: i capi si contano uno per uno in <a href="#magazzino" data-act="magTab" data-v="divise">Divise</a> (${quante} capi).</p>`;
      }else if(!ts.length){
        h+=`<p class="sub artNota">Nessuna taglia: si aggiungono da «Modifica articolo».</p>`;
      }else if(!unica){
        h+=`<div class="table-wrap"><table><thead><tr><th>Taglia</th><th class="num">Totale</th><th class="num">Consegnati</th><th class="num">In magazzino</th><th class="num">Prenotati</th><th class="num">Ordinati</th><th class="num">Magazzino finale</th><th></th></tr></thead><tbody>`;
        for(const t of ts){
          const c=conti(t);
          h+=`<tr class="click" data-act="matRow" data-art="${esc(a.nome)}" data-tg="${esc(t)}" tabindex="0" title="Registrare un carico, correggere la giacenza o dismettere dei pezzi">
          <td>${t==='UNICA'?'unica':esc(t)}${a.codice?`<small class="codTg">${esc(artCodiceTaglia(a.nome,t))}</small>`:''}</td><td class="num meta">${c.tot||''}</td><td class="num meta">${c.fuori||''}</td>
          <td class="num${c.st<0?' neg':''}">${c.st}</td><td class="num">${c.p||''}</td><td class="num meta">${c.ord||''}</td>
          <td class="num">${cella(c)}</td>
          <td class="num"><span class="btn small ghost suPassaggio" aria-hidden="true">Apri</span></td></tr>`;
        }
        // la somma delle taglie dell'articolo
        const T=ts.map(conti).reduce((z,c)=>({tot:z.tot+c.tot,fuori:z.fuori+c.fuori,st:z.st+c.st,p:z.p+c.p,ord:z.ord+c.ord,dopo:z.dopo+c.dopo,mancano:z.mancano+c.mancano}),{tot:0,fuori:0,st:0,p:0,ord:0,dopo:0,mancano:0});
        h+=`</tbody><tfoot><tr class="totale"><td>Totale</td><td class="num">${T.tot}</td><td class="num">${T.fuori}</td><td class="num${T.st<0?' neg':''}">${T.st}</td><td class="num">${T.p}</td><td class="num">${T.ord}</td><td class="num">${cella(T)}</td><td></td></tr></tfoot></table></div>`;
      }
      h+=`</div>`;
    }
  }
  if(!fam.length)return `<div class="list"><p class="empty">Non c'è ancora nessun articolo. Per iniziare aggiungere un articolo, oppure caricarli da un foglio Excel (Impostazioni &rarr; Prima configurazione).</p></div>`;
  return h;
}

/* La pagina di partenza. Sei riquadri, uno per sezione, ognuno con il numero
   che conta davvero in quella sezione: cosi' aprendo il programma si vede
   subito se c'e' qualcosa da fare, senza entrare da nessuna parte. */
/* La pagina di partenza: lo stemma della societa' se c'e', i numeri che
   contano, e una porta sola per consegnare. I riquadri portano ognuno alla
   sua schermata. */
function vHome(){
  const D=derive();
  const esiti={OK:0,MANCA:0,ESCLUSA:0};Object.values(D.prop).forEach(p=>esiti[p.esito]++);
  const nAtleti=Object.keys(S.atlete).length;
  const nSquadre=(D.set.squadre||[]).length;
  const divise=Object.values(S.divise).filter(d=>!d.dismessa);
  const libere=divise.filter(d=>!d.holder||d.daRestituire).length;
  const pezzi=Object.values(D.stock).reduce((t,x)=>t+Math.max(0,x.ora),0);
  const oggi=Object.values(S.movimenti).filter(m=>m.data===today()).length;
  // La copertina parla solo se c'e' qualcosa da sistemare. Un numero portato
  // da due persone della stessa squadra e' l'unico errore che si paga in
  // palestra: e' l'unico che vale la pena gridare da qui.
  const doppioni=doppioniPerSerie(D);
  const v=window.__APP?window.__APP.versione():null;
  const soc=(D.set.societa||'').trim();
  const logo=D.set.logo;

  const riquadro=(href,titolo,grosso,sotto,allarme)=>`<a class="cartaHome${allarme?' allarme':''}" href="${href}">
    <div class="grosso">${grosso}</div><div class="titolo">${esc(titolo)}</div><div class="sotto">${sotto}</div></a>`;

  // Programma ancora vuoto: da dove si parte, in ordine (analisi del
  // 25/09/2026: la pagina iniziale mostrava solo zeri).
  const nArt=(D.set.articoli||[]).length,nDiv=divise.length;
  const passi=[
    [nArt,'Gli articoli','divise e materiale che la società distribuisce, con le taglie','newArticolo','Aggiungi articolo'],
    [nDiv,'Le divise','le maglie da gara una per una, con taglia e numero','newDivisa','Aggiungi divisa'],
    [nSquadre&&nAtleti,'Squadre e atleti','poi il foglio delle squadre per raccogliere le richieste','newSquadra','Aggiungi squadra']];
  const inizio=passi.some(x=>!x[0])?`<div class="inizio"><h2>Per cominciare</h2>
    <p class="sub">Tre passi, in quest’ordine. Si possono fare a mano oppure caricando i fogli Excel da <a href="#impostazioni">Impostazioni → Prima configurazione</a>.</p>
    <ol>${passi.map(([fatto,t,sp,act,bt])=>`<li class="${fatto?'fatto':''}"><span><b>${t}</b> — ${sp}${fatto?' <span class="pill ok">fatto</span>':''}</span>${fatto?'':`<button type="button" class="btn small" data-act="${act}">${bt}</button>`}</li>`).join('')}</ol></div>`:'';

  return `<div class="copertina">
    <span class="copertinaStemma">${logo?`<img src="${esc(logo)}" alt="">`:MARCHIO}</span>
    ${soc?`<h1>${esc(soc)}</h1><p class="copertinaSub">Magazzino${D.set.stagione?` · ${esc(D.set.stagione)}`:''}</p>`
      :`<h1>Magazzino</h1><p class="copertinaSub">${esc(D.set.stagione||'')}</p>`}
  </div>
  ${inizio}
  <div class="grigliaHome">
    ${riquadro('#squadre','Squadre',nSquadre,'lotti, ordine di distribuzione, foglio delle squadre')}
    ${riquadro('#squadre/riepilogo','Atleti',nAtleti,'dotazione di ogni atleta')}
    ${riquadro('#assegnazioni','Assegnazioni',esiti.OK,`pronte da consegnare${esiti.MANCA?` \u00b7 <b>${esiti.MANCA} da ordinare</b>`:''}`,esiti.MANCA>0)}
    ${riquadro('#magazzino','Magazzino',libere,`divise libere \u00b7 ${pezzi} ${pezzi===1?'pezzo':'pezzi'} di materiale`)}
    ${riquadro('#movimenti','Movimenti',oggi,oggi===1?'registrato oggi':'registrati oggi')}
    ${riquadro('#impostazioni','Impostazioni','⚙','stagione, società, prima configurazione, copie di sicurezza')}
  </div>
  ${window.__APP&&nSquadre?`<div class="fogliHome"><span><b>Foglio delle squadre</b> · si scarica già compilato, si corregge o si porta in palestra, si ricarica</span>
    <span class="row-actions"><button type="button" class="btn" data-act="scaricaModulo">Scarica</button><button type="button" class="btn primary" data-act="caricaModulo">Carica</button></span></div>`:''}
  <p class="sottoGriglia"><a class="btn" href="#manuale">Manuale</a></p>
  ${doppioni.length?`<p class="allarmeHome"><a href="#squadre">${doppioni.length===1
    ?'Un numero è portato da due atleti della stessa squadra'
    :`${doppioni.length} numeri sono portati da due atleti della stessa squadra`}: ${doppioni.slice(0,4).map(x=>`${esc(x.serie)} n.${esc(x.numero)}`).join(', ')}${doppioni.length>4?(doppioni.length===5?' e un altro':` e altri ${doppioni.length-4}`):''}</a></p>`:''}
  <p class="versione">${v?`Versione ${esc(v)}`:'Versione di prova nel browser'}</p>`;
}

/* ---- Squadre ---- */
/* ============ il manuale ============
   Spiega il programma dentro il programma, cosi' non finisce in un foglio che
   nessuno ritrova. Qualche numero lo legge dall'archivio vero (quante squadre,
   quali articoli, che stagione): quelle righe non possono invecchiare.

   REGOLA: quando cambia un comportamento, si cambia anche qui. Sta scritto
   anche nel CLAUDE.md del progetto. */
function vManuale(){
  const D=derive();
  const v=window.__APP?window.__APP.versione():null;
  const nSq=(D.set.squadre||[]).length;
  const nAtl=Object.keys(S.atlete).length;
  const arts=(D.set.articoli||[]).filter(a=>a.distribuibile!==false);
  const fam={};for(const a of arts)(fam[a.famiglia||'senza famiglia']=fam[a.famiglia||'senza famiglia']||[]).push(artSolo(a.nome));
  const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();

  const sezione=(titolo,corpo)=>`<details class="man"><summary>${esc(titolo)}</summary><div class="manCorpo">${corpo}</div></details>`;

  return `<h1>Manuale</h1>
  <p class="sub">Guida all'uso del programma.${v?` Versione ${esc(v)}.`:''} Ogni sezione si apre selezionandone il titolo.</p>

  ${sezione('Panoramica',`
    <p>Il programma registra <b>la dotazione di ogni atleta</b> e la situazione del magazzino. Il magazzino comprende le <b>divise da gara</b>, gestite capo per capo perché ciascuna ha un numero, e il <b>materiale</b> (t-shirt, felpe, borracce e simili), gestito a quantità per taglia.</p>
    <p>Le <b>richieste</b> collegano le due parti: ogni richiesta indica un articolo che un atleta deve ricevere. Per ciascuna il programma propone il capo da consegnare in base alla disponibilità; alla consegna la richiesta si chiude e la giacenza si aggiorna. Le proposte vengono ricalcolate automaticamente a ogni modifica; le consegne registrate non vengono mai ricalcolate.</p>
    <p>Attualmente l'archivio contiene <b>${nSq} squadre</b>, <b>${nAtl} atleti</b> e <b>${arts.length} articoli</b> in distribuzione.</p>`)}

  ${sezione('Termini utilizzati',`
    <p><b>Codice</b> — la sigla breve dell'articolo, ad esempio A002. Con la taglia diventa A002_M ed è la forma da utilizzare negli ordini. Per le taglie espresse in anni la parola «anni» è omessa: A008_5-6. I codici mancanti vengono assegnati automaticamente all'avvio.</p>
    <p><b>Nome interno</b> — il nome in maiuscolo, ad esempio TEE NERA ALLENAMENTO. Collega magazzino, richieste e movimenti e non può essere modificato: se il capo cambia modello si crea un nuovo articolo.</p>
    <p><b>Famiglia</b> ed <b>etichetta</b> — determinano come l'articolo viene visualizzato: la famiglia raggruppa (Tee), l'etichetta distingue all'interno della famiglia (Nera allenamento). Possono essere modificate in qualsiasi momento.</p>
    <p><b>Stagione dell'articolo</b> — nella finestra <i>Modifica articolo</i> la casella «Articolo di questa stagione» indica se l'articolo appartiene alla stagione in corso. Solo questi articoli, e quelli senza stagione indicata, compaiono nel modulo di distribuzione.</p>
    <p><b>Si può ancora consegnare</b> — togliendo questa spunta l'articolo resta in inventario ma non viene più proposto. Con <i>Mostra le stagioni precedenti</i>, in Magazzino → Materiale, si visualizzano anche gli articoli delle stagioni passate.</p>
    <p><b>Lotto</b> — un insieme di maglie dello stesso tipo: <i>divise da gara</i> oppure <i>maglie da libero</i>. Ogni squadra utilizza un lotto per tipo: di norma il lotto standard per le divise e il lotto LIBERO per le maglie da libero, ma può averne di riservati (per esempio divise e liberi della prima squadra, distinti da quelli delle giovanili). Una richiesta indica solo il tipo di maglia; il lotto lo stabilisce la squadra. Nel cambio, una maglia da libero si sostituisce con un'altra maglia da libero e una divisa con un'altra divisa, anche di lotti diversi, mantenendo il numero quando è libero. I lotti si gestiscono in Magazzino → Divise.</p>
    <p><b>Numeri in comune</b> — il menu sulla riga della squadra. Scegliendo un'altra squadra, le due condividono un'unica serie di numeri di maglia: un numero in uso in una non viene dato nell'altra. Il collegamento è reciproco; più squadre possono far parte dello stesso gruppo; con «numeri propri» la squadra esce dal gruppo.</p>
    <p><b>Ordine di distribuzione</b> — il numero indicato sulla riga della squadra. Stabilisce quale squadra viene servita per prima quando il materiale non è sufficiente e l'ordine in cui le squadre compaiono in tutte le schermate. Le richieste con un numero di maglia preciso hanno comunque la precedenza.</p>
    <p><b>In distribuzione</b> — la casella sulla riga della squadra: togliendola, le richieste della squadra non vengono servite.</p>
    <p><b>Da cambiare</b> — un capo in uso che l'atleta deve sostituire. Alla consegna del capo nuovo quello precedente rientra automaticamente.</p>
    <p><b>Prenotata</b> — una divisa già proposta per una richiesta aperta: non è ancora consegnata, ma non è disponibile per altre richieste.</p>
    <p><b>Provvisoria</b> — una consegna in taglia diversa da quella richiesta, in attesa della taglia corretta: la richiesta resta aperta e la maglia resta all'atleta finché non arriva quella giusta.</p>
    <p><b>Atleta attivo</b> — la casella in <i>Modifica atleta</i>: un atleta non attivo non riceve consegne.</p>
    <p><b>In uscita</b> — un atleta che lascia la società e non ha ancora restituito tutto il materiale. Non riceve ulteriori consegne e viene cancellato solo a restituzione completata. Salvando la sua scheda da <i>Modifica atleta</i> torna un atleta normale.</p>`)}

  ${sezione('La pagina iniziale',`
    <p>All'apertura il programma mostra lo stemma e il nome della società, la stagione e sei riquadri: <b>Squadre</b> (elenco delle squadre), <b>Atleti</b> (riepilogo della dotazione di ogni atleta), <b>Assegnazioni</b>, <b>Magazzino</b>, <b>Movimenti</b> e <b>Impostazioni</b>. Sotto i riquadri si trova il pulsante <b>Manuale</b>; in fondo, la versione del programma. Nel menu in alto delle altre schermate le voci sono nello stesso ordine.</p>
    <p>Se in una squadra due atleti hanno lo stesso numero di maglia, sotto il pulsante Manuale compare un avviso in rosso che indica squadra e numero.</p>`)}

  ${sezione('Le schermate',`
    <p>In ogni schermata, e nella scheda di ciascun atleta, la voce <b>Come funziona questa schermata</b> ne riassume l'uso e il significato dei colori.</p>
    <p><b>Squadre</b> — due schede. <i>Atleti</i>: una riga per squadra, con nome, numero di atleti, stato delle impostazioni e i pulsanti <b>Consegna o ritira a tutti</b>, <b>Scarica foglio</b> e <b>Impostazioni</b> (nome, lotto, numeri in comune, ordine di distribuzione, «in distribuzione» ed eliminazione, possibile solo per una squadra senza atleti); con poco spazio i pulsanti si accorciano in «A tutti», «Foglio» e ⚙; con <b>+</b> si visualizzano gli atleti, modificabili direttamente sulla riga, e con <b>Apri</b> si accede alla loro scheda. <i>Riepilogo</i>: la dotazione attuale di ogni atleta e i numeri in uso in ciascuna squadra. Le due schede hanno gli stessi filtri (nome, squadra, numero di maglia) e gli stessi pulsanti <b>Aggiungi atleta</b> e <b>Aggiungi squadra</b>. Gli atleti la cui squadra non è più nell'elenco compaiono in fondo, con il pulsante per aggiungerla.</p>
    <p><b>Scheda dell'atleta</b> — divise, materiale e richieste dell'atleta, con i pulsanti <b>Consegna diretta</b>, <b>Nuova richiesta</b> e <b>Modifica atleta</b>. Ogni richiesta si modifica con ✎ e si elimina con ✕. Una nuova richiesta indica articolo e taglia e, per le divise, il tipo (divisa della squadra o maglia da libero) e l'eventuale numero desiderato.</p>
    <p><b>Assegnazioni</b> — due schede. <i>Richieste</i>: le richieste aperte, raggruppate per squadra, con il capo proposto dal programma e i filtri per squadra, esito, articolo e numero. <i>Da ordinare</i>: i pezzi da ordinare al fornitore, per articolo e taglia, al netto di quelli già ordinati.</p>
    <p><b>Magazzino</b> — due schede. <i>Divise</i>: le maglie una per una, per lotto e taglia (verde in magazzino, gialla in uso, tratteggiata da cambiare, azzurra prenotata; bianca se da libero, nera se di un lotto riservato); <b>Aggiungi divisa</b> inserisce un capo nuovo, <b>Aggiungi lotto</b> e <b>Modifica lotto</b> gestiscono i lotti e le squadre che li usano. Selezionando una maglia in magazzino, <b>Segna fuori uso</b> la lascia in magazzino (grigia e barrata) senza che venga mai assegnata, <b>Dismetti</b> la toglie definitivamente dal magazzino. <i>Materiale</i>: per ogni articolo e taglia sei valori: <i>totale</i> (in magazzino + consegnati), <i>consegnati</i>, <i>in magazzino</i>, <i>prenotati</i>, <i>ordinati</i> al fornitore e non ancora arrivati, <i>magazzino finale</i> (in magazzino − prenotati − mancanti + ordinati). Selezionando una riga si apre la finestra dell'articolo: in cima si sceglie <b>Arrivo</b>, <b>Inventario</b>, <b>Dismessi</b> oppure <b>Ordine</b>, e sotto compaiono solo le caselle che servono, con un solo pulsante. Eventuali incongruenze sono segnalate in cima alla scheda.</p>
    <p><b>Movimenti</b> — il registro di consegne, rientri, carichi e rettifiche, dal più recente; vengono mostrati gli ultimi 150, con il pulsante per visualizzarli tutti. <b>Consegna a staff ed esterni</b> registra il materiale dato ad allenatori, dirigenti o esterni.</p>
    <p><b>Impostazioni</b> — stagione in corso, nome e stemma della società, fogli Excel (scaricare e caricare i dati, scaricare i movimenti), codici degli articoli, aspetto (chiaro, scuro o come il computer), aggiornamenti e copie di sicurezza. Le funzioni che lavorano con i file sono disponibili nel programma installato.</p>`)}

  ${sezione('La regola dei numeri',`
    <p>All'interno di una squadra <b>un numero di maglia non può ripetersi</b>. Tra squadre diverse lo stesso numero è invece ammesso.</p>
    <p>Nel proporre le divise il programma dà la precedenza al numero richiesto; poi al numero della maglia che l'atleta sta cambiando, che resta riservato a lei; poi alla maglia che un compagno di squadra deve sostituire (lo scambio); infine al numero libero più basso. A un atleta non viene mai proposta la maglia che sta restituendo.</p>
    <p>La regola viene controllata anche nelle consegne manuali, nella modifica del numero di una divisa, quando una maglia torna «in uso» con <i>Non la cambia più</i> e quando un atleta viene spostato in un'altra squadra: in quest'ultimo caso, se il suo numero è già in uso, la sua maglia viene segnata da cambiare.</p>
    <p>Le squadre collegate con <b>Numeri in comune</b> (per esempio due squadre della stessa categoria) formano un gruppo: la regola vale per tutto il gruppo, maglie da libero comprese, come se fosse una squadra sola. Collegando due squadre che hanno già numeri in comune, il programma li elenca e chiede conferma.</p>
    <p>Un eventuale numero ripetuto è segnalato nella pagina iniziale, sulla riga della squadra (anche se chiusa), sulle righe degli atleti interessati, nel Riepilogo e sulle richieste di divise.</p>`)}

  ${sezione('Consegne e rientri',`
    <p>Le consegne si registrano in quattro modi; in tutti la richiesta corrispondente, se c'è, si chiude.</p>
    <p>1. <b>Da richiesta</b> — in Assegnazioni, il pulsante <b>Consegna</b> sulla richiesta registra la consegna del capo proposto e, se l'atleta sta cambiando maglia, il ritiro di quella vecchia.</p>
    <p>2. <b>Consegna diretta</b> — dalla scheda dell'atleta, senza una richiesta; per le divise si sceglie la maglia tra quelle disponibili con un numero libero nella squadra.</p>
    <p>3. <b>Consegna o ritira a tutti</b> — dalla riga della squadra, per il solo materiale: una taglia per tutti, con la possibilità di escludere chi possiede già l'articolo. La stessa finestra consente il ritiro dall'intera squadra, senza superare quanto consegnato a ciascuno.</p>
    <p>4. <b>Consegna a staff ed esterni</b> — in Movimenti, per il materiale dato ad allenatori, dirigenti o esterni, indicandone nome e ruolo.</p>
    <p>Gli atleti con l’eliminazione in attesa di riconsegna e quelli non attivi non ricevono consegne. Se la taglia richiesta non è disponibile, sulla richiesta compare <b>Altra taglia</b>: elenca le maglie disponibili a partire dalle taglie più vicine, con i soli numeri liberi nella squadra, e consente una consegna provvisoria.</p>
    <p>I rientri si registrano dalla scheda dell'atleta con <b>Restituita</b> (divise) o <b>Restituito</b> (materiale), oppure con il ritiro da tutta la squadra o con «consegnato» nel modulo per le divise da cambiare. <b>Segna da cambiare</b> indica una divisa come da sostituire.</p>`)}

  ${sezione('Annullare un movimento',`
    <p>In Movimenti, <b>Annulla</b> rimette il magazzino nella situazione precedente. Una consegna con il ritiro della maglia vecchia si annulla per intero, e la richiesta consegnata torna aperta; l'annullamento di un carico rimette tra gli ordinati i pezzi che aveva scalato.</p>
    <p>L'annullamento non è consentito se dopo quel movimento ne sono stati registrati altri sullo stesso capo o, per il materiale di un atleta, sullo stesso articolo; se la giacenza scenderebbe sotto zero; se la divisa tornerebbe a un atleta non più in archivio. In questi casi occorre annullare prima i movimenti successivi o correggere la giacenza.</p>`)}

  ${sezione('Atleti in due squadre',`
    <p>Un atleta tesserato in due squadre ha una scheda per ciascuna squadra. Quando lo stesso nome compare in squadre diverse, in Squadre il programma chiede se si tratta della stessa persona; il collegamento si imposta o si toglie anche da <i>Modifica atleta</i>, alla voce «Gioca anche in un'altra squadra con la scheda di».</p>
    <p>Le schede collegate riportano «gioca anche in …». Le <b>divise</b> restano una per squadra, ciascuna con la regola dei numeri della propria squadra. Il <b>materiale</b> si consegna una volta sola: se entrambe le schede lo richiedono, viene preparato per la squadra che viene prima nell'ordine di distribuzione e l'altra richiesta risulta coperta.</p>`)}

  ${sezione('Eliminazione di un atleta',`
    <p>Dalla scheda dell'atleta, <b>Modifica atleta</b> → <b>Elimina</b>. Se l'atleta non ha materiale, viene cancellato dopo la conferma.</p>
    <p>Se ha ancora materiale, si apre l'elenco dei capi in suo possesso: si selezionano quelli restituiti, che rientrano in magazzino, e si preme <b>Conferma eliminazione</b>; se non è stato restituito nulla si conferma senza selezionare. Finché manca qualcosa l'atleta resta nell'archivio con l'<b>eliminazione in attesa di riconsegna</b> e non riceve altre consegne; salvando la sua scheda l'eliminazione si annulla; alla restituzione dell'ultimo capo, anche se registrata dalla sua scheda, il programma propone la cancellazione. Il suo nome rimane comunque nel registro dei movimenti.</p>`)}

  ${sezione('Fogli Excel',`
    <p>Durante la stagione si usa un solo foglio, il <b>modulo di distribuzione</b>: si scarica già compilato (in <b>Squadre</b>, con <b>Foglio delle squadre → Scarica</b> per tutte, oppure con <b>Scarica foglio</b> dalla riga di una squadra), si corregge, si porta in palestra segnando <i>consegnato</i>, e si ricarica con <b>Foglio delle squadre → Carica</b>, sempre in Squadre. Il registro dei movimenti si scarica da <b>Movimenti</b>. I quattro fogli dei dati si trovano in <b>Impostazioni → Prima configurazione</b>: servono a riempire il programma per una società nuova.</p>
    <p>Il <b>modulo di distribuzione</b> è destinato ai dirigenti: contiene un foglio per squadra con gli atleti già inseriti e gli articoli della stagione in corso. Ogni articolo ha il nome nella prima riga dell'intestazione e, sotto, due colonne: la <i>Risposta</i> (<i>ce l'ho</i>, <i>mi manca</i>, <i>da cambiare</i>, dal menu a tendina; la casella vuota equivale a <i>ce l'ho</i>) e la <i>Taglia</i>, dal menu con le taglie dell'articolo: con <i>mi manca</i> e <i>da cambiare</i> è quella da consegnare, con <i>ce l'ho</i> è quella posseduta; gli articoli senza taglie hanno la sola risposta. Il materiale ha anche la colonna <i>Pezzi</i>, se l'atleta ne chiede più di uno: vuota vale 1, e con <i>mi manca</i> nascono tante richieste quanti i pezzi. La colonna <i>Numero maglia</i> riporta il numero attuale; la colonna <i>Note</i> è libera. Il foglio esce già compilato con quanto risulta al programma (ce l'ho, mi manca, da cambiare, con le taglie): chi lo compila modifica solo le caselle che non corrispondono, e al caricamento le righe non modificate non producono effetti. Al caricamento vengono creati squadre, atleti e richieste; <i>ce l'ho</i> scritto su un articolo con una richiesta aperta toglie la richiesta, una taglia diversa la corregge; con <i>ce l'ho</i> e la taglia il capo viene registrato come già in possesso dell'atleta, senza modificare le giacenze (per la divisa serve anche il numero di maglia: la divisa passa all'atleta, oppure viene creata se non era in archivio); un foglio copiato dentro Excel viene ricondotto alla sua squadra, e un foglio che non corrisponde a nessuna squadra viene segnalato prima di crearne una nuova.</p>
    <p>Gli altri quattro fogli servono al caricamento iniziale e vanno caricati in quest'ordine: <b>Articoli e magazzino</b>, <b>Squadre e atleti</b>, <b>Divise da gara</b>, <b>Richieste</b>. Vengono scaricati già compilati con i dati presenti nel programma, con in fondo alcune colonne solo informative (per esempio consegnati, prenotati e magazzino finale per gli articoli, esito e numero proposto per le richieste), che al caricamento vengono ignorate. Il foglio <b>Movimenti</b> si scarica soltanto. Le colonne sono riconosciute dal titolo: un foglio con colonne mancanti o ripetute viene rifiutato.</p>
    <p>Le taglie devono corrispondere a quelle previste per l'articolo; negli articoli delle richieste si può indicare il nome, il codice o il nome visualizzato. Il caricamento aggiunge soltanto: i dati già presenti non vengono modificati, il caricamento ripetuto dello stesso file non crea duplicati e non ricrea le richieste già consegnate.</p>
    <p>Nei fogli scaricati ogni casella è guidata: selezionandola, Excel mostra cosa inserire. Le colonne con valori prestabiliti hanno un <b>menu a tendina</b> (risposte, taglie, squadre, lotti, articoli, cognomi e nomi degli atleti già caricati, sì/no); i numeri accettano solo interi nell'intervallo previsto. In alto, le colonne <i>da compilare</i> sono separate da quelle <i>solo informative</i>, in grigio; le obbligatorie hanno il titolo più scuro. Il foglio <i>Istruzioni</i> descrive ogni colonna.</p>
    <p>Prima di caricare, il programma controlla ogni riga e mostra un riepilogo: cosa verrà aggiunto, cosa verrà ignorato perché già presente, le squadre e i lotti nuovi e le righe con errori, che non vengono caricate (per esempio un valore non ammesso, una taglia che Excel ha trasformato in data, un numero di maglia fuori dall'intervallo 0–99, un atleta o un articolo inesistente). Segnala inoltre, come avvisi, le situazioni da verificare: righe ripetute, giacenze diverse da quelle nel programma, numeri di maglia già in uso nella squadra, note che sembrano contenere recapiti (che non vengono caricate). Errori e avvisi dell'ultimo caricamento restano elencati in Impostazioni.</p>`)}

  ${sezione('Il foglio per la palestra',`
    <p>In <b>Squadre</b>, sulla riga di ogni squadra, il pulsante <b>Scarica foglio</b> produce il modulo di distribuzione della sola squadra, già compilato: per la divisa, la colonna <i>Proposta</i> indica la maglia preparata dal programma. In palestra, per ogni capo consegnato si sceglie <i>consegnato</i> nella casella della risposta; ricaricando il foglio con <b>Foglio delle squadre → Carica</b>, in Squadre, le consegne vengono registrate tutte insieme, compreso il rientro delle divise da cambiare. La funzione è disponibile nel programma installato.</p>`)}

  ${sezione('Dati, copie di sicurezza e aggiornamenti',`
    <p>I dati sono conservati <b>su questo computer</b>, in un file locale: non vengono trasmessi in rete e non richiedono un account. Il programma si apre una sola volta: aprendolo di nuovo si torna alla finestra già aperta.</p>
    <p>In ogni giornata di utilizzo il programma salva automaticamente una copia dell'archivio com'era prima della prima modifica del giorno e conserva le ultime 30; prima di ogni ripristino salva anche una copia dei dati del momento. In <b>Impostazioni → Copie di sicurezza</b> le copie automatiche si riprendono direttamente dall'elenco; è inoltre possibile salvare una copia in una posizione a scelta, riprendere i dati da un file e scegliere la cartella delle copie automatiche.</p>
    <p>Se alla chiusura le ultime modifiche non risultano salvate, il programma lo segnala e chiede se chiudere comunque.</p>
    <p>Pochi secondi dopo l'avvio il programma verifica la disponibilità di una nuova versione e, se presente, lo segnala. L'installazione si avvia da <b>Impostazioni → Aggiornamenti</b>: il programma scarica la versione nuova mostrando l'avanzamento, salva i dati, la installa e si riapre automaticamente. I dati non vengono modificati.</p>
    <p>L'aspetto segue il tema del computer, chiaro o scuro; in <b>Impostazioni → Come si vede</b> è possibile sceglierlo manualmente.</p>`)}

  ${sezione('Articoli in distribuzione',
    Object.keys(fam).sort().map(f=>`<p><b>${esc(cap1(f))}</b> — ${esc(fam[f].join(', '))}</p>`).join('')
    +`<p class="sub">L'elenco è letto dall'archivio e si aggiorna automaticamente quando si aggiungono o si tolgono articoli.</p>`)}
  `;
}

/* Il foglio della squadra, quello per il dirigente e per la palestra: e' il
   modulo di distribuzione della sola squadra. Prima era una lista a parte, solo
   di andata: le consegne andavano poi inserite a mano una per una. Adesso si
   scrive «consegnato» e si ricarica lo stesso foglio (Andrea, 25/09/2026). */
function fogliaSquadra(nome){return scaricaModulo(nome)}
/* Una cosa a tutta la squadra, o via da tutta la squadra. Vale solo per il
   materiale: una divisa da gara e' un capo con un numero e un proprietario, e
   quella si assegna una per una.

   Le taglie sono il punto delicato: per una borraccia va bene una taglia sola
   per tutti, per una felpa no. Quando l'articolo ha piu' taglie il programma
   lo dice chiaro invece di far finta di niente. */
function dlgTuttaSquadra(nome){
  const D=derive();
  const tutti=Object.entries(S.atlete).filter(([id,a])=>a.squadra===nome);
  // Chi sta uscendo o non e' attivo non riceve niente, ma una restituzione
  // da loro va registrata lo stesso.
  const squadra=tutti.filter(([,a])=>puoRicevere(a))
    .sort((x,y)=>norm(fullName(x[1])).localeCompare(norm(fullName(y[1]))));
  if(!tutti.length){toast('La squadra non ha atleti');return}
  const arts=(D.set.articoli||[]).filter(a=>!D.conNumero(a.nome)).sort(perNome);
  if(!arts.length){toast('Non c’è nessun articolo da consegnare');return}

  const taglieDi=n=>{const x=arts.find(z=>z.nome===n);const t=new Set(x?x.taglie:[]);
    for(const k of Object.keys(D.stock))if(k.startsWith(n+'|'))t.add(k.split('|')[1]);
    return [...t].sort((p,q)=>szIdx(p)-szIdx(q))};
  const vociTaglia=n=>{const t=taglieDi(n);
    if(!t.length)return '<option value="">nessuna taglia</option>';
    return t.map(x=>{const st=(D.stock[D.key(n,x)]||{ora:0}).ora;
      return `<option value="${esc(x)}">${x==='UNICA'?'taglia unica':esc(x)} — ${st} in magazzino</option>`}).join('')};
  // Ce l'ha gia' anche chi l'ha ricevuto con la scheda di un'altra squadra.
  const ceLHa=(id,art)=>[id,...collegati(id)].some(x=>Object.entries(D.dotazione[x]||{}).some(([k,v])=>v>0&&k.split('|')[0]===art));
  const quantiHanno=art=>squadra.filter(([id])=>ceLHa(id,art)).length;

  const first=arts[0].nome;
  openDlg(`<h2>Tutta la ${esc(teamLabel(nome))}</h2>
  <p class="sub">${squadra.length} ${squadra.length===1?'atleta':'atleti'}. Viene registrato un movimento per ciascun atleta, come per le consegne singole.</p>
  <div class="field"><label for="tAz">Cosa succede</label><select id="tAz" name="azione">
    <option value="CONSEGNA">Consegna a tutti</option>
    <option value="RIENTRO">Ritira da tutti</option></select></div>
  <div class="field"><label for="tArt">Articolo</label><select id="tArt" name="articolo">${arts.map(x=>`<option value="${esc(x.nome)}">${esc(artLabel(x.nome))}</option>`).join('')}</select></div>
  <div class="two"><div class="field"><label for="tTg">Taglia</label><select id="tTg" name="taglia">${vociTaglia(first)}</select></div>
  <div class="field"><label for="tQta">Quanti pezzi a testa</label><input type="number" id="tQta" name="qta" min="1" max="20" value="1" inputmode="numeric"></div></div>
  <label class="check"><input type="checkbox" id="tSalta" name="salta" checked> Escludere chi possiede già l’articolo, in qualsiasi taglia</label>
  <div id="tAvviso"></div>
  ${actions('Registra')}`, async fd=>{
    const art=fd.articolo;const tg=fd.taglia;const qta=Math.max(1,Number(fd.qta)||1);
    if(!tg){toast('Selezionare la taglia');return false}
    const k=D.key(art,tg);
    const salta=fd.salta==='on';
    const dentro=(fd.azione==='CONSEGNA'?squadra:tutti).filter(([id])=>{
      // Consegnando si salta chi quell'articolo ce l'ha gia', in qualunque
      // taglia. Ritirando invece conta la taglia esatta: non si puo' riprendere
      // una L a chi ha una M.
      if(fd.azione==='CONSEGNA')return salta?!ceLHa(id,art):true;
      return ((D.dotazione[id]||{})[k]||0)>0});
    if(!dentro.length){toast(fd.azione==='CONSEGNA'?'Tutti gli atleti possiedono già questo articolo':'Nessun atleta possiede questo articolo in questa taglia');return false}
    const pezzi=dentro.length*qta;
    const st=(D.stock[k]||{ora:0}).ora;
    // Una domanda sola: prima la giacenza scarsa ne faceva fare due di fila.
    if(!await chiedi(fd.azione==='CONSEGNA'
      ?`Consegnare ${qta>1?qta+' pezzi a testa, ':''}${artLabel(art)} ${tg==='UNICA'?'':tg} a ${dentro.length} ${dentro.length===1?'atleta':'atleti'}?${st<pezzi?`\nAttenzione: occorrono ${pezzi} pezzi e in magazzino ne risultano ${st}.`:''}`
      :`Registrare il rientro di ${artLabel(art)} ${tg==='UNICA'?'':tg} da ${dentro.length} ${dentro.length===1?'atleta':'atleti'}?`))return false;
    let chiuse=0;
    const ok=await w(async()=>{
      for(const [id] of dentro)await insieme(async()=>{
        // Ritirando non si prende piu' di quello che ha.
        const q=fd.azione==='RIENTRO'?Math.min(qta,(D.dotazione[id]||{})[k]||0):qta;
        const coperte=fd.azione==='CONSEGNA'?richiesteCoperte(id,art,tg,q):[];
        await mov({tipo:fd.azione,atletaId:id,articolo:art,taglia:tg,qta:q,
          note:`Tutta la ${teamLabel(nome)}`,...(coperte.length?{richieste:coperte.map(fotoRichiesta)}:{})});
        for(const rid of coperte){await S.db.doc('richieste/'+rid).delete();chiuse++}});
    });
    if(ok)toast(`${dentro.length} ${dentro.length===1?'movimento':'movimenti'} ${fd.azione==='CONSEGNA'?'di consegna':'di rientro'} registrati`
      +(chiuse?`, ${chiuse===1?'una richiesta chiusa':chiuse+' richieste chiuse'}`:''));
    return ok});

  const agg=()=>{const n=$('#tArt').value;const t=taglieDi(n);
    const tenuta=$('#tTg').value;$('#tTg').innerHTML=vociTaglia(n);
    if(t.includes(tenuta))$('#tTg').value=tenuta;
    const tg=$('#tTg').value;
    const righe=[];
    if(t.length>1)righe.push(`Questo articolo ha ${t.length} taglie: la consegna a tutti avviene <b>in una sola taglia</b>. Per taglie diverse è preferibile consegnare dalle richieste o dalla scheda di ciascun atleta.`);
    const ha=quantiHanno(n);
    const saltati=$('#tAz').value==='CONSEGNA'&&$('#tSalta').checked;
    if(ha)righe.push(`${ha} su ${squadra.length} ce l’${ha===1?'ha':'hanno'} già${saltati?`: ${ha===1?'viene saltato':'vengono saltati'}`:''}.`);
    $('#tAvviso').innerHTML=righe.length?`<div class="notice">${righe.join('<br>')}</div>`:''};
  $('#tArt').addEventListener('change',agg);
  $('#tTg').addEventListener('change',agg);
  $('#tAz').addEventListener('change',agg);
  $('#tSalta').addEventListener('change',agg);
  agg();
}
/* Un lotto di maglie: nome, tipo (gara o libero) e squadre che lo usano. Le
   squadre si possono scegliere anche dalla loro riga in Squadre: e' lo stesso
   dato. Rinominare un lotto aggiorna le maglie, le squadre e le richieste. */
function dlgLotto(nome){
  const D=derive();const nuovo=!nome;
  const tipo=nuovo?'gara':tipoLotto(nome);
  const maglie=nuovo?[]:Object.entries(S.divise).filter(([,d])=>!d.dismessa&&(d.modello||'STANDARD')===nome);
  const usa=x=>!nuovo&&(tipo==='libero'?D.liberoDi[x.nome]===nome:D.lotto[x.nome]===nome);
  openDlg(`<h2>${nuovo?'Nuovo lotto':esc(nomeLotto(nome,true))}</h2>
  <p class="sub">Un lotto è un insieme di maglie dello stesso tipo: le divise da gara di una squadra o di più squadre, oppure le maglie da libero. Ogni squadra usa un lotto per le divise da gara e uno per le maglie da libero.</p>
  <div class="two"><div class="field"><label for="ltNome">Nome</label><input type="text" id="ltNome" name="nome" required maxlength="40" value="${esc(nome||'')}" placeholder="per esempio LIBERO GIOVANILI"></div>
  <div class="field"><label for="ltTipo">Tipo</label><select id="ltTipo" name="tipo"><option value="gara"${tipo==='gara'?' selected':''}>Divise da gara</option><option value="libero"${tipo==='libero'?' selected':''}>Maglie da libero</option></select></div></div>
  <p class="sub" style="margin-bottom:4px">Squadre che lo usano:</p>
  <div class="colonneSq">${D.perServire.map(x=>`<label class="check"><input type="checkbox" name="sq" value="${esc(x.nome)}"${usa(x)?' checked':''}> ${esc(teamLabel(x.nome))}</label>`).join('')}</div>
  ${maglie.length?`<p class="sub">Nel lotto ci sono ${maglie.length===1?'una maglia':maglie.length+' maglie'}: una squadra che passa a un altro lotto tiene le maglie che ha, che si cambiano quando serve.</p>`:''}
  ${actions(nuovo?'Aggiungi lotto':'Salva',!nuovo&&!maglie.length&&(D.set.modelli||[]).length>1?`<button class="btn danger" value="elimina" style="margin-right:auto">Elimina lotto</button>`:'')}`,
  async(fd,btn)=>{
    const set=D.set;const modelli=[...(set.modelli||['STANDARD'])];const tipi={...(set.tipiLotto||{})};
    // i tipi di tutti i lotti gia' esistenti vengono scritti, cosi' non
    // dipendono piu' dalla vecchia lista dei comuni
    for(const m of modelli)if(!tipi[m])tipi[m]=tipoLotto(m);
    let squadre=(set.squadre||[]).map(x=>({...x}));
    const campo=t=>t==='libero'?'modelloLibero':'modelloDivisa';
    const altro=(t,escluso)=>modelli.find(m=>m!==escluso&&tipi[m]===t)||null;
    if(btn==='elimina'){
      if(!await chiedi(`Eliminare il lotto «${nomeLotto(nome,true)}»? Non contiene maglie; le squadre che lo usano passano a un altro lotto dello stesso tipo.`,{si:'Elimina il lotto',pericolo:true}))return false;
      const sost=altro(tipo,nome);
      squadre=squadre.map(x=>x[campo(tipo)]===nome?{...x,[campo(tipo)]:sost||undefined}:x);
      delete tipi[nome];
      return w(()=>S.db.doc('settings/main').update({modelli:modelli.filter(m=>m!==nome),tipiLotto:tipi,squadre}))}
    const nuovoNome=(fd.nome||'').trim().toUpperCase().replace(/\s+/g,' ');
    if(!nuovoNome){toast('Indicare il nome del lotto');return false}
    if(nuovoNome!==nome&&modelli.some(m=>KEY(m)===KEY(nuovoNome))){toast('Esiste già un lotto con questo nome');return false}
    const nuovoTipo=fd.tipo==='libero'?'libero':'gara';
    if(!nuovo&&nuovoTipo!==tipo&&maglie.length&&!await chiedi(`Le ${maglie.length} maglie del lotto diventano ${nuovoTipo==='libero'?'maglie da libero':'divise da gara'}. Continuare?`))return false;
    const scelte=new Set(fd._all.getAll('sq'));
    // se cambia tipo, chi lo usava per il tipo vecchio passa a un altro lotto
    if(!nuovo&&nuovoTipo!==tipo){const sost=altro(tipo,nome);squadre=squadre.map(x=>x[campo(tipo)]===nome?{...x,[campo(tipo)]:sost||undefined}:x)}
    // le squadre spuntate usano questo lotto; quelle tolte tornano a un altro
    const sostituto=altro(nuovoTipo,nome);
    let senzaAlternativa=0;
    squadre=squadre.map(x=>{
      const f=campo(nuovoTipo);const attuale=nuovoTipo==='libero'?(x.modelloLibero||D.lottiLibero[0]):(x.modelloDivisa||'STANDARD');
      if(scelte.has(x.nome))return {...x,[f]:nuovoNome};
      if(attuale===nome){if(!sostituto){senzaAlternativa++;return {...x,[f]:nuovoNome}}return {...x,[f]:sostituto}}
      return x});
    if(senzaAlternativa)toast('Alcune squadre restano su questo lotto: non ci sono altri lotti dello stesso tipo');
    const listaNuova=nuovo?[...modelli,nuovoNome]:modelli.map(m=>m===nome?nuovoNome:m);
    if(!nuovo&&nuovoNome!==nome){delete tipi[nome];
      squadre=squadre.map(x=>({...x,...(x.modelloDivisa===nome?{modelloDivisa:nuovoNome}:{}),...(x.modelloLibero===nome?{modelloLibero:nuovoNome}:{})}))}
    tipi[nuovoNome]=nuovoTipo;
    const ok=await w(async()=>{
      if(!nuovo&&nuovoNome!==nome){
        for(const [id] of maglie)await S.db.doc('divise/'+id).update({modello:nuovoNome});
        for(const [rid,r] of Object.entries(S.richieste))if(r.modello===nome)await S.db.doc('richieste/'+rid).update({modello:nuovoNome})}
      await S.db.doc('settings/main').update({modelli:listaNuova,tipiLotto:tipi,squadre})});
    if(ok)toast(nuovo?`Lotto ${cap(nuovoNome)} aggiunto`:'Lotto salvato');
    return ok});
}
