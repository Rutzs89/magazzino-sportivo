  else h+=`<div class="list">`+dot.map(([k,v])=>{const [ar,tg]=k.split('|');return`<div class="item"><div class="main"><div class="name">${esc(artLabel(ar))}</div><div class="meta">${tg==='UNICA'?'Taglia unica':'Taglia '+esc(tg)} · ${v} ${v===1?'pezzo':'pezzi'}</div></div>
    <div class="right"><button type="button" class="btn small" data-act="rientroMat" data-id="${esc(id)}" data-art="${esc(ar)}" data-tg="${esc(tg)}">Restituito</button></div></div>`}).join('')+`</div>`;
  return h;
}
function reqRow(rid,withName){
  const r=S.richieste[rid];const D=derive();const p=D.prop[rid]||{};const a=S.atlete[r.atletaId];
  const isNum=D.conNumero(r.articolo);const d=p.divisaId?S.divise[p.divisaId]:null;
  const modVero=D.conNumero(r.articolo)?D.modelloPer(r):(r.modello||'');
  const what=`${esc(artLabel(r.articolo))}${modVero&&modVero!=='STANDARD'?' '+esc(modVero.toLowerCase()):''} · ${r.taglia==='UNICA'?'taglia unica':esc(r.taglia)}${r.numeroDesiderato!=null?' · chiede il n.'+esc(r.numeroDesiderato):''}`;
  const dp=conNumeroDoppio(D)[r.atletaId];
  const extra=[];
  // Chi sta aspettando la taglia giusta intanto una divisa ce l'ha: senza
  // dirlo, la riga sembra quella di chi e' rimasto a mani vuote.
  const provvisoria=(D.perAtleta[r.atletaId]||[]).map(x=>S.divise[x])
    .find(x=>x&&x.daRestituire&&x.tagliaChiesta===r.taglia);
  if(provvisoria)extra.push(`intanto ha una ${esc(provvisoria.taglia)} n.${esc(provvisoria.numero)}, da cambiare`);
  if(d&&d.holder&&d.holder!==r.atletaId)extra.push(`in rientro da ${esc(fullName(S.atlete[d.holder]))}`);
  if(p.motivo&&p.esito!=='OK')extra.push(esc(p.motivo));else if(p.motivo)extra.push(esc(p.motivo));
  if(r.note)extra.push(esc(r.note));
  if(dp)extra.push(`<b>${dp.length===1?`porta il n.${dp[0]}`:`porta i numeri ${dp.join(', ')}`} già di un compagno di squadra</b>`);
  return`<div class="item riga richiesta${dp?' conflitto':''}">${isNum?(d?chip(d,'prenotata'):'<span class="jersey rientro" aria-hidden="true"><b>?</b></span>'):''}
  <div class="main">${withName?`<div class="name"><a href="#atleta/${encodeURIComponent(r.atletaId)}">${esc(fullName(a))}</a><span class="cosa">${what}</span></div>`:`<div class="name">${what}</div>`}
  ${extra.length?`<div class="meta">${extra.join(' \u00b7 ')}</div>`:''}</div>
  <div class="right">${esitoPill(p)}<span class="slotBtn">${p.esito==='OK'
    ?`<button type="button" class="btn small primary" data-act="consegna" data-id="${esc(rid)}">Consegna</button>`
    :isNum&&p.esito==='MANCA'?`<button type="button" class="btn small" data-act="altraTaglia" data-id="${esc(rid)}">Altra taglia</button>`:''}</span>
  <button type="button" class="btn small ghost" data-act="modRichiesta" data-id="${esc(rid)}" aria-label="Modifica richiesta" title="Modifica">✎</button>
  <button type="button" class="btn small ghost" data-act="delRichiesta" data-id="${esc(rid)}" aria-label="Elimina richiesta">✕</button></div></div>`;
}

/* ---- Assegnazioni ---- */
function vAssegnazioni(){
  const D=derive();const q=norm(S.ui.aQ);
  const nA=S.ui.nAss===''||S.ui.nAss==null?null:Number(S.ui.nAss);
  let ids=D.order.filter(rid=>{const r=S.richieste[rid];const a=S.atlete[r.atletaId];const p=D.prop[rid];
    // Il numero cercato puo' essere quello che l'atleta ha chiesto o quello
    // che il programma gli propone: tutti e due servono a ritrovare la riga.
    const num=nA===null||Number(r.numeroDesiderato)===nA
      ||(p&&p.divisaId&&Number(S.divise[p.divisaId].numero)===nA);
    return(!S.ui.aTeam||(a&&a.squadra===S.ui.aTeam))&&(!S.ui.aEsito||(p&&p.esito===S.ui.aEsito))&&(!S.ui.aArt||r.articolo===S.ui.aArt)&&(!q||norm(fullName(a)).includes(q))&&num});
  const all=Object.values(D.prop);const c={OK:0,MANCA:0,ESCLUSA:0};all.forEach(p=>c[p.esito]++);
  const miss={};for(const rid of D.order){const p=D.prop[rid];if(p.esito!=='MANCA')continue;const r=S.richieste[rid];const k=`${r.articolo}|${r.taglia}|${D.conNumero(r.articolo)?D.modelloPer(r):''}`;miss[k]=(miss[k]||0)+1}
  const arts=[...new Set(Object.values(S.richieste).map(r=>r.articolo))].sort(perNome);
  const mk=Object.entries(miss).sort();
  const pezzi=mk.reduce((n,x)=>n+x[1],0);
  // Due viste invece di una pagina sola: l'elenco delle richieste e la lista
  // della spesa. Prima "Da ordinare" era un titoletto in mezzo, e scorrendo
  // restava li' fisso come se fosse il titolo di quello che si sta guardando.
  const ordinare=S.ui.assTab==='ordinare';
  let h=`<h1>Assegnazioni</h1><div class="row-actions barraMag"><div class="seg" role="group" aria-label="Vista">
    <button type="button" data-act="assTab" data-v="richieste" aria-pressed="${!ordinare}">Richieste</button>
    <button type="button" data-act="assTab" data-v="ordinare" aria-pressed="${ordinare}">Da ordinare${pezzi?' · '+pezzi:''}</button></div>
</div>
  <div class="stats"><div class="stat ok"><b>${c.OK}</b><span>pronte da consegnare</span></div><div class="stat bad"><b>${c.MANCA}</b><span>da ordinare</span></div><div class="stat"><b>${c.ESCLUSA}</b><span>escluse</span></div></div>`;
  if(ordinare){
    const spOrd=legenda(`<p>Il fabbisogno da ordinare al fornitore: i pezzi necessari per coprire tutte le richieste aperte, per articolo e per taglia. All'arrivo della merce i pezzi si registrano in Magazzino con <b>Carico</b>.</p>`);
    if(!mk.length)return h+spOrd+`<div class="list"><p class="empty">Nessun pezzo da ordinare: il magazzino copre tutte le richieste.</p></div>`;
    return h+spOrd+`
    <div class="table-wrap"><table><thead><tr><th>Articolo</th><th>Taglia</th><th class="num">Pezzi</th></tr></thead><tbody>`+
    mk.map(([k,n])=>{const [a,t,m]=k.split('|');return`<tr><td class="art">${esc(artLabel(a))}${m&&m!=='STANDARD'?' ('+esc(m.toLowerCase())+')':''}</td><td>${esc(t)}</td><td class="num">${n}</td></tr>`}).join('')+`</tbody></table></div>`;
  }
  h+=legenda(`<p>Per ogni richiesta aperta il programma propone un capo del magazzino, rispettando la taglia richiesta e senza ripetere un numero già presente nella squadra; quando possibile utilizza la maglia che un compagno di squadra deve sostituire. Le giacenze indicate in Magazzino tengono già conto di queste proposte.</p>
    <p><b>Consegna</b> registra la consegna del capo proposto. Se la taglia richiesta non è disponibile, <b>Altra taglia</b> consente di consegnarne una diversa, anche in via provvisoria. Le richieste si caricano da Excel (Impostazioni) oppure si inseriscono dalla scheda dell'atleta.</p>`,
    [['<span class="pill ok">pronta</span>','disponibile, pronta per la consegna'],
    ['<span class="pill bad">manca</span>','giacenza insufficiente: da ordinare'],
    ['<span class="pill">esclusa</span>','squadra o articolo fuori distribuzione']])+`
  <div class="filters">
    <input type="search" id="qAss" placeholder="Cerca atleta" value="${esc(S.ui.aQ)}" data-bind="aQ" autocomplete="off">
    <select data-bind="aTeam" aria-label="Squadra">${teamOptions(S.ui.aTeam,'Tutte le squadre')}</select>
    <select data-bind="aEsito" aria-label="Esito"><option value="">Tutti gli esiti</option>${[['OK','Pronte'],['MANCA','Mancano'],['ESCLUSA','Escluse']].map(([v,l])=>`<option value="${v}"${S.ui.aEsito===v?' selected':''}>${l}</option>`).join('')}</select>
    <select data-bind="aArt" aria-label="Articolo"><option value="">Tutti gli articoli</option>${arts.map(a=>`<option value="${esc(a)}"${S.ui.aArt===a?' selected':''}>${esc(artLabel(a))}</option>`).join('')}</select>
    <input type="text" id="f_nAss" class="filtroNum" maxlength="2" pattern="[0-9]*" placeholder="n. maglia" value="${esc(S.ui.nAss)}" data-bind="nAss" aria-label="Numero di maglia" inputmode="numeric">`;
  const nOk=ids.filter(rid=>D.prop[rid].esito==='OK').length;
  h+=`<span class="quante">${ids.length} ${ids.length===1?'richiesta':'richieste'}${nOk?`, ${nOk} da consegnare`:''}</span></div>`;
  if(!ids.length)return h+`<div class="list"><p class="empty">Nessuna richiesta con questi filtri.</p></div>`;
  let cur=null,buf='';const flush=()=>{if(buf)h+=`<div class="list">${buf}</div>`;buf=''};
  for(const rid of ids){const a=S.atlete[S.richieste[rid].atletaId];const t=a?a.squadra:'—';
    if(t!==cur){flush();cur=t;h+=`<div class="group-head"><h2>${esc(teamLabel(t))}</h2></div>`}
    buf+=reqRow(rid,true)}
  flush();return h;
}

/* ---- Magazzino ---- */
function vMagazzino(){
  const D=derive();
  // La barra e' identica nelle tre viste: linguette, opzione, pulsante. Cosi'
  // niente si sposta passando dall'una all'altra.
  const opzione=S.ui.magTab==='divise'
    ? `<input type="text" id="f_nDiv" class="filtroNum" maxlength="2" pattern="[0-9]*" placeholder="n. maglia" value="${esc(S.ui.nDiv)}" data-bind="nDiv" aria-label="Numero di maglia" inputmode="numeric">
       <label class="check"><input type="checkbox" data-act="toggleInUse" ${S.ui.showInUse?'checked':''}> Mostra anche le divise in uso</label>`
    : `<label class="check"><input type="checkbox" data-act="toggleOld" ${S.ui.showOld?'checked':''}> Mostra le stagioni precedenti</label>`;
  const azione=S.ui.magTab==='divise'
    ? '<button type="button" class="btn" data-act="newDivisa">Aggiungi divisa</button>'
    : '<button type="button" class="btn" data-act="newArticolo">Aggiungi articolo</button>';
  let h=`<h1>Magazzino</h1><div class="row-actions barraMag"><div class="seg" role="group" aria-label="Vista">
    <button type="button" data-act="magTab" data-v="divise" aria-pressed="${S.ui.magTab==='divise'}">Divise</button>
    <button type="button" data-act="magTab" data-v="materiale" aria-pressed="${S.ui.magTab!=='divise'}">Materiale</button></div>
    <span class="opzMag">${opzione}</span>${azione}</div>`;
  h+=S.ui.magTab==='divise'
    ?legenda(`<p>Le divise da gara, per lotto e per taglia: ogni riquadro rappresenta una maglia, con numero e taglia. Selezionando un riquadro si modificano taglia, numero, lotto e nota; una maglia in magazzino può inoltre essere segnata come dismessa. Normalmente sono visibili solo le maglie disponibili: l'opzione in alto mostra anche quelle in uso.</p>`,
      vociDivise(true))
    :legenda(`<p>Gli articoli con le rispettive taglie. <b>Totale</b> = consegnati + in magazzino. <b>Magazzino finale</b> = in magazzino − prenotati + ordinati, cioè la giacenza prevista dopo la consegna delle richieste e l'arrivo degli ordini.</p>
      <p>Selezionando una riga, o con <b>Carico</b>, si registrano i pezzi arrivati, si corregge la giacenza dopo un inventario e si indica la quantità ordinata al fornitore.</p>`,
      [['<span class="pill bad">−3</span>','mancano 3 pezzi per coprire le richieste'],
      ['<span class="num neg">-2</span>','giacenza negativa: da verificare con un inventario'],
      ['<span class="pill">fuori distribuzione</span>','resta in inventario ma non viene più proposto']]);
  if(S.ui.magTab!=='divise'){
    const neg=giacenzeNegative();
    return h+(neg.length?`<div class="notice bad">${neg.join('<br>')}</div>`:'')+vMateriale()}
  if(S.ui.magTab==='divise'){
    const probl=problemiDivise();
    if(probl.length)h+=`<div class="notice bad">${probl.join('<br>')}</div>`;
    const mods=[...new Set(Object.values(S.divise).map(d=>d.modello||'STANDARD'))].sort((a,b)=>(a==='STANDARD'?-1:b==='STANDARD'?1:a.localeCompare(b)));
    for(const m of mods){
      const nD=S.ui.nDiv===''||S.ui.nDiv==null?null:Number(S.ui.nDiv);
      const ents=Object.entries(S.divise).filter(([id,d])=>(d.modello||'STANDARD')===m&&!d.dismessa&&(nD===null||Number(d.numero)===nD));
      const sizes=[...new Set(ents.map(e=>e[1].taglia))].sort((a,b)=>szIdx(a)-szIdx(b));
      const free=ents.filter(([id,d])=>(!d.holder||d.daRestituire)&&!D.prenDivisa[id]).length;
      h+=`<div class="group-head"><h2>${m==='STANDARD'?'Divise gara':m==='LIBERO'?'Divise libero':'Prima squadra'}</h2><span>${free} disponibili dopo le assegnazioni</span></div><div class="list">`;
      for(const s of sizes){
        const inS=ents.filter(e=>e[1].taglia===s).sort((a,b)=>a[1].numero-b[1].numero);
        const avail=inS.filter(([id,d])=>!d.holder||d.daRestituire);
        const inuse=inS.length-avail.length;
        const after=avail.filter(([id])=>!D.prenDivisa[id]).length;
        const shown=S.ui.showInUse?inS:avail;
        h+=`<div class="size-row"><div class="sz">${esc(s)}<small>${after} dopo</small></div><div><div class="chips">${shown.map(([id,d])=>{
          const pren=D.prenDivisa[id];const inU=d.holder&&!d.daRestituire;
          return chip(inU?{...d}:d,pren?'prenotata':'',true,id).replace('class="jersey',inU?'style="opacity:.45" class="jersey':'class="jersey')}).join('')||'<span class="meta" style="color:var(--muted)">Nessuna libera</span>'}</div>
          <div class="meta" style="color:var(--muted);font-size:12px;margin-top:4px">${avail.length} nel magazzino o in rientro · ${inuse} in uso</div></div></div>`;
      }
      h+=`</div>`;
    }
    return h;
  }
  return h;
}

/* ---- Movimenti ---- */
function vMovimenti(){
  const q=norm(S.ui.mvQ);
  let ids=Object.entries(S.movimenti).filter(([id,m])=>(!S.ui.mvTipo||m.tipo===S.ui.mvTipo)&&(!q||norm((m.atletaId?fullName(S.atlete[m.atletaId]):(m.a||''))+' '+m.articolo).includes(q)))
    .sort((a,b)=>(b[1].ts||0)-(a[1].ts||0));
  const tot=ids.length;if(!S.ui.mvAll)ids=ids.slice(0,150);
  let h=`<h1>Movimenti</h1><div class="row-actions"><button type="button" class="btn yellow" data-act="newMov">Registra movimento</button></div>
  ${legenda(`<p>Il registro di tutte le entrate e le uscite di magazzino, dalla più recente: consegne, rientri, carichi e rettifiche. Le consegne registrate nelle altre schermate compaiono qui automaticamente.</p>
    <p><b>Registra movimento</b> permette di inserire un movimento manuale, verso un atleta oppure verso staff ed esterni indicandone il nome. <b>Annulla</b> ripristina la situazione precedente del magazzino.</p>`,
    [['<span class="pill blue">consegna</span>','uscita dal magazzino'],
     ['<span class="pill yellow">rientro</span>','rientro in magazzino'],
     ['<span class="pill ok">carico</span>','arrivo dal fornitore']])}
  <div class="filters"><input type="search" id="qMov" placeholder="Cerca atleta o articolo" value="${esc(S.ui.mvQ)}" data-bind="mvQ" autocomplete="off">
  <select data-bind="mvTipo" aria-label="Tipo"><option value="">Tutti i tipi</option>${['CONSEGNA','RIENTRO','CARICO','RETTIFICA'].map(t=>`<option value="${t}"${S.ui.mvTipo===t?' selected':''}>${cap(t)}</option>`).join('')}</select></div>`;
  if(!ids.length)return h+`<div class="list"><p class="empty">Nessun movimento registrato. Le consegne fatte da Assegnazioni compaiono qui.</p></div>`;
  h+=`<div class="list">`+ids.map(([id,m])=>{
    const cls=m.tipo==='CONSEGNA'?'blue':m.tipo==='RIENTRO'?'yellow':m.tipo==='CARICO'?'ok':'';
    const d=m.divisaId?S.divise[m.divisaId]:null;
    // Fuori squadra il nome e' scritto a mano: non c'e' nessuna scheda da aprire.
    const who=m.atletaId?`<a href="#atleta/${encodeURIComponent(m.atletaId)}">${esc(fullName(S.atlete[m.atletaId]))}</a>`
      :m.a?esc(m.a):'Magazzino';
    return`<div class="item">${d?chip({...d,daRestituire:false}):''}<div class="main"><div class="name">${who}</div>
    <div class="meta">${esc(artLabel(m.articolo))} · ${m.taglia==='UNICA'?'unica':esc(m.taglia)}${!m.divisaId?` · ${m.qta>0&&m.tipo==='RETTIFICA'?'+':''}${esc(m.qta)} pz`:''} · ${fmtDate(m.data)}${m.note?' · '+esc(m.note):''}</div></div>
    <div class="right"><span class="pill ${cls}">${cap(m.tipo)}</span><button type="button" class="btn small ghost" data-act="annulla" data-id="${esc(id)}">Annulla</button></div></div>`}).join('')+`</div>`;
  if(!S.ui.mvAll&&tot>150)h+=`<div class="row-actions"><button type="button" class="btn" data-act="mvAll">Mostra tutti i ${tot} movimenti</button></div>`;
  return h;
}

function dlgArticolo(i){
  const D=derive();const nuovo=i==null;const a=nuovo?{}:D.set.articoli[i];
  if(!nuovo&&!a)return;
  const famiglie=[...new Set((D.set.articoli||[]).map(x=>x.famiglia).filter(Boolean))].sort();
  const usato=nuovo?0:Object.values(S.materiale).filter(m=>m.articolo===a.nome).length
    +Object.values(S.richieste).filter(r=>r.articolo===a.nome).length;
  openDlg(`<h2>${nuovo?'Aggiungi articolo':esc(artLabel(a.nome))}</h2>
  ${nuovo?'':`<p class="sub">Nome interno <b>${esc(a.nome)}</b>. Non si cambia: è con questo che magazzino, richieste e movimenti restano legati fra loro.</p>`}
  <div class="two"><div class="field"><label for="acCodB">Codice</label><input type="text" id="acCodB" name="codice" maxlength="12" value="${esc(a.codice||'')}" placeholder="${esc(prossimoCodice(D.set.articoli))}"></div>
  <div class="field"><label>Sull'ordine si scrive</label><input type="text" value="${esc((a.codice||prossimoCodice(D.set.articoli))+((a.taglie||[]).length>1?'_'+(a.taglie[0]||'M'):''))}" disabled></div></div>
  ${nuovo?`<div class="field"><label for="acCod">Codice</label><input type="text" id="acCod" name="codice" required placeholder="TEE NERA ALLENAMENTO"></div>
  <p class="sub">Il codice identifica l'articolo per sempre. Se un domani il capo cambia disegno, si crea un codice nuovo nella stessa famiglia.</p>`:''}
  <div class="two"><div class="field"><label for="acFam">Famiglia</label><input type="text" id="acFam" name="famiglia" list="lFam" value="${esc(a.famiglia||'')}" placeholder="Tee"><datalist id="lFam">${famiglie.map(f=>`<option value="${esc(f)}">`).join('')}</datalist></div>
  <div class="field"><label for="acEt">Nome dentro la famiglia</label><input type="text" id="acEt" name="etichetta" value="${esc(a.etichetta||'')}" placeholder="Nera"></div></div>
  <label class="check" style="margin:2px 0 8px"><input type="checkbox" id="acQuest" name="questAnno" ${(a.stagione||'')===(D.set.stagione||'')&&(D.set.stagione||'')?'checked':''}> Articolo di questa stagione${D.set.stagione?` (${esc(D.set.stagione)})`:''}</label>
  <div class="two"><div class="field" id="fSt"><label for="acSt">Di quale stagione allora</label><input type="text" id="acSt" name="stagione" value="${esc(a.stagione||'')}" placeholder="per esempio 2024/25, oppure lascia vuoto"></div>
  <div class="field"><label for="acTg">Taglie, separate da virgola</label><input type="text" id="acTg" name="taglie" value="${esc((a.taglie||[]).join(', '))}" placeholder="XS, S, M, L, XL"></div></div>
  <label class="check" style="margin-bottom:6px"><input type="checkbox" name="num" ${a.conNumero?'checked':''} ${usato?'disabled':''}> Ha un numero stampato</label>
  ${usato?`<p class="sub">Questo non si cambia più: ci sono già ${usato} righe che lo usano.</p>`:''}
  <label class="check" style="margin-bottom:10px"><input type="checkbox" name="distr" ${a.distribuibile!==false?'checked':''}> Si può ancora consegnare</label>
  <p class="sub">Togliendo la spunta l'articolo resta in magazzino come inventario, ma non viene più proposto nelle assegnazioni. Serve per le stagioni vecchie che non si smaltiscono.</p>
  ${actions(nuovo?'Aggiungi':'Salva')}`,async fd=>{
    void 0;
    const arts=[...(D.set.articoli||[])];
    const taglie=fd.taglie.split(',').map(x=>x.trim().toUpperCase()).filter(Boolean);
    // La spunta vale piu' della casella: se dice "di questa stagione", la
    // stagione e' quella corrente e basta.
    const stag=fd.questAnno==='on'?(D.set.stagione||''):fd.stagione.trim();
    const cod=(fd.codice||'').trim().toUpperCase()||prossimoCodice(arts);
    const gia=arts.find((x,k)=>k!==i&&String(x.codice||'').toUpperCase()===cod);
    if(gia){toast(`Il codice ${cod} \u00e8 gi\u00e0 di ${artLabel(gia.nome)}`);return false}
    const campi={famiglia:fd.famiglia.trim().toUpperCase(),etichetta:fd.etichetta.trim(),
      stagione:stag,taglie,distribuibile:fd.distr==='on',codice:cod};
    if(nuovo){
      const cod=fd.codice.trim().toUpperCase();
      if(!cod)return false;
      if(arts.some(x=>x.nome===cod)){toast('Esiste già un articolo con questo codice');return false}
      arts.push({nome:cod,conNumero:fd.num==='on',...campi});
    }else{
      arts[i]={...a,...campi,...(usato?{}:{conNumero:fd.num==='on'})};
    }
    const ok=await w(()=>S.db.doc('settings/main').update({articoli:arts}));
    if(ok)toast(nuovo?'Articolo aggiunto':'Articolo salvato');return ok});
  const vediStag=()=>{$('#fSt').style.display=$('#acQuest').checked?'none':''};
  $('#acQuest').addEventListener('change',vediStag);vediStag();
}

/* Le due viste delgli atleti: l'elenco, e il riepilogo di cosa hanno in mano. */
/* La testata di Squadre, uguale nelle due linguette: cambiando linguetta
   filtri e pulsanti restano dove sono, e i filtri restano quelli. */
function testaSquadre(){
  const rie=S.ui.atlTab==='riepilogo';
  const spiega=rie
    ?legenda(`<p>La dotazione attuale di ogni atleta, per squadra: quanto consegnato al netto dei rientri. Ogni colonna corrisponde a un articolo; le divise sono indicate con numero e taglia.</p>
      <p>Le righe evidenziate in rosso indicano atleti con lo stesso numero di un compagno di squadra.</p>`,
      [[`<span class="numTag">8<small>M</small></span>`,'in uso'],
       [`<span class="numTag da">8<small>M</small></span>`,'da cambiare'],
       ['<span class="vuoto">—</span>','non consegnato']])
    :legenda(`<p>Ogni riga corrisponde a una squadra; con <b>+</b> si visualizzano i suoi atleti e con <b>Apri</b> si accede alla scheda dell'atleta, con la dotazione e le richieste. Sulla riga della squadra si modificano nome, lotto di divise e ordine di distribuzione, che stabilisce anche l'ordine in cui le squadre compaiono in tutte le schermate.</p>
      <p><b>Consegna a tutti</b> consegna o ritira un articolo per l'intera squadra; <b>Scarica lista</b> produce il foglio Excel per la distribuzione, con gli articoli da consegnare e quelli da ritirare. Le squadre e le righe evidenziate in rosso contengono un numero di maglia ripetuto.</p>`,
      vociDivise(false));
  return `<h1>Squadre</h1><div class="row-actions barraMag"><div class="seg" role="group" aria-label="Vista">
    <button type="button" data-act="atlTab" data-v="elenco" aria-pressed="${!rie}">Atleti</button>
    <button type="button" data-act="atlTab" data-v="riepilogo" aria-pressed="${rie}">Riepilogo</button></div>
    <span class="opzMag"></span>
    <button type="button" class="btn" data-act="newAtleta">Aggiungi atleta</button>
    <button type="button" class="btn" data-act="newSquadra">Aggiungi squadra</button></div>`+spiega+
  `<div class="filters">
    <input type="search" id="qAtl" placeholder="Cerca per nome o cognome" value="${esc(S.ui.q)}" data-bind="q" autocomplete="off">
    <select data-bind="team" aria-label="Squadra">${teamOptions(S.ui.team,'Tutte le squadre')}</select>
    <input type="text" id="f_nAtl" class="filtroNum" maxlength="2" pattern="[0-9]*" placeholder="n. maglia" value="${esc(S.ui.nAtl)}" data-bind="nAtl" aria-label="Numero di maglia" inputmode="numeric"></div>`;
}

/* Chi ha cosa, tutto in una tabella, squadra per squadra.
   Sono le consegne meno i rientri: quello che gli atleti hanno davvero in mano
   adesso, non quello che era stato previsto. */
/* I numeri che una squadra porta davvero, con chi li porta. Le divise segnate
   da cambiare non contano: quelle stanno tornando indietro e il loro numero e'
   gia' libero per un'altra. */
function numeriDiSquadra(D,squadra){
  const per={};
  for(const [id,a] of Object.entries(S.atlete)){
    if(a.squadra!==squadra)continue;
    for(const did of (D.perAtleta[id]||[])){
      const d=S.divise[did];if(!d||d.dismessa||d.daRestituire)continue;
      (per[Number(d.numero)]=per[Number(d.numero)]||[]).push(fullName(a))}}
  return per;
}

/* Gli atleti che portano un numero gia' addosso a un compagno di squadra.
   Torna id -> i numeri in conflitto, cosi' ogni schermata puo' segnare la riga
   invece di lasciare l'errore scritto in un posto solo. */
function conNumeroDoppio(D){
  const fuori={};
  for(const sq of D.perServire){
    const per=numeriDiSquadra(D,sq.nome);
    for(const [n,chi] of Object.entries(per)){
      if(chi.length<2)continue;
      for(const [id,a] of Object.entries(S.atlete)){
        if(a.squadra!==sq.nome)continue;
        if(!chi.includes(fullName(a)))continue;
        (fuori[id]=fuori[id]||[]).push(Number(n));
      }}}
  return fuori;
}

function vRiepilogo(){
  const D=derive();
  const q=norm(S.ui.q);
  const nQ=S.ui.nAtl===''||S.ui.nAtl==null?null:Number(S.ui.nAtl);
  // Gli stessi filtri dell'elenco, e sono gli stessi anche nella memoria: si
  // cambia linguetta e si continua a guardare la stessa squadra.
  const tiene=(id,a)=>(!S.ui.team||a.squadra===S.ui.team)
    &&(!q||norm(fullName(a)).includes(q))
    &&(nQ===null||(D.perAtleta[id]||[]).some(x=>Number(S.divise[x].numero)===nQ));

  let html=testaSquadre();

  // Quali articoli compaiono davvero: inutile una colonna per chi non ha consegnato niente.
  const colonne=new Set();
  for(const dot of Object.values(D.dotazione))
    for(const [k,v] of Object.entries(dot))if(v>0)colonne.add(k.split('|')[0]);
  const arts=[...colonne].sort((a,b)=>artLabel(a).localeCompare(artLabel(b)));

  const conDivise=Object.keys(D.perAtleta).length>0;
  if(!arts.length&&!conDivise)
    return html+`<div class="list"><p class="empty">Non è ancora stato consegnato niente. Appena registri le prime consegne, qui compare il quadro completo.</p></div>`;

  const perSquadra={};
  for(const [id,a] of Object.entries(S.atlete))if(tiene(id,a))(perSquadra[a.squadra]=perSquadra[a.squadra]||[]).push([id,a]);
  const squadre=D.perServire.map(x=>x.nome).filter(n=>perSquadra[n]);
  for(const n of Object.keys(perSquadra))if(!squadre.includes(n))squadre.push(n);

  if(!squadre.length)return html+`<div class="list"><p class="empty">Nessun atleta con questi filtri.</p></div>`;
  // Il conto dei doppioni si fa su tutte le squadre, non solo su quelle
  // filtrate: se ne nascondi una con un doppione dentro, il cartello in cima
  // direbbe che va tutto bene.
  const doppioni=[];
  for(const s of D.perServire)
    for(const [n,chi] of Object.entries(numeriDiSquadra(D,s.nome)))
      if(chi.length>1)doppioni.push({squadra:s.nome,numero:n,chi});
  html+=doppioni.length
    ? `<div class="notice bad"><b>${doppioni.length} ${doppioni.length===1?'numero ripetuto':'numeri ripetuti'}</b> dentro una squadra: `
      +doppioni.map(x=>`${esc(teamLabel(x.squadra))} n.${esc(x.numero)} (${x.chi.map(esc).join(' e ')})`).join(' \u00b7 ')+`</div>`
    : `<div class="notice ok">Nessun numero ripetuto: in ogni squadra ogni numero e\u2019 di una persona sola.</div>`;

  const doppi=conNumeroDoppio(D);
  const totali={};let totDivise=0;
  for(const sq of squadre){
    const righe=perSquadra[sq].sort((x,y)=>norm(fullName(x[1])).localeCompare(norm(fullName(y[1]))));
    const conRoba=righe.filter(([id])=>(D.perAtleta[id]||[]).length||Object.values(D.dotazione[id]||{}).some(v=>v>0));
    if(!conRoba.length)continue;
    const numeri=numeriDiSquadra(D,sq);
    const inFila=Object.keys(numeri).map(Number).sort((x,y)=>x-y);
    html+=`<div class="group-head"><h2>${esc(teamLabel(sq))}</h2><span>${conRoba.length} ${conRoba.length===1?'atleta':'atleti'} con materiale</span></div>
    ${inFila.length?`<p class="filaNumeri">Numeri in campo: ${inFila.map(n=>`<span class="numTag${numeri[n].length>1?' doppio':''}" title="${esc(numeri[n].join(', '))}">${n}</span>`).join('')}</p>`:''}
    <div class="tabellaFuori"><table class="tab riepilogo" style="--colonne:${arts.length}"><thead><tr><th class="colAtleta">Atleta</th>${conDivise?'<th class="colDivise">Divise</th>':''}${arts.map(a=>`<th class="num">${esc(artLabel(a))}</th>`).join('')}</tr></thead><tbody>`;
    for(const [id,a] of conRoba){
      const divise=(D.perAtleta[id]||[]).map(x=>S.divise[x]).filter(Boolean);
      totDivise+=divise.length;
      html+=`<tr${doppi[id]?' class="conflitto"':''}><th scope="row"><a href="#atleta/${encodeURIComponent(id)}">${esc(fullName(a))}</a>${doppi[id]?` <span class="pill bad">${doppi[id].length===1?`n.${doppi[id][0]} doppio`:`numeri doppi: ${doppi[id].join(', ')}`}</span>`:''}</th>`;
      if(conDivise)html+=`<td>${divise.map(d=>`<span class="numTag${d.daRestituire?' da':''}" title="${d.daRestituire?'da cambiare':'in uso'}">${esc(d.numero)}<small>${esc(d.taglia)}</small></span>`).join(' ')||'<span class="vuoto">—</span>'}</td>`;
      for(const art of arts){
        const voci=Object.entries(D.dotazione[id]||{}).filter(([k,v])=>v>0&&k.split('|')[0]===art);
        const n=voci.reduce((t,[,v])=>t+v,0);
        if(n)totali[art]=(totali[art]||0)+n;
        html+=`<td class="num">${n?esc(voci.map(([k,v])=>{const tg=k.split('|')[1];return (v>1?v+'× ':'')+(tg&&tg!=='UNICA'?tg:'sì')}).join(', ')):'<span class="vuoto">—</span>'}</td>`;
      }
      html+=`</tr>`;
    }
    html+=`</tbody></table></div>`;
  }

  html+=`<div class="group-head"><h2>In tutto</h2><span>somma di tutte le squadre</span></div><div class="list">`;
  if(conDivise)html+=`<div class="item"><div class="main"><div class="name">Divise in mano agli atleti</div></div><div class="right"><b>${totDivise}</b></div></div>`;
  for(const a of arts)html+=`<div class="item"><div class="main"><div class="name">${esc(artLabel(a))}</div></div><div class="right"><b>${totali[a]||0}</b></div></div>`;
  return html+`</div>`;
}

/* Il magazzino del materiale: cosa esiste e quanti ce ne sono, nello stesso
   posto. Erano due schermate, ma sono lo stesso oggetto: una diceva le taglie,
   l'altra quante ne restavano, e per cambiare una taglia bisognava cambiare
   schermata. */
function vMateriale(){
  const D=derive();const arts=D.set.articoli||[];
  // Taglie che compaiono davvero: quelle dichiarate sull'articolo piu' quelle
  // che si trovano in magazzino e che magari nessuno ha mai dichiarato.
  const taglieDi={};
  for(const a of arts)taglieDi[a.nome]=new Set(a.taglie||[]);
  // Le taglie delle stagioni passate si nascondono davvero. Il secondo giro
  // pesca dalle giacenze, che non sanno di che stagione sono: senza questo
  // elenco le rimetteva dentro tutte, e la spunta non serviva a niente.
  const passate=new Set();
  for(const m of Object.values(S.materiale)){
    if(m.precedente&&!S.ui.showOld){passate.add(D.key(m.articolo,m.taglia));continue}
    (taglieDi[m.articolo]=taglieDi[m.articolo]||new Set()).add(m.taglia)}
  for(const k of Object.keys(D.stock)){
    if(passate.has(k))continue;
    const [a,t]=k.split('|');
    (taglieDi[a]=taglieDi[a]||new Set()).add(t)}
  for(const n of Object.keys(taglieDi))if(!taglieDi[n].size)delete taglieDi[n];

  // Articoli che non stanno in anagrafica ma hanno pezzi in magazzino: capita
  // coi lasciti delle stagioni passate, e non vanno persi.
  const noti=new Set(arts.map(a=>a.nome));
  const orfani=Object.keys(taglieDi).filter(n=>!noti.has(n));

  const perFam={};
  arts.forEach((a,i)=>{const f=a.famiglia||'';(perFam[f]=perFam[f]||[]).push([a,i])});
  if(orfani.length)perFam['']=(perFam['']||[]).concat(orfani.map(n=>[{nome:n},-1]));
  const fam=Object.keys(perFam).sort((x,y)=>x===''?1:y===''?-1:x.localeCompare(y));

  let h='';
  for(const f of fam){
    h+=`<div class="group-head"><h2>${f?esc(cap(f)):'Senza famiglia'}</h2><span>${perFam[f].length} ${perFam[f].length===1?'articolo':'articoli'}</span></div>`;
    for(const [a,i] of perFam[f]){
      const ts=[...(taglieDi[a.nome]||[])].sort((x,y)=>szIdx(x)-szIdx(y)||x.localeCompare(y));
      const conNum=D.conNumero(a.nome);
      const conti=t=>{const k=D.key(a.nome,t);const q=D.stock[k]||{ora:0,consegne:0,rientri:0,ordinati:0};
        const st=q.ora;const fuori=Math.max(0,(q.consegne||0)-(q.rientri||0));const p=D.prenMat[k]||0;
        const ord=q.ordinati||0;const tot=st+fuori;
        const mancano=Object.entries(D.prop).filter(([rid,pp])=>pp.esito==='MANCA'&&S.richieste[rid].articolo===a.nome&&S.richieste[rid].taglia===t).length;
        return {st,fuori,p,ord,tot,dopo:st-p+ord,mancano}};
      const cella=c=>`<b class="${c.dopo<=0&&c.mancano?'neg':''}">${c.dopo}${c.mancano?` <span class="pill bad">−${c.mancano}</span>`:''}</b>`;
      // Taglia unica: i tre numeri stanno accanto al nome. Una tabella di due
      // righe per un numero solo era mezzo schermo buttato via.
      const stessoNome=norm(a.nome).replace(/\s+/g,'')===norm(artSolo(a.nome)).replace(/\s+/g,'');
      const sotto=[a.codice?`<b>${esc(a.codice)}</b>`:'',stessoNome?'':esc(a.nome),a.stagione?esc(a.stagione):''].filter(Boolean).join(' · ');
      let unica='';
      if(!conNum&&ts.length===1){
        const c=conti(ts[0]);
        unica=`<span class="artUnica" data-act="matRow" data-art="${esc(a.nome)}" data-tg="${esc(ts[0])}" tabindex="0" role="button" title="Registra un carico o correggi la giacenza">
        <span><small>Totale</small><b>${c.tot||'—'}</b></span>
        <span><small>Consegnati</small><b>${c.fuori||'—'}</b></span>
        <span><small>In magazzino</small><b>${c.st}</b></span>
        <span><small>Prenotati</small><b>${c.p||'—'}</b></span>
        <span><small>Ordinati</small><b>${c.ord||'—'}</b></span>
        <span><small>Magazzino finale</small>${cella(c)}</span>
        <span class="btn small ghost" aria-hidden="true">Carico</span></span>`;
      }
      h+=`<div class="artBox">
      <div class="artTesta">
        <div class="main"><div class="name">${esc(artSolo(a.nome))}${a.distribuibile===false?' <span class="pill">fuori distribuzione</span>':''}</div>
        ${sotto?`<div class="meta">${sotto}</div>`:''}</div>
        ${i>=0?`<button type="button" class="btn small modArt" data-act="modArticolo" data-i="${i}">Modifica articolo</button>`:'<span class="meta modArt">non in anagrafica</span>'}
        <div class="right">${unica}</div>
      </div>`;
      if(conNum){
        const quante=Object.values(S.divise).filter(d=>!d.dismessa).length;
        h+=`<p class="sub artNota">Ha il numero stampato: i capi si contano uno per uno in <a href="#magazzino" data-act="magTab" data-v="divise">Divise</a> (${quante} capi).</p>`;
      }else if(!ts.length){
        h+=`<p class="sub artNota">Nessuna taglia. Aprilo con «Modifica articolo» per aggiungerle.</p>`;
      }else if(!unica){
        h+=`<div class="table-wrap"><table><thead><tr><th>Taglia</th><th class="num">Totale</th><th class="num">Consegnati</th><th class="num">In magazzino</th><th class="num">Prenotati</th><th class="num">Ordinati</th><th class="num">Magazzino finale</th><th></th></tr></thead><tbody>`;
        for(const t of ts){
          const c=conti(t);
          h+=`<tr class="click" data-act="matRow" data-art="${esc(a.nome)}" data-tg="${esc(t)}" tabindex="0" title="Registra un carico o correggi la giacenza">
          <td>${t==='UNICA'?'unica':esc(t)}${a.codice?`<small class="codTg">${esc(artCodiceTaglia(a.nome,t))}</small>`:''}</td><td class="num meta">${c.tot||''}</td><td class="num meta">${c.fuori||''}</td>
          <td class="num${c.st<0?' neg':''}">${c.st}</td><td class="num">${c.p||''}</td><td class="num meta">${c.ord||''}</td>
          <td class="num">${cella(c)}</td>
          <td class="num"><span class="btn small ghost" aria-hidden="true">Carico</span></td></tr>`;
        }
        h+=`</tbody></table></div>`;
      }
      h+=`</div>`;
    }
  }
  if(!fam.length)return `<div class="list"><p class="empty">Non c'è ancora nessun articolo. Aggiungine uno, oppure caricali da un foglio Excel (Impostazioni &rarr; Riempire da Excel).</p></div>`;
  return h;
}

/* La pagina di partenza. Sei riquadri, uno per sezione, ognuno con il numero
   che conta davvero in quella sezione: cosi' aprendo il programma si vede
   subito se c'e' qualcosa da fare, senza entrare da nessuna parte. */
/* La pagina di partenza: lo stemma della societa' se c'e', i numeri che
   contano, e una porta sola per consegnare. I riquadri portano ognuno alla
   sua schermata. */
function vHome(){
  const D=derive();
  const esiti={OK:0,MANCA:0,ESCLUSA:0};Object.values(D.prop).forEach(p=>esiti[p.esito]++);
  const nAtleti=Object.keys(S.atlete).length;
  const nSquadre=(D.set.squadre||[]).length;
  const divise=Object.values(S.divise).filter(d=>!d.dismessa);
  const libere=divise.filter(d=>!d.holder||d.daRestituire).length;
  const pezzi=Object.values(D.stock).reduce((t,x)=>t+Math.max(0,x.ora),0);
  const oggi=Object.values(S.movimenti).filter(m=>m.data===today()).length;
  // La copertina parla solo se c'e' qualcosa da sistemare. Un numero portato
  // da due persone della stessa squadra e' l'unico errore che si paga in
  // palestra: e' l'unico che vale la pena gridare da qui.
  const doppioni=[];
  for(const sq of D.perServire)
    for(const [n,chi] of Object.entries(numeriDiSquadra(D,sq.nome)))
      if(chi.length>1)doppioni.push({squadra:sq.nome,numero:n});
  const v=window.__APP?window.__APP.versione():null;
  const soc=(D.set.societa||'').trim();
  const logo=D.set.logo;

  const riquadro=(href,titolo,grosso,sotto,allarme)=>`<a class="cartaHome${allarme?' allarme':''}" href="${href}">
    <div class="grosso">${grosso}</div><div class="titolo">${esc(titolo)}</div><div class="sotto">${sotto}</div></a>`;

  return `<div class="copertina">
    <span class="copertinaStemma">${logo?`<img src="${esc(logo)}" alt="">`:MARCHIO}</span>
    ${soc?`<h1>${esc(soc)}</h1><p class="copertinaSub">Magazzino${D.set.stagione?` · ${esc(D.set.stagione)}`:''}</p>`
      :`<h1>Magazzino</h1><p class="copertinaSub">${esc(D.set.stagione||'')}</p>`}
  </div>
  <div class="grigliaHome">
    ${riquadro('#squadre','Squadre',nSquadre,'lotti, ordine di distribuzione, liste')}
    ${riquadro('#squadre','Atleti',nAtleti,'schede, con quello che hanno in mano')}
    ${riquadro('#assegnazioni','Assegnazioni',esiti.OK,`pronte da consegnare${esiti.MANCA?` \u00b7 <b>${esiti.MANCA} da ordinare</b>`:''}`,esiti.MANCA>0)}
    ${riquadro('#magazzino','Magazzino',libere,`divise libere \u00b7 ${pezzi} pezzi di materiale`)}
    ${riquadro('#movimenti','Movimenti',oggi,oggi===1?'registrato oggi':'registrati oggi')}
    ${riquadro('#manuale','Manuale','?','come funziona il programma')}
  </div>
  <p class="sottoGriglia"><a class="btn" href="#impostazioni">Impostazioni</a></p>
  ${doppioni.length?`<p class="allarmeHome"><a href="#squadre">${doppioni.length===1
    ?'Un numero è portato da due atleti della stessa squadra'
    :`${doppioni.length} numeri sono portati da due atleti della stessa squadra`}: ${doppioni.slice(0,4).map(x=>`${esc(teamLabel(x.squadra))} n.${esc(x.numero)}`).join(', ')}${doppioni.length>4?(doppioni.length===5?' e un altro':` e altri ${doppioni.length-4}`):''}</a></p>`:''}
  <p class="versione">${v?`Versione ${esc(v)}`:'Versione di prova nel browser'}</p>`;
}

/* ---- Squadre ---- */
/* ============ il manuale ============
   Spiega il programma dentro il programma, cosi' non finisce in un foglio che
   nessuno ritrova. Qualche numero lo legge dall'archivio vero (quante squadre,
   quali articoli, che stagione): quelle righe non possono invecchiare.

   REGOLA: quando cambia un comportamento, si cambia anche qui. Sta scritto
   anche nel CLAUDE.md del progetto. */
function vManuale(){
  const D=derive();
  const v=window.__APP?window.__APP.versione():null;
  const nSq=(D.set.squadre||[]).length;
  const nAtl=Object.keys(S.atlete).length;
  const arts=(D.set.articoli||[]).filter(a=>a.distribuibile!==false);
  const fam={};for(const a of arts)(fam[a.famiglia||'senza famiglia']=fam[a.famiglia||'senza famiglia']||[]).push(artSolo(a.nome));
  const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();

  const sezione=(titolo,corpo)=>`<details class="man"><summary>${esc(titolo)}</summary><div class="manCorpo">${corpo}</div></details>`;

  return `<h1>Manuale</h1>
  <p class="sub">Guida all'uso del programma.${v?` Versione ${esc(v)}.`:''} Ogni sezione si apre selezionandone il titolo.</p>

  ${sezione('Panoramica',`
    <p>Il programma registra <b>la dotazione di ogni atleta</b> e la situazione del magazzino. Il magazzino comprende le <b>divise da gara</b>, gestite capo per capo perché ciascuna ha un numero, e il <b>materiale</b> (t-shirt, felpe, borracce e simili), gestito a quantità per taglia.</p>
    <p>Le <b>richieste</b> collegano le due parti: ogni richiesta indica un articolo che un atleta deve ricevere. Per ciascuna il programma propone il capo da consegnare in base alla disponibilità; alla consegna la richiesta si chiude e la giacenza si aggiorna.</p>
    <p>Attualmente l'archivio contiene <b>${nSq} squadre</b>, <b>${nAtl} atleti</b> e <b>${arts.length} articoli</b> in distribuzione.</p>`)}

  ${sezione('Termini utilizzati',`
    <p><b>Codice</b> — la sigla breve dell'articolo, ad esempio A002. Con la taglia diventa A002_M ed è la forma da utilizzare negli ordini e nei fogli Excel. Per le taglie espresse in anni la parola «anni» è omessa: A008_5-6.</p>
    <p><b>Nome interno</b> — il nome in maiuscolo, ad esempio TEE NERA ALLENAMENTO. Collega magazzino, richieste e movimenti e non può essere modificato: se il capo cambia modello si crea un nuovo articolo.</p>
    <p><b>Famiglia</b> ed <b>etichetta</b> — determinano come l'articolo viene visualizzato: la famiglia raggruppa (Tee), l'etichetta distingue all'interno della famiglia (Nera allenamento). Possono essere modificate in qualsiasi momento.</p>
    <p><b>Stagione dell'articolo</b> — nella finestra <i>Modifica articolo</i> la casella «Articolo di questa stagione» indica se l'articolo appartiene alla stagione in corso. Solo questi articoli compaiono nel modulo di distribuzione; quelli delle stagioni precedenti restano in inventario.</p>
    <p><b>Lotto</b> — l'insieme di divise da cui attinge una squadra. La maggior parte delle squadre utilizza il lotto standard; una squadra può averne uno riservato. Le <b>maglie da libero</b> costituiscono un lotto comune a tutte le squadre.</p>
    <p><b>Ordine di distribuzione</b> — il numero indicato sulla riga della squadra. Stabilisce quale squadra viene servita per prima quando il materiale non è sufficiente, e l'ordine in cui le squadre compaiono in tutte le schermate.</p>
    <p><b>Da cambiare</b> — un capo in uso che l'atleta deve sostituire. Il suo numero è considerato subito libero; alla consegna del capo nuovo quello precedente rientra automaticamente.</p>
    <p><b>Prenotata</b> — una divisa già proposta per una richiesta aperta: non è ancora consegnata, ma non è disponibile per altre richieste.</p>
    <p><b>Provvisoria</b> — una consegna in taglia diversa da quella richiesta, in attesa della taglia corretta: la richiesta resta aperta.</p>
    <p><b>In uscita</b> — un atleta che lascia la società e non ha ancora restituito tutto il materiale. Non riceve ulteriori consegne e viene cancellato solo a restituzione completata.</p>`)}

  ${sezione('La pagina iniziale',`
    <p>Riporta lo stemma e il nome della società, la stagione e sei riquadri di accesso: <b>Squadre</b>, <b>Atleti</b>, <b>Assegnazioni</b>, <b>Magazzino</b>, <b>Movimenti</b> e <b>Manuale</b>. Sotto i riquadri si trova il pulsante <b>Impostazioni</b>; in fondo, la versione del programma.</p>
    <p>Se in una squadra due atleti hanno lo stesso numero di maglia, sotto il pulsante Impostazioni compare un avviso in rosso che indica squadra, numero e atleti coinvolti.</p>`)}

  ${sezione('Le schermate',`
    <p>In ogni schermata, la voce <b>Come funziona questa schermata</b> ne riassume l'uso e il significato dei colori.</p>
    <p><b>Squadre</b> — due schede. <i>Atleti</i>: una riga per squadra, con lotto, ordine di distribuzione e i pulsanti <b>Consegna a tutti</b>, <b>Scarica lista</b> ed <b>Elimina</b>; con <b>+</b> si visualizzano gli atleti, modificabili direttamente sulla riga. <i>Riepilogo</i>: la dotazione attuale di ogni atleta e i numeri in uso in ciascuna squadra. Le due schede condividono gli stessi filtri: nome, squadra e numero di maglia.</p>
    <p><b>Assegnazioni</b> — due schede. <i>Richieste</i>: le richieste aperte con il capo proposto dal programma. <i>Da ordinare</i>: i pezzi da ordinare al fornitore, per articolo e taglia.</p>
    <p><b>Magazzino</b> — due schede. <i>Divise</i>: le maglie una per una (verde in magazzino, gialla in uso, tratteggiata da cambiare, azzurra prenotata, bianca da libero, nera se di un lotto riservato). <i>Materiale</i>: per ogni articolo e taglia sei valori: <i>totale</i> (in magazzino + consegnati), <i>consegnati</i>, <i>in magazzino</i>, <i>prenotati</i>, <i>ordinati</i> al fornitore e non ancora arrivati, <i>magazzino finale</i> (in magazzino − prenotati + ordinati). La quantità ordinata si indica nella finestra del carico e diminuisce automaticamente all'arrivo della merce. Eventuali incongruenze (una divisa conteggiata due volte, una giacenza negativa) sono segnalate in cima alla scheda.</p>
    <p><b>Movimenti</b> — il registro di consegne, rientri, carichi e rettifiche. Un movimento può essere annullato se non ne sono seguiti altri sullo stesso capo o articolo; in caso contrario occorre annullare prima quelli successivi.</p>
    <p><b>Impostazioni</b> — stagione in corso, nome e stemma della società, caricamento da Excel, esportazione in CSV, codici degli articoli, aspetto (chiaro, scuro o come il computer), aggiornamenti e copie di sicurezza.</p>`)}

  ${sezione('La regola dei numeri',`
    <p>All'interno di una squadra <b>un numero di maglia non può ripetersi</b>. Tra squadre diverse lo stesso numero è invece ammesso.</p>
    <p>Il programma applica la regola quando propone i capi, nelle consegne manuali e nella modifica del numero di una divisa: se il numero è già in uso nella squadra, l'operazione viene bloccata con un avviso. Nel proporre le divise dà la precedenza al numero richiesto o già in uso; in alternativa, alla maglia che un compagno di squadra deve sostituire.</p>
    <p>Un eventuale numero ripetuto è segnalato nella pagina iniziale, sulla riga della squadra (anche se chiusa), sulle righe degli atleti interessati, nel Riepilogo e nelle Assegnazioni.</p>`)}

  ${sezione('Consegne e rientri',`
    <p>Le consegne si registrano in quattro modi:</p>
    <p>1. <b>Da richiesta</b> — in Assegnazioni, il pulsante <b>Consegna</b> sulla richiesta registra la consegna del capo proposto.</p>
    <p>2. <b>Consegna diretta</b> — dalla scheda dell'atleta, senza una richiesta; per le divise si sceglie la maglia esatta tra quelle disponibili.</p>
    <p>3. <b>Consegna a tutti</b> — dalla riga della squadra, per il solo materiale: una taglia per tutti, con la possibilità di escludere chi possiede già l'articolo in qualsiasi taglia. La stessa finestra consente il ritiro dall'intera squadra.</p>
    <p>4. <b>Registra movimento</b> — in Movimenti, per consegne o rientri fuori dalle richieste: a un atleta, oppure a staff ed esterni indicandone nome e ruolo.</p>
    <p>Se la taglia richiesta non è disponibile, sulla richiesta compare <b>Altra taglia</b>: elenca le taglie presenti a partire dalle più vicine e i soli numeri liberi nella squadra. La consegna può essere segnata come provvisoria: la richiesta resta aperta e torna pronta quando la taglia corretta è disponibile.</p>
    <p>I rientri si registrano dalla scheda dell'atleta con <b>Restituita</b> o <b>Restituito</b>. Con <b>Segna da cambiare</b> una divisa viene indicata come da sostituire.</p>`)}

  ${sezione('Uscita di un atleta',`
    <p>Dalla scheda dell'atleta, <b>Modifica atleta</b> → <b>Elimina</b>. Se l'atleta non ha materiale, viene cancellato subito.</p>
    <p>Se ha ancora materiale, si apre l'elenco dei capi in suo possesso: si selezionano quelli restituiti, che rientrano in magazzino. Finché manca qualcosa l'atleta resta nell'archivio contrassegnato <b>in uscita</b> e non riceve ulteriori consegne; la cancellazione avviene alla restituzione dell'ultimo capo. Il suo nome rimane comunque nel registro dei movimenti.</p>`)}

  ${sezione('Caricamento da Excel',`
    <p>In <b>Impostazioni → Riempire da Excel</b>.</p>
    <p>Il <b>modulo di distribuzione</b> è destinato ai dirigenti: contiene un foglio per squadra con gli atleti già inseriti e i soli articoli della stagione in corso. Per ogni articolo sono previste tre colonne: la risposta (<i>ce l'ho</i>, <i>mi manca</i>, <i>da cambiare</i>; la casella vuota equivale a <i>ce l'ho</i>), la <i>taglia</i> attuale e la <i>taglia richiesta</i>, da compilare solo se diversa. La colonna <i>Numero maglia</i> riporta il numero attuale; la colonna <i>Note</i> è libera. Al caricamento vengono creati squadre, atleti e richieste.</p>
    <p>Gli altri quattro fogli servono al caricamento iniziale e vanno caricati in quest'ordine: <b>Articoli e magazzino</b>, <b>Squadre e atleti</b>, <b>Divise da gara</b>, <b>Richieste</b>. Vengono scaricati già compilati con i dati presenti nel programma e possono quindi servire anche come verifica.</p>
    <p>Il caricamento ripetuto dello stesso file non crea duplicati: i dati già presenti vengono ignorati. Le righe che non è stato possibile caricare sono elencate in Impostazioni.</p>`)}

  ${sezione('Lista di squadra',`
    <p>In <b>Squadre</b>, sulla riga di ogni squadra, il pulsante <b>Scarica lista</b> produce un file Excel con gli articoli da ritirare e da consegnare a ciascun atleta, lo stato di ogni capo e una colonna per la firma. Le consegne effettuate vanno poi registrate nel programma. La funzione è disponibile nel programma installato.</p>`)}

  ${sezione('Dati, copie di sicurezza e aggiornamenti',`
    <p>I dati sono conservati <b>su questo computer</b>, in un file locale: non vengono trasmessi in rete e non richiedono un account.</p>
    <p>In ogni giornata di utilizzo il programma salva automaticamente una copia dei dati e conserva le ultime 30. In <b>Impostazioni → Copie di sicurezza</b> è possibile salvare una copia in una posizione a scelta, scegliere la cartella delle copie automatiche e ripristinare i dati da una copia.</p>
    <p>Pochi secondi dopo l'avvio il programma verifica la disponibilità di una nuova versione e, se presente, lo segnala. L'installazione si avvia da <b>Impostazioni → Aggiornamenti</b>, con l'indicazione dell'avanzamento; i dati non vengono modificati.</p>
    <p>L'aspetto segue il tema del computer, chiaro o scuro; in <b>Impostazioni → Come si vede</b> è possibile sceglierlo manualmente.</p>`)}

  ${sezione('Articoli in distribuzione',
    Object.keys(fam).sort().map(f=>`<p><b>${esc(cap1(f))}</b> — ${esc(fam[f].join(', '))}</p>`).join('')
    +`<p class="sub">L'elenco è letto dall'archivio e si aggiorna automaticamente quando si aggiungono o si tolgono articoli.</p>`)}

/* Il foglio della squadra, quello che si porta in palestra: chi deve
   riconsegnare qualcosa e chi deve ricevere qualcosa, una riga per capo, con
   lo spazio per la firma. Su carta serve sapere tre cose - chi, cosa, e se
   c'e' - e niente altro. */
async function fogliaSquadra(nome){
  if(!window.__APP){toast('Il foglio si scarica dal programma installato');return}
  const D=derive();
  const atleti=Object.entries(S.atlete).filter(([id,a])=>a.squadra===nome)
    .sort((x,y)=>norm(fullName(x[1])).localeCompare(norm(fullName(y[1]))));
  if(!atleti.length){toast('In questa squadra non c’è nessuno');return}

  const righe=[];
  for(const [id,a] of atleti){
    // prima quello che deve tornare indietro: in palestra si ritira e si consegna
    for(const did of (D.perAtleta[id]||[])){
      const d=S.divise[did];if(!d.daRestituire)continue;
      righe.push([a.cognome,a.nome,'RICONSEGNA','Divisa gara',d.taglia,String(d.numero),'da ritirare',d.note||'','']);
    }
    for(const rid of D.order){
      const r=S.richieste[rid];if(!r||r.atletaId!==id)continue;
      const p=D.prop[rid]||{};const d=p.divisaId?S.divise[p.divisaId]:null;
      const stato=p.esito==='OK'?'pronta':p.esito==='MANCA'?'DA ORDINARE':'esclusa';
      righe.push([a.cognome,a.nome,'RICEVE',artLabel(r.articolo),
        d?d.taglia:r.taglia,String(d?d.numero:(r.numeroDesiderato??'')),stato,
        [r.note,d&&d.holder&&d.holder!==id?'in rientro da '+fullName(S.atlete[d.holder]):''].filter(Boolean).join(' · '),'']);
    }
  }
  if(!righe.length){toast('Per questa squadra non c’è niente da consegnare né da ritirare');return}

  const quanti=n=>righe.filter(r=>r[2]===n).length;
  const nomeFile=`${teamLabel(nome).toLowerCase().replace(/[^a-z0-9]+/g,'-')}-${today()}.xlsx`;
  // Tutto testo: la parte Rust vuole stringhe, e un numero le fa rifiutare la
  // chiamata in silenzio.
  const testo=righe.map(r=>r.map(c=>c==null?'':String(c)));
  let dove;
  try{dove=await window.__APP.scegliDoveSalvare(nomeFile)}
  catch(e){toast('Non riesco ad aprire la finestra per salvare: '+e);return}
  if(!dove)return;
  try{
  await window.__APP.scriviExcel(dove,teamLabel(nome),
    ['Cognome','Nome','Cosa','Articolo','Taglia','Numero','Stato','Nota','Firma'],testo,
    [`${teamLabel(nome)} · ${D.set.stagione||''}`,
     `${quanti('RICONSEGNA')} capi da ritirare, ${quanti('RICEVE')} da consegnare.`,
     '',
     'RICONSEGNA  il capo che l’atleta deve riportare indietro.',
     'RICEVE      quello che gli tocca. Nello stato: "pronta" c’è in magazzino,',
     '            "DA ORDINARE" no.',
     'Firma       da far firmare in palestra al momento della consegna.',
     '',
     'Lista stampata il '+fmtDate(today())+'. Le consegne vanno poi segnate nel programma.']);
  }catch(e){toast('Non riesco a scrivere il file: '+e);return}
  toast('Lista salvata');
}
/* Una cosa a tutta la squadra, o via da tutta la squadra. Vale solo per il
   materiale: una divisa da gara e' un capo con un numero e un proprietario, e
   quella si assegna una per una.

   Le taglie sono il punto delicato: per una borraccia va bene una taglia sola
   per tutti, per una felpa no. Quando l'articolo ha piu' taglie il programma
   lo dice chiaro invece di far finta di niente. */
function dlgTuttaSquadra(nome){
  const D=derive();
  const squadra=Object.entries(S.atlete).filter(([id,a])=>a.squadra===nome)
    .sort((x,y)=>norm(fullName(x[1])).localeCompare(norm(fullName(y[1]))));
  if(!squadra.length){toast('In questa squadra non c’è nessuno');return}
  const arts=(D.set.articoli||[]).filter(a=>!D.conNumero(a.nome)).sort(perNome);
  if(!arts.length){toast('Non c’è nessun articolo da consegnare');return}

  const taglieDi=n=>{const x=arts.find(z=>z.nome===n);const t=new Set(x?x.taglie:[]);
    for(const k of Object.keys(D.stock))if(k.startsWith(n+'|'))t.add(k.split('|')[1]);
    return [...t].sort((p,q)=>szIdx(p)-szIdx(q))};
  const vociTaglia=n=>{const t=taglieDi(n);
    if(!t.length)return '<option value="">nessuna taglia</option>';
    return t.map(x=>{const st=(D.stock[D.key(n,x)]||{ora:0}).ora;
      return `<option value="${esc(x)}">${x==='UNICA'?'taglia unica':esc(x)} — ${st} in magazzino</option>`}).join('')};
  const ceLHa=(id,art)=>Object.entries(D.dotazione[id]||{}).some(([k,v])=>v>0&&k.split('|')[0]===art);
  const quantiHanno=art=>squadra.filter(([id])=>ceLHa(id,art)).length;

  const first=arts[0].nome;
  openDlg(`<h2>Tutta la ${esc(teamLabel(nome))}</h2>
  <p class="sub">${squadra.length} ${squadra.length===1?'atleta':'atleti'}. Una riga di movimento per ognuno, come se li avessi segnati uno per uno.</p>
  <div class="field"><label for="tAz">Cosa succede</label><select id="tAz" name="azione">
    <option value="CONSEGNA">Consegna a tutti</option>
    <option value="RIENTRO">Ritira da tutti</option></select></div>
  <div class="field"><label for="tArt">Articolo</label><select id="tArt" name="articolo">${arts.map(x=>`<option value="${esc(x.nome)}">${esc(artLabel(x.nome))}</option>`).join('')}</select></div>
  <div class="two"><div class="field"><label for="tTg">Taglia</label><select id="tTg" name="taglia">${vociTaglia(first)}</select></div>
  <div class="field"><label for="tQta">Quanti pezzi a testa</label><input type="number" id="tQta" name="qta" min="1" max="20" value="1" inputmode="numeric"></div></div>
  <label class="check"><input type="checkbox" id="tSalta" name="salta" checked> Salta chi ce l’ha già, in qualunque taglia</label>
  <div id="tAvviso"></div>
  ${actions('Registra')}`, async fd=>{
    const art=fd.articolo;const tg=fd.taglia;const qta=Math.max(1,Number(fd.qta)||1);
    if(!tg){toast('Scegli la taglia');return false}
    const k=D.key(art,tg);
    const salta=fd.salta==='on';
    const dentro=squadra.filter(([id])=>{
      // Consegnando si salta chi quell'articolo ce l'ha gia', in qualunque
      // taglia. Ritirando invece conta la taglia esatta: non si puo' riprendere
      // una L a chi ha una M.
      if(fd.azione==='CONSEGNA')return salta?!ceLHa(id,art):true;
      return ((D.dotazione[id]||{})[k]||0)>0});
    if(!dentro.length){toast(fd.azione==='CONSEGNA'?'Ce l’hanno già tutti':'Non ce l’ha nessuno');return false}
    const pezzi=dentro.length*qta;
    const st=(D.stock[k]||{ora:0}).ora;
    if(fd.azione==='CONSEGNA'&&st<pezzi&&!confirm(`Servono ${pezzi} pezzi e in magazzino ce ne sono ${st}. Registrare lo stesso?`))return false;
    if(!confirm(fd.azione==='CONSEGNA'
      ?`Consegnare ${qta>1?qta+' pezzi a testa, ':''}${artLabel(art)} ${tg==='UNICA'?'':tg} a ${dentro.length} ${dentro.length===1?'atleta':'atleti'}?`
      :`Registrare il rientro di ${artLabel(art)} ${tg==='UNICA'?'':tg} da ${dentro.length} ${dentro.length===1?'atleta':'atleti'}?`))return false;
    const ok=await w(async()=>{
      for(const [id] of dentro)
        await mov({tipo:fd.azione,atletaId:id,articolo:art,taglia:tg,qta,
          note:`Tutta la ${teamLabel(nome)}`});
    });
    if(ok)toast(`${dentro.length} ${dentro.length===1?'movimento':'movimenti'} ${fd.azione==='CONSEGNA'?'di consegna':'di rientro'} registrati`);
    return ok});

  const agg=()=>{const n=$('#tArt').value;const t=taglieDi(n);
    const tenuta=$('#tTg').value;$('#tTg').innerHTML=vociTaglia(n);
    if(t.includes(tenuta))$('#tTg').value=tenuta;
    const tg=$('#tTg').value;
    const righe=[];
    if(t.length>1)righe.push(`Questo articolo ha ${t.length} taglie: così la dai <b>tutta della stessa taglia</b>. Se le taglie sono diverse conviene la consegna dalla scheda di ognuno.`);
    const ha=quantiHanno(n);
    const saltati=$('#tAz').value==='CONSEGNA'&&$('#tSalta').checked;
    if(ha)righe.push(`${ha} su ${squadra.length} ce l’${ha===1?'ha':'hanno'} già${saltati?`: ${ha===1?'viene saltato':'vengono saltati'}`:''}.`);
    $('#tAvviso').innerHTML=righe.length?`<div class="notice">${righe.join('<br>')}</div>`:''};
  $('#tArt').addEventListener('change',agg);
  $('#tTg').addEventListener('change',agg);
  $('#tAz').addEventListener('change',agg);
  $('#tSalta').addEventListener('change',agg);
  agg();
}

/* Copie di sicurezza: c'e' solo nel programma installato. I dati vivono su un

/* Le informazioni sulle copie si chiedono al computer una volta sola: rileggere
   la cartella a ogni ridisegno farebbe lampeggiare la schermata. */
async function chiediInfoCopie(forza){
  if(!window.__APP)return;
  if(S.app.chiesto&&!forza)return;
  S.app.chiesto=true;
  try{
    S.app.percorso=await window.__APP.percorso();
    S.app.cartella=window.__APP.cartellaCopie();
    S.app.copie=await window.__APP.elencoCopie();
  }catch(e){S.app.percorso='non sono riuscito a leggerlo: '+e}
  render();
}

/* Una giacenza negativa vuol dire che i conti non tornano: pezzi consegnati
   che il magazzino non aveva. Il calcolo e' giusto (e' la somma dei movimenti),
   ma il risultato assurdo va detto, non lasciato li' come un numero qualsiasi. */
function giacenzeNegative(){
  const D=derive();const out=[];
  for(const [k,st] of Object.entries(D.stock)){
    const [art,tg]=k.split('|');
    if(D.conNumero(art))continue;
    if(st.ora<0)out.push(`${esc(artLabel(art))} ${tg==='UNICA'?'':esc(tg)}: la giacenza è ${st.ora}. Qualcosa non torna nei movimenti: controlla carichi e annullamenti.`);
  }
  return out;
}

/* Quello che non torna fra le divise. Il numero doppio in squadra non c'e'
   piu' qui: si vede gia' sulla copertina, sulle squadre, sugli atleti e nelle
   assegnazioni. */
function problemiDivise(){
  const out=[];const g={};
  for(const [id,d] of Object.entries(S.divise)){if(d.dismessa)continue;const k=`${d.modello}|${d.taglia}|${d.numero}`;(g[k]=g[k]||[]).push(id)}
  for(const [k,v] of Object.entries(g)){
    if(v.length<2)continue;
    const [m,t,n]=k.split('|');
    // Due capi uguali in squadre diverse vanno bene. Uno in mano a qualcuno e
    // uno uguale in magazzino di solito e' lo stesso capo contato due volte.
    const libera=v.some(id=>!S.divise[id].holder),usata=v.some(id=>S.divise[id].holder);
    if(!(libera&&usata))continue;
    const dove=v.map(id=>{const d=S.divise[id];return d.holder&&S.atlete[d.holder]?esc(fullName(S.atlete[d.holder])):'magazzino'}).join(', ');
    out.push(`La ${esc(m==='STANDARD'?'':m.toLowerCase()+' ')}${esc(t)} n.${esc(n)} risulta sia in magazzino sia a ${dove.replace('magazzino, ','').replace(', magazzino','')}: probabilmente è lo stesso capo contato due volte.`)}
  for(const d of Object.values(S.divise))
    if(d.holder&&!S.atlete[d.holder]&&!d.dismessa)
      out.push(`La ${esc(d.taglia)} n.${esc(d.numero)} risulta a un atleta che non c'è più: segnane il rientro.`);
  return out;
}

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),3200)}
async function w(fn){
  if(!S.db){toast('Dati non raggiungibili.');return false}
  if(S.readonly){toast('Hai accesso in sola lettura.');return false}
  try{await fn();return true}catch(e){console.error(e);
    if(e&&e.code==='invalid_argument'){S.readonly=true;toast('Non hai i permessi per modificare questi dati.');render()}
    else if(e&&e.code==='quota_exceeded')toast('Archivio pieno: elimina movimenti vecchi o esporta e archivia la stagione.');
    else if(e&&e.code==='resource_exhausted')toast('Troppe operazioni ravvicinate: attendi qualche secondo e riprova.');
    else toast('Salvataggio non riuscito. Riprova.');return false}
}
const today=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};

function mov(o){return S.db.collection('movimenti').add(Object.assign({ts:Date.now()+(_seq++%1000)/1000,data:today(),stagione:(S.settings&&S.settings.stagione)||'',qta:1,atletaId:null,divisaId:null,numero:null,note:''},o))}

async function doConsegna(rid,p,sh,ritiro){
  const r=S.richieste[rid];if(!r)return;
  if(p.divisaId){
    const d=S.divise[p.divisaId];const cur=sh[p.divisaId];
    if(cur.holder&&cur.holder!==r.atletaId){
      await mov({tipo:'RIENTRO',atletaId:cur.holder,articolo:r.articolo,taglia:d.taglia,divisaId:p.divisaId,numero:d.numero,prevHolder:cur.holder,prevDR:cur.dr,note:'Ritirata per riassegnarla'})}
    await S.db.doc('divise/'+p.divisaId).update({holder:r.atletaId,daRestituire:false});
    await mov({tipo:'CONSEGNA',atletaId:r.atletaId,articolo:r.articolo,taglia:d.taglia,divisaId:p.divisaId,numero:d.numero,prevHolder:null,prevDR:false});
    sh[p.divisaId]={holder:r.atletaId,dr:false};
    for(const oid of ritiro){const x=sh[oid];const od=S.divise[oid];if(!x||!od||x.holder!==r.atletaId)continue;
      await S.db.doc('divise/'+oid).update({holder:null,daRestituire:false});
      await mov({tipo:'RIENTRO',atletaId:r.atletaId,articolo:r.articolo,taglia:od.taglia,divisaId:oid,numero:od.numero,prevHolder:r.atletaId,prevDR:x.dr,note:'Restituita al cambio taglia'});
      sh[oid]={holder:null,dr:false}}
  }else{
    await mov({tipo:'CONSEGNA',atletaId:r.atletaId,articolo:r.articolo,taglia:r.taglia,qta:1});
  }
  await S.db.doc('richieste/'+rid).delete();
}
/* Cosa si puo' chiedere per questo atleta: la divisa da gara della sua squadra
   (qualunque lotto usi) piu' i modelli comuni a tutta la societa', i liberi. */
function modelliSceglibili(aid){
  const D=derive();const a=S.atlete[aid];
  const voci=[{v:'',t:'Divisa della squadra'}];
  for(const m of D.comuni)voci.push({v:m,t:cap(m)});
  return voci;
}
/* Le divise che questo atleta deve restituire, a fronte di una richiesta di
   quel modello.
   I modelli comuni (i liberi) stanno per conto loro: un libero si cambia con un
   libero. Le divise da gara invece si cambiano fra loro **qualunque lotto
   siano**, perche' passare di squadra vuol dire proprio cambiare lotto. */
function stessoGenere(modelloDivisa,modelloChiesto){
  const D=derive();const a=modelloDivisa||'STANDARD';const b=modelloChiesto||'STANDARD';
  if(D.comuni.has(a)||D.comuni.has(b))return a===b;
  return true; // due lotti di divise da gara: intercambiabili per il cambio
}
const ownReturning=(aid,mod)=>Object.entries(S.divise).filter(([id,d])=>d.holder===aid&&d.daRestituire&&stessoGenere(d.modello,mod)).map(e=>e[0]);

/* La taglia chiesta non c'e'. Invece di aspettare l'ordine si puo' dare quella
   accanto, e in palestra e' quello che si fa. Qui si vede cosa c'e' davvero,
   partendo dalle taglie piu' vicine a quella chiesta.

   Nell'elenco entrano solo i capi il cui numero e' libero nella squadra: e' la
   regola che non si tocca, un numero non si ripete fra compagne. */
function dlgAltraTaglia(rid){
  const D=derive();const r=S.richieste[rid];if(!r)return;
  const a=S.atlete[r.atletaId];const mod=D.modelloPer(r);
  const occupati=D.occ[a.squadra]||new Set();
  const vicine=Object.entries(S.divise)
    .filter(([id,d])=>!d.dismessa&&(d.modello||'STANDARD')===mod&&(!d.holder||d.daRestituire)
      &&!occupati.has(Number(d.numero)))
    .sort((x,y)=>Math.abs(szIdx(x[1].taglia)-szIdx(r.taglia))-Math.abs(szIdx(y[1].taglia)-szIdx(r.taglia))
      ||szIdx(x[1].taglia)-szIdx(y[1].taglia)||x[1].numero-y[1].numero);
  if(!vicine.length){toast('Non c’è nessun capo di questo lotto col numero libero in squadra');return}

  const distanza=t=>{const n=szIdx(t)-szIdx(r.taglia);
    return n===0?'la taglia chiesta':n===1?'una taglia in più':n===-1?'una taglia in meno'
      :n>0?n+' taglie in più':(-n)+' taglie in meno'};

  openDlg(`<h2>Altra taglia</h2>
  <p class="sub">${esc(fullName(a))} · ${esc(teamLabel(a.squadra))} ha chiesto una <b>${esc(r.taglia)}</b>${r.numeroDesiderato!=null?` col n.${esc(r.numeroDesiderato)}`:''}, e non ce n’è nessuna libera. Qui sotto c’è quello che c’è davvero, dalla taglia più vicina in giù. Compaiono solo i numeri liberi in ${esc(teamLabel(a.squadra))}.</p>
  <div class="field"><label for="atCapo">Quale capo</label><select id="atCapo" name="divisaId">${vicine.map(([id,d])=>{
    const stato=[d.holder?'da ritirare a '+fullName(S.atlete[d.holder]):'',
      D.prenDivisa[id]?'già promessa a '+fullName(S.atlete[S.richieste[D.prenDivisa[id]].atletaId]):''].filter(Boolean);
    return `<option value="${esc(id)}">${esc(d.taglia)} n.${d.numero} — ${distanza(d.taglia)}${stato.length?' — '+esc(stato.join(', ')):''}</option>`}).join('')}</select></div>
  <div id="atAvviso"></div>
  <label class="check" id="atProvv" style="margin:6px 0 2px"><input type="checkbox" name="provv" checked> È una soluzione per adesso: quando arriva la taglia giusta va cambiata</label>
  ${actions('Consegna questa')}`, async fd=>{
    const did=fd.divisaId;const d=S.divise[did];if(!d)return false;
    const diversa=d.taglia!==r.taglia;
    // Provvisoria vuol dire: gliela diamo adesso, ma la richiesta resta
    // aperta e il capo e' gia' segnato da cambiare.
    const provv=diversa&&fd.provv==='on';
    if(diversa&&!confirm(provv
      ?`Consegnare una ${d.taglia} per adesso? La richiesta della ${r.taglia} resta aperta e il programma te la ripropone appena arriva.`
      :`Consegnare una ${d.taglia} al posto della ${r.taglia} chiesta? La richiesta si chiude qui.`))return false;
    const rit=ownReturning(r.atletaId,mod).filter(x=>x!==did);
    const ok=await w(async()=>{
      if(d.holder&&d.holder!==r.atletaId)
        await mov({tipo:'RIENTRO',atletaId:d.holder,articolo:r.articolo,taglia:d.taglia,divisaId:did,numero:d.numero,prevHolder:d.holder,prevDR:!!d.daRestituire,note:'Ritirata per riassegnarla'});
      // La taglia diversa resta scritta sul capo: cosi' si vede sulla scheda
      // dell'atleta e non si perde quando la richiesta sparisce.
      await S.db.doc('divise/'+did).update({holder:r.atletaId,daRestituire:provv,
        tagliaChiesta:diversa?r.taglia:null});
      await mov({tipo:'CONSEGNA',atletaId:r.atletaId,articolo:r.articolo,taglia:d.taglia,divisaId:did,numero:d.numero,
        prevHolder:null,prevDR:false,note:diversa?`Taglia ${d.taglia} al posto della ${r.taglia} chiesta`:''});
      for(const oid of rit){const od=S.divise[oid];if(!od||od.holder!==r.atletaId)continue;
        await S.db.doc('divise/'+oid).update({holder:null,daRestituire:false});
        await mov({tipo:'RIENTRO',atletaId:r.atletaId,articolo:r.articolo,taglia:od.taglia,divisaId:oid,numero:od.numero,prevHolder:r.atletaId,prevDR:!!od.daRestituire,note:'Restituita al cambio'})}
      // Provvisoria: la richiesta non si chiude, cosi' resta in elenco e torna
      // "pronta" da sola appena la taglia giusta entra in magazzino.
      if(!provv)await S.db.doc('richieste/'+rid).delete()});
    if(ok)toast(provv?`${d.taglia} consegnata per adesso: la richiesta della ${r.taglia} resta aperta`
      :diversa?`Consegnata una ${d.taglia} al posto della ${r.taglia}`:`Consegnata la ${d.taglia} n.${d.numero}`);
    return ok});

  // Man mano che si scorre l'elenco si vede subito se la taglia e' quella
  // chiesta o no: il messaggio arriva prima della conferma, non dopo.
  const avvisa=()=>{const d=S.divise[$('#atCapo').value];if(!d)return;
    const id=$('#atCapo').value;const pr=D.prenDivisa[id];
    const righe=[];
    if(d.taglia!==r.taglia)righe.push(`Taglia <b>${esc(d.taglia)}</b> al posto della <b>${esc(r.taglia)}</b> chiesta. Rimane scritto sulla scheda dell’atleta e nei movimenti.`);
    if(pr&&S.richieste[pr])righe.push(`Questa era già promessa a <b>${esc(fullName(S.atlete[S.richieste[pr].atletaId]))}</b>: prendendola, la sua richiesta torna da sistemare.`);
    $('#atAvviso').innerHTML=righe.length?`<div class="notice">${righe.join('<br>')}</div>`:'';
    $('#atProvv').style.display=d.taglia===r.taglia?'none':''};
  $('#atCapo').addEventListener('change',avvisa);avvisa();
}

/* Chi lascia la squadra non sparisce con un clic. Prima si segna, capo per
   capo, cosa ha riportato indietro: quello che torna rientra in magazzino
   davvero, con il suo movimento. Finche' manca qualcosa l'atleta resta "in
   uscita" - scritto in chiaro negli elenchi - e si cancella solo quando non
   ha piu' niente in mano.

   Cancellandolo, il suo nome viene scritto sui movimenti che lo riguardano:
   se no il registro direbbe "Atleta rimosso" su consegne e rientri che invece
   raccontano una storia precisa. */
function coseInMano(id){
  const D=derive();const fuori=[];
  for(const did of (D.perAtleta[id]||[])){const d=S.divise[did];if(!d)continue;
    fuori.push({tipo:'divisa',id:did,divisa:d,
      etichetta:`Divisa ${d.taglia} n.${d.numero}${d.daRestituire?' (già segnata da cambiare)':''}`})}
  for(const [k,v] of Object.entries(D.dotazione[id]||{})){if(v<=0)continue;
    const [art,tg]=k.split('|');
    fuori.push({tipo:'materiale',articolo:art,taglia:tg,qta:v,
      etichetta:`${artLabel(art)}${tg&&tg!=='UNICA'?' '+tg:''}${v>1?' ×'+v:''}`})}
  return fuori;
}

async function eliminaAtleta(id){
  const a=S.atlete[id];if(!a)return false;
  const inMano=coseInMano(id);
  if(inMano.length)return dlgUscita(id);
  return cancellaDavvero(id);
}

/* La finestra dell'uscita: si spunta quello che ha riportato. */
function dlgUscita(id){
  const a=S.atlete[id];const inMano=coseInMano(id);
  openDlg(`<h2>${esc(fullName(a))} lascia la squadra</h2>
  <p class="sub">Spunta quello che ha riportato indietro: quello che spunti rientra in magazzino adesso. L’atleta si cancella solo quando non ha più niente in mano; finché manca qualcosa resta segnato <b>in uscita</b>.</p>
  <div class="list" style="margin-bottom:10px">${inMano.map((x,i)=>`<label class="item" style="cursor:pointer">
    <input type="checkbox" name="reso" value="${i}" checked style="margin-right:10px">
    <div class="main"><div class="name">${esc(x.etichetta)}</div></div></label>`).join('')}</div>
  ${actions('Registra i rientri')}`, async fd=>{
    const scelti=fd._all.getAll('reso').map(Number);
    if(!scelti.length){toast('Non hai spuntato niente');return false}
    const ok=await w(async()=>{
      for(const i of scelti){const x=inMano[i];
        if(x.tipo==='divisa'){
          await S.db.doc('divise/'+x.id).update({holder:null,daRestituire:false,tagliaChiesta:null});
          await mov({tipo:'RIENTRO',atletaId:id,articolo:'DIVISA GARA',taglia:x.divisa.taglia,
            divisaId:x.id,numero:x.divisa.numero,prevHolder:id,prevDR:!!x.divisa.daRestituire,
            note:'Restituita lasciando la squadra'});
        }else{
          await mov({tipo:'RIENTRO',atletaId:id,articolo:x.articolo,taglia:x.taglia,qta:x.qta,
            note:'Restituito lasciando la squadra'});
        }}});
    if(!ok)return false;
    // Quello che resta lo si conta dopo aver scritto: se non resta niente si
    // chiude il discorso, se no l'atleta resta li' segnato in uscita.
    await new Promise(r=>setTimeout(r,60));
    const restano=coseInMano(id);
    if(!restano.length){
      if(confirm(`${fullName(a)} ha restituito tutto. Lo cancello?`)){setTimeout(()=>cancellaDavvero(id),0);return true}
      if(a.inUscita)await w(()=>S.db.doc('atlete/'+id).update({inUscita:false}));
      toast('Rientri registrati');return true}
    if(a.inUscita!==true)await w(()=>S.db.doc('atlete/'+id).update({inUscita:true}));
    toast(`Rientri registrati. Restano ${restano.length} ${restano.length===1?'cosa':'cose'}: resta in uscita`);
    return true});
}

async function cancellaDavvero(id){
  const a=S.atlete[id];if(!a)return false;
  const richieste=Object.keys(S.richieste).filter(r=>S.richieste[r].atletaId===id);
  const movimenti=Object.entries(S.movimenti).filter(([,m])=>m.atletaId===id);
  if(!confirm(`Eliminare ${fullName(a)}?${richieste.length?`\nSpariscono anche le sue ${richieste.length} richieste aperte.`:''}${movimenti.length?`\nI ${movimenti.length} movimenti restano nel registro, col suo nome scritto sopra.`:''}\nNon si torna indietro.`))return false;
  const nome=fullName(a);
  const ok=await w(async()=>{
    for(const r of richieste)await S.db.doc('richieste/'+r).delete();
    // Il nome va scritto sul movimento prima di cancellare la scheda, se no il
    // registro resta con "Atleta rimosso" al posto di chi era.
    for(const [mid] of movimenti)await S.db.doc('movimenti/'+mid).update({atletaId:null,a:nome});
    await S.db.doc('atlete/'+id).delete()});
  if(ok){toast('Atleta eliminato');location.hash='#atleti'}
  return ok;
}

    <div class="field"><label for="dMod">Lotto</label><select id="dMod" name="modello">${(D.set.modelli||['STANDARD']).map(m=>`<option value="${esc(m)}"${(d.modello||'STANDARD')===m?' selected':''}>${esc(cap(m))}</option>`).join('')}</select></div>
    <div class="field"><label for="dNote">Nota</label><input type="text" id="dNote" name="note" value="${esc(d.note||'')}" maxlength="200"></div>
    ${actions('Salva',!d.holder?`<button class="btn danger" value="dismetti" style="margin-right:auto">Segna come dismessa</button>`:'')}`,async(fd,btn)=>{
      if(btn==='dismetti'){const ok=await w(()=>S.db.doc('divise/'+id).update({dismessa:true,note:(fd.note?fd.note+' · ':'')+'dismessa '+today()}));if(ok)toast('Divisa dismessa');return ok}
      const num=Number(fd.numero);const mod=fd.modello;const tg=fd.taglia;

      if(cambia){
        // La regola vera e' una sola: dentro una squadra un numero non si

function dlgMat(art,tg){
  const D=derive();const arts=(D.set.articoli||[]).filter(a=>!a.conNumero).sort(perNome);
  const k=art?D.key(art,tg):null;const cur=k&&D.stock[k]?D.stock[k].ora:0;
  const ordOra=k&&D.stock[k]?(D.stock[k].ordinati||0):0;
  const sizesFor=n=>{const x=arts.find(z=>z.nome===n);if(x)return x.taglie;return[...new Set(Object.values(S.materiale).filter(m=>m.articolo===n).map(m=>m.taglia))]};
  const allArts=[...new Set([...arts.map(a=>a.nome),...Object.values(S.materiale).map(m=>m.articolo)])].sort(perNome);
  openDlg(`<h2>${art?esc(artLabel(art))+' · '+(tg==='UNICA'?'unica':esc(tg)):'Carico merce'}</h2>
  ${art?`<p class="sub">In magazzino ora: <b>${cur}</b></p><input type="hidden" name="articolo" value="${esc(art)}"><input type="hidden" name="taglia" value="${esc(tg)}">`:
  `<div class="field"><label for="mArt">Articolo</label><select id="mArt" name="articolo">${allArts.map(a=>`<option value="${esc(a)}">${esc(artLabel(a))}</option>`).join('')}</select></div>
   <div class="field"><label for="mTg">Taglia</label><select id="mTg" name="taglia"></select></div>`}
  <div class="field"><label for="mQ">Quanti pezzi</label><input type="number" id="mQ" name="qta" min="0" step="1" required inputmode="numeric"></div>
  ${art?`<div class="field"><label for="mOrd">Ordinati al fornitore, in arrivo</label><input type="number" id="mOrd" name="ordinati" min="0" step="1" inputmode="numeric" value="${ordOra||''}" placeholder="0"></div>`:''}
  ${art?`<p class="sub"><b>Sono arrivati</b>: li aggiunge a quelli che ci sono già (${cur} + quanti scrivi), e scala altrettanto da quelli in arrivo.<br><b>Ho contato</b>: sostituisce la giacenza con questo numero, per sistemare i conti dopo un inventario.</p>`:''}
  <div class="field"><label for="mNote">Nota</label><input type="text" id="mNote" name="note" maxlength="200"></div>
  ${actions(art?'Sono arrivati':'Registra carico',art?`<button class="btn" value="rett" style="margin-right:auto">Ho contato</button>`:'')}`,async(fd,btn)=>{
    // Lo stesso campo serve a due cose: un carico (almeno un pezzo) e un
    // conteggio reale (che può essere zero, se l'articolo è finito). Numeri
    // negativi non vogliono dire niente né per l'uno né per l'altro: prima
    // passavano, e un carico di -50 faceva crollare la giacenza in silenzio.
    const q=Number(fd.qta);
    if(!Number.isInteger(q)||q<0){toast('Metti un numero intero, zero o più');return false}
    if(btn!=='rett'&&q<1){toast('Un carico è di almeno un pezzo');return false}
    const kk=D.key(fd.articolo,fd.taglia);const now=D.stock[kk]?D.stock[kk].ora:0;
    const exists=Object.values(S.materiale).some(m=>m.articolo===fd.articolo&&m.taglia===fd.taglia);
    // Quelli in arrivo: un numero scritto a mano, che cala da solo quando la
    // merce arriva. Se no bisognerebbe ricordarsi di correggerlo ogni volta.
    const ordScritto=fd.ordinati===''||fd.ordinati==null?null:Number(fd.ordinati);
    if(ordScritto!=null&&(!Number.isInteger(ordScritto)||ordScritto<0)){toast('Gli ordinati sono un numero intero, zero o più');return false}
    const ordPrima=D.stock[kk]?(D.stock[kk].ordinati||0):0;
    let ordDopo=ordScritto==null?ordPrima:ordScritto;
    if(btn!=='rett')ordDopo=Math.max(0,ordDopo-q);
    const ok=await w(async()=>{
      if(!exists)await S.db.collection('materiale').add({articolo:fd.articolo,taglia:fd.taglia,iniziale:0,precedente:false});
      if(ordDopo!==ordPrima){
        const riga=Object.entries(S.materiale).find(([,m])=>m.articolo===fd.articolo&&m.taglia===fd.taglia);
        if(riga)await S.db.doc('materiale/'+riga[0]).update({ordinati:ordDopo});
      }
      if(btn==='rett'){const delta=q-now;if(delta!==0)await mov({tipo:'RETTIFICA',articolo:fd.articolo,taglia:fd.taglia,qta:delta,note:fd.note||'Inventario'})}
      else await mov({tipo:'CARICO',articolo:fd.articolo,taglia:fd.taglia,qta:q,note:fd.note||''})});
    if(ok)toast(btn==='rett'?`Giacenza corretta: adesso ne risultano ${q}`
      :`Carico registrato${ordDopo!==ordPrima&&ordScritto==null?`, ne restano ${ordDopo} in arrivo`:''}`);return ok});
  if(!art){const u=()=>{$('#mTg').innerHTML=sizesFor($('#mArt').value).map(t=>`<option>${esc(t)}</option>`).join('')};$('#mArt').addEventListener('change',u);u()}
}

  <div class="field"><label for="rq">Pezzi</label><input type="number" id="rq" name="qta" value="1" min="1" required></div>${actions('Registra restituzione')}`,async fd=>{
