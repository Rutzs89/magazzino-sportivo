}

/* La domanda prima di caricare: cosa verra' aggiunto, cosa ignorato, quali
   righe hanno errori. */
/* Le impostazioni di una squadra: quello che si cambia di rado, tolto dalla
   riga. Ogni campo si salva appena cambiato, con la stessa logica di prima
   (il gestore di data-act="modSquadra"), controlli sui numeri compresi. */
function dlgSquadra(nome){
  const D=derive();const x=(D.set.squadre||[]).find(y=>y.nome===nome);if(!x)return;
  const lotti=lottiSceglibili();const altre=D.perServire.filter(y=>y.nome!==nome);
  const con=squadreDellaSerie(D,nome).filter(n=>n!==nome);
  openDlg(`<h2>Impostazioni della squadra</h2><p class="sub">Ogni modifica viene salvata appena fatta.</p>
  <div class="field"><label for="dsNome">Nome</label><input type="text" id="dsNome" value="${esc(x.nome)}" data-act="modSquadra" data-n="${esc(x.nome)}" data-f="nome" autocomplete="off"></div>
  ${lotti.length>1?`<div class="field"><label for="dsLotto">Lotto delle divise da gara</label><select id="dsLotto" data-act="modSquadra" data-n="${esc(x.nome)}" data-f="modelloDivisa">${lotti.map(m=>`<option value="${esc(m)}"${(x.modelloDivisa||'STANDARD')===m?' selected':''}>${esc(nomeLotto(m,true))}</option>`).join('')}</select></div>`:''}
  ${altre.length?`<div class="field"><label for="dsNum">Numeri di maglia</label><select id="dsNum" data-act="modSquadra" data-n="${esc(x.nome)}" data-f="gruppoNumeri">
    <option value="">numeri propri</option>${altre.map(y=>`<option value="${esc(y.nome)}"${con[0]===y.nome?' selected':''}>numeri in comune con ${esc(teamLabel(y.nome))}</option>`).join('')}</select>${con.length>1?`<p class="sub">Anche con ${esc(con.slice(1).map(teamLabel).join(', '))}.</p>`:''}</div>`:''}
  <div class="field"><label for="dsOrd">Ordine di distribuzione</label><input type="number" id="dsOrd" min="1" step="1" value="${x.ordine??''}" placeholder="—" data-act="modSquadra" data-n="${esc(x.nome)}" data-f="ordine" inputmode="numeric"></div>
  <label class="check"><input type="checkbox" id="dsInc" data-act="modSquadra" data-n="${esc(x.nome)}" data-f="includi" ${x.includi!==false?'checked':''}> In distribuzione (togliendo la spunta la squadra non riceve proposte)</label>
  <div class="dlg-actions"><button type="button" class="btn danger" data-act="sqElimina" data-n="${esc(x.nome)}" style="margin-right:auto">Elimina la squadra</button><button class="btn primary" value="cancel">Chiudi</button></div>`,null);
}
/* Fine stagione: una finestra sola (analisi del 25/09/2026: la chiusura non
   c'era, e cambiare il nome della stagione faceva sparire dal modulo gli
   articoli segnati "di questa stagione"). Scrive con la rete sotto, come un
   caricamento: la copia prima, e si annulla dall'esito. Le consegne restano nel
   registro con la loro stagione. */
function stagioneDopo(st){const m=String(st||'').match(/^(\d{4})\s*[\/-]\s*(\d{2,4})$/);
  if(!m)return '';const a=Number(m[1])+1;return `${a}/${String((a+1)%100).padStart(2,'0')}`}
function dlgChiudiStagione(){
  const D=derive();const ora=D.set.stagione||'';
  const aperte=Object.keys(S.richieste).length;
  const dac=Object.values(S.divise).filter(x=>x.holder&&x.daRestituire&&!x.dismessa).length;
  const inUscita=Object.values(S.atlete).filter(a=>a.inUscita).length;
  const artQuesta=(D.set.articoli||[]).filter(a=>a.stagione&&a.stagione===ora).length;
  openDlg(`<h2>Chiudi la stagione ${esc(ora)}</h2>
  <p class="sub">Prima di scrivere viene salvata una copia dei dati; la chiusura si può annullare dalla finestra che segue. Le consegne restano nel registro, con la loro stagione.</p>
  <div class="field"><label for="csNuova">Stagione nuova</label><input type="text" id="csNuova" name="nuova" required value="${esc(stagioneDopo(ora))}" placeholder="per esempio 2027/28"></div>
  ${artQuesta?`<label class="check"><input type="checkbox" name="articoli" checked> Gli ${artQuesta} articoli della stagione ${esc(ora)} restano in distribuzione anche nella nuova</label>`:''}
  <div class="field" style="margin-top:10px"><label>Le ${aperte} richieste aperte</label>
    <label class="check"><input type="radio" name="richieste" value="tieni" checked> restano aperte: sono ancora da consegnare</label>
    <label class="check"><input type="radio" name="richieste" value="togli"> vengono tolte: si ricomincia da capo con il foglio delle squadre</label></div>
  ${dac||inUscita?`<p class="sub">Restano come sono: ${[dac?`${dac} ${dac===1?'divisa da cambiare':'divise da cambiare'}`:'',inUscita?`${inUscita} ${inUscita===1?'atleta':'atleti'} con l’eliminazione in attesa di riconsegna`:''].filter(Boolean).join(' e ')}.</p>`:''}
  ${actions('Chiudi la stagione')}`,async fd=>{
    const nuova=(fd.nuova||'').trim();
    if(!nuova||nuova===ora){toast('Indicare una stagione diversa da quella in corso');return false}
    const togli=fd.richieste==='togli';
    if(!await chiedi(`Chiudere la stagione ${ora} e aprire la ${nuova}?${togli?`\nLe ${aperte} richieste aperte vengono tolte.`:''}`,{si:'Chiudi la stagione',pericolo:togli}))return false;
    const esito=nuovoEsito();
    const r=await scriviConRete('Chiusura della stagione',async()=>{
      const articoli=(D.set.articoli||[]).map(a=>fd.articoli&&a.stagione===ora?{...a,stagione:nuova}:a);
      await S.db.doc('settings/main').update({stagione:nuova,articoli});
      if(togli)for(const rid of Object.keys(S.richieste)){await S.db.doc('richieste/'+rid).delete();esito.tolti++}
      return esito});
    if(!r)return false;
    if(r.errore){mostraEsitoExcel('Chiusura della stagione',{problemi:[interrotto(r.errore)],avvisi:[]},'chiusura interrotta');return false}
    // l'esito prende il posto di questa finestra: false = non chiuderla
    mostraEsitoExcel('Chiusura della stagione',{problemi:[],avvisi:[]},`aperta la stagione ${nuova}${togli?`, tolte ${esito.tolti} richieste`:''}`);
    return false});
}
/* Ogni caricamento in blocco scrive con la rete sotto (rischi trovati il
   25/09/2026): prima una copia con data e ora nella cartella delle copie, e se
   non riesce non si scrive niente; poi la fotografia resta in memoria, e la
   finestra dell'esito offre «Annulla questo caricamento». Prima un caricamento
   sbagliato si disfaceva un movimento alla volta, e atleti e richieste mai; e la
   copia del giorno era quella del mattino, che riprendendola cancellava anche
   il lavoro fatto dopo. */
const impronta=()=>[Object.keys(S.movimenti).length,Object.keys(S.richieste).length,Object.keys(S.atlete).length,Object.keys(S.divise).length].join('|');
async function scriviConRete(nome,esegui){
  let testo=null;
  if(window.__APP&&window.__APP.primaDelCaricamento){
    try{testo=await window.__APP.primaDelCaricamento()}
    catch(e){await avvisoFisso(`Caricamento non eseguito: non è stato possibile salvare la copia di sicurezza dei dati attuali (${e}). Nessun dato è stato modificato.`);return null}
  }
  S.busy=true;render();
  let esito=null,errore=null;
  try{esito=await esegui()}catch(e){errore=e}
  S.busy=false;
  await new Promise(r=>setTimeout(r,80)); // i dati scritti arrivano alla pagina
  if(testo)S.app.annulla={testo,nome,id:Date.now(),quando:new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}),impronta:impronta()};
  return {esito,errore};
}
const interrotto=e=>`Caricamento interrotto: ${e}. Una parte dei dati potrebbe essere già stata scritta: con «Annulla questo caricamento» i dati tornano a com'erano prima.`;
async function annullaCaricamento(){
  const u=S.app.annulla;if(!u||!window.__APP||!window.__APP.tornaAllaCopia)return false;
  const altro=impronta()!==u.impronta;
  if(!await chiedi(`Riportare i dati a com’erano prima del caricamento «${u.nome}» delle ${u.quando}?${altro?'\nDopo il caricamento sono state fatte altre modifiche: andranno perse anche quelle.':''}\nI dati attuali vengono prima salvati in una copia nella cartella delle copie di sicurezza.`,{si:'Annulla il caricamento',pericolo:true}))return false;
  try{await window.__APP.tornaAllaCopia(u.testo)}
  catch(e){await avvisoFisso('Annullamento non eseguito: '+e+'. Nessun dato è stato modificato.');return false}
  S.app.annulla=null;S.app.esitoExcel=null;S.app.problemiExcel=[];
  toast('Caricamento annullato: i dati sono tornati a com’erano prima');render();return true;
}
function riepilogoCaricamento(nome,e,voci){
  const n=(v,k)=>`${v} ${v===1?voci[k][0]:voci[k][1]}`;
  const righe=[`Foglio «${nome}»: controllo completato.`,''];
  const da=[];
  if(e.creati)da.push(n(e.creati,'creati'));
  if(e.aggiornati&&voci.aggiornati)da.push(n(e.aggiornati,'aggiornati'));
  if(e.posseduti)da.push(`${e.posseduti} ${e.posseduti===1?'capo già in possesso':'capi già in possesso'}`);
  righe.push(`Da aggiungere: ${da.join(', ')||'niente'}.`);
  // I nomi prima di confermare, non dopo: con i soli numeri non si vedeva, per
  // esempio, un'atleta nuova scritta con nome e cognome invertiti.
  const elenco=(tit,v)=>{if(v&&v.length){righe.push(`${tit}: ${v.slice(0,8).join(', ')}${v.length>8?` e altri ${v.length-8}`:''}.`)}};
  elenco('Atleti nuovi',e.nomiCreati);
  elenco('Cambiano squadra',e.nomiSpostati);
  if(e.consegne)righe.push(`Consegne da registrare: ${e.consegne}${e.rientri?`, con ${e.rientri} ${e.rientri===1?'capo che rientra':'capi che rientrano'}`:''}.`);
  if(e.tolti)elenco(`Richieste da togliere (indicate «ce l’ho»): ${e.tolti}`,e.nomiTolti);
  if(e.saltati)righe.push(`Già presenti, ignorati: ${e.saltati}.`);
  if(e.invariati)righe.push('Le altre caselle non sono cambiate rispetto al foglio scaricato e vengono ignorate.');
  if(e.squadreNuove&&e.squadreNuove.length)righe.push(`Squadre nuove: ${e.squadreNuove.join(', ')}.`);
  if(e.lottiNuovi&&e.lottiNuovi.length)righe.push(`Lotti di divise nuovi: ${e.lottiNuovi.join(', ')}.`);
  if(e.problemi.length){righe.push('',`${e.problemi.length===1?'Una riga contiene errori e non verrà caricata':e.problemi.length+' righe contengono errori e non verranno caricate'}:`);
    righe.push(...e.problemi.slice(0,5).map(x=>'• '+x));if(e.problemi.length>5)righe.push(`• …e altre ${e.problemi.length-5}`)}
  // le richieste tolte sono gia' elencate sopra: fra gli avvisi non si ripetono
  const avv=e.avvisi.filter(x=>!/: tolta la richiesta/.test(x));
  if(avv.length){righe.push('',`Avvisi da verificare: ${avv.length}. I primi:`);
    righe.push(...avv.slice(0,4).map(x=>'• '+x));if(avv.length>4)righe.push(`• …l’elenco completo si vede dopo il caricamento`)}
  righe.push('','Caricare i dati validi?');
  return righe.join('\n');
}
function sintesiEsito(e,voci){
  const pezzi=[];
  if(e.creati)pezzi.push(`${e.creati} ${e.creati===1?voci.creati[0]:voci.creati[1]}`);
  if(e.aggiornati&&voci.aggiornati)pezzi.push(`${e.aggiornati} ${e.aggiornati===1?voci.aggiornati[0]:voci.aggiornati[1]}`);
  if(e.posseduti)pezzi.push(`${e.posseduti} ${e.posseduti===1?'capo già in possesso':'capi già in possesso'}`);
  if(e.tolti)pezzi.push(`${e.tolti} ${e.tolti===1?'richiesta tolta':'richieste tolte'}`);
  if(e.consegne)pezzi.push(`${e.consegne} ${e.consegne===1?'consegna registrata':'consegne registrate'}`);
  if(e.saltati)pezzi.push(`${e.saltati} già presenti`);
  if(e.problemi.length)pezzi.push(`${e.problemi.length} con errori`);
  return pezzi.join(', ')||'Niente da aggiungere';
}
/* L'esito di un caricamento: una finestra che si apre appena finito, con il
   riepilogo, le righe non caricate e gli avvisi. In fondo alle Impostazioni
   passava inosservato. Resta ricordato per poterla riaprire. */
function mostraEsitoExcel(nome,e,sintesi){
  const u=S.app.annulla;
  S.app.esitoExcel={nome,problemi:e.problemi||[],avvisi:e.avvisi||[],sintesi:sintesi||'',quando:new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}),
    annullabile:u&&u.nome===nome&&Date.now()-u.id<5000?u.id:null};
  S.app.problemiExcel=e.problemi||[];
  render();
  finestraEsitoExcel();
}
function finestraEsitoExcel(){
  const e=S.app.esitoExcel;if(!e)return;
  const blocco=(titolo,voci,cls)=>voci.length?`<h3 class="esitoTit ${cls}">${titolo}</h3><ul class="esitoLista">${voci.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:'';
  openDlg(`<h2>Esito del caricamento</h2>
  <p class="sub">«${esc(e.nome)}», alle ${esc(e.quando)}${e.sintesi?`: ${esc(e.sintesi)}`:''}.</p>
  ${!e.problemi.length&&!e.avvisi.length?'<div class="notice">Tutte le righe sono state caricate o erano già presenti: nessun errore e nessun avviso.</div>':''}
  ${blocco(e.problemi.length===1?'Una riga non caricata':e.problemi.length+' righe non caricate',e.problemi,'bad')}
  ${blocco(e.avvisi.length===1?'Un avviso da verificare':e.avvisi.length+' avvisi da verificare',e.avvisi,'')}
  <div class="dlg-actions">${e.annullabile&&S.app.annulla&&S.app.annulla.id===e.annullabile?'<button class="btn danger" value="annullaCar" style="margin-right:auto">Annulla questo caricamento</button>':''}<button class="btn primary" value="cancel">Chiudi</button></div>`,
  async(fd,btn)=>{if(btn==='annullaCar')return annullaCaricamento();return true});
}

/* Legge il foglio compilato, lo controlla, dice cosa succederebbe, e carica
   solo se si conferma. */
async function caricaModello(tipo){
  const m=MODELLI_EXCEL[tipo];if(!m)return;
  if(!window.__APP){toast('Il foglio si carica dal programma installato');return}
  let file,righe;
  try{file=await window.__APP.scegliDaAprire()}
  catch(e){toast('Apertura della finestra non riuscita: '+e);return}
  if(!file)return;
  try{righe=await window.__APP.leggiExcel(file)}
  catch(e){toast('Lettura del file non riuscita: '+e);return}
  if(!righe.length){toast('Il foglio è vuoto');return}

  // Le colonne si riconoscono dal titolo, non dalla posizione: una colonna
  // spostata o aggiunta non fa piu' scivolare i dati, e un foglio sbagliato
  // (le divise caricate come atleti) viene rifiutato invece di creare righe
  // senza senso.
  const iTit=righe.slice(0,5).findIndex(r=>m.obbligatorie.every(c=>r.map(KEY).includes(KEY(c))));
  if(iTit<0){toast(`Questo non sembra il foglio «${m.nome}»: mancano le colonne ${m.obbligatorie.join(', ')}`);return}
  const titoli=righe[iTit].map(KEY);
  const doppie=titoli.filter((t,k)=>t&&titoli.indexOf(t)!==k);
  if(doppie.length){toast(`Il foglio ha colonne ripetute (${[...new Set(doppie)].join(', ')}): correggere il foglio e riprovare`);return}
  const note=new Set([...m.colonne,...(m.info||[])].map(KEY));
  const ignote=righe[iTit].filter(t=>String(t??'').trim()&&!note.has(KEY(t)));
  const pos=m.colonne.map(c=>titoli.indexOf(KEY(c)));
  const tutte=righe.slice(iTit+1).map((r,k)=>({r,n:iTit+2+k}));
  const piene=tutte.filter(x=>x.r.some(c=>String(c??'').trim()));
  const dati=piene.map(x=>pos.map(k=>k<0?'':(x.r[k]??'')));
  const nr=k=>`riga ${piene[k].n}`;
  if(!dati.length){toast('Nel foglio ci sono solo le intestazioni');return}

  const prova=await m.applica(dati,true,nr);
  if(ignote.length)prova.avvisi.unshift(`colonne non riconosciute, ignorate: ${ignote.join(', ')}`);
  if(!prova.creati&&!prova.aggiornati){mostraEsitoExcel(m.nome,prova,'nessun dato nuovo da caricare');return}
  if(!await chiedi(riepilogoCaricamento(m.nome,prova,m.voci),{si:'Carica'}))return;

  const r=await scriviConRete(m.nome,()=>m.applica(dati,false,nr));
  if(!r)return;
  if(r.errore){mostraEsitoExcel(m.nome,{problemi:[interrotto(r.errore)],avvisi:[]},'caricamento interrotto');return}
  const esito=r.esito;
  if(ignote.length)esito.avvisi.unshift(`colonne non riconosciute, ignorate: ${ignote.join(', ')}`);
  mostraEsitoExcel(m.nome,esito,sintesiEsito(esito,m.voci));
}

function sezioneExcel(){
  const e=S.app.esitoExcel;
  // In Impostazioni resta solo la prima configurazione. Il foglio delle
  // squadre si scarica e si carica da Squadre (e dalla pagina iniziale), il
  // registro da Movimenti: Scarica e Carica stanno insieme, dove si lavora
  // (analisi del 25/09/2026: prima si scaricava da Squadre e si caricava da qui).
  return `<h2>Prima configurazione</h2>
  <p class="sub">I quattro fogli dei dati servono a riempire il programma per una società nuova, oppure per correzioni in blocco; durante la stagione si usa il foglio delle squadre, in <a href="#squadre">Squadre</a>. Vanno caricati nell’ordine indicato: le richieste richiedono gli atleti, e gli atleti gli articoli. Il caricamento aggiunge soltanto, non modifica né cancella; le colonne informative in fondo ai fogli vengono ignorate.</p>
  <div class="list">`+
  Object.entries(MODELLI_EXCEL).map(([tipo,m],i)=>`<div class="item"><div class="main"><div class="name">${i+1}. ${esc(m.nome)}</div><div class="meta">${esc(m.colonne.join(' · '))}${m.info&&m.info.length?` <span class="soloInfo">· informative: ${esc(m.info.join(', '))}</span>`:''}</div></div>
  <div class="right"><button type="button" class="btn small" data-act="scaricaXls" data-v="${tipo}">Scarica</button>
  <button type="button" class="btn small primary" data-act="caricaXls" data-v="${tipo}">Carica</button></div></div>`).join('')+
  `</div>`+ultimoCaricamento(e);
}
/* L'ultimo caricamento, per rivederne l'esito (e annullarlo). */
const ultimoCaricamento=e=>e?`<div class="list" style="margin-top:10px"><div class="item"><div class="main"><div class="name">Ultimo caricamento: «${esc(e.nome)}», alle ${esc(e.quando)}</div>
    <div class="meta">${e.problemi.length?`<b class="neg">${e.problemi.length===1?'una riga non caricata':e.problemi.length+' righe non caricate'}</b>`:'nessuna riga scartata'}${e.avvisi.length?` · ${e.avvisi.length===1?'un avviso':e.avvisi.length+' avvisi'}`:''}</div></div>
    <div class="right"><button type="button" class="btn small" data-act="rivediEsito">Rivedi</button></div></div></div>`:'';

/* ============ avvio ============ */
async function boot(){
  applicaTema();
  render();
  if(!window.claude||typeof window.claude.use!=='function'){S.status='offline';render();return}
  let db=null;try{db=await window.claude.use('db')}catch(e){db=null}
  if(!db){S.status='offline';render();return}
  S.db=db;S.status='ok';
  const onErr=e=>{S.status=e&&e.code==='revoked'?'revoked':'error';toast(window.__APP?'Collegamento ai dati interrotto: riavviare il programma.':'Collegamento ai dati interrotto: ricaricare la pagina.');render()};
  db.doc('settings/main').onSnapshot(s=>{S.settings=s.exists?s.data():null;S.loaded.add('settings');changed();
    // i dati di prima non avevano il codice corto degli articoli
    setTimeout(assegnaCodiciMancanti,0)},onErr);
  for(const c of COLS)db.collection(c).onSnapshot(q=>{const m={};for(const d of q.docs)m[d.id]=d.data();S[c]=m;S.loaded.add(c);changed()},onErr);
  window.claude.use('downloads').then(d=>{S.dl=d}).catch(()=>{});
  // Qualche secondo dopo l'avvio, senza disturbare: se c'è una versione nuova
  // compare l'avviso, se non c'è non succede niente.
  if(window.__APP)setTimeout(()=>{window.__APP.cercaAggiornamento()
    .then(v=>{if(v){S.app.nuovaVersione=v;toast(`È disponibile la versione ${v}: si installa da Impostazioni`);render()}})
    .catch(()=>{})},4000);
}
boot();
</script>
