   tocca anche tutte le suoi atleti: il nome e' scritto su ognuna. */
document.addEventListener('change',async e=>{
  const el=e.target;if(!el.dataset||el.dataset.act!=='modSquadra')return;
  const D=derive();const vecchio=el.dataset.n;const campo=el.dataset.f;
  const i=(D.set.squadre||[]).findIndex(y=>y.nome===vecchio);
  if(i<0)return;
  const sq=[...D.set.squadre];const x=sq[i];
  if(campo==='includi'){
    sq[i]={...x,includi:el.checked};
    if(await w(()=>S.db.doc('settings/main').update({squadre:sq})))toast(el.checked?'In distribuzione':'Esclusa dalla distribuzione');
    return}
  if(campo==='ordine'){
    const v=el.value.trim();
    const num=v===''?null:Number(v);
    if(v!==''&&(!Number.isInteger(num)||num<1)){el.value=x.ordine??'';toast('Metti un numero intero da 1 in su, oppure lascia vuoto');return}
    sq[i]={...x,ordine:num};
    if(await w(()=>S.db.doc('settings/main').update({squadre:sq})))
      toast(num===null?'Senza ordine: viene servita per ultima':`${teamLabel(vecchio)}: ordine ${num}`);
    return}
  if(campo==='modelloDivisa'){
    sq[i]={...x,modelloDivisa:el.value};
    if(await w(()=>S.db.doc('settings/main').update({squadre:sq})))toast(`${teamLabel(vecchio)}: divise dal lotto ${el.value.toLowerCase()}`);
    return}
  const nome=el.value.trim().toUpperCase();
  if(nome===vecchio)return;
  if(!nome){el.value=vecchio;toast('Il nome non può restare vuoto');return}
  if(sq.some((y,j)=>j!==i&&y.nome===nome)){el.value=vecchio;toast('Esiste già una squadra con questo nome');return}
  sq[i]={...x,nome};
  const ok=await w(async()=>{
    await S.db.doc('settings/main').update({squadre:sq});
    for(const [id,a] of Object.entries(S.atlete))
      if(a.squadra===vecchio)await S.db.doc('atlete/'+id).update({squadra:nome});
  });
  if(ok)toast('Squadra rinominata');
});

        if(later){toast('Annulla prima i movimenti più recenti di questo articolo per questo atleta.');return}}

      const n=fd.nome.trim().toUpperCase();if(D.set.squadre.some(s=>s.nome===n)){toast('Questa squadra esiste già');return false}

    case'riprendiCopia':{
      if(!confirm('Sostituire tutti i dati con quelli della copia?\nQuello che c\'e\' adesso viene rimpiazzato: se non l\'hai gia\' fatto, salva prima una copia.'))return;
      return window.__APP.importa().then(d=>{if(d)toast('Dati ripresi dalla copia')}).catch(e=>toast('Non sono riuscito a leggere la copia: '+e));}
    case'cartellaCopie':return window.__APP.scegliCartellaCopie().then(d=>{if(d){toast('Da adesso le copie finiscono li\'');chiediInfoCopie(true)}}).catch(e=>toast('Non ci sono riuscito: '+e));
    case'scordaCartella':window.__APP.dimenticaCartellaCopie();toast('Le copie tornano accanto ai dati');chiediInfoCopie(true);return;
    case'scaricaModulo':return scaricaModulo();
    case'caricaModulo':return caricaModulo();
    case'scaricaXls':return scaricaModello(el.dataset.v);
    case'caricaXls':return caricaModello(el.dataset.v);
    case'cercaAgg':{
      S.app.cercando=true;render();
      try{const v=await window.__APP.cercaAggiornamento();
        S.app.nuovaVersione=v||null;
        toast(v?`C\u2019\u00e8 la versione ${v}`:'Sei gi\u00e0 all\u2019ultima versione')}
      catch(e){toast('Non sono riuscito a controllare: '+e)}
      S.app.cercando=false;render();return}
    case'installaAgg':{
      if(!confirm(`Installare la versione ${S.app.nuovaVersione}?
Il programma si chiude e si riapre da solo. I dati restano dove sono.`))return;
      // La barra si muove chiedendo ogni tanto al programma a che punto e':
      // sono sette megabyte, e venti secondi di schermo fermo sembrano un
      // blocco. Si chiede invece di ricevere un evento perche' gli eventi
      // passano dalla libreria JavaScript del plugin, che qui non e' scontata.
      S.app.installando=true;S.app.percento=null;S.app.mb='';render();
      const battito=setInterval(async()=>{
        try{const r=await window.__APP.avanzamentoAggiornamento();
          const presi=r[0],tot=r[1];
          if(tot>0){S.app.percento=Math.min(100,Math.round(presi*100/tot));
            S.app.mb=(presi/1048576).toFixed(1)+' di '+(tot/1048576).toFixed(1)+' MB';render()}
        }catch(e){}},400);
      try{await window.__APP.installaAggiornamento()}
      catch(e){clearInterval(battito);S.app.installando=false;render();
        toast('Non sono riuscito a installarla: '+e);return}
      clearInterval(battito);S.app.percento=100;render();
      return}
    case'resetProva':if(window.__PROVA&&confirm('Cancellare tutte le prove e tornare ai dati iniziali?'))window.__PROVA.reset();return;
  }
});

   scaricano gia' pieni di quello che c'e' dentro: cosi' lo stesso file serve
   sia da modello da compilare, sia da controllo di quello che c'e', sia da
   modifica di massa da rimandare indietro.

   L'ordine conta, ed e' scritto nelle istruzioni di ogni foglio: prima gli
   articoli, poi le squadre con gli atleti, poi le divise, poi le richieste. */

const KEY=s=>norm(s).replace(/\s+/g,' ').trim();

const MODELLI_EXCEL={
 articoli:{

  async applica(righe){
   const D=derive();const r={creati:0,aggiornati:0,saltati:0,problemi:[]};

   const perNome=new Map(Object.entries(S.atlete).map(([id,a])=>[KEY(a.squadra+'|'+a.cognome+'|'+a.nome),id]));

   for(const riga of righe){

/* Scarica il foglio, gia' pieno di quello che c'e' nel programma. */
/* ============ il modulo di distribuzione ============
   Un file solo, un foglio per squadra, le stesse colonne dappertutto: e' il
   modulo che i dirigenti compilano a mano, e da cui escono squadre, atleti e
   richieste in un colpo.

   Le colonne le decide l'elenco articoli del programma, non chi compila: cosi'
   non succede piu' che la stessa cosa si chiami "BORSONE GRANDE" in un foglio
   e "BORSONE ZAINETTO" in un altro. */

/* Le uniche risposte ammesse in una casella. Chi compila ne scrive di tutti i
   colori ("la devo sostiutire", "Ce l'ho"), quindi si guarda la sostanza. */
const MOD_RISPOSTE=['ce l’ho','mi manca','da cambiare'];
function modRisposta(v){
  const t=norm(v).replace(/[’'`]/g,'\'').trim();
  if(!t)return '';
  if(t.includes('manca'))return 'manca';
  if(t.includes('cambiar')||t.includes('sostitu'))return 'cambia';
  if(t.includes('ce l'))return 'ha';
  return '?';
}
/* Nel modulo vanno solo gli articoli di quest'anno. Gli avanzi delle stagioni
   passate restano in magazzino e si possono ancora consegnare a mano, ma se
   entrassero qui il foglio avrebbe sessanta colonne invece di trenta e
   nessuno lo compilerebbe. Si riconoscono da soli: tutte le loro righe di
   magazzino sono segnate come stagioni precedenti. */
const modArticoli=D=>(D.set.articoli||[]).filter(a=>{
  if(a.distribuibile===false)return false;
  // Di questa stagione lo dice l'articolo stesso: se non lo dice, si guarda se
  // tutto quello che ne resta in magazzino e' roba di stagioni passate.
  if(a.stagione)return a.stagione===(D.set.stagione||'');
  const righe=Object.values(S.materiale).filter(m=>m.articolo===a.nome);
  return !(righe.length&&righe.every(m=>m.precedente))});
const modConTaglie=a=>(a.taglie||[]).filter(t=>t&&t!=='UNICA').length>0;

function modColonne(D){
  const c=['Cognome','Nome','Numero maglia'];
  for(const a of modArticoli(D)){
    const et=artLabel(a.nome);
    c.push(et);
    if(modConTaglie(a)){c.push(et+' taglia');c.push(et+' taglia richiesta')}
  }
  c.push('Note');
  return c;
}

/* Il foglio esce gia' con dentro gli atleti che il programma conosce, e il
   numero di maglia che hanno: chi compila trova la sua squadra e riempie solo
   le caselle, senza riscrivere i nomi. */
function modRighe(D,squadra){
  const arts=modArticoli(D);
  return Object.entries(S.atlete)
    .filter(([id,a])=>a.squadra===squadra)
    .sort((x,y)=>norm(fullName(x[1])).localeCompare(norm(fullName(y[1]))))
    .map(([id,a])=>{
      const divisa=(D.perAtleta[id]||[]).map(x=>S.divise[x])
        .find(x=>x&&(x.modello||'STANDARD')===(D.lotto[squadra]||'STANDARD'));
      const riga=[a.cognome,a.nome,divisa?String(divisa.numero):''];
      for(const art of arts){riga.push('');if(modConTaglie(art)){riga.push('');riga.push('')}}
      riga.push(a.note||'');
      return riga});
}

function modIstruzioni(D){
  const arts=modArticoli(D);
  return ['MODULO DI DISTRIBUZIONE',
   '',
   'Un foglio per squadra: il nome del foglio e’ il nome della squadra, quindi',
   'non va riscritta su ogni riga e non si puo’ sbagliare. Le squadre e gli',
   'atleti che non ci sono vengono creati caricando il file.',
   '',
   'In ogni casella di un articolo si scrive una di queste tre cose:',
   '',
   '   ce l’ho        ce l’ha gia’, non gli serve niente',
   '   mi manca      gli serve: nasce una richiesta',
   '   da cambiare   ce l’ha ma va sostituito: nasce una richiesta, e quello',
   '                 che ha adesso risulta da restituire',
   '',
   'Lasciare la casella vuota vale come "ce l’ho": non succede niente.',
   '',
   'Colonne:',
   '',
   'Cognome, Nome        obbligatori',
   'Numero maglia        quello che ha adesso, non quello che chiede',
   '<articolo>           una delle tre risposte qui sopra',
   '<articolo> taglia    la taglia che ha adesso',
   '<articolo> taglia richiesta   quella che vuole, se diversa',
   'Note                 quello che non sta nelle caselle',
   '',
   'Se la taglia richiesta e’ vuota vale quella che ha.',
   '',
   'Articoli in questo modulo: '+arts.map(a=>artLabel(a.nome)).join(', '),
   '',
   'Caricare lo stesso file due volte non crea doppioni: gli atleti gia’',
   'presenti e le richieste uguali vengono saltati.',
   '',
   'NON mettere qui mail, telefoni o date delle visite mediche: il programma non',
   'li usa e sono dati di ragazzi spesso minorenni.'];
}

async function scaricaModulo(){
  if(!window.__APP){toast('Il modulo si scarica dal programma installato');return}
  const D=derive();
  const squadre=D.perServire;
  if(!squadre.length){toast('Prima servono le squadre');return}
  if(!modArticoli(D).length){toast('Prima servono gli articoli');return}
  // Il titolo della colonna e' l'unica cosa che lega la casella all'articolo:
  // se due articoli si chiamassero uguale, al ritorno non si saprebbe di chi
  // e' quella casella. Meglio fermarsi adesso che sbagliare dopo.
  const titoli=modArticoli(D).map(a=>KEY(artLabel(a.nome)));
  const doppio=titoli.find((t,i)=>titoli.indexOf(t)!==i);
  if(doppio){const quali=modArticoli(D).filter(a=>KEY(artLabel(a.nome))===doppio).map(a=>a.nome);
    toast(`Due articoli si leggono uguale (${quali.join(' e ')}): cambia l’etichetta a uno dei due, se no il modulo non si sa rileggere`);return}
  const colonne=modColonne(D);
  const fogli=squadre.map(s=>({nome:s.nome,intestazioni:colonne,righe:modRighe(D,s.nome)}));
  let dove;
  try{dove=await window.__APP.scegliDoveSalvare(`modulo-distribuzione-${today()}.xlsx`)}
  catch(e){toast('Non riesco ad aprire la finestra per salvare: '+e);return}
  if(!dove)return;
  try{await window.__APP.scriviExcelFogli(dove,fogli,modIstruzioni(D))}
  catch(e){toast('Non riesco a scrivere il file: '+e);return}
  toast(`Modulo salvato: ${fogli.length} ${fogli.length===1?'squadra':'squadre'}`);
}

/* Legge il modulo compilato. Tutto quello che non torna finisce nell'elenco dei
   problemi invece di fermare il caricamento: con centocinquanta righe scritte a
   mano, fermarsi alla prima storta vuol dire non caricare mai niente. */
async function caricaModulo(){
  if(!window.__APP){toast('Il modulo si carica dal programma installato');return}
  let file;
  try{file=await window.__APP.scegliDaAprire()}
  catch(e){toast('Non riesco ad aprire la finestra: '+e);return}
  if(!file)return;
  let fogli;
  try{fogli=await window.__APP.leggiExcelFogli(file)}
  catch(e){toast('Non riesco a leggere il file: '+e);return}

  const D=derive();
  const arts=modArticoli(D);
  // dal titolo della colonna all'articolo: si accetta l'etichetta o il codice
  const perTitolo={};
  for(const a of arts){perTitolo[KEY(artLabel(a.nome))]=a;perTitolo[KEY(a.nome)]=a}

  const daFare=[];const problemi=[];
  for(const [nomeFoglio,righe] of fogli){
    if(KEY(nomeFoglio)===KEY('Istruzioni')||!righe.length)continue;
    const squadra=String(nomeFoglio).trim().toUpperCase();
    const i0=righe.findIndex(r=>r.some(c=>KEY(c)===KEY('Cognome')));
    if(i0<0){problemi.push(`foglio ${nomeFoglio}: non trovo la riga dei titoli`);continue}
    const titoli=righe[i0].map(c=>String(c||'').trim());
    // ogni colonna: cosa vuol dire
    const mappa=titoli.map(t=>{
      const k=KEY(t);
      if(k===KEY('Cognome'))return{tipo:'cognome'};
      if(k===KEY('Nome'))return{tipo:'nome'};
      if(k===KEY('Numero maglia'))return{tipo:'numero'};
      if(k===KEY('Note'))return{tipo:'note'};
      const mR=t.match(/^(.*) taglia richiesta$/i);
      if(mR&&perTitolo[KEY(mR[1])])return{tipo:'tagliaRic',art:perTitolo[KEY(mR[1])]};
      const mT=t.match(/^(.*) taglia$/i);
      if(mT&&perTitolo[KEY(mT[1])])return{tipo:'taglia',art:perTitolo[KEY(mT[1])]};
      if(perTitolo[k])return{tipo:'risposta',art:perTitolo[k]};
      // Una colonna che non si riconosce non si butta via zitti: forse
      // l'articolo e' stato rinominato dopo aver consegnato il modulo, e chi
      // ha compilato si aspetta che quelle caselle contino.
      if(t)problemi.push(`foglio ${nomeFoglio}: la colonna "${t}" non corrisponde a nessun articolo, l’ho saltata`);
      return{tipo:'?'}});
    if(!mappa.some(m=>m.tipo==='cognome')){problemi.push(`foglio ${nomeFoglio}: manca la colonna Cognome`);continue}

    for(let i=i0+1;i<righe.length;i++){
      const riga=righe[i];const dati={squadra,articoli:{},note:''};
      mappa.forEach((m,c)=>{const v=String(riga[c]??'').trim();
        if(m.tipo==='cognome')dati.cognome=v;
        else if(m.tipo==='nome')dati.nome=v;
        else if(m.tipo==='numero')dati.numero=v;
        else if(m.tipo==='note')dati.note=v;
        else if(m.tipo==='risposta'||m.tipo==='taglia'||m.tipo==='tagliaRic'){
          const a=(dati.articoli[m.art.nome]=dati.articoli[m.art.nome]||{art:m.art});
          if(m.tipo==='risposta')a.risposta=v;
          else if(m.tipo==='taglia')a.taglia=v.toUpperCase();
          else a.tagliaRic=v.toUpperCase()}});
      if(!dati.cognome&&!dati.nome)continue;
      if(!dati.cognome||!dati.nome){problemi.push(`${nomeFoglio}: riga senza cognome o nome (${dati.cognome||dati.nome})`);continue}
      daFare.push(dati);
    }
  }
  if(!daFare.length){toast(problemi.length?problemi[0]:'Nel modulo non c’e’ nessuna riga compilata');
    S.app.problemiExcel=problemi;render();return}

  const quante=daFare.reduce((n,d)=>n+Object.values(d.articoli).filter(x=>['manca','cambia'].includes(modRisposta(x.risposta))).length,0);
  if(!confirm(`Caricare ${daFare.length} righe da ${new Set(daFare.map(d=>d.squadra)).size} squadre?\nNascono ${quante} richieste. Quello che c’e’ gia’ non viene toccato.`))return;

  S.busy=true;render();
  const esito={creati:0,aggiornati:0,saltati:0,problemi};
  try{
    const squadre=[...(D.set.squadre||[])];
    const viste=new Set(squadre.map(x=>KEY(x.nome)));
    // indice degli atleti gia' dentro, per non rifarli
    const perNome={};
    for(const [id,a] of Object.entries(S.atlete))perNome[KEY(a.squadra+'|'+a.cognome+'|'+a.nome)]=id;
    const richGia=new Set(Object.values(S.richieste).map(r=>KEY(r.atletaId+'|'+r.articolo+'|'+r.taglia)));

    for(const d of daFare){
      if(!viste.has(KEY(d.squadra))){squadre.push({nome:d.squadra,includi:true,modelloDivisa:'STANDARD'});viste.add(KEY(d.squadra))}
      const k=KEY(d.squadra+'|'+d.cognome+'|'+d.nome);
      let aid=perNome[k];
      if(!aid){
        const nuovo=await S.db.collection('atlete').add({squadra:d.squadra,cognome:d.cognome,nome:d.nome,attiva:true,note:d.note||''});
        aid=nuovo.id;perNome[k]=aid;esito.creati++;
      }else if(d.note&&!S.atlete[aid].note){
        await S.db.doc('atlete/'+aid).update({note:d.note});
      }
      for(const x of Object.values(d.articoli)){
        const r=modRisposta(x.risposta);
        if(r===''||r==='ha')continue;
        if(r==='?'){esito.problemi.push(`${d.cognome} ${d.nome}: non capisco "${x.risposta}" per ${artLabel(x.art.nome)}`);continue}
        const conNum=D.conNumero(x.art.nome);
        const taglia=(x.tagliaRic||x.taglia||(modConTaglie(x.art)?'':'UNICA')).toUpperCase();
        if(!taglia){esito.problemi.push(`${d.cognome} ${d.nome}: manca la taglia per ${artLabel(x.art.nome)}`);continue}
        const kr=KEY(aid+'|'+x.art.nome+'|'+taglia);
        if(richGia.has(kr)){esito.saltati++;continue}
        richGia.add(kr);
        await S.db.collection('richieste').add({atletaId:aid,articolo:x.art.nome,taglia,
          modello:conNum?'':'',numeroDesiderato:null,note:'',ordine:Date.now()});
        esito.aggiornati++;
        // "da cambiare" su una divisa: quella che ha adesso torna disponibile
        if(r==='cambia'&&conNum){
          const suo=Object.entries(S.divise).find(([id,dv])=>dv.holder===aid&&!dv.dismessa
            &&(!d.numero||Number(dv.numero)===Number(d.numero)));
          if(suo){if(!suo[1].daRestituire)await S.db.doc('divise/'+suo[0]).update({daRestituire:true})}
          else esito.problemi.push(`${d.cognome} ${d.nome}: dice di dover cambiare la divisa ma non ne risulta nessuna in mano${d.numero?' col n.'+d.numero:''}`);
        }
      }
    }
    if(squadre.length!==(D.set.squadre||[]).length)await S.db.doc('settings/main').update({squadre});
  }catch(e){S.busy=false;render();toast('Caricamento interrotto: '+e);return}
  S.busy=false;
  const pezzi=[];
  if(esito.creati)pezzi.push(`${esito.creati} atleti nuovi`);
  if(esito.aggiornati)pezzi.push(`${esito.aggiornati} richieste`);
  if(esito.saltati)pezzi.push(`${esito.saltati} gia’ presenti`);
  toast(pezzi.join(', ')||'niente da aggiungere');
  S.app.problemiExcel=esito.problemi;
  render();
}

async function scaricaModello(tipo){
  const m=MODELLI_EXCEL[tipo];if(!m)return;
  const dove=await window.__APP.scegliDoveSalvare(`${m.foglio.toLowerCase()}-${today()}.xlsx`);
  if(!dove)return;
  await window.__APP.scriviExcel(dove,m.foglio,m.colonne,m.righe(),m.istruzioni);
  toast('Modello salvato');
}

/* Legge il foglio compilato, dice cosa succederebbe, e applica se confermi. */
async function caricaModello(tipo){
  const m=MODELLI_EXCEL[tipo];if(!m)return;
  const file=await window.__APP.scegliDaAprire();
  if(!file)return;
  let righe;
  try{righe=await window.__APP.leggiExcel(file)}
  catch(e){toast('Non riesco a leggere il file: '+e);return}
  if(!righe.length){toast('Il foglio è vuoto');return}

  // La prima riga e' l'intestazione se somiglia alle nostre colonne.
  const prima=righe[0].map(KEY);
  const pareIntestazione=m.colonne.some(c=>prima.includes(KEY(c)));
  const dati=pareIntestazione?righe.slice(1):righe;
  if(!dati.length){toast('Nel foglio ci sono solo le intestazioni');return}

  if(!confirm(`Caricare ${dati.length} righe dal foglio ${m.nome}?\nQuello che c'è già non viene toccato: le righe doppie vengono saltate.`))return;

  S.busy=true;render();
  let esito;
  try{esito=await m.applica(dati)}
  catch(e){S.busy=false;render();toast('Caricamento interrotto: '+e);return}
  S.busy=false;

  const pezzi=[];
  if(esito.creati)pezzi.push(`${esito.creati} aggiunti`);
  if(esito.aggiornati)pezzi.push(`${esito.aggiornati} righe di magazzino`);
  if(esito.saltati)pezzi.push(`${esito.saltati} già presenti`);
  toast(pezzi.join(', ')||'niente da aggiungere');
  S.app.problemiExcel=esito.problemi;
  render();
}

function sezioneExcel(){
  const p=S.app.problemiExcel||[];
  return `<h2>Riempire da Excel</h2>
  <div class="list" style="margin-bottom:12px"><div class="item"><div class="main">
  <div class="name">Modulo di distribuzione</div>
  <div class="meta">Un foglio per squadra, gia' con dentro gli atleti. Chi compila scrive solo «ce l'ho», «mi manca» o «da cambiare».</div></div>
  <div class="right"><button type="button" class="btn small" data-act="scaricaModulo">Scarica</button>
  <button type="button" class="btn small primary" data-act="caricaModulo">Carica</button></div></div></div>
  <p class="sub">Scarica il foglio, compilalo (o fallo compilare ai dirigenti) e ricaricalo. I fogli escono già pieni di quello che c'è nel programma, quindi servono anche a controllare. Caricali in quest'ordine: le richieste hanno bisogno degli atleti, e gli atleti degli articoli.</p>
  <div class="list">`+
  Object.entries(MODELLI_EXCEL).map(([tipo,m],i)=>`<div class="item"><div class="main"><div class="name">${i+1}. ${esc(m.nome)}</div><div class="meta">${esc(m.colonne.join(' · '))}</div></div>
  <div class="right"><button type="button" class="btn small" data-act="scaricaXls" data-v="${tipo}">Scarica</button>
  <button type="button" class="btn small primary" data-act="caricaXls" data-v="${tipo}">Carica</button></div></div>`).join('')+
  `</div>`+
  (p.length?`<div class="list" style="margin-top:10px"><div class="item"><div class="main"><div class="name">Righe non caricate dall'ultimo foglio (${p.length})</div><div class="meta">${p.slice(0,12).map(esc).join('<br>')}${p.length>12?'<br>…e altre '+(p.length-12):''}</div></div></div></div>`:'');
}

/* ============ export ============ */
async function esporta(kind){
  const D=derive();const rows=[];const q=v=>{const s=String(v??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  if(kind==='atlete'){rows.push(['Squadra','Cognome','Nome','Attiva','Divise']);
    Object.entries(S.atlete).sort((a,b)=>(D.teamIdx[a[1].squadra]??99)-(D.teamIdx[b[1].squadra]??99)||norm(fullName(a[1])).localeCompare(norm(fullName(b[1])))).forEach(([id,a])=>rows.push([a.squadra,a.cognome,a.nome,a.attiva===false?'no':'si',(D.perAtleta[id]||[]).map(x=>{const d=S.divise[x];return`${d.taglia} ${d.numero}${d.modello!=='STANDARD'?' '+d.modello.toLowerCase():''}${d.daRestituire?' (da restituire)':''}`}).join(', ')]))}
  if(kind==='divise'){rows.push(['Modello','Taglia','Numero','Stato','Atleta','Squadra','Prenotata per','Note']);
    Object.entries(S.divise).sort((a,b)=>(a[1].modello||'').localeCompare(b[1].modello||'')||szIdx(a[1].taglia)-szIdx(b[1].taglia)||a[1].numero-b[1].numero).forEach(([id,d])=>{const a=S.atlete[d.holder];const pr=D.prenDivisa[id];
      rows.push([d.modello,d.taglia,d.numero,d.dismessa?'dismessa':!d.holder?'in magazzino':d.daRestituire?'in rientro':'in uso',a?fullName(a):'',a?a.squadra:'',pr?fullName(S.atlete[S.richieste[pr].atletaId]):'',d.note||''])})}
  if(kind==='materiale'){rows.push(['Articolo','Taglia','In magazzino','Prenotati','Dopo assegnazioni']);
    Object.entries(D.stock).sort().forEach(([k,s])=>{const [a,t]=k.split('|');if(D.conNumero(a))return;const p=D.prenMat[k]||0;rows.push([a,t,s.ora,p,s.ora-p])})}
  if(kind==='assegnazioni'){rows.push(['Squadra','Cognome','Nome','Articolo','Modello','Taglia','Numero chiesto','Esito','Numero proposto','Motivo','Nota']);
    D.order.forEach(rid=>{const r=S.richieste[rid];const a=S.atlete[r.atletaId]||{};const p=D.prop[rid];const d=p.divisaId?S.divise[p.divisaId]:null;
      rows.push([a.squadra,a.cognome,a.nome,r.articolo,D.conNumero(r.articolo)?D.modelloPer(r):(r.modello||''),r.taglia,r.numeroDesiderato??'',p.esito==='OK'?'pronta':p.esito==='MANCA'?'manca':'esclusa',d?d.numero:'',p.motivo||'',r.note||''])})}
  if(kind==='movimenti'){rows.push(['Data','Tipo','Atleta','Squadra','Articolo','Taglia','Numero','Quantita','Stagione','Nota']);
    Object.values(S.movimenti).sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(m=>{const a=S.atlete[m.atletaId];rows.push([m.data,m.tipo,a?fullName(a):'',a?a.squadra:'',m.articolo,m.taglia,m.numero??'',m.qta,m.stagione,m.note||''])})}
  const csv='\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n');
  const name=`magazzino-${kind}-${today()}.csv`;
  if(!S.dl){toast('Il download non è disponibile in questa vista.');return}
  try{await S.dl.save({filename:name,data:csv});toast('File pronto')}catch(e){if(e&&e.code==='declined')return;toast(e&&e.code==='rate_limited'?'Attendi un attimo e riprova.':'Download non riuscito.')}
}

/* ============ avvio ============ */
async function boot(){
  applicaTema();
  render();
  if(!window.claude||typeof window.claude.use!=='function'){S.status='offline';render();return}
  let db=null;try{db=await window.claude.use('db')}catch(e){db=null}
  if(!db){S.status='offline';render();return}
  S.db=db;S.status='ok';
  const onErr=e=>{S.status=e&&e.code==='revoked'?'revoked':'error';toast('Collegamento ai dati interrotto: ricarica la pagina.');render()};
  db.doc('settings/main').onSnapshot(s=>{S.settings=s.exists?s.data():null;S.loaded.add('settings');changed();
    // i dati di prima non avevano il codice corto degli articoli
    setTimeout(assegnaCodiciMancanti,0)},onErr);
  for(const c of COLS)db.collection(c).onSnapshot(q=>{const m={};for(const d of q.docs)m[d.id]=d.data();S[c]=m;S.loaded.add(c);changed()},onErr);
  window.claude.use('downloads').then(d=>{S.dl=d}).catch(()=>{});
  // Qualche secondo dopo l'avvio, senza disturbare: se c'è una versione nuova
  // compare l'avviso, se non c'è non succede niente.
  if(window.__APP)setTimeout(()=>{window.__APP.cercaAggiornamento()
    .then(v=>{if(v){S.app.nuovaVersione=v;toast(`C'è la versione ${v}: la installi da Impostazioni`);render()}})
    .catch(()=>{})},4000);
}
boot();
