    <span class="opzMag">${opzione}</span>${azione}</div>`;
  h+=S.ui.magTab==='divise'
    ?legenda(`<p>Le divise da gara, per lotto e per taglia: ogni riquadro rappresenta una maglia, con numero e taglia. Selezionando un riquadro si modificano taglia, numero, lotto e nota; una maglia in magazzino può inoltre essere segnata come dismessa. Normalmente sono visibili solo le maglie disponibili: l'opzione in alto mostra anche quelle in uso.</p>`,
      vociDivise(true))
    :legenda(`<p>Gli articoli con le rispettive taglie. <b>Totale</b> = consegnati + in magazzino. <b>Magazzino finale</b> = in magazzino − prenotati + ordinati, cioè la giacenza prevista dopo la consegna delle richieste e l'arrivo degli ordini.</p>
      <p>Selezionando una riga, o con <b>Carico</b>, si registrano i pezzi arrivati, si corregge la giacenza dopo un inventario e si indica la quantità ordinata al fornitore.</p>`,
      [['<span class="pill bad">−3</span>','mancano 3 pezzi per coprire le richieste'],
      ['<span class="neg" style="color:var(--bad);font-weight:700">−2</span>','giacenza negativa: da verificare con un inventario'],
      ['<span class="pill">fuori distribuzione</span>','resta in inventario ma non viene più proposto']]);
  if(S.ui.magTab!=='divise'){
    const neg=giacenzeNegative();
    return h+(neg.length?`<div class="notice bad">${neg.join('<br>')}</div>`:'')+vMateriale()}
  if(S.ui.magTab==='divise'){
    const probl=problemiDivise();
    if(probl.length)h+=`<div class="notice bad">${probl.join('<br>')}</div>`;
    const mods=[...new Set(Object.values(S.divise).map(d=>d.modello||'STANDARD'))].sort((a,b)=>(a==='STANDARD'?-1:b==='STANDARD'?1:a.localeCompare(b)));
    let trovate=0;
    for(const m of mods){
      const nD=S.ui.nDiv===''||S.ui.nDiv==null?null:Number(S.ui.nDiv);
      const ents=Object.entries(S.divise).filter(([id,d])=>(d.modello||'STANDARD')===m&&!d.dismessa&&(nD===null||Number(d.numero)===nD));
      if(nD!==null&&!ents.length)continue;
      trovate+=ents.length;
      const sizes=[...new Set(ents.map(e=>e[1].taglia))].sort((a,b)=>szIdx(a)-szIdx(b));
      const free=ents.filter(([id,d])=>(!d.holder||d.daRestituire)&&!D.prenDivisa[id]).length;
      h+=`<div class="group-head"><h2>${esc(nomeLotto(m,true))}</h2><span>${free} disponibili dopo le assegnazioni</span></div><div class="list">`;
      for(const s of sizes){
        const inS=ents.filter(e=>e[1].taglia===s).sort((a,b)=>a[1].numero-b[1].numero);
        const avail=inS.filter(([id,d])=>!d.holder||d.daRestituire);
        const inuse=inS.length-avail.length;
        const after=avail.filter(([id])=>!D.prenDivisa[id]).length;

        h+=`<div class="size-row"><div class="sz">${esc(s)}<small>${after} dopo</small></div><div><div class="chips">${shown.map(([id,d])=>{
          const pren=D.prenDivisa[id];const inU=d.holder&&!d.daRestituire;

      }
      h+=`</div>`;
    }
    if(S.ui.nDiv!==''&&S.ui.nDiv!=null&&!trovate)h+=`<div class="list"><p class="empty">Nessuna divisa con il numero ${esc(S.ui.nDiv)}.</p></div>`;
    return h;
  }
  return h;
}

function testaSquadre(){

       ['<span class="vuoto">—</span>','non consegnato']])

    <span class="opzMag"></span>
    <button type="button" class="btn" data-act="newAtleta">Aggiungi atleta</button>
    <button type="button" class="btn" data-act="newSquadra">Aggiungi squadra</button></div>`+spiega+
  `<div class="filters">
    <input type="search" id="qAtl" placeholder="Cerca per nome o cognome" value="${esc(S.ui.q)}" data-bind="q" autocomplete="off">

/* Chi ha cosa, tutto in una tabella, squadra per squadra.
   Sono le consegne meno i rientri: quello che gli atleti hanno davvero in mano
   adesso, non quello che era stato previsto. */
/* I numeri che una squadra porta davvero, con chi li porta. Le divise segnate
   da cambiare non contano: quelle stanno tornando indietro e il loro numero e'
   gia' libero per un'altra. */
function numeriDiSquadra(D,squadra){
  const per={};
  for(const [id,a] of Object.entries(S.atlete)){
    if(a.squadra!==squadra)continue;
    for(const did of (D.perAtleta[id]||[])){
      const d=S.divise[did];if(!d||d.dismessa||d.daRestituire)continue;
      (per[Number(d.numero)]=per[Number(d.numero)]||[]).push(fullName(a))}}
  return per;
}

/* Gli atleti che portano un numero gia' addosso a un compagno di squadra.
   Torna id -> i numeri in conflitto, cosi' ogni schermata puo' segnare la riga
   invece di lasciare l'errore scritto in un posto solo. */
function conNumeroDoppio(D){
  const fuori={};
  for(const sq of D.perServire){
    const per=numeriDiSquadra(D,sq.nome);
    for(const [n,chi] of Object.entries(per)){
      if(chi.length<2)continue;
      for(const [id,a] of Object.entries(S.atlete)){
        if(a.squadra!==sq.nome)continue;
        if(!chi.includes(fullName(a)))continue;
        (fuori[id]=fuori[id]||[]).push(Number(n));
      }}}
  return fuori;
}

function vRiepilogo(){
  const D=derive();
  const q=norm(S.ui.q);
  const nQ=S.ui.nAtl===''||S.ui.nAtl==null?null:Number(S.ui.nAtl);
  // Gli stessi filtri dell'elenco, e sono gli stessi anche nella memoria: si
  // cambia linguetta e si continua a guardare la stessa squadra.
  const tiene=(id,a)=>(!S.ui.team||a.squadra===S.ui.team)
    &&(!q||norm(fullName(a)).includes(q))
    &&(nQ===null||(D.perAtleta[id]||[]).some(x=>Number(S.divise[x].numero)===nQ));

  let html=testaSquadre();

  // Quali articoli compaiono davvero: inutile una colonna per chi non ha consegnato niente.
  const colonne=new Set();
  for(const dot of Object.values(D.dotazione))
    for(const [k,v] of Object.entries(dot))if(v>0)colonne.add(k.split('|')[0]);
  const arts=[...colonne].sort((a,b)=>artLabel(a).localeCompare(artLabel(b)));

  const conDivise=Object.keys(D.perAtleta).length>0;
  if(!arts.length&&!conDivise)
    return html+`<div class="list"><p class="empty">Nessuna consegna registrata finora: il riepilogo compare con le prime consegne.</p></div>`;

  const perSquadra={};
  for(const [id,a] of Object.entries(S.atlete))if(tiene(id,a))(perSquadra[a.squadra]=perSquadra[a.squadra]||[]).push([id,a]);
  const squadre=D.perServire.map(x=>x.nome).filter(n=>perSquadra[n]);
  for(const n of Object.keys(perSquadra))if(!squadre.includes(n))squadre.push(n);

  if(!squadre.length)return html+`<div class="list"><p class="empty">Nessun atleta con questi filtri.</p></div>`;
  // Il conto dei doppioni si fa su tutte le squadre, non solo su quelle
  // filtrate: se ne nascondi una con un doppione dentro, il cartello in cima
  // direbbe che va tutto bene.
  const doppioni=[];
  for(const s of D.perServire)
    for(const [n,chi] of Object.entries(numeriDiSquadra(D,s.nome)))
      if(chi.length>1)doppioni.push({squadra:s.nome,numero:n,chi});
  html+=doppioni.length
    ? `<div class="notice bad"><b>${doppioni.length} ${doppioni.length===1?'numero ripetuto':'numeri ripetuti'}</b> dentro una squadra: `
      +doppioni.map(x=>`${esc(teamLabel(x.squadra))} n.${esc(x.numero)} (${x.chi.map(esc).join(' e ')})`).join(' \u00b7 ')+`</div>`
    : `<div class="notice ok">Nessun numero ripetuto: in ogni squadra ogni numero e\u2019 di una persona sola.</div>`;

  const doppi=conNumeroDoppio(D);
  const totali={};let totDivise=0;
  for(const sq of squadre){
    const righe=perSquadra[sq].sort((x,y)=>norm(fullName(x[1])).localeCompare(norm(fullName(y[1]))));
    const conRoba=righe.filter(([id])=>(D.perAtleta[id]||[]).length||Object.values(D.dotazione[id]||{}).some(v=>v>0));
    if(!conRoba.length)continue;
    const numeri=numeriDiSquadra(D,sq);
    const inFila=Object.keys(numeri).map(Number).sort((x,y)=>x-y);
    html+=`<div class="group-head"><h2>${esc(teamLabel(sq))}</h2><span>${conRoba.length} ${conRoba.length===1?'atleta':'atleti'} con materiale</span></div>
    ${inFila.length?`<p class="filaNumeri">Numeri in campo: ${inFila.map(n=>`<span class="numTag${numeri[n].length>1?' doppio':''}" title="${esc(numeri[n].join(', '))}">${n}</span>`).join('')}</p>`:''}
    <div class="tabellaFuori"><table class="tab riepilogo" style="--colonne:${arts.length}"><thead><tr><th class="colAtleta">Atleta</th>${conDivise?'<th class="colDivise">Divise</th>':''}${arts.map(a=>`<th class="num">${esc(artLabel(a))}</th>`).join('')}</tr></thead><tbody>`;
    for(const [id,a] of conRoba){
      const divise=(D.perAtleta[id]||[]).map(x=>S.divise[x]).filter(Boolean);
      totDivise+=divise.length;
      html+=`<tr${doppi[id]?' class="conflitto"':''}><th scope="row"><a href="#atleta/${encodeURIComponent(id)}">${esc(fullName(a))}</a>${doppi[id]?` <span class="pill bad">${doppi[id].length===1?`n.${doppi[id][0]} doppio`:`numeri doppi: ${doppi[id].join(', ')}`}</span>`:''}</th>`;
      if(conDivise)html+=`<td>${divise.map(d=>`<span class="numTag${d.daRestituire?' da':''}" title="${d.daRestituire?'da cambiare':'in uso'}">${esc(d.numero)}<small>${esc(d.taglia)}</small></span>`).join(' ')||'<span class="vuoto">—</span>'}</td>`;
      for(const art of arts){
        const voci=Object.entries(D.dotazione[id]||{}).filter(([k,v])=>v>0&&k.split('|')[0]===art);
        const n=voci.reduce((t,[,v])=>t+v,0);
        if(n)totali[art]=(totali[art]||0)+n;
        html+=`<td class="num">${n?esc(voci.map(([k,v])=>{const tg=k.split('|')[1];return (v>1?v+'× ':'')+(tg&&tg!=='UNICA'?tg:'sì')}).join(', ')):'<span class="vuoto">—</span>'}</td>`;
      }
      html+=`</tr>`;
    }
    html+=`</tbody></table></div>`;
  }

  html+=`<div class="group-head"><h2>In tutto</h2><span>${S.ui.team||q||nQ!==null?'somma delle righe visualizzate':'somma di tutte le squadre'}</span></div><div class="list">`;
  if(conDivise)html+=`<div class="item"><div class="main"><div class="name">Divise assegnate agli atleti</div></div><div class="right"><b>${totDivise}</b></div></div>`;
  for(const a of arts)html+=`<div class="item"><div class="main"><div class="name">${esc(artLabel(a))}</div></div><div class="right"><b>${totali[a]||0}</b></div></div>`;
  return html+`</div>`;
}

/* Il magazzino del materiale: cosa esiste e quanti ce ne sono, nello stesso
   posto. Erano due schermate, ma sono lo stesso oggetto: una diceva le taglie,
   l'altra quante ne restavano, e per cambiare una taglia bisognava cambiare
   schermata. */
function vMateriale(){
  const D=derive();const arts=D.set.articoli||[];
  // Taglie che compaiono davvero: quelle dichiarate sull'articolo piu' quelle
  // che si trovano in magazzino e che magari nessuno ha mai dichiarato.
  const taglieDi={};
  for(const a of arts)taglieDi[a.nome]=new Set(a.taglie||[]);
  // Le taglie delle stagioni passate si nascondono davvero. Il secondo giro
  // pesca dalle giacenze, che non sanno di che stagione sono: senza questo
  // elenco le rimetteva dentro tutte, e la spunta non serviva a niente.
  const passate=new Set();
  for(const m of Object.values(S.materiale)){
    if(m.precedente&&!S.ui.showOld){passate.add(D.key(m.articolo,m.taglia));continue}
    (taglieDi[m.articolo]=taglieDi[m.articolo]||new Set()).add(m.taglia)}
  for(const k of Object.keys(D.stock)){
    if(passate.has(k))continue;
    const [a,t]=k.split('|');
    (taglieDi[a]=taglieDi[a]||new Set()).add(t)}
  for(const n of Object.keys(taglieDi))if(!taglieDi[n].size)delete taglieDi[n];

  // Articoli che non stanno in anagrafica ma hanno pezzi in magazzino: capita
  // coi lasciti delle stagioni passate, e non vanno persi.
  const noti=new Set(arts.map(a=>a.nome));
  const orfani=Object.keys(taglieDi).filter(n=>!noti.has(n));

  const perFam={};
  arts.forEach((a,i)=>{const f=a.famiglia||'';(perFam[f]=perFam[f]||[]).push([a,i])});
  if(orfani.length)perFam['']=(perFam['']||[]).concat(orfani.map(n=>[{nome:n},-1]));
  const fam=Object.keys(perFam).sort((x,y)=>x===''?1:y===''?-1:x.localeCompare(y));

  let h='';
  for(const f of fam){
    h+=`<div class="group-head"><h2>${f?esc(cap(f)):'Senza famiglia'}</h2><span>${perFam[f].length} ${perFam[f].length===1?'articolo':'articoli'}</span></div>`;
    for(const [a,i] of perFam[f]){
      const ts=[...(taglieDi[a.nome]||[])].sort((x,y)=>szIdx(x)-szIdx(y)||x.localeCompare(y));
      const conNum=D.conNumero(a.nome);
      const conti=t=>{const k=D.key(a.nome,t);const q=D.stock[k]||{ora:0,consegne:0,rientri:0,ordinati:0};
        const st=q.ora;const fuori=Math.max(0,(q.consegne||0)-(q.rientri||0));const p=D.prenMat[k]||0;
        const ord=q.ordinati||0;const tot=st+fuori;
        const mancano=Object.entries(D.prop).filter(([rid,pp])=>pp.esito==='MANCA'&&S.richieste[rid].articolo===a.nome&&S.richieste[rid].taglia===t).length;
        // Il finale e' quello che resta quando tutte le richieste sono servite e
        // gli ordini sono arrivati: anche quelle che oggi mancano.
        return {st,fuori,p,ord,tot,dopo:st-p-mancano+ord,mancano}};
      const cella=c=>`<b class="${c.dopo<=0&&c.mancano?'neg':''}">${c.dopo}${c.mancano?` <span class="pill bad">−${c.mancano}</span>`:''}</b>`;
      // Taglia unica: i tre numeri stanno accanto al nome. Una tabella di due
      // righe per un numero solo era mezzo schermo buttato via.
      const stessoNome=norm(a.nome).replace(/\s+/g,'')===norm(artSolo(a.nome)).replace(/\s+/g,'');
      const sotto=[a.codice?`<b>${esc(a.codice)}</b>`:'',stessoNome?'':esc(a.nome),a.stagione?esc(a.stagione):''].filter(Boolean).join(' · ');
      let unica='';
      if(!conNum&&ts.length===1){
        const c=conti(ts[0]);
        unica=`<span class="artUnica" data-act="matRow" data-art="${esc(a.nome)}" data-tg="${esc(ts[0])}" tabindex="0" role="button" title="Registrare un carico o correggere la giacenza">
        <span><small>Totale</small><b>${c.tot||'—'}</b></span>
        <span><small>Consegnati</small><b>${c.fuori||'—'}</b></span>
        <span><small>In magazzino</small><b>${c.st}</b></span>
        <span><small>Prenotati</small><b>${c.p||'—'}</b></span>
        <span><small>Ordinati</small><b>${c.ord||'—'}</b></span>
        <span><small>Magazzino finale</small>${cella(c)}</span>
        <span class="btn small ghost" aria-hidden="true">Carico</span></span>`;
      }
      h+=`<div class="artBox">
      <div class="artTesta">
        <div class="main"><div class="name">${esc(artSolo(a.nome))}${a.distribuibile===false?' <span class="pill">fuori distribuzione</span>':''}</div>
        ${sotto?`<div class="meta">${sotto}</div>`:''}</div>
        ${i>=0?`<button type="button" class="btn small modArt" data-act="modArticolo" data-i="${i}">Modifica articolo</button>`:'<span class="meta modArt">non in anagrafica</span>'}
        <div class="right">${unica}</div>
      </div>`;
      if(conNum){
        const quante=Object.values(S.divise).filter(d=>!d.dismessa).length;
        h+=`<p class="sub artNota">Ha il numero stampato: i capi si contano uno per uno in <a href="#magazzino" data-act="magTab" data-v="divise">Divise</a> (${quante} capi).</p>`;
      }else if(!ts.length){
        h+=`<p class="sub artNota">Nessuna taglia: si aggiungono da «Modifica articolo».</p>`;
      }else if(!unica){
        h+=`<div class="table-wrap"><table><thead><tr><th>Taglia</th><th class="num">Totale</th><th class="num">Consegnati</th><th class="num">In magazzino</th><th class="num">Prenotati</th><th class="num">Ordinati</th><th class="num">Magazzino finale</th><th></th></tr></thead><tbody>`;
        for(const t of ts){
          const c=conti(t);
          h+=`<tr class="click" data-act="matRow" data-art="${esc(a.nome)}" data-tg="${esc(t)}" tabindex="0" title="Registrare un carico o correggere la giacenza">
          <td>${t==='UNICA'?'unica':esc(t)}${a.codice?`<small class="codTg">${esc(artCodiceTaglia(a.nome,t))}</small>`:''}</td><td class="num meta">${c.tot||''}</td><td class="num meta">${c.fuori||''}</td>
          <td class="num${c.st<0?' neg':''}">${c.st}</td><td class="num">${c.p||''}</td><td class="num meta">${c.ord||''}</td>
          <td class="num">${cella(c)}</td>
          <td class="num"><span class="btn small ghost" aria-hidden="true">Carico</span></td></tr>`;
        }
        h+=`</tbody></table></div>`;
      }
      h+=`</div>`;
    }
  }
  if(!fam.length)return `<div class="list"><p class="empty">Non c'è ancora nessun articolo. Per iniziare aggiungere un articolo, oppure caricarli da un foglio Excel (Impostazioni &rarr; Fogli Excel).</p></div>`;
  return h;
}

/* La pagina di partenza. Sei riquadri, uno per sezione, ognuno con il numero
   che conta davvero in quella sezione: cosi' aprendo il programma si vede
   subito se c'e' qualcosa da fare, senza entrare da nessuna parte. */
/* La pagina di partenza: lo stemma della societa' se c'e', i numeri che
   contano, e una porta sola per consegnare. I riquadri portano ognuno alla
   sua schermata. */
function vHome(){
  const D=derive();
  const esiti={OK:0,MANCA:0,ESCLUSA:0};Object.values(D.prop).forEach(p=>esiti[p.esito]++);
  const nAtleti=Object.keys(S.atlete).length;
  const nSquadre=(D.set.squadre||[]).length;
  const divise=Object.values(S.divise).filter(d=>!d.dismessa);
  const libere=divise.filter(d=>!d.holder||d.daRestituire).length;
  const pezzi=Object.values(D.stock).reduce((t,x)=>t+Math.max(0,x.ora),0);
  const oggi=Object.values(S.movimenti).filter(m=>m.data===today()).length;
  // La copertina parla solo se c'e' qualcosa da sistemare. Un numero portato
  // da due persone della stessa squadra e' l'unico errore che si paga in
  // palestra: e' l'unico che vale la pena gridare da qui.
  const doppioni=[];
  for(const sq of D.perServire)
    for(const [n,chi] of Object.entries(numeriDiSquadra(D,sq.nome)))
      if(chi.length>1)doppioni.push({squadra:sq.nome,numero:n});
  const v=window.__APP?window.__APP.versione():null;
  const soc=(D.set.societa||'').trim();
  const logo=D.set.logo;

  const riquadro=(href,titolo,grosso,sotto,allarme)=>`<a class="cartaHome${allarme?' allarme':''}" href="${href}">
    <div class="grosso">${grosso}</div><div class="titolo">${esc(titolo)}</div><div class="sotto">${sotto}</div></a>`;

  return `<div class="copertina">
    <span class="copertinaStemma">${logo?`<img src="${esc(logo)}" alt="">`:MARCHIO}</span>
    ${soc?`<h1>${esc(soc)}</h1><p class="copertinaSub">Magazzino${D.set.stagione?` · ${esc(D.set.stagione)}`:''}</p>`
      :`<h1>Magazzino</h1><p class="copertinaSub">${esc(D.set.stagione||'')}</p>`}
  </div>
  <div class="grigliaHome">
    ${riquadro('#squadre','Squadre',nSquadre,'lotti, ordine di distribuzione, liste')}
    ${riquadro('#squadre/riepilogo','Atleti',nAtleti,'dotazione di ogni atleta')}
    ${riquadro('#assegnazioni','Assegnazioni',esiti.OK,`pronte da consegnare${esiti.MANCA?` \u00b7 <b>${esiti.MANCA} da ordinare</b>`:''}`,esiti.MANCA>0)}
    ${riquadro('#magazzino','Magazzino',libere,`divise libere \u00b7 ${pezzi} ${pezzi===1?'pezzo':'pezzi'} di materiale`)}
    ${riquadro('#movimenti','Movimenti',oggi,oggi===1?'registrato oggi':'registrati oggi')}
    ${riquadro('#impostazioni','Impostazioni','⚙','stagione, società, fogli Excel, copie di sicurezza')}
  </div>
  <p class="sottoGriglia"><a class="btn" href="#manuale">Manuale</a></p>
  ${doppioni.length?`<p class="allarmeHome"><a href="#squadre">${doppioni.length===1
    ?'Un numero è portato da due atleti della stessa squadra'
    :`${doppioni.length} numeri sono portati da due atleti della stessa squadra`}: ${doppioni.slice(0,4).map(x=>`${esc(teamLabel(x.squadra))} n.${esc(x.numero)}`).join(', ')}${doppioni.length>4?(doppioni.length===5?' e un altro':` e altri ${doppioni.length-4}`):''}</a></p>`:''}
  <p class="versione">${v?`Versione ${esc(v)}`:'Versione di prova nel browser'}</p>`;
}

/* ---- Squadre ---- */
/* ============ il manuale ============
   Spiega il programma dentro il programma, cosi' non finisce in un foglio che
   nessuno ritrova. Qualche numero lo legge dall'archivio vero (quante squadre,
   quali articoli, che stagione): quelle righe non possono invecchiare.

   REGOLA: quando cambia un comportamento, si cambia anche qui. Sta scritto
   anche nel CLAUDE.md del progetto. */
function vManuale(){
  const D=derive();
  const v=window.__APP?window.__APP.versione():null;
  const nSq=(D.set.squadre||[]).length;
  const nAtl=Object.keys(S.atlete).length;
  const arts=(D.set.articoli||[]).filter(a=>a.distribuibile!==false);
  const fam={};for(const a of arts)(fam[a.famiglia||'senza famiglia']=fam[a.famiglia||'senza famiglia']||[]).push(artSolo(a.nome));
  const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();

  const sezione=(titolo,corpo)=>`<details class="man"><summary>${esc(titolo)}</summary><div class="manCorpo">${corpo}</div></details>`;

  return `<h1>Manuale</h1>
  <p class="sub">Guida all'uso del programma.${v?` Versione ${esc(v)}.`:''} Ogni sezione si apre selezionandone il titolo.</p>

  ${sezione('Panoramica',`
    <p>Il programma registra <b>la dotazione di ogni atleta</b> e la situazione del magazzino. Il magazzino comprende le <b>divise da gara</b>, gestite capo per capo perché ciascuna ha un numero, e il <b>materiale</b> (t-shirt, felpe, borracce e simili), gestito a quantità per taglia.</p>
    <p>Le <b>richieste</b> collegano le due parti: ogni richiesta indica un articolo che un atleta deve ricevere. Per ciascuna il programma propone il capo da consegnare in base alla disponibilità; alla consegna la richiesta si chiude e la giacenza si aggiorna. Le proposte vengono ricalcolate automaticamente a ogni modifica; le consegne registrate non vengono mai ricalcolate.</p>
    <p>Attualmente l'archivio contiene <b>${nSq} squadre</b>, <b>${nAtl} atleti</b> e <b>${arts.length} articoli</b> in distribuzione.</p>`)}

  ${sezione('Termini utilizzati',`
    <p><b>Codice</b> — la sigla breve dell'articolo, ad esempio A002. Con la taglia diventa A002_M ed è la forma da utilizzare negli ordini. Per le taglie espresse in anni la parola «anni» è omessa: A008_5-6. I codici mancanti vengono assegnati automaticamente all'avvio.</p>
    <p><b>Nome interno</b> — il nome in maiuscolo, ad esempio TEE NERA ALLENAMENTO. Collega magazzino, richieste e movimenti e non può essere modificato: se il capo cambia modello si crea un nuovo articolo.</p>
    <p><b>Famiglia</b> ed <b>etichetta</b> — determinano come l'articolo viene visualizzato: la famiglia raggruppa (Tee), l'etichetta distingue all'interno della famiglia (Nera allenamento). Possono essere modificate in qualsiasi momento.</p>
    <p><b>Stagione dell'articolo</b> — nella finestra <i>Modifica articolo</i> la casella «Articolo di questa stagione» indica se l'articolo appartiene alla stagione in corso. Solo questi articoli, e quelli senza stagione indicata, compaiono nel modulo di distribuzione.</p>
    <p><b>Si può ancora consegnare</b> — togliendo questa spunta l'articolo resta in inventario ma non viene più proposto. Con <i>Mostra le stagioni precedenti</i>, in Magazzino → Materiale, si visualizzano anche gli articoli delle stagioni passate.</p>
    <p><b>Lotto</b> — l'insieme di divise da cui attinge una squadra. La maggior parte delle squadre utilizza il lotto standard; una squadra può averne uno riservato. Le <b>maglie da libero</b> costituiscono un lotto comune a tutte le squadre.</p>
    <p><b>Ordine di distribuzione</b> — il numero indicato sulla riga della squadra. Stabilisce quale squadra viene servita per prima quando il materiale non è sufficiente e l'ordine in cui le squadre compaiono in tutte le schermate. Le richieste con un numero di maglia preciso hanno comunque la precedenza.</p>
    <p><b>In distribuzione</b> — la casella sulla riga della squadra: togliendola, le richieste della squadra non vengono servite.</p>
    <p><b>Da cambiare</b> — un capo in uso che l'atleta deve sostituire. Alla consegna del capo nuovo quello precedente rientra automaticamente.</p>
    <p><b>Prenotata</b> — una divisa già proposta per una richiesta aperta: non è ancora consegnata, ma non è disponibile per altre richieste.</p>
    <p><b>Provvisoria</b> — una consegna in taglia diversa da quella richiesta, in attesa della taglia corretta: la richiesta resta aperta e la maglia resta all'atleta finché non arriva quella giusta.</p>
    <p><b>Atleta attivo</b> — la casella in <i>Modifica atleta</i>: un atleta non attivo non riceve consegne.</p>
    <p><b>In uscita</b> — un atleta che lascia la società e non ha ancora restituito tutto il materiale. Non riceve ulteriori consegne e viene cancellato solo a restituzione completata. Salvando la sua scheda da <i>Modifica atleta</i> torna un atleta normale.</p>`)}

  ${sezione('La pagina iniziale',`
    <p>All'apertura il programma mostra lo stemma e il nome della società, la stagione e sei riquadri: <b>Squadre</b> (elenco delle squadre), <b>Atleti</b> (riepilogo della dotazione di ogni atleta), <b>Assegnazioni</b>, <b>Magazzino</b>, <b>Movimenti</b> e <b>Impostazioni</b>. Sotto i riquadri si trova il pulsante <b>Manuale</b>; in fondo, la versione del programma. Nel menu in alto delle altre schermate le voci sono nello stesso ordine.</p>
    <p>Se in una squadra due atleti hanno lo stesso numero di maglia, sotto il pulsante Manuale compare un avviso in rosso che indica squadra e numero.</p>`)}

  ${sezione('Le schermate',`
    <p>In ogni schermata, e nella scheda di ciascun atleta, la voce <b>Come funziona questa schermata</b> ne riassume l'uso e il significato dei colori.</p>
    <p><b>Squadre</b> — due schede. <i>Atleti</i>: una riga per squadra, con nome, lotto, casella «in distribuzione», ordine di distribuzione e i pulsanti <b>Consegna a tutti</b>, <b>Scarica lista</b> ed <b>Elimina</b> (possibile solo per una squadra senza atleti); con <b>+</b> si visualizzano gli atleti, modificabili direttamente sulla riga, e con <b>Apri</b> si accede alla loro scheda. <i>Riepilogo</i>: la dotazione attuale di ogni atleta e i numeri in uso in ciascuna squadra. Le due schede hanno gli stessi filtri (nome, squadra, numero di maglia) e gli stessi pulsanti <b>Aggiungi atleta</b> e <b>Aggiungi squadra</b>. Gli atleti la cui squadra non è più nell'elenco compaiono in fondo, con il pulsante per aggiungerla.</p>
    <p><b>Scheda dell'atleta</b> — divise, materiale e richieste dell'atleta, con i pulsanti <b>Consegna diretta</b>, <b>Nuova richiesta</b> e <b>Modifica atleta</b>. Ogni richiesta si modifica con ✎ e si elimina con ✕. Una nuova richiesta indica articolo e taglia e, per le divise, il tipo (divisa della squadra o maglia da libero) e l'eventuale numero desiderato.</p>
    <p><b>Assegnazioni</b> — due schede. <i>Richieste</i>: le richieste aperte, raggruppate per squadra, con il capo proposto dal programma e i filtri per squadra, esito, articolo e numero. <i>Da ordinare</i>: i pezzi da ordinare al fornitore, per articolo e taglia, al netto di quelli già ordinati.</p>
    <p><b>Magazzino</b> — due schede. <i>Divise</i>: le maglie una per una, per lotto e taglia (verde in magazzino, gialla in uso, tratteggiata da cambiare, azzurra prenotata; bianca se da libero, nera se di un lotto riservato); <b>Aggiungi divisa</b> inserisce un capo nuovo. <i>Materiale</i>: per ogni articolo e taglia sei valori: <i>totale</i> (in magazzino + consegnati), <i>consegnati</i>, <i>in magazzino</i>, <i>prenotati</i>, <i>ordinati</i> al fornitore e non ancora arrivati, <i>magazzino finale</i> (in magazzino − prenotati − mancanti + ordinati). Selezionando una riga si apre la finestra del carico: <b>Registra arrivo</b> aggiunge i pezzi arrivati e li scala dagli ordinati, <b>Correggi giacenza</b> sostituisce la giacenza dopo un inventario, e si indica la quantità ordinata. Eventuali incongruenze sono segnalate in cima alla scheda.</p>
    <p><b>Movimenti</b> — il registro di consegne, rientri, carichi e rettifiche, dal più recente; vengono mostrati gli ultimi 150, con il pulsante per visualizzarli tutti. <b>Registra movimento</b> inserisce un movimento manuale di materiale.</p>
    <p><b>Impostazioni</b> — stagione in corso, nome e stemma della società, fogli Excel (scaricare e caricare i dati, scaricare i movimenti), codici degli articoli, aspetto (chiaro, scuro o come il computer), aggiornamenti e copie di sicurezza. Le funzioni che lavorano con i file sono disponibili nel programma installato.</p>`)}

  ${sezione('La regola dei numeri',`
    <p>All'interno di una squadra <b>un numero di maglia non può ripetersi</b>. Tra squadre diverse lo stesso numero è invece ammesso.</p>
    <p>Nel proporre le divise il programma dà la precedenza al numero richiesto; poi al numero della maglia che l'atleta sta cambiando, che resta riservato a lei; poi alla maglia che un compagno di squadra deve sostituire (lo scambio); infine al numero libero più basso. A un atleta non viene mai proposta la maglia che sta restituendo.</p>
    <p>La regola viene controllata anche nelle consegne manuali, nella modifica del numero di una divisa, quando una maglia torna «in uso» con <i>Non la cambia più</i> e quando un atleta viene spostato in un'altra squadra: in quest'ultimo caso, se il suo numero è già in uso, la sua maglia viene segnata da cambiare.</p>
    <p>Un eventuale numero ripetuto è segnalato nella pagina iniziale, sulla riga della squadra (anche se chiusa), sulle righe degli atleti interessati, nel Riepilogo e sulle richieste di divise.</p>`)}

  ${sezione('Consegne e rientri',`
    <p>Le consegne si registrano in quattro modi; in tutti la richiesta corrispondente, se c'è, si chiude.</p>
    <p>1. <b>Da richiesta</b> — in Assegnazioni, il pulsante <b>Consegna</b> sulla richiesta registra la consegna del capo proposto e, se l'atleta sta cambiando maglia, il ritiro di quella vecchia.</p>
    <p>2. <b>Consegna diretta</b> — dalla scheda dell'atleta, senza una richiesta; per le divise si sceglie la maglia tra quelle disponibili con un numero libero nella squadra.</p>
    <p>3. <b>Consegna a tutti</b> — dalla riga della squadra, per il solo materiale: una taglia per tutti, con la possibilità di escludere chi possiede già l'articolo. La stessa finestra consente il ritiro dall'intera squadra, senza superare quanto consegnato a ciascuno.</p>
    <p>4. <b>Registra movimento</b> — in Movimenti, per il materiale fuori dalle richieste: a un atleta, oppure a staff ed esterni indicandone nome e ruolo.</p>
    <p>Gli atleti in uscita o non attivi non ricevono consegne. Se la taglia richiesta non è disponibile, sulla richiesta compare <b>Altra taglia</b>: elenca le maglie disponibili a partire dalle taglie più vicine, con i soli numeri liberi nella squadra, e consente una consegna provvisoria.</p>
    <p>I rientri si registrano dalla scheda dell'atleta con <b>Restituita</b> (divise) o <b>Restituito</b> (materiale), oppure con Registra movimento e con il ritiro da tutta la squadra. <b>Segna da cambiare</b> indica una divisa come da sostituire.</p>`)}

  ${sezione('Annullare un movimento',`
    <p>In Movimenti, <b>Annulla</b> rimette il magazzino nella situazione precedente. Una consegna con il ritiro della maglia vecchia si annulla per intero, e la richiesta consegnata torna aperta; l'annullamento di un carico rimette tra gli ordinati i pezzi che aveva scalato.</p>
    <p>L'annullamento non è consentito se dopo quel movimento ne sono stati registrati altri sullo stesso capo o, per il materiale di un atleta, sullo stesso articolo; se la giacenza scenderebbe sotto zero; se la divisa tornerebbe a un atleta non più in archivio. In questi casi occorre annullare prima i movimenti successivi o correggere la giacenza.</p>`)}

  ${sezione('Atleti in due squadre',`
    <p>Un atleta tesserato in due squadre ha una scheda per ciascuna squadra. Quando lo stesso nome compare in squadre diverse, in Squadre il programma chiede se si tratta della stessa persona; il collegamento si imposta o si toglie anche da <i>Modifica atleta</i>, alla voce «Gioca anche in un'altra squadra con la scheda di».</p>
    <p>Le schede collegate riportano «gioca anche in …». Le <b>divise</b> restano una per squadra, ciascuna con la regola dei numeri della propria squadra. Il <b>materiale</b> si consegna una volta sola: se entrambe le schede lo richiedono, viene preparato per la squadra che viene prima nell'ordine di distribuzione e l'altra richiesta risulta coperta.</p>`)}

  ${sezione('Uscita di un atleta',`
    <p>Dalla scheda dell'atleta, <b>Modifica atleta</b> → <b>Elimina</b>. Se l'atleta non ha materiale, viene cancellato dopo la conferma.</p>
    <p>Se ha ancora materiale, si apre l'elenco dei capi in suo possesso: si selezionano quelli restituiti, che rientrano in magazzino. Finché manca qualcosa l'atleta resta nell'archivio contrassegnato <b>in uscita</b>; alla restituzione dell'ultimo capo, anche se registrata dalla sua scheda, il programma propone la cancellazione. Il suo nome rimane comunque nel registro dei movimenti.</p>`)}

  ${sezione('Fogli Excel',`
    <p>In <b>Impostazioni → Fogli Excel</b> si trovano tutti i file che il programma scarica e carica: il modulo di distribuzione, i quattro fogli dei dati e il registro dei movimenti. L'unico altro file è la <b>lista di squadra</b>, sulla riga di ogni squadra.</p>
    <p>Il <b>modulo di distribuzione</b> è destinato ai dirigenti: contiene un foglio per squadra con gli atleti già inseriti e gli articoli della stagione in corso. Per ogni articolo con taglie sono previste tre colonne: la risposta (<i>ce l'ho</i>, <i>mi manca</i>, <i>da cambiare</i>; la casella vuota equivale a <i>ce l'ho</i>), la <i>taglia</i> attuale e la <i>taglia richiesta</i>, da compilare solo se diversa; gli articoli senza taglie hanno la sola risposta. La colonna <i>Numero maglia</i> riporta il numero attuale; la colonna <i>Note</i> è libera. Al caricamento vengono creati squadre, atleti e richieste; un foglio copiato dentro Excel viene ricondotto alla sua squadra, e un foglio che non corrisponde a nessuna squadra viene segnalato prima di crearne una nuova.</p>
    <p>Gli altri quattro fogli servono al caricamento iniziale e vanno caricati in quest'ordine: <b>Articoli e magazzino</b>, <b>Squadre e atleti</b>, <b>Divise da gara</b>, <b>Richieste</b>. Vengono scaricati già compilati con i dati presenti nel programma, con in fondo alcune colonne solo informative (per esempio consegnati, prenotati e magazzino finale per gli articoli, esito e numero proposto per le richieste), che al caricamento vengono ignorate. Il foglio <b>Movimenti</b> si scarica soltanto. Le colonne sono riconosciute dal titolo: un foglio con colonne mancanti o ripetute viene rifiutato.</p>
    <p>Le taglie devono corrispondere a quelle previste per l'articolo; negli articoli delle richieste si può indicare il nome, il codice o il nome visualizzato. Il caricamento aggiunge soltanto: i dati già presenti non vengono modificati, il caricamento ripetuto dello stesso file non crea duplicati e non ricrea le richieste già consegnate.</p>
    <p>Prima di caricare, il programma controlla ogni riga e mostra un riepilogo: cosa verrà aggiunto, cosa verrà ignorato perché già presente, le squadre e i lotti nuovi e le righe con errori, che non vengono caricate (per esempio un valore non ammesso, una taglia che Excel ha trasformato in data, un numero di maglia fuori dall'intervallo 0–99, un atleta o un articolo inesistente). Segnala inoltre, come avvisi, le situazioni da verificare: righe ripetute, giacenze diverse da quelle nel programma, numeri di maglia già in uso nella squadra, note che sembrano contenere recapiti (che non vengono caricate). Errori e avvisi dell'ultimo caricamento restano elencati in Impostazioni.</p>`)}

  ${sezione('Lista di squadra',`
    <p>In <b>Squadre</b>, sulla riga di ogni squadra, il pulsante <b>Scarica lista</b> produce un file Excel con gli articoli da ritirare e da consegnare a ciascun atleta, lo stato di ogni capo e una colonna per la firma. Le consegne effettuate vanno poi registrate nel programma. La funzione è disponibile nel programma installato.</p>`)}

  ${sezione('Dati, copie di sicurezza e aggiornamenti',`
    <p>I dati sono conservati <b>su questo computer</b>, in un file locale: non vengono trasmessi in rete e non richiedono un account. Il programma si apre una sola volta: aprendolo di nuovo si torna alla finestra già aperta.</p>
    <p>In ogni giornata di utilizzo il programma salva automaticamente una copia dell'archivio com'era prima della prima modifica del giorno e conserva le ultime 30; prima di ogni ripristino salva anche una copia dei dati del momento. In <b>Impostazioni → Copie di sicurezza</b> le copie automatiche si riprendono direttamente dall'elenco; è inoltre possibile salvare una copia in una posizione a scelta, riprendere i dati da un file e scegliere la cartella delle copie automatiche.</p>
    <p>Se alla chiusura le ultime modifiche non risultano salvate, il programma lo segnala e chiede se chiudere comunque.</p>
    <p>Pochi secondi dopo l'avvio il programma verifica la disponibilità di una nuova versione e, se presente, lo segnala. L'installazione si avvia da <b>Impostazioni → Aggiornamenti</b>: il programma scarica la versione nuova mostrando l'avanzamento, salva i dati, la installa e si riapre automaticamente. I dati non vengono modificati.</p>
    <p>L'aspetto segue il tema del computer, chiaro o scuro; in <b>Impostazioni → Come si vede</b> è possibile sceglierlo manualmente.</p>`)}

  ${sezione('Articoli in distribuzione',
    Object.keys(fam).sort().map(f=>`<p><b>${esc(cap1(f))}</b> — ${esc(fam[f].join(', '))}</p>`).join('')
    +`<p class="sub">L'elenco è letto dall'archivio e si aggiorna automaticamente quando si aggiungono o si tolgono articoli.</p>`)}
  `;
}

/* Il foglio della squadra, quello che si porta in palestra: chi deve
   riconsegnare qualcosa e chi deve ricevere qualcosa, una riga per capo, con
   lo spazio per la firma. Su carta serve sapere tre cose - chi, cosa, e se
   c'e' - e niente altro. */
async function fogliaSquadra(nome){
  if(!window.__APP){toast('Il foglio si scarica dal programma installato');return}
  const D=derive();
  const atleti=Object.entries(S.atlete).filter(([id,a])=>a.squadra===nome)
    .sort((x,y)=>norm(fullName(x[1])).localeCompare(norm(fullName(y[1]))));
  if(!atleti.length){toast('La squadra non ha atleti');return}

  const righe=[];
  for(const [id,a] of atleti){
    // prima quello che deve tornare indietro: in palestra si ritira e si consegna
    for(const did of (D.perAtleta[id]||[])){
      const d=S.divise[did];if(!d.daRestituire)continue;
      righe.push([a.cognome,a.nome,'RICONSEGNA',artLabel(artDivisa())+((d.modello||'STANDARD')!=='STANDARD'?' '+cap(d.modello):''),d.taglia,String(d.numero),'da ritirare',d.note||'','']);
    }
    for(const rid of D.order){
      const r=S.richieste[rid];if(!r||r.atletaId!==id)continue;
      const p=D.prop[rid]||{};const d=p.divisaId?S.divise[p.divisaId]:null;
      const stato=p.esito==='OK'?(d&&d.holder&&d.holder!==id?'in rientro da un compagno':'pronta'):p.esito==='MANCA'?'DA ORDINARE':'esclusa';
      righe.push([a.cognome,a.nome,'RICEVE',artLabel(r.articolo),
        d?d.taglia:r.taglia,String(d?d.numero:(r.numeroDesiderato??'')),stato,
        [r.note,d&&d.holder&&d.holder!==id?'in rientro da '+fullName(S.atlete[d.holder]):''].filter(Boolean).join(' · '),'']);
    }
  }
  if(!righe.length){toast('Per questa squadra non ci sono articoli da consegnare né da ritirare');return}

  const quanti=n=>righe.filter(r=>r[2]===n).length;
  const nomeFile=`${teamLabel(nome).toLowerCase().replace(/[^a-z0-9]+/g,'-')}-${today()}.xlsx`;
  // Tutto testo: la parte Rust vuole stringhe, e un numero le fa rifiutare la
  // chiamata in silenzio.
  const testo=righe.map(r=>r.map(c=>c==null?'':String(c)));
  let dove;
  try{dove=await window.__APP.scegliDoveSalvare(nomeFile)}
  catch(e){toast('Apertura della finestra di salvataggio non riuscita: '+e);return}
  if(!dove)return;
  try{
  await window.__APP.scriviExcel(dove,nomeFoglioExcel(teamLabel(nome)),
    ['Cognome','Nome','Cosa','Articolo','Taglia','Numero','Stato','Nota','Firma'],testo,
    [`${teamLabel(nome)} · ${D.set.stagione||''}`,
     `${quanti('RICONSEGNA')} capi da ritirare, ${quanti('RICEVE')} da consegnare.`,
     '',
     'RICONSEGNA  il capo che l’atleta deve restituire.',
     'RICEVE      l’articolo da consegnare all’atleta. Stato: "pronta" se è in magazzino,',
     '            "DA ORDINARE" se non è disponibile, "esclusa" se la richiesta non viene servita.',
     'Firma       da far firmare al momento della consegna.',
     '',
     'Lista generata il '+fmtDate(today())+'. Le consegne vanno poi registrate nel programma.']);
  }catch(e){toast('Scrittura del file non riuscita: '+e);return}
  toast('Lista salvata');
}
/* Una cosa a tutta la squadra, o via da tutta la squadra. Vale solo per il
   materiale: una divisa da gara e' un capo con un numero e un proprietario, e
   quella si assegna una per una.

   Le taglie sono il punto delicato: per una borraccia va bene una taglia sola
   per tutti, per una felpa no. Quando l'articolo ha piu' taglie il programma
   lo dice chiaro invece di far finta di niente. */
function dlgTuttaSquadra(nome){
  const D=derive();
  const tutti=Object.entries(S.atlete).filter(([id,a])=>a.squadra===nome);
  // Chi sta uscendo o non e' attivo non riceve niente, ma una restituzione
  // da loro va registrata lo stesso.
  const squadra=tutti.filter(([,a])=>puoRicevere(a))
    .sort((x,y)=>norm(fullName(x[1])).localeCompare(norm(fullName(y[1]))));
  if(!tutti.length){toast('La squadra non ha atleti');return}
  const arts=(D.set.articoli||[]).filter(a=>!D.conNumero(a.nome)).sort(perNome);
  if(!arts.length){toast('Non c’è nessun articolo da consegnare');return}

  const taglieDi=n=>{const x=arts.find(z=>z.nome===n);const t=new Set(x?x.taglie:[]);
    for(const k of Object.keys(D.stock))if(k.startsWith(n+'|'))t.add(k.split('|')[1]);
    return [...t].sort((p,q)=>szIdx(p)-szIdx(q))};
  const vociTaglia=n=>{const t=taglieDi(n);
    if(!t.length)return '<option value="">nessuna taglia</option>';
    return t.map(x=>{const st=(D.stock[D.key(n,x)]||{ora:0}).ora;
      return `<option value="${esc(x)}">${x==='UNICA'?'taglia unica':esc(x)} — ${st} in magazzino</option>`}).join('')};
  // Ce l'ha gia' anche chi l'ha ricevuto con la scheda di un'altra squadra.
  const ceLHa=(id,art)=>[id,...collegati(id)].some(x=>Object.entries(D.dotazione[x]||{}).some(([k,v])=>v>0&&k.split('|')[0]===art));
  const quantiHanno=art=>squadra.filter(([id])=>ceLHa(id,art)).length;

  const first=arts[0].nome;
  openDlg(`<h2>Tutta la ${esc(teamLabel(nome))}</h2>
  <p class="sub">${squadra.length} ${squadra.length===1?'atleta':'atleti'}. Viene registrato un movimento per ciascun atleta, come per le consegne singole.</p>
  <div class="field"><label for="tAz">Cosa succede</label><select id="tAz" name="azione">
    <option value="CONSEGNA">Consegna a tutti</option>
    <option value="RIENTRO">Ritira da tutti</option></select></div>
  <div class="field"><label for="tArt">Articolo</label><select id="tArt" name="articolo">${arts.map(x=>`<option value="${esc(x.nome)}">${esc(artLabel(x.nome))}</option>`).join('')}</select></div>
  <div class="two"><div class="field"><label for="tTg">Taglia</label><select id="tTg" name="taglia">${vociTaglia(first)}</select></div>
  <div class="field"><label for="tQta">Quanti pezzi a testa</label><input type="number" id="tQta" name="qta" min="1" max="20" value="1" inputmode="numeric"></div></div>
  <label class="check"><input type="checkbox" id="tSalta" name="salta" checked> Escludere chi possiede già l’articolo, in qualsiasi taglia</label>
  <div id="tAvviso"></div>
  ${actions('Registra')}`, async fd=>{
    const art=fd.articolo;const tg=fd.taglia;const qta=Math.max(1,Number(fd.qta)||1);
    if(!tg){toast('Selezionare la taglia');return false}
    const k=D.key(art,tg);
    const salta=fd.salta==='on';
    const dentro=(fd.azione==='CONSEGNA'?squadra:tutti).filter(([id])=>{
      // Consegnando si salta chi quell'articolo ce l'ha gia', in qualunque
      // taglia. Ritirando invece conta la taglia esatta: non si puo' riprendere
      // una L a chi ha una M.
      if(fd.azione==='CONSEGNA')return salta?!ceLHa(id,art):true;
      return ((D.dotazione[id]||{})[k]||0)>0});
    if(!dentro.length){toast(fd.azione==='CONSEGNA'?'Tutti gli atleti possiedono già questo articolo':'Nessun atleta possiede questo articolo in questa taglia');return false}
    const pezzi=dentro.length*qta;
    const st=(D.stock[k]||{ora:0}).ora;
    if(fd.azione==='CONSEGNA'&&st<pezzi&&!await chiedi(`Occorrono ${pezzi} pezzi e in magazzino ne risultano ${st}. Registrare comunque?`))return false;
    if(!await chiedi(fd.azione==='CONSEGNA'
      ?`Consegnare ${qta>1?qta+' pezzi a testa, ':''}${artLabel(art)} ${tg==='UNICA'?'':tg} a ${dentro.length} ${dentro.length===1?'atleta':'atleti'}?`
      :`Registrare il rientro di ${artLabel(art)} ${tg==='UNICA'?'':tg} da ${dentro.length} ${dentro.length===1?'atleta':'atleti'}?`))return false;
    let chiuse=0;
    const ok=await w(async()=>{
      for(const [id] of dentro)await insieme(async()=>{
        // Ritirando non si prende piu' di quello che ha.
        const q=fd.azione==='RIENTRO'?Math.min(qta,(D.dotazione[id]||{})[k]||0):qta;
        const coperte=fd.azione==='CONSEGNA'?richiesteCoperte(id,art,tg,q):[];
        await mov({tipo:fd.azione,atletaId:id,articolo:art,taglia:tg,qta:q,
          note:`Tutta la ${teamLabel(nome)}`,...(coperte.length?{richieste:coperte.map(fotoRichiesta)}:{})});
        for(const rid of coperte){await S.db.doc('richieste/'+rid).delete();chiuse++}});
    });
    if(ok)toast(`${dentro.length} ${dentro.length===1?'movimento':'movimenti'} ${fd.azione==='CONSEGNA'?'di consegna':'di rientro'} registrati`
      +(chiuse?`, ${chiuse===1?'una richiesta chiusa':chiuse+' richieste chiuse'}`:''));
    return ok});

  const agg=()=>{const n=$('#tArt').value;const t=taglieDi(n);
    const tenuta=$('#tTg').value;$('#tTg').innerHTML=vociTaglia(n);
    if(t.includes(tenuta))$('#tTg').value=tenuta;
    const tg=$('#tTg').value;
    const righe=[];
    if(t.length>1)righe.push(`Questo articolo ha ${t.length} taglie: la consegna a tutti avviene <b>in una sola taglia</b>. Per taglie diverse è preferibile consegnare dalle richieste o dalla scheda di ciascun atleta.`);
    const ha=quantiHanno(n);
    const saltati=$('#tAz').value==='CONSEGNA'&&$('#tSalta').checked;
    if(ha)righe.push(`${ha} su ${squadra.length} ce l’${ha===1?'ha':'hanno'} già${saltati?`: ${ha===1?'viene saltato':'vengono saltati'}`:''}.`);
    $('#tAvviso').innerHTML=righe.length?`<div class="notice">${righe.join('<br>')}</div>`:''};
  $('#tArt').addEventListener('change',agg);
  $('#tTg').addEventListener('change',agg);
  $('#tAz').addEventListener('change',agg);
  $('#tSalta').addEventListener('change',agg);
  agg();
}
/* ---- Impostazioni ---- */
function vImpostazioni(){
  const D=derive();
  let h=`<h1>Impostazioni</h1>`+legenda(`<p>Le impostazioni valgono per tutto l'archivio: stagione in corso, nome e stemma della società, fogli Excel da scaricare e caricare, codici degli articoli, aspetto, aggiornamenti e copie di sicurezza. Ogni sezione riporta sotto il titolo che cosa fa.</p>`)+`
  <h2>Stagione</h2><div class="filters corti"><input type="text" id="stag" value="${esc(D.set.stagione)}" aria-label="Stagione"><button type="button" class="btn" data-act="saveStag">Salva stagione</button></div>
  <h2>Società</h2><p class="sub">Il nome e lo stemma compaiono in alto, accanto a «Magazzino», e il nome anche nel titolo della finestra. Sono salvati nell’archivio: il programma non appartiene a una società in particolare.</p>

/* Copie di sicurezza: c'e' solo nel programma installato. I dati vivono su un
   computer solo, quindi perderli e' il rischio piu' concreto. */
/* I lotti fra cui una squadra puo' scegliere: tutti i modelli tranne quelli
   comuni, che non appartengono a nessuna squadra in particolare. */
function lottiSceglibili(){
  const D=derive();
  return (D.set.modelli||['STANDARD']).filter(m=>!D.comuni.has(m));
}

/* Il nome di una copia automatica, come si legge: "copia del 23/09/2026"
   oppure "prima del ripristino del 23/09/2026 alle 18:05". */
function nomeCopia(n){
  let m=/^magazzino-(\d{4}-\d{2}-\d{2})\.json$/.exec(n);
  if(m)return `inizio giornata del ${fmtDate(m[1])}`;
  m=/^prima-di-riprendere-(\d{4}-\d{2}-\d{2})-(\d{2})(\d{2})\d{2}\.json$/.exec(n);
  if(m)return `prima del ripristino del ${fmtDate(m[1])} alle ${m[2]}:${m[3]}`;
  return n;
}

/* Le informazioni sulle copie si chiedono al computer una volta sola: rileggere
   la cartella a ogni ridisegno farebbe lampeggiare la schermata. */
async function chiediInfoCopie(forza){
  if(!window.__APP)return;
  if(S.app.chiesto&&!forza)return;
  S.app.chiesto=true;
  try{
    S.app.percorso=await window.__APP.percorso();

/* Una giacenza negativa vuol dire che i conti non tornano: pezzi consegnati
   che il magazzino non aveva. Il calcolo e' giusto (e' la somma dei movimenti),
   ma il risultato assurdo va detto, non lasciato li' come un numero qualsiasi. */
function giacenzeNegative(){
  const D=derive();const out=[];
  for(const [k,st] of Object.entries(D.stock)){
    const [art,tg]=k.split('|');
    if(D.conNumero(art))continue;
    if(st.ora<0)out.push(`${esc(artLabel(art))} ${tg==='UNICA'?'':esc(tg)}: la giacenza è ${st.ora}. Verificare carichi e annullamenti nei movimenti.`);
  }
  return out;
}

/* Quello che non torna fra le divise. Il numero doppio in squadra non c'e'
   piu' qui: si vede gia' sulla copertina, sulle squadre, sugli atleti e nelle
   assegnazioni. */
function problemiDivise(){
  const out=[];const g={};
  for(const [id,d] of Object.entries(S.divise)){if(d.dismessa)continue;const k=`${d.modello}|${d.taglia}|${d.numero}`;(g[k]=g[k]||[]).push(id)}
  for(const [k,v] of Object.entries(g)){
    if(v.length<2)continue;
    const [m,t,n]=k.split('|');
    // Due capi uguali in squadre diverse vanno bene. Uno in mano a qualcuno e
    // uno uguale in magazzino di solito e' lo stesso capo contato due volte.
    const libera=v.some(id=>!S.divise[id].holder),usata=v.some(id=>S.divise[id].holder);
    if(!(libera&&usata))continue;
    const dove=v.map(id=>{const d=S.divise[id];return d.holder&&S.atlete[d.holder]?esc(fullName(S.atlete[d.holder])):'magazzino'}).join(', ');
    out.push(`La ${esc(m==='STANDARD'?'':m.toLowerCase()+' ')}${esc(t)} n.${esc(n)} risulta sia in magazzino sia a ${dove.replace('magazzino, ','').replace(', magazzino','')}: probabilmente è lo stesso capo contato due volte.`)}
  for(const d of Object.values(S.divise))
    if(d.holder&&!S.atlete[d.holder]&&!d.dismessa)
      out.push(`La ${esc(d.taglia)} n.${esc(d.numero)} risulta a un atleta che non c'è più: segnane il rientro.`);
  return out;
}

/* Le domande di conferma, dentro il programma e con la sua grafica.
   Nel programma installato la conferma di sistema non va: il componente delle
   finestre la sostituisce con una versione asincrona che, senza permesso,
   viene rifiutata; prima ancora, senza await, tornava subito "si'" e ogni
   domanda passava da sola senza essere mai mostrata. Si risponde sempre con
   una promessa: chi chiede usa await chiedi(...).
   Nel browser di prova resta la conferma normale; nelle prove automatiche la
   risposta si puo' fissare con window.__rispostaConferme. */
function chiedi(testo){
  if(window.__rispostaConferme!==undefined)return Promise.resolve(!!window.__rispostaConferme);
  if(!window.__APP)return Promise.resolve(window.confirm(testo));
  return new Promise(risposta=>{
    const d=$('#dlgConf');$('#confTesto').textContent=testo;d.returnValue='';
    const chiuso=()=>{d.removeEventListener('close',chiuso);risposta(d.returnValue==='si')};
    d.addEventListener('close',chiuso);d.showModal();d.querySelector('.primary').focus()});
}
window.chiedi=chiedi;
/* ============ scritture ============ */
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),3200)}
async function w(fn){
  if(!S.db){toast('Dati non raggiungibili.');return false}
  if(S.readonly){toast('Accesso in sola lettura: modifiche non consentite.');return false}
  try{await fn();return true}catch(e){console.error(e);
    // Sola lettura solo se l'archivio rifiuta davvero di scrivere. Un dato
    // che non esiste piu' (cancellato nel frattempo) e' un errore di quel
    // momento, non un motivo per bloccare tutto il resto della sessione.
    if(e&&e.code==='permission_denied'){S.readonly=true;toast('Modifiche non consentite su questi dati.');render()}
    else if(e&&e.code==='invalid_argument')toast('Il dato non esiste più: la pagina è stata aggiornata.');
    else if(e&&e.code==='quota_exceeded')toast('Archivio pieno: eliminare i movimenti vecchi oppure esportare e archiviare la stagione.');
    else if(e&&e.code==='resource_exhausted')toast('Troppe operazioni ravvicinate: attendere qualche secondo e riprovare.');
    else toast('Salvataggio non riuscito: riprovare.');return false}
}
const today=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let _seq=0,_gruppo=null;
function mov(o){return S.db.collection('movimenti').add(Object.assign({ts:Date.now()+(_seq++%1000)/1000,data:today(),stagione:(S.settings&&S.settings.stagione)||'',qta:1,atletaId:null,divisaId:null,numero:null,note:''},_gruppo?{gruppo:_gruppo}:{},o))}
/* I movimenti scritti dentro fn fanno parte di una sola operazione (una
   consegna con il ritiro della maglia vecchia): si annullano insieme. */
async function insieme(fn){
  const prima=_gruppo;_gruppo='g'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  try{return await fn()}finally{_gruppo=prima}
}
/* La richiesta come era, da scrivere sul movimento di consegna: annullando la
   consegna la si rimette al suo posto. */
function fotoRichiesta(rid){
  const r=S.richieste[rid];if(!r)return null;
  return {id:rid,atletaId:r.atletaId,articolo:r.articolo,taglia:r.taglia,modello:r.modello||'',
    numeroDesiderato:r.numeroDesiderato??null,note:r.note||'',ordine:r.ordine||0};
}
/* L'articolo con cui si registrano le divise da gara: il primo che ha il
   numero stampato. Non un nome scritto nel codice: ogni societa' lo chiama a
   modo suo. */
function artDivisa(){
  const a=((S.settings&&S.settings.articoli)||[]).find(x=>x.conNumero);
  return a?a.nome:'DIVISA GARA';
}
/* Le richieste aperte che una consegna di materiale soddisfa: stesso atleta,
   stesso articolo, stessa taglia, una per pezzo. */
function richiesteCoperte(aid,art,tg,qta){
  return Object.entries(S.richieste).filter(([,r])=>r.atletaId===aid&&r.articolo===art&&r.taglia===tg)
    .sort((x,y)=>(x[1].ordine||0)-(y[1].ordine||0)).slice(0,qta).map(e=>e[0]);
}
/* Chi puo' ancora ricevere: non chi sta lasciando la squadra, non chi e'
   segnato non attivo. */
const puoRicevere=a=>!!a&&!a.inUscita&&a.attiva!==false;
function shadow(){const s={};for(const [id,d] of Object.entries(S.divise))s[id]={holder:d.holder||null,dr:!!d.daRestituire};return s}
async function doConsegna(rid,p,sh,ritiro){
  const r=S.richieste[rid];if(!r)return;
  const foto=fotoRichiesta(rid);
  await insieme(async()=>{
  if(p.divisaId){
    const d=S.divise[p.divisaId];const cur=sh[p.divisaId];
    if(cur.holder&&cur.holder!==r.atletaId){
      await mov({tipo:'RIENTRO',atletaId:cur.holder,articolo:r.articolo,taglia:d.taglia,divisaId:p.divisaId,numero:d.numero,prevHolder:cur.holder,prevDR:cur.dr,prevTC:d.tagliaChiesta||null,note:'Ritirata per riassegnarla'})}
    await S.db.doc('divise/'+p.divisaId).update({holder:r.atletaId,daRestituire:false,tagliaChiesta:null});
    await mov({tipo:'CONSEGNA',atletaId:r.atletaId,articolo:r.articolo,taglia:d.taglia,divisaId:p.divisaId,numero:d.numero,prevHolder:null,prevDR:false,richiesta:foto});
    sh[p.divisaId]={holder:r.atletaId,dr:false};
    for(const oid of ritiro){const x=sh[oid];const od=S.divise[oid];if(!x||!od||x.holder!==r.atletaId)continue;
      await S.db.doc('divise/'+oid).update({holder:null,daRestituire:false,tagliaChiesta:null});
      await mov({tipo:'RIENTRO',atletaId:r.atletaId,articolo:r.articolo,taglia:od.taglia,divisaId:oid,numero:od.numero,prevHolder:r.atletaId,prevDR:x.dr,prevTC:od.tagliaChiesta||null,note:'Restituita al cambio taglia'});
      sh[oid]={holder:null,dr:false}}
  }else{
    await mov({tipo:'CONSEGNA',atletaId:r.atletaId,articolo:r.articolo,taglia:r.taglia,qta:1,richiesta:foto});
  }
  await S.db.doc('richieste/'+rid).delete();
  });
}
/* Cosa si puo' chiedere per questo atleta: la divisa da gara della sua squadra
   (qualunque lotto usi) piu' i modelli comuni a tutta la societa', i liberi. */
function modelliSceglibili(aid){
  const D=derive();const a=S.atlete[aid];
  const voci=[{v:'',t:'Divisa della squadra'}];
  for(const m of D.comuni)voci.push({v:m,t:cap(m)});
  return voci;
}
/* Le divise che questo atleta deve restituire, a fronte di una richiesta di
   quel modello.
   I modelli comuni (i liberi) stanno per conto loro: un libero si cambia con un
   libero. Le divise da gara invece si cambiano fra loro **qualunque lotto
   siano**, perche' passare di squadra vuol dire proprio cambiare lotto. */
function stessoGenere(modelloDivisa,modelloChiesto){
  const D=derive();const a=modelloDivisa||'STANDARD';const b=modelloChiesto||'STANDARD';
  if(D.comuni.has(a)||D.comuni.has(b))return a===b;
  return true; // due lotti di divise da gara: intercambiabili per il cambio
}
const ownReturning=(aid,mod)=>Object.entries(S.divise).filter(([id,d])=>d.holder===aid&&d.daRestituire&&stessoGenere(d.modello,mod)).map(e=>e[0]);

/* Annullare un movimento. Se fa parte di un'operazione (una consegna con il
   ritiro della maglia vecchia) si annulla tutta: annullarne un pezzo lasciava
   l'atleta senza nessuna maglia. */
async function annullaMovimento(id){
  const m=S.movimenti[id];if(!m)return;
  const gruppo=(m.gruppo?Object.entries(S.movimenti).filter(([,x])=>x.gruppo===m.gruppo):[[id,m]])
    .sort((x,y)=>(y[1].ts||0)-(x[1].ts||0));
  const dentro=new Set(gruppo.map(g=>g[0]));
  const D=derive();
  for(const [,x] of gruppo){
    const dopo=Object.entries(S.movimenti).filter(([yid,y])=>!dentro.has(yid)&&(y.ts||0)>(x.ts||0)).map(e=>e[1]);
    if(x.divisaId){
      if(dopo.some(y=>y.divisaId===x.divisaId)){toast('Annullare prima i movimenti più recenti di questa divisa.');return}
      if(x.prevHolder&&!S.atlete[x.prevHolder]){toast('La divisa tornerebbe a un atleta che non è più in archivio: annullamento non possibile.');return}
      continue}
    // Materiale di un atleta: prima i movimenti piu' recenti dello stesso
    // articolo per lo stesso atleta, se no la giacenza cresce di un pezzo che
    // non esiste.
    if(x.atletaId&&dopo.some(y=>!y.divisaId&&y.atletaId===x.atletaId&&y.articolo===x.articolo&&y.taglia===x.taglia)){
      toast('Annullare prima i movimenti più recenti di questo articolo per questo atleta.');return}
    // Un carico o una rettifica: non se la giacenza finirebbe sotto zero.
    const effetto=(x.tipo==='CARICO'||x.tipo==='RETTIFICA'||x.tipo==='RIENTRO'?1:-1)*(Number(x.qta)||0);
    const ora=(D.stock[D.key(x.articolo,x.taglia)]||{ora:0}).ora;
    if(effetto>0&&ora-effetto<0){toast(`Annullandolo la giacenza di ${artLabel(x.articolo)} ${x.taglia} andrebbe sotto zero: nel frattempo quei pezzi sono già usciti.`);return}
  }
  const foto=gruppo.flatMap(([,x])=>[x.richiesta,...(x.richieste||[])]).filter(r=>r&&!S.richieste[r.id]);
  const descr=gruppo.length>1?`questa operazione (${gruppo.length} movimenti insieme)`:`questo movimento (${m.tipo.toLowerCase()} ${artLabel(m.articolo)})`;
  if(!await chiedi(`Annullare ${descr}?${foto.length?(foto.length===1?' La richiesta consegnata torna aperta.':` Le ${foto.length} richieste consegnate tornano aperte.`):''}`))return;
  const ok=await w(async()=>{
    for(const [xid,x] of gruppo){
      if(x.divisaId&&S.divise[x.divisaId])
        await S.db.doc('divise/'+x.divisaId).update({holder:x.prevHolder??null,daRestituire:!!x.prevDR,tagliaChiesta:x.prevTC??null});
      // Il carico aveva scalato quelli in arrivo: tornano in arrivo.
      if(x.tipo==='CARICO'&&x.ordScalati>0){
        const riga=Object.entries(S.materiale).find(([,r])=>r.articolo===x.articolo&&r.taglia===x.taglia);
        if(riga)await S.db.doc('materiale/'+riga[0]).update({ordinati:(Number(riga[1].ordinati)||0)+x.ordScalati})}
      await S.db.doc('movimenti/'+xid).delete()}
    for(const r of foto){const {id:rid,...corpo}=r;if(S.atlete[corpo.atletaId])await S.db.doc('richieste/'+rid).set(corpo)}
  });
  if(ok)toast(foto.length?'Annullato: la richiesta è di nuovo aperta':'Movimento annullato');
}
