<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magazzino</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231C2430'/><path d='M11 6 5 8.5l1.7 5 2.3-.8V26h14V12.7l2.3.8 1.7-5L21 6a5 5 0 0 1-10 0Z' fill='%23F2C230'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --ink:#1C2430; --muted:#5E6875; --line:#D6DAE0;
  --yellow:#F2C230; --yellow-ink:#8A6A00; --yellow-soft:#FFF4CC;
  --ok:#2E7D4F; --ok-soft:#E3F2E8; --bad:#B4430C; --bad-soft:#FBE7DC; --blue:#2F5DA8; --blue-soft:#E3EAF7;
  --radius:10px;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-cond:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
/* Il tema segue il computer, ma si puo' decidere a mano: la scelta sta sul
   computer di chi usa il programma, non nell'archivio della societa'. */
:root[data-theme="dark"]{
    --bg:#151A21; --surface:#1E252F; --ink:#E8ECF1; --muted:#9AA4B1; --line:#303946;
    --yellow-ink:#F2C230; --yellow-soft:#3A3117;
    --ok:#6CC08F; --ok-soft:#1D3327; --bad:#F08A5D; --bad-soft:#3A2419; --blue:#8DB0EB; --blue-soft:#1E2B42;
    color-scheme:dark;
  }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151A21; --surface:#1E252F; --ink:#E8ECF1; --muted:#9AA4B1; --line:#303946;
    --yellow-ink:#F2C230; --yellow-soft:#3A3117;
    --ok:#6CC08F; --ok-soft:#1D3327; --bad:#F08A5D; --bad-soft:#3A2419; --blue:#8DB0EB; --blue-soft:#1E2B42;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151A21; --surface:#1E252F; --ink:#E8ECF1; --muted:#9AA4B1; --line:#303946;
  --yellow-ink:#F2C230; --yellow-soft:#3A3117;
  --ok:#6CC08F; --ok-soft:#1D3327; --bad:#F08A5D; --bad-soft:#3A2419; --blue:#8DB0EB; --blue-soft:#1E2B42;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
/* La finestra non scorre: intestazione e barra restano ferme, e a scorrere e'
   il contenuto. Su un programma da scrivania e' quello che ci si aspetta, e
   soprattutto le intestazioni delle tabelle non scappano via. */
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.top{display:flex;align-items:center;gap:12px;padding:14px 22px 10px;max-width:1700px;margin:0 auto}
/* Sul telefono la barra va a capo invece di spingere la pagina di lato: con
   marchio, stagione e stato non ci stava, e tutte le schermate scrollavano
   di traverso di una sessantina di pixel. */
@media(max-width:640px){.top{flex-wrap:wrap;row-gap:4px;padding:10px 16px 8px}
  .top .sync{margin-left:auto}}
.brand{font-family:var(--f-cond);font-weight:700;font-size:24px;letter-spacing:.2px;line-height:1;display:flex;align-items:center;gap:10px}
a.brand{color:inherit;text-decoration:none}
.brand .mark{width:32px;height:32px;flex:none;display:grid;place-items:center;color:var(--yellow)}
.brand .mark svg,.brand .mark img{width:100%;height:100%;display:block;object-fit:contain}
.season{color:var(--muted);font-size:13px}
.societa{font-family:var(--f-cond);font-weight:600;font-size:17px;letter-spacing:.2px}
.societa:not(:empty)::before{content:'';display:inline-block;width:1px;height:14px;background:var(--line);margin-right:10px;vertical-align:-2px}
@media(max-width:640px){.societa{display:none}}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.err i{background:var(--bad)}

/* Sulla pagina di partenza il menu sparisce: i riquadri fanno gia' quel
   mestiere, e con i numeri sopra lo fanno meglio. */
body.inCasa .tabs,body.inCasa .top{display:none}
.tabs{order:3;flex:none;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs a{flex:1;text-decoration:none;text-align:center;font-size:12px;color:var(--muted);padding:4px 2px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:600}
.tabs a[aria-current="page"] svg{color:var(--yellow-ink)}
/* Con sette voci, sul telefono stretto la barra debordava di due pixel e
   tutta la pagina scorreva di lato. */
@media(max-width:420px){.tabs{padding-left:0;padding-right:0}.tabs a{font-size:11px;padding:4px 0}}
@media (min-width:900px){
  .tabs{order:0;border-top:0;border-bottom:1px solid var(--line);justify-content:center;gap:4px;padding:4px 8px}
  .tabs a{flex:0 0 auto;flex-direction:row;gap:8px;font-size:14px;padding:8px 14px}
  .tabs a svg{width:18px;height:18px}
}

.top{flex:none}
main{flex:1;min-height:0;display:flex;flex-direction:column;
  width:100%;max-width:1700px;margin:0 auto;padding:6px 22px 0}
.scorrevole{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:24px}
h1{font-family:var(--f-cond);font-weight:700;font-size:30px;line-height:1.1;margin:10px 0 4px}
h2{font-family:var(--f-cond);font-weight:600;font-size:21px;line-height:1.2;margin:22px 0 8px}
h3{font-family:var(--f-cond);font-weight:600;font-size:17px;margin:16px 0 6px;color:var(--muted)}
/* Niente limite di larghezza: con l'app a tutto schermo un cappuccio faceva
   andare a capo le spiegazioni con mezzo schermo libero a destra. */
.sub{color:var(--muted);margin:0 0 12px}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:500;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.yellow{background:var(--yellow);color:#1C2430;border-color:var(--yellow)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
/* Caricamento in corso: si aspetta, non si lavora altrove a meta'. */
#occupato{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
#occupato[hidden]{display:none}
#occupato div{background:var(--surface);color:var(--ink);border-radius:var(--radius);padding:18px 24px;font-weight:600}
.spunta{color:var(--ok);font-weight:700}
.sceltaMat{display:flex;gap:4px;margin:4px 0 8px;flex-wrap:wrap}
.sceltaMat label{flex:1 1 auto;text-align:center;padding:6px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;white-space:nowrap}
.sceltaMat label.scelta{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sceltaMat input{position:absolute;opacity:0;pointer-events:none}
.omonimi summary{cursor:pointer;font-weight:600}
.manCorpo p{max-width:80ch}
.fogliHome,.inizio{width:100%;max-width:980px;margin-left:auto;margin-right:auto;box-sizing:border-box}
.fogliHome{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-top:12px;margin-bottom:12px}
.inizio{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:4px 16px 12px;margin-top:0;margin-bottom:14px}
.inizio ol{margin:6px 0 0;padding-left:20px}.inizio li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.inizio li:first-child{border-top:0}.inizio li.fatto{color:var(--muted)}
.gruppoFoglio{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-right:6px}
#nonSalvato.fisso{position:sticky;top:0;z-index:30;margin:0;border-radius:0}
.btn.danger.pieno{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

.field{display:flex;flex-direction:column;gap:4px;margin:0 0 12px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
input[type=search]{padding-left:12px}
/* La casella del numero e' stretta: ci stanno due cifre, non un nome. */
.filtroNum{flex:0 0 7.5em;width:7.5em;text-align:center;font-variant-numeric:tabular-nums}
.barraMag .filtroNum{flex:0 0 7.5em;margin-right:10px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.filters>*{flex:1 1 150px}
.filters input[type=search]{flex:3 1 220px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--ink)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:7px 14px;border-top:1px solid var(--line);min-height:42px}
.item:first-child{border-top:0}
a.item{text-decoration:none;cursor:pointer}
a.item:hover{background:var(--bg)}
.item .main{flex:1;min-width:0}
.item .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:13px;color:var(--muted)}
/* La testata copre quello che le scorre sotto, quindi deve anche lasciargli
   spazio: senza il margine in fondo mangiava i primi pixel della prima riga. */
/* La testata sta FUORI da quello che scorre: cosi' non esiste un bordo dove
   si veda una riga tagliata a meta'. A scorrere e' solo .scorrevole. */
.testata{flex:none;padding:0 0 10px}
.testata>:last-child{margin-bottom:0}
.testata h1{margin-top:4px}
.omonimo{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:2px 0}
.omonimo+.omonimo{margin-top:8px}
.filters.corti>.btn{flex:0 0 auto}
.soloInfo{opacity:.75}
.testaLotto{flex-wrap:wrap;gap:6px 12px;align-items:center}
.testaLotto .btn{margin-left:auto}
.colonneSq{display:grid;grid-template-columns:repeat(auto-fill,minmax(11em,1fr));gap:2px 12px;margin-bottom:10px}
.esitoTit{margin:14px 0 6px;font-size:15px}
.esitoTit.bad{color:var(--bad)}
.esitoLista{margin:0;padding-left:18px;max-height:34vh;overflow:auto;font-size:13.5px;line-height:1.45}
.esitoLista li{margin:0 0 4px}
/* Lo spazio dell'avviso del numero doppio c'e' sempre, anche vuoto: se no le
   squadre con l'avviso hanno le colonne spostate rispetto alle altre. */
.campi.unaRiga select.inRiga.numeriCon{flex:0 0 17.5em;width:17.5em;max-width:17.5em}
.campi.unaRiga select.inRiga.numeriCon.attivo{border-color:var(--blue);color:var(--blue)}
.campi.unaRiga .slotAvviso{flex:0 0 9.5em;display:flex;overflow:hidden}
.campi.unaRiga .slotAvviso .pill{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.filters.corti>input{flex:0 1 22em}
.legenda{margin:0 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.legenda summary{cursor:pointer;padding:8px 12px;font-size:13.5px;color:var(--muted);list-style:none}
.legenda summary::-webkit-details-marker{display:none}
.legenda summary::before{content:'▸ ';font-size:11px}
.legenda[open] summary::before{content:'▾ '}
.legenda summary:hover{color:var(--ink)}
/* Una voce senza pastiglia e' una spiegazione, non un colore: va a capo da sola. */
.voceLeg:has(>span:first-child:empty){flex:1 1 100%;color:var(--muted)}
.quante{color:var(--muted);font-size:13px;white-space:nowrap;align-self:center}
.vociLeg{display:flex;flex-wrap:wrap;gap:8px 22px;padding:2px 12px 12px}
.spiegaLeg{padding:2px 12px 10px;font-size:13.5px;line-height:1.5;color:var(--muted)}
.spiegaLeg p{margin:0 0 6px}
.voceLeg{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted)}
/* Il pulsante sta sempre nello stesso posto, qualunque sia la sua scritta. */
.artBox{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.artTesta{display:flex;align-items:center;gap:12px;padding:9px 14px}
.artTesta .main{flex:1;min-width:0}
.artTesta .right{display:flex;align-items:center;gap:0;flex:none}
.artTesta .modArt{flex:none;margin-right:14px}
.artNota{margin:0;padding:0 14px 10px;font-size:13.5px}
/* Mentre scarica la schermata dice a che punto e'. */
.scarico{margin:10px 0 0}
.scarico .progress{display:block;height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin-bottom:8px}
.scarico .progress i{display:block;height:100%;background:var(--yellow);transition:width .3s}
.artUnica{display:flex;gap:0;align-items:center;cursor:pointer;padding:2px 0;border-radius:8px}
.artUnica:hover,.artUnica:focus{background:var(--bg);outline:none}
/* Le stesse larghezze delle colonne della tabella, cosi' i numeri di un
   articolo a taglia unica si leggono come quelli di uno con le taglie. */
.artUnica>span{flex:0 0 var(--colNum);display:flex;flex-direction:column;align-items:flex-end;gap:0;line-height:1.15;padding-right:12px}
.artUnica>.btn{flex:0 0 var(--colUlt);align-self:center;margin-left:0}
.artUnica{margin-right:-14px}
.codTg{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.3px}
.artUnica small{color:var(--muted);font-size:11.5px}
.artUnica b{font-family:'Barlow Condensed',system-ui,sans-serif;font-size:17px;font-variant-numeric:tabular-nums}
.artUnica b.neg{color:var(--bad)}
/* Finestra stretta: i sei conti dell'articolo con una sola taglia vanno a
   capo sotto il nome invece di uscire dal riquadro, e la tabella delle taglie
   scorre di lato dentro il suo riquadro. */
@media(max-width:1000px){
  .artTesta{flex-wrap:wrap}
  .artTesta .right{flex:1 1 100%;flex-wrap:wrap;justify-content:flex-start}
  .artUnica{flex-wrap:wrap;margin-right:0;row-gap:6px}
  .artUnica>span{flex:0 0 auto;flex-direction:row;gap:6px;align-items:baseline;margin-right:14px;padding-right:0}
  .artBox .table-wrap{overflow-x:auto}}
.artBox .table-wrap{border:0;border-top:1px solid var(--line);border-radius:0;margin:0}
/* Le taglie di un articolo e quelle di un altro devono stare sulla stessa
   verticale: senza larghezze dette a voce alta ogni tabella si misurava da se'. */
.artBox table{table-layout:fixed;width:100%}
.artBox th:first-child,.artBox td:first-child{width:auto}
:root{--colNum:112px;--colUlt:96px}
.artBox th:nth-child(n+2):not(:last-child),.artBox td:nth-child(n+2):not(:last-child){width:var(--colNum)}
.artBox th:last-child,.artBox td:last-child{width:var(--colUlt)}
.artBox table{min-width:calc(12em + 6 * var(--colNum) + var(--colUlt))}
.barraMag{flex-wrap:nowrap;align-items:center}
.barraMag .opzMag{flex:1 1 auto;min-width:0;display:flex;align-items:center}
.barraMag .opzMag .check{margin:0;white-space:nowrap}
.barraMag>.btn{flex:none;margin-left:auto}
.barraMag>.btn+.btn{margin-left:8px}
@media(max-width:760px){.barraMag{flex-wrap:wrap}.barraMag .opzMag{flex:1 1 100%;order:3}}
/* I riquadri della pagina di partenza: si vogliono poter premere col pollice,
   quindi sono grandi, e il numero si legge da lontano. */
/* La testa della pagina: stemma, nome, stagione, e il pulsante che si usa
   dieci volte al giorno. */
/* La copertina respira: sta in mezzo allo schermo invece che schiacciata in
   alto, e fra una cosa e l'altra c'e' spazio. */
body.inCasa #view{display:flex;flex-direction:column;justify-content:center;min-height:88vh}
.copertina{text-align:center;margin:0 0 40px}
.copertinaStemma{display:block;width:104px;height:104px;margin:0 auto 18px;color:var(--yellow)}
.copertinaStemma img,.copertinaStemma svg{width:100%;height:100%;object-fit:contain}
.copertina h1{font-size:40px;margin:0;line-height:1.15}
.copertinaSub{font-family:var(--f-cond);font-size:19px;color:var(--muted);margin:6px 0 0;letter-spacing:.3px}
.sottoGriglia{text-align:center;margin:30px 0 0}
/* Una riga in conflitto si vede anche senza leggere: un numero portato da due
   persone della stessa squadra si scopre in palestra, ed e' tardi. */
.item.conflitto{box-shadow:inset 3px 0 0 var(--bad)}
tr.conflitto th,tr.conflitto td{background:var(--bad-soft)}
.allarmeHome{text-align:center;margin:22px 0 0}
.allarmeHome a{display:inline-block;background:var(--bad-soft);border-left:4px solid var(--bad);
  border-radius:var(--radius);padding:9px 16px;color:var(--ink);text-decoration:none;font-size:14px}
.allarmeHome a:hover{text-decoration:underline}
/* Sei riquadri, due file da tre, al centro: una pagina di partenza si guarda,
   non si scorre. */
.grigliaHome{display:grid;gap:18px;grid-template-columns:repeat(3,minmax(0,1fr));
  max-width:980px;margin:0 auto}
@media(max-width:820px){.grigliaHome{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.grigliaHome{grid-template-columns:1fr}}
.cartaHome{display:block;text-decoration:none;color:inherit;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:18px 20px;
  transition:border-color .15s,transform .15s}
.cartaHome:hover{border-color:var(--yellow);transform:translateY(-2px)}
.cartaHome .grosso{font-family:var(--f-cond);font-weight:700;font-size:38px;line-height:1;color:var(--yellow-ink)}
.cartaHome .titolo{font-family:var(--f-cond);font-weight:600;font-size:19px;margin-top:6px}
.cartaHome .sotto{color:var(--muted);font-size:13px;margin-top:2px}
.cartaHome.allarme .grosso{color:var(--ok)}
.cartaHome.allarme .sotto b{color:var(--bad)}
.versione{color:var(--muted);font-size:12.5px;margin:34px 0 0;text-align:center}
/* Il manuale: una sezione per volta, aperta quando serve. */
.man{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px}
.man>summary{cursor:pointer;padding:12px 16px;font-family:var(--f-cond);font-weight:600;font-size:18px;list-style:none}
.man>summary::-webkit-details-marker{display:none}
.man>summary::before{content:'+';display:inline-block;width:1.1em;color:var(--yellow-ink);font-weight:700}
.man[open]>summary::before{content:'\2212'}
.manCorpo{padding:0 18px 16px 18px}
.manCorpo p{margin:0 0 9px;font-size:14.5px;line-height:1.5}
.manCorpo .sub{color:var(--muted);font-size:13px}
/* La riga di una squadra si distingue da quelle degli atleti che contiene:
   sta sopra, e quello che le appartiene sta rientrato sotto. */
.sqRiga{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:10px}
/* Una riga sola a ogni larghezza (Andrea, 25/09/2026: "troppo grande ogni
   riga", e sul Mac con molto zoom andava tutto a capo). Sulla riga resta solo
   cio' che si usa spesso; le impostazioni della squadra stanno nella finestra
   «Impostazioni». Colonne a misura fissa: il nome lungo si accorcia con «…»
   invece di spingere il resto a capo; con poco spazio i pulsanti si accorciano
   («A tutti», «Foglio»); solo a larghezza da telefono la riga si divide. */
.item.sqRiga{display:grid;grid-template-columns:26px minmax(5em,11em) 5.5em auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:6px 10px 6px 12px;min-height:0}
.sqRiga .sqNome{font-weight:700;font-family:var(--f-cond);font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sqRiga .quanti{color:var(--muted);white-space:nowrap}
.sqRiga .sqStato{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sqRiga .slotAvviso{display:flex;gap:6px;white-space:nowrap}
.sqAzioni{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end}
.sqAzioni .corto{display:none}
@media(max-width:1180px){.sqAzioni .lungo{display:none}.sqAzioni .corto{display:inline}}
@media(max-width:620px){.item.sqRiga{grid-template-columns:26px minmax(0,1fr) auto}
  .sqRiga .sqStato,.sqRiga .slotAvviso{grid-column:2/-1}.sqRiga .sqAzioni{grid-column:1/-1}}
.sqRiga .apri{flex:none;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-size:15px;line-height:1;cursor:pointer;font-family:var(--f-cond)}
.sqRiga .apri:hover{border-color:var(--yellow)}
.list.dentroSq{margin:0 0 0 26px;border-top-left-radius:0;border-top-right-radius:0}
.btn.grande{font-size:16px;padding:10px 22px}
/* La fila dei numeri di una squadra: si legge come la distinta, e un numero
   portato da due persone si vede da lontano. */
.filaNumeri{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:0 0 8px;color:var(--muted);font-size:13px}
.filaNumeri .numTag{margin-left:2px}
.numTag.doppio{background:var(--bad);color:#fff;border-color:var(--bad)}
.notice.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.notice.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.item.riga{gap:8px;padding:4px 10px 4px 14px;min-height:38px}
/* Nome e articolo sulla stessa riga: erano la stessa informazione spezzata in
   due, e 222 richieste facevano tredicimila pixel di elenco. */
.richiesta .name{display:flex;align-items:baseline;gap:8px;font-weight:600}
.richiesta .name .cosa{font-weight:400;font-size:13.5px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.richiesta .meta{margin-top:1px}
.richiesta .right{gap:8px;flex-wrap:nowrap}
.richiesta .right .pill{flex:0 0 5.4em;text-align:center}
.richiesta .slotBtn{flex:0 0 6.6em;display:flex;justify-content:flex-end}
@media(max-width:760px){.richiesta .right .pill,.richiesta .slotBtn{flex:0 0 auto}}
@media(max-width:760px){.richiesta .name{flex-wrap:wrap;gap:0 8px}}
.ordDist{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ordDist .inRiga.ordine{flex:0 0 58px;width:58px;text-align:center;font-variant-numeric:tabular-nums}
.campi{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
/* La riga della squadra sta tutta su una riga: andare a capo per una spunta e
   un elenco a tendina non serviva a niente. Sotto i 700px si arrende. */
.campi.unaRiga{flex-wrap:nowrap;gap:12px}
/* Misure dette a voce alta, e con abbastanza peso da vincere sulla regola
   generale dei campi: senza, la casella del nome si schiacciava a 24 pixel su
   una riga larga 1400. */
.campi.unaRiga input.inRiga.nomeSq{flex:1 1 auto;min-width:12em;max-width:26em}
/* Cognome e nome dell'atleta: si dividono lo spazio, senza schiacciarsi. */
.campi.unaRiga input.inRiga.cognome{flex:1 1 12em;min-width:9em;max-width:20em}
.campi.unaRiga input.inRiga:not(.cognome):not(.ordine):not(.nomeSq){flex:1 1 10em;min-width:8em;max-width:18em}
.campi.unaRiga .chips{flex:0 0 auto;white-space:nowrap}
.campi.unaRiga input.inRiga.ordine::-webkit-outer-spin-button,
.campi.unaRiga input.inRiga.ordine::-webkit-inner-spin-button{opacity:.35}
.campi.unaRiga .meta{white-space:nowrap}
/* Ogni colonna ha la sua larghezza, se no il numero degli atleti (una cifra o
   due) spostava di mezzo carattere tutto quello che veniva dopo, riga per riga. */
.campi.unaRiga .quanti{flex:0 0 6em;text-align:right;color:var(--muted)}
.campi.unaRiga .check{white-space:nowrap;flex:0 0 12em}
.campi.unaRiga select.inRiga{flex:0 0 13em;width:13em;max-width:13em}
.campi.unaRiga input.inRiga.cognome{flex:0 0 13em}
.campi.unaRiga input.inRiga:not(.cognome):not(.ordine):not(.nomeSq){flex:0 0 11em;min-width:0;max-width:none}
/* Con poco spazio le caselle si stringono tutte della stessa misura: se si
   allargano secondo lo spazio che avanza, ogni riga ha le colonne in un punto
   diverso (misurato a 800 px, 25/09/2026). */
@media(max-width:1180px){
  .campi.unaRiga .quanti{flex:0 0 auto}
  .campi.unaRiga .check{flex:0 0 auto}
  .campi.unaRiga select.inRiga{flex:0 0 7.5em;width:7.5em;max-width:7.5em}
  .campi.unaRiga input.inRiga.cognome{flex:0 0 9em;width:9em}
  .campi.unaRiga input.inRiga:not(.cognome):not(.ordine):not(.nomeSq){flex:0 0 9em;width:9em;min-width:0}}
@media(max-width:700px){.campi.unaRiga{flex-wrap:wrap;gap:8px}}
.inRiga{background:transparent;border:1px solid transparent;border-radius:7px;padding:5px 7px;
  color:var(--ink);font:inherit;font-weight:600;min-width:0}
.inRiga:hover{border-color:var(--line)}
.inRiga:focus{border-color:var(--yellow);background:var(--bg);outline:none}
.inRiga.cognome{flex:0 1 11em}
.campi input.inRiga{flex:0 1 10em}
.campi select.inRiga{font-weight:500;color:var(--muted);flex:0 1 auto}
.campi select.inRiga:focus{color:var(--ink)}
@media(max-width:700px){.campi{width:100%}.campi input.inRiga{flex:1 1 45%}}
/* La tabella scorre dentro di se', non trascinandosi dietro la pagina: la
   riga delle intestazioni e la colonna dei nomi restano ferme, che e' l'unico
   modo di capire cosa si sta guardando a meta' di una tabella larga. */
/* Scorre solo di lato: in verticale ci pensa la pagina. Con un'altezza
   massima diventava un secondo contenitore che tratteneva la rotellina, e
   arrivati in fondo a una tabella lo scorrimento si piantava li'. */
.tabellaFuori{overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);
  border-radius:12px;background:var(--surface);margin-bottom:14px}
/* Larghezze dette a voce alta: con table-layout auto ogni squadra misurava la
   sua tabella sul proprio contenuto, e scorrendo da una squadra all'altra le
   colonne saltavano. La larghezza minima tiene conto di quante colonne ci
   sono: quando sono tante la tabella scorre di lato invece di schiacciarsi. */
.tab.riepilogo{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed;
  min-width:calc(14em + 11em + var(--colonne,4) * 7.5em)}
.tab.riepilogo .colAtleta{width:14em}
.tab.riepilogo .colDivise{width:11em}
.tab.riepilogo td,.tab.riepilogo th{overflow:hidden;text-overflow:ellipsis}
.tab.riepilogo th,.tab.riepilogo td{padding:8px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
.tab.riepilogo thead th{border-top:0;font-size:12.5px;color:var(--muted);font-weight:600;
  background:var(--surface);box-shadow:inset 0 -1px 0 var(--line)}
.tab.riepilogo thead th:first-child{position:sticky;left:0;z-index:3}
.tab.riepilogo tbody th{font-weight:600;position:sticky;left:0;background:var(--surface);z-index:1}
.tab.riepilogo tbody th a{color:inherit;text-decoration:none}
.tab.riepilogo tbody th a:hover{text-decoration:underline}
.tab.riepilogo .num{text-align:center}
.tab.riepilogo .vuoto{color:var(--line)}
.numTag{display:inline-flex;align-items:baseline;gap:2px;background:var(--yellow);color:#1C2430;border-radius:5px;padding:1px 6px;font-weight:700;font-family:var(--f-cond)}
.numTag small{font-size:10px;font-weight:600;opacity:.75}
.numTag.da{background:transparent;color:var(--ink);border:1px dashed var(--yellow)}
.item .right{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
/* Titolo e conteggio vicini: con l'app larga, "space-between" li mandava ai
   due capi opposti dello schermo. */
.group-head{display:flex;align-items:baseline;justify-content:flex-start;gap:10px;flex-wrap:wrap;margin:20px 2px 6px}
.group-head h2{margin:0}
.group-head span{color:var(--muted);font-size:13px}

.jersey{display:inline-flex;align-items:baseline;gap:3px;background:var(--yellow);color:#1C2430;border:1.5px solid var(--yellow);
  border-radius:5px 5px 11px 11px;padding:1px 8px 3px;font-family:var(--f-cond);font-weight:700;font-size:20px;line-height:1;min-width:40px;justify-content:center}
.jersey small{font-size:12px;font-weight:600}
.jersey.inCasa{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.jersey.libero{background:#FFFFFF;color:#1C2430;border-color:#C9CED6}
.jersey.libero.inCasa{background:#FFFFFF;color:#2E7D4F;border-color:#2E7D4F}
.jersey.libero small{opacity:.55}
.jersey.prima.inCasa{background:#1C2430;color:var(--ok);border-color:var(--ok)}
.jersey.prima{background:#1C2430;color:var(--yellow);border-color:#1C2430}
.jersey.rientro{background:transparent;color:var(--ink);border-style:dashed;border-color:var(--yellow-ink)}
/* Fuori uso: c'e' ma non si usa. Grigia e barrata, perche' non si confonda con
   una libera. */
.jersey.rovinata{background:transparent;color:var(--muted);border-color:var(--muted);border-style:dotted}
.jersey.rovinata b{text-decoration:line-through}
/* Il "pulsante" di una riga del materiale: tutta la riga si apre, quindi
   compare solo sulla riga sotto il mouse. Ripetuto su ogni riga era rumore. */
.suPassaggio{visibility:hidden}
tr.click:hover .suPassaggio,tr.click:focus .suPassaggio,.artUnica:hover .suPassaggio,.artUnica:focus .suPassaggio{visibility:visible}
.jersey.libero.rientro{background:#FFFFFF;color:#1C2430;border-style:dashed;border-color:var(--yellow-ink)}
.jersey.prima.rientro{background:#1C2430;color:var(--yellow);border-style:dashed;border-color:var(--yellow)}
.jersey.prenotata,.jersey.libero.prenotata,.jersey.prima.prenotata,.jersey.libero.inCasa.prenotata,.jersey.prima.inCasa.prenotata{background:var(--blue-soft);color:var(--blue);border-color:var(--blue)}
:root[data-theme="dark"] .jersey.prima{border-color:#6B7686}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .jersey.prima{border-color:#6B7686}}
.jersey.big{font-size:34px;padding:3px 14px 6px;border-radius:7px 7px 16px 16px}
.jersey.big small{font-size:16px}
button.jersey{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.yellow{background:var(--yellow-soft);color:var(--yellow-ink)}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 4px}
tfoot tr.totale td{font-weight:700;border-top:2px solid var(--line)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;min-width:110px;flex:1}
.stat b{display:block;font-family:var(--f-cond);font-size:28px;line-height:1}
.stat span{font-size:13px;color:var(--muted)}
.stat.bad b{color:var(--bad)} .stat.ok b{color:var(--ok)}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:13px;border-top:0;background:var(--bg)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--bg)}
td.neg{color:var(--bad);font-weight:600}
td.art{font-weight:600;white-space:normal}

.size-row{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line);align-items:start}
.size-row:first-child{border-top:0}
.size-row .sz{font-family:var(--f-cond);font-weight:700;font-size:22px;line-height:1.1}
.size-row .sz small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center;margin:6px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}

.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.notice{background:var(--yellow-soft);border-radius:var(--radius);padding:10px 14px;margin:10px 0;font-size:14px}
.notice.bad{background:var(--bad-soft)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:14px;margin-top:6px}

dialog{border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 40px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,26,33,.5)}
dialog form{padding:18px 18px 16px;display:flex;flex-direction:column;overflow:auto;max-height:calc(100dvh - 40px)}
dialog h2{margin:0 0 12px}
dialog.conferma{width:min(460px,calc(100vw - 24px))}
#confTesto{margin:0 0 16px;white-space:pre-line;line-height:1.45}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:9px;font-size:14px;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (min-width:900px){#toast{bottom:24px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.progress{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--yellow);width:0}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#home"><span class="mark" id="mark" aria-hidden="true"></span>Magazzino</a>
  <span class="societa" id="societa"></span>
  <span class="season" id="season"></span>
  <span class="sync" id="sync"><i></i><span>Collegamento…</span></span>
</header>
<div id="nonSalvato" class="notice bad fisso" role="alert" hidden></div>
<div id="occupato" hidden><div>Caricamento del foglio in corso: attendere il termine…</div></div>
<nav class="tabs" id="tabs" aria-label="Sezioni">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a href="#squadre" data-tab="squadre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.3.2 4 1.8 4.5 4.8"/></svg>Squadre</a>
  <a href="#assegnazioni" data-tab="assegnazioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8l4 3-2 4-2-1v10H8V10l-2 1-2-4z"/><path d="M10 14l1.5 1.5L14.5 12"/></svg>Assegnazioni</a>
  <a href="#magazzino" data-tab="magazzino"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M7 20v-7h10v7M7 16h10"/></svg>Magazzino</a>
  <a href="#movimenti" data-tab="movimenti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>Movimenti</a>
  <a href="#impostazioni" data-tab="impostazioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Impostazioni</a>
  <a href="#manuale" data-tab="manuale"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h9a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M8 8h6M8 12h6"/></svg>Manuale</a>
</nav>
<main id="view"></main>
<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
<dialog id="dlgConf" class="conferma"><form method="dialog"><p id="confTesto"></p>
  <div class="dlg-actions"><button class="btn" value="no">Annulla</button><button class="btn primary" value="si">Conferma</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ stato ============ */
const COLS=['atlete','divise','richieste','materiale','movimenti'];
const S={tema:(()=>{try{return localStorage.getItem('tema')||null}catch(e){return null}})(),
  settings:null,atlete:{},divise:{},richieste:{},materiale:{},movimenti:{},loaded:new Set(),
  db:null,dl:null,status:'connecting',readonly:false,busy:false,
  app:{percorso:'',cartella:'',copie:[],chiesto:false,nuovaVersione:null,cercando:false,problemiExcel:[]},
  ui:{q:'',team:'',aTeam:'',aEsito:'',aArt:'',aQ:'',atlTab:'elenco',aperte:{},magTab:'divise',showOld:false,showInUse:false,mvQ:'',mvTipo:'',mvAll:false}};
/* Il segno del prodotto: una maglia, non lo stemma di nessuno. Si vede
   finche' una societa' non carica il suo da Impostazioni. */
const MARCHIO=`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11 4 4 7l2 6 3-1v16h14V12l3 1 2-6-7-3a5 5 0 0 1-10 0Z" fill="currentColor"/></svg>`;
const SZ=['XXS','XS','S','M','L','XL','XXL'];
/* L'ordine delle taglie e' quello dei ripiani, non l'alfabeto. Le taglie a
   numero (35-37, oppure 5-6 anni) non stanno nell'elenco delle lettere: si
   mettono in fila per il primo numero che contengono, se no "11-12 anni"
   finiva prima di "5-6 anni". */
const szIdx=t=>{const i=SZ.indexOf(t);if(i>=0)return i;
  const n=String(t||'').match(/\d+/);return n?100+Number(n[0]):999};
const $=s=>document.querySelector(s);
/* Il tema scelto a mano sta nel browser di questo computer: non e' un dato
   della societa' e non deve finire nelle copie di sicurezza. */
function applicaTema(){
  if(S.tema)document.documentElement.setAttribute('data-theme',S.tema);
  else document.documentElement.removeAttribute('data-theme');
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>String(s||'').toLowerCase().replace(/(^|[\s'\-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
const nomeTipo=t=>t==='POSSESSO'?'Già in possesso':t==='SCARTO'?'Dismesso':cap(t);
const teamLabel=t=>t?cap(String(t).replace(/^UNDER /,'U')).replace(/^U(\d)/,'U$1'):'';
/* Il nome da mostrare. Il codice dell'articolo resta quello scritto
   nell'archivio; qui si guarda se qualcuno gli ha dato famiglia ed etichetta. */
const artLabel=a=>{
  const x=_D&&_D.art?_D.art[a]:null;
  // "Felpa Felpa" non lo dice nessuno: quando l'etichetta e' gia' il nome
  // della famiglia, la famiglia non si ripete.
  if(x&&x.etichetta){const f=x.famiglia?cap(x.famiglia):'';
    return f&&norm(f)!==norm(x.etichetta)?f+' '+x.etichetta:x.etichetta}
  const s=String(a||'').toLowerCase();return s.charAt(0).toUpperCase()+s.slice(1)};
/* Solo la parte dentro la famiglia, per gli elenchi gia' raggruppati. */
const artSolo=a=>{const x=_D&&_D.art?_D.art[a]:null;
  return x&&x.etichetta?x.etichetta:artLabel(a)};
/* Negli elenchi a tendina gli articoli vanno in ordine alfabetico come si
   leggono, non nell'ordine in cui sono stati creati. */
const perNome=(x,y)=>artLabel(x.nome||x).localeCompare(artLabel(y.nome||y));
/* Il codice corto dell'articolo (A001) e quello della singola taglia
   (A001_M): il primo si scrive sul catalogo, il secondo sull'ordine. */
const artCodice=a=>{const x=_D&&_D.art?_D.art[a]:null;return (x&&x.codice)||''};
const artCodiceTaglia=(a,t)=>{const c=artCodice(a);
  if(!c)return '';
  if(!t||t==='UNICA')return c;
  // "5-6 anni" diventa 5-6: la parola non aggiunge niente, e nel codice gli
  // spazi sono solo un modo in piu' per sbagliare a scrivere.
  const tg=String(t).replace(/\s*anni/i,'').replace(/\s+/g,'');
  return `${c}_${tg}`};
/* Il primo codice libero, contando quelli gia' dati. */
/* Chi aveva gia' degli articoli prima che esistesse il codice se lo trova
   assegnato da solo, una volta, nell'ordine dell'elenco. Aggiunge un campo e
   non tocca nient'altro; se si ripete non succede niente, perche' a quel
   punto ce l'hanno tutti. */
let _codiciAssegnati=false;
async function assegnaCodiciMancanti(){
  if(_codiciAssegnati||!S.settings||S.readonly||!S.db)return;
  const arts=[...(S.settings.articoli||[])];
  if(!arts.length||!arts.some(a=>!a.codice))return;
  _codiciAssegnati=true;
  for(let k=0;k<arts.length;k++)if(!arts[k].codice)arts[k]={...arts[k],codice:prossimoCodice(arts)};
  // Finito il giro si puo' rifare: se poi si riprende una copia vecchia, senza
  // codici, li riceve anche lei senza dover riavviare il programma.
  try{await S.db.doc('settings/main').update({articoli:arts})}catch(e){}finally{_codiciAssegnati=false}
}
function prossimoCodice(arts){
  let n=0;
  for(const a of arts||[]){const m=/^A(\d+)$/.exec(String(a.codice||''));if(m)n=Math.max(n,Number(m[1]))}
  return 'A'+String(n+1).padStart(3,'0');
}
/* Una taglia scritta a mano: le sigle (s, xl) in maiuscolo, il resto come e'
   scritto. "5-6 anni" in maiuscolo diventava un'altra taglia. */
const normTaglia=t=>{t=String(t??'').trim().replace(/\s+/g,' ');return /^[a-z0-9]{1,5}$/i.test(t)?t.toUpperCase():t};
const artFamiglia=a=>{const x=_D&&_D.art?_D.art[a]:null;return (x&&x.famiglia)||''};
const fullName=a=>a?`${a.cognome} ${a.nome}`.trim():'Atleta rimosso';
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const fmtDate=d=>{if(!d)return'';const [y,m,g]=String(d).split('-');return g?`${g}/${m}/${y.slice(2)}`:d};

/* ============ motore ============ */
let _D=null;
function changed(){_D=null;schedule()}
/* La serie di numeri di una squadra: la sua, oppure quella del gruppo di
   squadre che condividono i numeri (campo gruppoNumeri, uguale su tutte). */
const serieNumeri=(D,squadra)=>(D.gruppo&&D.gruppo[squadra])||('S:'+squadra);
const stessaSerie=(D,a,b)=>serieNumeri(D,a)===serieNumeri(D,b);
function squadreDellaSerie(D,squadra){const k=serieNumeri(D,squadra);return D.perServire.map(x=>x.nome).filter(n=>serieNumeri(D,n)===k)}
function nomeSerie(D,squadra){const t=squadreDellaSerie(D,squadra);return t.length>1?t.map(teamLabel).join(' + '):teamLabel(squadra)}
/* I numeri ripetuti, una volta per serie (non una per squadra del gruppo). */
function doppioniPerSerie(D){
  const out=[];const viste=new Set();
  for(const sq of D.perServire){const k=serieNumeri(D,sq.nome);if(viste.has(k))continue;viste.add(k);
    for(const [n,chi] of Object.entries(numeriDiSquadra(D,sq.nome)))if(chi.length>1)out.push({squadra:sq.nome,serie:nomeSerie(D,sq.nome),numero:n,chi})}
  return out;
}

/* Le altre schede della stessa persona: chi gioca in due squadre ha una
   scheda per squadra, collegate dallo stesso campo `persona`. */
function collegati(aid){
  const a=S.atlete[aid];if(!a||!a.persona)return [];
  return Object.keys(S.atlete).filter(x=>x!==aid&&S.atlete[x].persona===a.persona);
}
/* Nomi uguali in squadre diverse, non ancora collegati ne' dichiarati
   persone diverse: il programma chiede, non decide da solo, perche' due
   omonime in squadre diverse esistono. */
function omonimiDaChiarire(){
  const diversi=new Set((S.settings&&S.settings.nomiDiversi)||[]);
  const g={};
  for(const [id,a] of Object.entries(S.atlete)){const k=KEY(a.cognome+'|'+a.nome);(g[k]=g[k]||[]).push(id)}
  return Object.entries(g).filter(([k,ids])=>{
    if(ids.length<2||diversi.has(k))return false;
    if(new Set(ids.map(x=>S.atlete[x].squadra)).size<2)return false;
    const p=S.atlete[ids[0]].persona;return !(p&&ids.every(x=>S.atlete[x].persona===p))});
}
/* Collega le schede date: prendono tutte lo stesso segno di persona. */
async function collegaSchede(ids){
  const p=ids.map(x=>S.atlete[x]&&S.atlete[x].persona).find(Boolean)||('P'+Date.now().toString(36));
  return w(async()=>{for(const x of ids)if(S.atlete[x]&&S.atlete[x].persona!==p)await S.db.doc('atlete/'+x).update({persona:p})});
}
/* "Gioca anche in ...": le altre squadre di questa persona. */
function ancheIn(aid){
  return collegati(aid).map(x=>S.atlete[x]).filter(Boolean).map(x=>teamLabel(x.squadra));
}

/* Un numero si puo' dare a un'atleta di quella squadra? No se lo porta gia'
   una compagna, e no se e' riservato a una compagna che sta cambiando maglia.
   La maglia che la compagna lascia (lo scambio) invece si': e' proprio quella. */
function numeroDaDare(D,squadra,aid,d){
  const n=Number(d.numero);
  if(d.holder===aid)return true;
  if((D.occ[squadra]||new Set()).has(n))return false;
  const chi=D.riservati&&D.riservati[serieNumeri(D,squadra)]&&D.riservati[serieNumeri(D,squadra)].get(n);
  return !chi||chi===aid||d.holder===chi;
}
/* Le maglie dell'atleta il cui numero, in un'altra squadra, e' gia' di
   qualcuno: spostandola li' ci sarebbero due maglie con lo stesso numero. */
function maglieInConflitto(aid,squadra){
  const D=derive();const occ=D.occ[squadra]||new Set();
  return (D.perAtleta[aid]||[]).map(id=>[id,S.divise[id]])
    .filter(([,d])=>d&&!d.daRestituire&&occ.has(Number(d.numero))
      &&Object.values(S.divise).some(x=>x!==d&&!x.dismessa&&x.holder&&x.holder!==aid&&!x.daRestituire
        &&S.atlete[x.holder]&&stessaSerie(D,S.atlete[x.holder].squadra,squadra)&&Number(x.numero)===Number(d.numero)));
}
/* Prima di spostare un'atleta in un'altra squadra: se il suo numero li' e'
   gia' preso, lo si dice e, confermando, la sua maglia viene segnata da
   cambiare. Torna false se si rinuncia allo spostamento. */
async function preparaSpostamento(aid,squadra){
  const c=maglieInConflitto(aid,squadra);if(!c.length)return true;
  const numeri=c.map(([,d])=>d.numero).join(', ');
  if(!await chiedi(`In ${teamLabel(squadra)} ${c.length===1?'il numero '+numeri+' è':'i numeri '+numeri+' sono'} già in uso.\nSpostare comunque l’atleta? ${c.length===1?'La sua maglia viene segnata':'Le sue maglie vengono segnate'} da cambiare.`))return false;
  return w(async()=>{for(const [id] of c)await S.db.doc('divise/'+id).update({daRestituire:true})});
}

/* Il tipo di un lotto: "gara" (la divisa della squadra) o "libero" (la maglia
   da libero). Sta in settings.tipiLotto; per gli archivi di prima vale la
   vecchia lista dei lotti comuni, che erano i liberi. */
function tipoLotto(m){
  m=m||'STANDARD';const set=S.settings||{};
  const t=(set.tipiLotto||{})[m];if(t)return t;
  return (set.modelliComuni||['LIBERO']).includes(m)?'libero':'gara';
}
const TIPI_MAGLIA={gara:'divisa da gara',libero:'maglia da libero'};
/* La maglia che l'atleta sta cambiando e da cui eredita il numero, per una
   richiesta di quel lotto: dello stesso tipo, qualunque lotto sia (chi cambia
   squadra cambia anche lotto, e tiene il numero). */
function mieiDaCambiare(aid,mod){
  const t=tipoLotto(mod);
  return Object.values(S.divise).find(d=>!d.dismessa&&d.holder===aid&&d.daRestituire&&tipoLotto(d.modello)===t)||null;
}
function derive(){
  if(_D)return _D;
  const set=S.settings||{squadre:[],articoli:[],modelli:[]};
  const teamIdx={},includi={},lotto={};
  // Le squadre si vedono sempre nell'ordine di distribuzione, il numero
  // scritto sulla squadra: e' anche chi viene servito per primo quando il
  // materiale non basta. A parita' di numero, in ordine alfabetico.
  const squadreOrd=[...(set.squadre||[])].sort((a,b)=>norm(a.nome).localeCompare(norm(b.nome)));
  const prio=x=>Number.isFinite(Number(x.ordine))&&x.ordine!==''&&x.ordine!=null?Number(x.ordine):9999;
  const perServire=[...squadreOrd].sort((a,b)=>prio(a)-prio(b)||norm(a.nome).localeCompare(norm(b.nome)));
  perServire.forEach((s,i)=>{teamIdx[s.nome]=i});
  squadreOrd.forEach(s=>{includi[s.nome]=s.includi!==false;lotto[s.nome]=s.modelloDivisa||'STANDARD'});
  // Le squadre che condividono i numeri hanno la stessa serie.
  const gruppo={};for(const s of set.squadre||[])if(s.gruppoNumeri)gruppo[s.nome]='G:'+s.gruppoNumeri;
  const serie=t=>gruppo[t]||('S:'+t);
  // Ogni squadra ha un lotto per tipo di maglia: le divise da gara e le
  // maglie da libero. Una richiesta dice il tipo (vuoto = divisa della
  // squadra, un lotto da libero = maglia da libero) e il lotto lo decide la
  // squadra dell'atleta.
  const lottiLibero=(set.modelli||[]).filter(m=>tipoLotto(m)==='libero');
  if(!lottiLibero.length)lottiLibero.push('LIBERO');
  const comuni=new Set(lottiLibero); // tutti i lotti da libero (nome storico)
  const liberoDi={};
  squadreOrd.forEach(s=>{liberoDi[s.nome]=s.modelloLibero&&lottiLibero.includes(s.modelloLibero)?s.modelloLibero:lottiLibero[0]});
  const modelloPer=r=>{const c=r.modello||'';const a=S.atlete[r.atletaId];
    if(c&&tipoLotto(c)==='libero')return (a&&liberoDi[a.squadra])||lottiLibero[0];
    return (a&&lotto[a.squadra])||'STANDARD'};
  const art={};(set.articoli||[]).forEach(a=>art[a.nome]=a);
  const conNumero=a=>!!(art[a]&&art[a].conNumero);

  // divise per atleta, numeri occupati per squadra
  const perAtleta={},occ={},occS={};
  for(const [id,d] of Object.entries(S.divise)){
    if(d.dismessa)continue;
    if(d.holder){(perAtleta[d.holder]=perAtleta[d.holder]||[]).push(id);
      if(!d.daRestituire){const t=S.atlete[d.holder]&&S.atlete[d.holder].squadra;
        if(t){(occS[serie(t)]=occS[serie(t)]||new Set()).add(Number(d.numero))}}}
  }
  // Ogni squadra vede la serie intera: le squadre di un gruppo condividono lo
  // stesso insieme di numeri occupati.
  for(const t of new Set([...(set.squadre||[]).map(x=>x.nome),...Object.values(S.atlete).map(a=>a.squadra)]))
    occ[t]=occS[serie(t)]||(occS[serie(t)]=new Set());
  // giacenze materiale
  const stock={};const key=(a,t)=>a+'|'+t;
  const st=k=>stock[k]||(stock[k]={iniziale:0,carichi:0,consegne:0,rientri:0,scarti:0,ordinati:0});
  for(const m of Object.values(S.materiale)){const s=st(key(m.articolo,m.taglia));
    s.iniziale+=Number(m.iniziale)||0;s.ordinati=(s.ordinati||0)+(Number(m.ordinati)||0)}
  const dotazione={};
  for(const mv of Object.values(S.movimenti)){
    if(mv.divisaId||conNumero(mv.articolo))continue;
    const s=st(key(mv.articolo,mv.taglia));const q=Number(mv.qta)||0;
    if(mv.tipo==='CARICO'||mv.tipo==='RETTIFICA')s.carichi+=q;
    else if(mv.tipo==='CONSEGNA')s.consegne+=q;
    else if(mv.tipo==='RIENTRO')s.rientri+=q;
    // Dismessi: escono dal magazzino senza andare a nessuno.
    else if(mv.tipo==='SCARTO')s.scarti+=q;
    // POSSESSO: l'atleta l'aveva gia' (di solito da una stagione passata). Conta
    // fra le cose che ha, ma non e' uscito dal magazzino di oggi.
    if(mv.atletaId&&(mv.tipo==='CONSEGNA'||mv.tipo==='RIENTRO'||mv.tipo==='POSSESSO')){
      const dd=dotazione[mv.atletaId]||(dotazione[mv.atletaId]={});
      const k2=key(mv.articolo,mv.taglia);dd[k2]=(dd[k2]||0)+(mv.tipo==='RIENTRO'?-q:q)}
  }
  for(const s of Object.values(stock))s.ora=s.iniziale+s.carichi-s.consegne+s.rientri-s.scarti;

  // assegnazione
  const avail=Object.entries(S.divise).filter(([id,d])=>!d.dismessa&&!(d.fuoriUso&&!d.holder)&&(!d.holder||d.daRestituire))
    .sort((a,b)=>(a[1].numero-b[1].numero)||(a[0]<b[0]?-1:1));
  const taken=new Set(),usedMat={},prop={},prenDivisa={},prenMat={};
  // Chi gioca in due squadre riceve il materiale una volta sola: qui si segna
  // chi, fra le sue schede, lo sta gia' ricevendo.
  const perPersona={};
  const occW={};const cloni={};for(const t in occ){const k=serie(t);occW[t]=cloni[k]||(cloni[k]=new Set(occ[t]))}
  // Il numero di chi sta cambiando maglia resta suo finche' ha una richiesta
  // aperta: se no una compagna che viene prima in elenco se lo prende, e per
  // qualche giorno in squadra ci sono due maglie con lo stesso numero.
  const riservati={};
  for(const r of Object.values(S.richieste)){
    const a=S.atlete[r.atletaId];if(!a||a.inUscita||a.attiva===false||!conNumero(r.articolo))continue;
    const own=mieiDaCambiare(r.atletaId,modelloPer(r));
    if(own)(riservati[serie(a.squadra)]=riservati[serie(a.squadra)]||new Map()).set(Number(own.numero),r.atletaId);
  }
  const reqs=Object.entries(S.richieste).sort((a,b)=>{
    const ra=a[1],rb=b[1];const aa=S.atlete[ra.atletaId],ab=S.atlete[rb.atletaId];
    const ka=[ra.numeroDesiderato!=null?0:1,conNumero(ra.articolo)?0:1,aa?(teamIdx[aa.squadra]??99):999,norm(fullName(aa)),ra.ordine||0];
    const kb=[rb.numeroDesiderato!=null?0:1,conNumero(rb.articolo)?0:1,ab?(teamIdx[ab.squadra]??99):999,norm(fullName(ab)),rb.ordine||0];
    for(let i=0;i<ka.length;i++){if(ka[i]<kb[i])return-1;if(ka[i]>kb[i])return 1}return 0});
  for(const [rid,r] of reqs){
    const a=S.atlete[r.atletaId];
    if(!a){prop[rid]={esito:'ESCLUSA',motivo:'Atleta non trovato'};continue}
    if(a.inUscita){prop[rid]={esito:'ESCLUSA',motivo:'Eliminazione in attesa di riconsegna'};continue}
    if(a.attiva===false){prop[rid]={esito:'ESCLUSA',motivo:'Atleta non attivo'};continue}
    if(includi[a.squadra]===false){prop[rid]={esito:'ESCLUSA',motivo:'Squadra esclusa dalla distribuzione'};continue}
    // Un articolo di una stagione vecchia che si e' deciso di non smaltire
    // resta in inventario ma non viene mai proposto.
    const artR=art[r.articolo];
    if(artR&&artR.distribuibile===false){prop[rid]={esito:'ESCLUSA',motivo:`${artLabel(r.articolo)} non è più in distribuzione`};continue}
    if(conNumero(r.articolo)){
      const o=occW[a.squadra]||(occW[a.squadra]=new Set());
      const mod=modelloPer(r);
      const ris=riservati[serie(a.squadra)];
      const cand=avail.filter(([id,d])=>{
        if(taken.has(id)||d.taglia!==r.taglia||(d.modello||'STANDARD')!==mod||o.has(Number(d.numero)))return false;
        // La maglia che lei stessa sta restituendo non e' una consegna.
        if(d.holder===r.atletaId)return false;
        // Una maglia data "per adesso" in un'altra taglia resta a chi ce l'ha
        // finche' non arriva la sua: toglierla vorrebbe dire lasciarla senza.
        if(d.holder&&d.tagliaChiesta)return false;
        // Il numero di una compagna che cambia maglia e' suo, tranne quando si prende
        // proprio la maglia che lei lascia (lo scambio in palestra).
        const chi=ris&&ris.get(Number(d.numero));
        if(chi&&chi!==r.atletaId&&d.holder!==chi)return false;
        return true});
      let pref=r.numeroDesiderato;
      // Il numero si eredita dalla divisa che restituisce anche se cambia
      // lotto: chi aveva il 77 in U19 tiene il 77 in prima squadra.
      if(pref==null){const own=mieiDaCambiare(r.atletaId,mod);if(own)pref=Number(own.numero)}
      let pick=pref!=null?cand.find(([id,d])=>Number(d.numero)===Number(pref)):null;
      let motivo='';
      // Se in squadra c'e' gia' una divisa della taglia giusta che una compagna
      // sta restituendo, si prende quella: le due si scambiano la maglia in
      // palestra e il magazzino non si muove. Viene dopo il numero chiesto e
      // dopo il proprio numero, che sono desideri di chi la indossa.
      if(!pick){
        const scambio=cand.find(([id,d])=>{
          if(!d.holder||!d.daRestituire)return false;
          const compagna=S.atlete[d.holder];
          return compagna&&serie(compagna.squadra)===serie(a.squadra)&&d.holder!==r.atletaId});
        if(scambio){pick=scambio;motivo=`Scambio dentro ${teamLabel(a.squadra)}: la lascia ${fullName(S.atlete[scambio[1].holder])}`}}
      if(!pick&&cand.length){pick=cand[0];if(r.numeroDesiderato!=null)motivo=`Il n.${r.numeroDesiderato} non è disponibile in ${r.taglia}`}
      if(pick){taken.add(pick[0]);o.add(Number(pick[1].numero));prenDivisa[pick[0]]=rid;prop[rid]={esito:'OK',divisaId:pick[0],motivo}}
      else prop[rid]={esito:'MANCA',motivo:`Nessuna divisa ${r.taglia} libera con numero non usato in squadra`};
    }else{
      if(a.persona){
        const altre=Object.keys(S.atlete).filter(x=>x!==r.atletaId&&S.atlete[x].persona===a.persona);
        const gia=altre.find(x=>Object.entries(dotazione[x]||{}).some(([kk,v])=>v>0&&kk.split('|')[0]===r.articolo));
        if(gia){prop[rid]={esito:'ESCLUSA',motivo:`Già consegnato con la scheda di ${teamLabel(S.atlete[gia].squadra)}`};continue}
        const kp=a.persona+'|'+r.articolo;
        if(perPersona[kp]){prop[rid]={esito:'ESCLUSA',motivo:`Lo riceve con la scheda di ${teamLabel(perPersona[kp])}`};continue}
        perPersona[kp]=a.squadra;
      }
      const k=key(r.articolo,r.taglia);const disp=stock[k]?stock[k].ora:0;const u=usedMat[k]||0;
      if(u<disp){usedMat[k]=u+1;prenMat[k]=u+1;prop[rid]={esito:'OK'}}
      else prop[rid]={esito:'MANCA',motivo:disp<=0?'Esaurito':'Non basta per tutte le richieste'};
    }
  }
  const order=reqs.map(r=>r[0]);
  _D={set,squadreOrd,perServire,teamIdx,includi,lotto,gruppo,comuni,lottiLibero,liberoDi,modelloPer,art,conNumero,perAtleta,occ,riservati,stock,dotazione,prop,prenDivisa,prenMat,order,key};
  return _D;
}

/* ============ render ============ */
let _raf=0;
function schedule(){if(_raf)return;_raf=requestAnimationFrame(()=>{_raf=0;render()})}
function route(){const h=location.hash.replace(/^#/,'')||'home';const [v,...rest]=h.split('/');return {v,arg:decodeURIComponent(rest.join('/'))}}
/* Dove si era arrivati scorrendo, schermata per schermata. La parte che
   scorre viene ridisegnata a ogni cambio, quindi senza questo si tornava
   sempre in cima: aprire un atleta e tornare indietro voleva dire rifare
   tutto lo scorrimento. */
const _scorri={};let _dove=null;
function chiaveDove(r){return r.v==='atleta'?null:[r.v,S.ui.atlTab,S.ui.magTab,S.ui.assTab].join('|')}
function render(){
  const r=route();
  {const sc=document.querySelector('#view>.scorrevole');if(sc&&_dove)_scorri[_dove]=sc.scrollTop}
  document.body.classList.toggle('inCasa',r.v==='home');
  document.querySelectorAll('#tabs a').forEach(a=>{const cur=a.dataset.tab===r.v||((r.v==='atleta'||r.v==='atlete'||r.v==='atleti')&&a.dataset.tab==='squadre');cur?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
  const sy=$('#sync');const ready=S.loaded.size===COLS.length+1;

/* In cima a ogni schermata, sempre uguale: cosa si fa qui e, se ci sono,
   cosa vogliono dire i colori. Si apre e si chiude, e resta chiusa finche'
   non serve: chi usa il programma tutti i giorni non ha bisogno di rileggerla.
   Il testo e' scritto qui dentro, non viene dai dati. */
function legenda(spiega,voci){
  // Aperta o chiusa, schermata per schermata: aprirla in Movimenti non deve
  // aprirla anche in Magazzino.
  const r=route();const k=[r.v==='atleta'?'atleta':r.v,S.ui.atlTab,S.ui.magTab,S.ui.assTab].join('|');
  const aperta=!!(S.ui.legende||{})[k];
  voci=voci||[];
  return `<details class="legenda"${aperta?' open':''} data-act="legenda" data-k="${esc(k)}">
  <summary>Come funziona questa schermata</summary>
  <div class="spiegaLeg">${spiega}</div>`+
  (voci.length?`<div class="vociLeg">`+voci.map(v=>`<span class="voceLeg">${v[0]}<span>${esc(v[1])}</span></span>`).join('')+`</div>`:'')+`</details>`;
}

/* Le voci del cartellino maglia: sono le stesse ovunque compaia. */
function vociDivise(conPrenotate){
  const q=(cls,n,t)=>`<span class="jersey ${cls}"><b>${n}</b><small>${t}</small></span>`;

/* Tiene fermi in alto titolo, spiegazione e pulsanti mentre l'elenco scorre.
   Si guarda dove comincia il primo elenco o la prima tabella: tutto quello che
   viene prima e' testata. Fatto qui una volta, vale per ogni schermata. */
function bloccaTestata(view){
  // Si cerca il primo figlio diretto che sia, o che contenga, un elenco o una
  // tabella: in qualche schermata la tabella sta dentro un contenitore, e
  // fermarsi al primo livello lasciava quelle schermate senza testata bloccata.
  // Anche un titoletto e' un confine: in Assegnazioni "Da ordinare" finiva
  // nella testata e restava li' fisso sopra l'elenco delle richieste, come se
  // fosse il titolo di quello che si sta guardando.
  const dentro='.list,.tabellaFuori,.table-wrap,.group-head,.sqRiga,details.man,table,h2';
  let primo=null;
  for(const figlio of view.children)
    if(figlio.matches(dentro)||figlio.querySelector(dentro)){primo=figlio;break}
  if(!primo){
    // Nessun confine: tutta la pagina scorre. Meglio una testata che scorre
    // via che una pagina ferma.
    if(document.body.classList.contains('inCasa'))return;
    const tutta=document.createElement('div');tutta.className='scorrevole';
    while(view.firstChild)tutta.appendChild(view.firstChild);
    view.appendChild(tutta);return}
  const testata=document.createElement('div');
  testata.className='testata';
  while(view.firstChild&&view.firstChild!==primo)testata.appendChild(view.firstChild);
  const scorrevole=document.createElement('div');
  scorrevole.className='scorrevole';
  while(view.firstChild)scorrevole.appendChild(view.firstChild);
  if(testata.childNodes.length)view.appendChild(testata);
  view.appendChild(scorrevole);
}

/* Come si chiama una divisa di quel lotto. I nomi dei lotti sono dati della
   societa': il codice non ne conosce nessuno. */
function nomeLotto(m,plurale){
  m=m||'STANDARD';
  if(m==='STANDARD')return plurale?'Divise gara':'Divisa gara';
  if(tipoLotto(m)==='libero')return m==='LIBERO'?(plurale?'Maglie da libero':'Maglia da libero'):(plurale?'Maglie ':'Maglia ')+m.toLowerCase();
  return (plurale?'Divise ':'Divisa ')+m.toLowerCase();
}
/* Il colore del lotto: bianca per i lotti comuni (i liberi), nera per un lotto
   riservato a una squadra, gialla per la divisa standard. */
function classeLotto(m){
  m=m||'STANDARD';if(m==='STANDARD')return '';
  return derive().comuni.has(m)?'libero':'prima';
}
function chip(d,extra,asBtn,id){
  if(!d)return'';const c=['jersey'];
  const cl=classeLotto(d.modello);if(cl)c.push(cl);
  // Verde vuol dire che sta in magazzino, giallo che ce l'ha addosso
  // qualcuno: prima erano tutte e due gialle e il cartellino non lo diceva.
  if(d.fuoriUso&&!d.holder)c.push('rovinata');
  else if(!d.holder&&!d.dismessa)c.push('inCasa');
  if(d.daRestituire)c.push('rientro');if(extra)c.push(extra);
  const t=`${(d.modello||'STANDARD')!=='STANDARD'?nomeLotto(d.modello)+' ':''}n.${d.numero} taglia ${d.taglia}${d.daRestituire?' (da cambiare)':''}${d.fuoriUso&&!d.holder?' (fuori uso)':''}`;
  return asBtn?`<button type="button" class="${c.join(' ')}" data-act="divisa" data-id="${esc(id)}" aria-label="${esc(t)}"><b>${esc(d.numero)}</b><small>${esc(d.taglia)}</small></button>`
    :`<span class="${c.join(' ')}" title="${esc(t)}"><b>${esc(d.numero)}</b><small>${esc(d.taglia)}</small></span>`;
}
const esitoPill=p=>!p?'':p.esito==='OK'?'<span class="pill ok">Pronta</span>':p.esito==='MANCA'?'<span class="pill bad">Da ordinare</span>':'<span class="pill">Esclusa</span>';
function teamOptions(sel,withAll){const D=derive();return (withAll?`<option value="">${withAll}</option>`:'')+D.perServire.map(s=>`<option value="${esc(s.nome)}"${s.nome===sel?' selected':''}>${esc(teamLabel(s.nome))}</option>`).join('')}

/* La schermata Squadre. Ogni squadra e' una riga con le sue impostazioni -
   nome, lotto divise, ordine di distribuzione - e si apre per vedere chi c'e'
   dentro. Prima gli atleti stavano in un elenco a parte: due schermate per
   parlare delle stesse persone, e per sapere quanti erano in una squadra
   bisognava cambiare schermata.

function vAtlete(){
  const D=derive();const q=norm(S.ui.q);

    &&(!q||norm(fullName(a)).includes(q)||norm(a.nome+' '+a.cognome).includes(q))
    &&(nQ===null||haIlNumero(id));

  if(S.ui.atlTab==='riepilogo')return vRiepilogo();

  const open={};for(const [rid,r] of Object.entries(S.richieste)){const p=D.prop[rid];const o=open[r.atletaId]||(open[r.atletaId]={ok:0,manca:0});if(p&&p.esito==='OK')o.ok++;else if(p&&p.esito==='MANCA')o.manca++}
  const doppi=conNumeroDoppio(D);

  let html=testaSquadre();
  const daChiarire=omonimiDaChiarire();
  // Piu' di un nome da chiarire: una riga sola che si apre. Due avvisi aperti

    return `<div class="omonimo"><span><b>${esc(fullName(a))}</b> (${ids.map(x=>esc(teamLabel(S.atlete[x].squadra))).join(', ')}). È la stessa persona?</span>
      <span class="row-actions"><button type="button" class="btn small primary" data-act="collegaPersona" data-k="${esc(k)}">Sì, stessa persona</button>
      <button type="button" class="btn small" data-act="nomiDiversi" data-k="${esc(k)}">No, persone diverse</button></span></div>`}).join('')+`</details>`;
  else if(daChiarire.length)html+=`<div class="notice">`+daChiarire.map(([k,ids])=>{const a=S.atlete[ids[0]];
    return `<div class="omonimo"><span>Lo stesso nome compare in più squadre: <b>${esc(fullName(a))}</b> (${ids.map(x=>esc(teamLabel(S.atlete[x].squadra))).join(', ')}). È la stessa persona?</span>
      <span class="row-actions"><button type="button" class="btn small primary" data-act="collegaPersona" data-k="${esc(k)}">Sì, stessa persona</button>
      <button type="button" class="btn small" data-act="nomiDiversi" data-k="${esc(k)}">No, persone diverse</button></span></div>`}).join('')+`</div>`;

  const squadre=D.perServire;
  if(!squadre.length)return html+`<div class="list"><p class="empty">Non c'è ancora nessuna squadra. Per iniziare aggiungere una squadra, oppure caricarle da un foglio Excel (Impostazioni &rarr; Prima configurazione).</p></div>`;

  const lotti=lottiSceglibili();
  const dentroA={};
  for(const e of Object.entries(S.atlete))(dentroA[e[1].squadra]=dentroA[e[1].squadra]||[]).push(e);
  let viste=0;

  for(const x of squadre){
    const tutti=(dentroA[x.nome]||[]).sort((p,r)=>norm(fullName(p[1])).localeCompare(norm(fullName(r[1]))));
    const dentro=tutti.filter(filtra);
    if(cercando&&!dentro.length)continue;

    const aperta=cercando?true:!!S.ui.aperte[x.nome];
    const n=tutti.length;
    // Con la squadra chiusa non si vedrebbero le righe segnate: l'avviso sta
    // anche qui, cosi' si sa dove aprire.
    const suoi=[...new Set(tutti.flatMap(([id])=>doppi[id]||[]))].sort((p,r)=>p-r);
    // Lo stato delle impostazioni, scritto piccolo: si cambia da «Impostazioni».

    const stato=[lotti.length>1?nomeLotto(x.modelloDivisa||'STANDARD',true).toLowerCase():'',
      con.length?`numeri in comune con ${con.map(teamLabel).join(', ')}`:'',

    <span class="sqStato" title="${esc(stato)}">${esc(stato)}</span>
    <div class="sqAzioni">
      <button type="button" class="btn small" data-act="tuttaSq" data-n="${esc(x.nome)}" title="Consegna un articolo a tutti gli atleti della squadra, o ritiralo da tutti"><span class="lungo">Consegna o ritira a tutti</span><span class="corto">A tutti</span></button>
