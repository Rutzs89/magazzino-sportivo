/* Una giacenza negativa vuol dire che i conti non tornano: pezzi consegnati
   che il magazzino non aveva. Il calcolo e' giusto (e' la somma dei movimenti),
   ma il risultato assurdo va detto, non lasciato li' come un numero qualsiasi. */
function giacenzeNegative(){
  const D=derive();const out=[];
  for(const [k,st] of Object.entries(D.stock)){
    const [art,tg]=k.split('|');
    if(D.conNumero(art))continue;
    if(st.ora<0)out.push(`${esc(artLabel(art))} ${tg==='UNICA'?'':esc(tg)}: la giacenza è ${st.ora}. Verificare carichi e annullamenti nei movimenti.`);
  }
  return out;
}

/* Quello che non torna fra le divise. Il numero doppio in squadra non c'e'
   piu' qui: si vede gia' sulla copertina, sulle squadre, sugli atleti e nelle
   assegnazioni. */
function problemiDivise(){
  const out=[];const g={};
  for(const [id,d] of Object.entries(S.divise)){if(d.dismessa)continue;const k=`${d.modello}|${d.taglia}|${d.numero}`;(g[k]=g[k]||[]).push(id)}
  for(const [k,v] of Object.entries(g)){
    if(v.length<2)continue;
    const [m,t,n]=k.split('|');
    // Due capi uguali in squadre diverse vanno bene. Uno in mano a qualcuno e
    // uno uguale in magazzino di solito e' lo stesso capo contato due volte.
    const libera=v.some(id=>!S.divise[id].holder),usata=v.some(id=>S.divise[id].holder);
    if(!(libera&&usata))continue;
    const dove=v.map(id=>{const d=S.divise[id];return d.holder&&S.atlete[d.holder]?esc(fullName(S.atlete[d.holder])):'magazzino'}).join(', ');
    out.push(`La ${esc(m==='STANDARD'?'':m.toLowerCase()+' ')}${esc(t)} n.${esc(n)} risulta sia in magazzino sia a ${dove.replace('magazzino, ','').replace(', magazzino','')}: probabilmente è lo stesso capo contato due volte.`)}
  for(const d of Object.values(S.divise))
    if(d.holder&&!S.atlete[d.holder]&&!d.dismessa)
      out.push(`La ${esc(d.taglia)} n.${esc(d.numero)} risulta a un atleta che non c'è più: segnane il rientro.`);
  return out;
}

/* Le domande di conferma, dentro il programma e con la sua grafica.
   Nel programma installato la conferma di sistema non va: il componente delle
   finestre la sostituisce con una versione asincrona che, senza permesso,
   viene rifiutata; prima ancora, senza await, tornava subito "si'" e ogni
   domanda passava da sola senza essere mai mostrata. Si risponde sempre con
   una promessa: chi chiede usa await chiedi(...).
   Nel browser di prova resta la conferma normale; nelle prove automatiche la
   risposta si puo' fissare con window.__rispostaConferme. */
/* La domanda di conferma. Con {si:'Elimina', pericolo:true} il pulsante dice
   l'azione ed e' rosso, e il fuoco parte da «Annulla»: prima Invio confermava
   subito anche "Eliminare... non reversibile" (analisi del 25/09/2026). */
function chiedi(testo,op){
  op=op||{};
  if(window.__rispostaConferme!==undefined)return Promise.resolve(!!window.__rispostaConferme);
  if(!window.__APP)return Promise.resolve(window.confirm(testo));
  return new Promise(risposta=>{
    const d=$('#dlgConf');$('#confTesto').textContent=testo;d.returnValue='';
    const si=d.querySelector('button[value="si"]'),no=d.querySelector('button[value="no"]');
    si.textContent=op.si||'Conferma';si.className='btn '+(op.pericolo?'danger pieno':'primary');no.hidden=false;
    const chiuso=()=>{d.removeEventListener('close',chiuso);risposta(d.returnValue==='si')};
    d.addEventListener('close',chiuso);d.showModal();(op.pericolo?no:si).focus()});
}
/* Un avviso che resta finche' non lo si chiude: per errori e blocchi, che nel
   messaggio in basso sparivano in tre secondi prima di poterli leggere. */
function avvisoFisso(testo){
  if(window.__rispostaConferme!==undefined||!window.__APP){toast(testo);return Promise.resolve()}
  return new Promise(fine=>{
    const d=$('#dlgConf');$('#confTesto').textContent=testo;d.returnValue='';
    const si=d.querySelector('button[value="si"]'),no=d.querySelector('button[value="no"]');
    si.textContent='Chiudi';si.className='btn primary';no.hidden=true;
    const chiuso=()=>{d.removeEventListener('close',chiuso);no.hidden=false;fine()};
    d.addEventListener('close',chiuso);d.showModal();si.focus()});
}
window.chiedi=chiedi;
/* ============ scritture ============ */
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),3200)}
async function w(fn){
  if(!S.db){toast('Dati non raggiungibili.');return false}
  if(S.readonly){toast('Accesso in sola lettura: modifiche non consentite.');return false}
  try{await fn();return true}catch(e){console.error(e);
    // Sola lettura solo se l'archivio rifiuta davvero di scrivere. Un dato
    // che non esiste piu' (cancellato nel frattempo) e' un errore di quel
    // momento, non un motivo per bloccare tutto il resto della sessione.
    if(e&&e.code==='permission_denied'){S.readonly=true;toast('Modifiche non consentite su questi dati.');render()}
    else if(e&&e.code==='invalid_argument')toast('Il dato non esiste più: la pagina è stata aggiornata.');
    else if(e&&e.code==='quota_exceeded')toast('Archivio pieno: eliminare i movimenti vecchi oppure esportare e archiviare la stagione.');
    else if(e&&e.code==='resource_exhausted')toast('Troppe operazioni ravvicinate: attendere qualche secondo e riprovare.');
    else toast('Salvataggio non riuscito: riprovare.');return false}
}
const today=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let _seq=0,_gruppo=null;
function mov(o){return S.db.collection('movimenti').add(Object.assign({ts:Date.now()+(_seq++%1000)/1000,data:today(),stagione:(S.settings&&S.settings.stagione)||'',qta:1,atletaId:null,divisaId:null,numero:null,note:''},_gruppo?{gruppo:_gruppo}:{},o))}
/* I movimenti scritti dentro fn fanno parte di una sola operazione (una
   consegna con il ritiro della maglia vecchia): si annullano insieme. */
async function insieme(fn){
  const prima=_gruppo;_gruppo='g'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  try{return await fn()}finally{_gruppo=prima}
}
/* La richiesta come era, da scrivere sul movimento di consegna: annullando la
   consegna la si rimette al suo posto. */
function fotoRichiesta(rid){
  const r=S.richieste[rid];if(!r)return null;
  return {id:rid,atletaId:r.atletaId,articolo:r.articolo,taglia:r.taglia,modello:r.modello||'',
    numeroDesiderato:r.numeroDesiderato??null,note:r.note||'',ordine:r.ordine||0};
}
/* L'articolo con cui si registrano le divise da gara: il primo che ha il
   numero stampato. Non un nome scritto nel codice: ogni societa' lo chiama a
   modo suo. */
function artDivisa(){
  const a=((S.settings&&S.settings.articoli)||[]).find(x=>x.conNumero);
  return a?a.nome:'DIVISA GARA';
}
/* Le richieste aperte che una consegna di materiale soddisfa: stesso atleta,
   stesso articolo, stessa taglia, una per pezzo. */
function richiesteCoperte(aid,art,tg,qta){
  return Object.entries(S.richieste).filter(([,r])=>r.atletaId===aid&&r.articolo===art&&r.taglia===tg)
    .sort((x,y)=>(x[1].ordine||0)-(y[1].ordine||0)).slice(0,qta).map(e=>e[0]);
}
/* Chi puo' ancora ricevere: non chi sta lasciando la squadra, non chi e'
   segnato non attivo. */
const puoRicevere=a=>!!a&&!a.inUscita&&a.attiva!==false;
function shadow(){const s={};for(const [id,d] of Object.entries(S.divise))s[id]={holder:d.holder||null,dr:!!d.daRestituire};return s}
async function doConsegna(rid,p,sh,ritiro){
  const r=S.richieste[rid];if(!r)return;
  const foto=fotoRichiesta(rid);
  await insieme(async()=>{
  if(p.divisaId){
    const d=S.divise[p.divisaId];const cur=sh[p.divisaId];
    if(cur.holder&&cur.holder!==r.atletaId){
      await mov({tipo:'RIENTRO',atletaId:cur.holder,articolo:r.articolo,taglia:d.taglia,divisaId:p.divisaId,numero:d.numero,prevHolder:cur.holder,prevDR:cur.dr,prevTC:d.tagliaChiesta||null,note:'Ritirata per riassegnarla'})}
    await S.db.doc('divise/'+p.divisaId).update({holder:r.atletaId,daRestituire:false,tagliaChiesta:null});
    await mov({tipo:'CONSEGNA',atletaId:r.atletaId,articolo:r.articolo,taglia:d.taglia,divisaId:p.divisaId,numero:d.numero,prevHolder:null,prevDR:false,richiesta:foto});
    sh[p.divisaId]={holder:r.atletaId,dr:false};
    for(const oid of ritiro){const x=sh[oid];const od=S.divise[oid];if(!x||!od||x.holder!==r.atletaId)continue;
      await S.db.doc('divise/'+oid).update({holder:null,daRestituire:false,tagliaChiesta:null});
      await mov({tipo:'RIENTRO',atletaId:r.atletaId,articolo:r.articolo,taglia:od.taglia,divisaId:oid,numero:od.numero,prevHolder:r.atletaId,prevDR:x.dr,prevTC:od.tagliaChiesta||null,note:'Restituita al cambio taglia'});
      sh[oid]={holder:null,dr:false}}
  }else{
    await mov({tipo:'CONSEGNA',atletaId:r.atletaId,articolo:r.articolo,taglia:r.taglia,qta:1,richiesta:foto});
  }
  await S.db.doc('richieste/'+rid).delete();
  });
}
/* Cosa si puo' chiedere per questo atleta: la divisa da gara della sua squadra
   (qualunque lotto usi) piu' i modelli comuni a tutta la societa', i liberi. */
function modelliSceglibili(aid){
  const D=derive();const a=S.atlete[aid];
  // Si sceglie il tipo; il lotto lo decide la squadra.
  return [{v:'',t:'Divisa della squadra'},{v:D.lottiLibero[0],t:'Maglia da libero'+(a&&D.lottiLibero.length>1?` (${cap(D.liberoDi[a.squadra]||D.lottiLibero[0])})`:'')}];
}
/* Le divise che questo atleta deve restituire, a fronte di una richiesta di
   quel modello.
   I modelli comuni (i liberi) stanno per conto loro: un libero si cambia con un
   libero. Le divise da gara invece si cambiano fra loro **qualunque lotto
   siano**, perche' passare di squadra vuol dire proprio cambiare lotto. */
function stessoGenere(modelloDivisa,modelloChiesto){
  // Stesso tipo di maglia, qualunque lotto: un libero si cambia con un
  // libero, una divisa da gara con una divisa da gara.
  return tipoLotto(modelloDivisa)===tipoLotto(modelloChiesto);
}
const ownReturning=(aid,mod)=>Object.entries(S.divise).filter(([id,d])=>d.holder===aid&&d.daRestituire&&stessoGenere(d.modello,mod)).map(e=>e[0]);

/* Annullare un movimento. Se fa parte di un'operazione (una consegna con il
   ritiro della maglia vecchia) si annulla tutta: annullarne un pezzo lasciava
   l'atleta senza nessuna maglia. */
async function annullaMovimento(id){
  const m=S.movimenti[id];if(!m)return;
  const gruppo=(m.gruppo?Object.entries(S.movimenti).filter(([,x])=>x.gruppo===m.gruppo):[[id,m]])
    .sort((x,y)=>(y[1].ts||0)-(x[1].ts||0));
  const dentro=new Set(gruppo.map(g=>g[0]));
  const D=derive();
  for(const [,x] of gruppo){
    const dopo=Object.entries(S.movimenti).filter(([yid,y])=>!dentro.has(yid)&&(y.ts||0)>(x.ts||0)).map(e=>e[1]);
    if(x.divisaId){
      if(dopo.some(y=>y.divisaId===x.divisaId)){toast('Annullare prima i movimenti più recenti di questa divisa.');return}
      if(x.prevHolder&&!S.atlete[x.prevHolder]){toast('La divisa tornerebbe a un atleta che non è più in archivio: annullamento non possibile.');return}
      continue}
    // Materiale di un atleta: prima i movimenti piu' recenti dello stesso
    // articolo per lo stesso atleta, se no la giacenza cresce di un pezzo che
    // non esiste.
    if(x.atletaId&&dopo.some(y=>!y.divisaId&&y.atletaId===x.atletaId&&y.articolo===x.articolo&&y.taglia===x.taglia)){
      toast('Annullare prima i movimenti più recenti di questo articolo per questo atleta.');return}
    // Un carico o una rettifica: non se la giacenza finirebbe sotto zero.
    const effetto=(x.tipo==='CARICO'||x.tipo==='RETTIFICA'||x.tipo==='RIENTRO'?1:-1)*(Number(x.qta)||0);
    const ora=(D.stock[D.key(x.articolo,x.taglia)]||{ora:0}).ora;
    if(effetto>0&&ora-effetto<0){toast(`Annullandolo la giacenza di ${artLabel(x.articolo)} ${x.taglia} andrebbe sotto zero: nel frattempo quei pezzi sono già usciti.`);return}
  }
  const foto=gruppo.flatMap(([,x])=>[x.richiesta,...(x.richieste||[])]).filter(r=>r&&!S.richieste[r.id]);
  const descr=gruppo.length>1?`questa operazione (${gruppo.length} movimenti insieme)`:`questo movimento (${nomeTipo(m.tipo).toLowerCase()} ${artLabel(m.articolo)})`;
  if(!await chiedi(`Annullare ${descr}?${foto.length?(foto.length===1?' La richiesta consegnata torna aperta.':` Le ${foto.length} richieste consegnate tornano aperte.`):''}`))return;
  const ok=await w(async()=>{
    for(const [xid,x] of gruppo){
      // Una divisa nata dal modulo ("ce l'ho" con un numero che non c'era)
      // non esisteva prima: annullando, sparisce.
      if(x.divisaId&&x.creata&&S.divise[x.divisaId])await S.db.doc('divise/'+x.divisaId).delete();
      else if(x.divisaId&&S.divise[x.divisaId])
        await S.db.doc('divise/'+x.divisaId).update({holder:x.prevHolder??null,daRestituire:!!x.prevDR,tagliaChiesta:x.prevTC??null,...(x.tipo==='SCARTO'?{dismessa:false}:{})});
      // Il carico aveva scalato quelli in arrivo: tornano in arrivo.
      if(x.tipo==='CARICO'&&x.ordScalati>0){
        const riga=Object.entries(S.materiale).find(([,r])=>r.articolo===x.articolo&&r.taglia===x.taglia);
        if(riga)await S.db.doc('materiale/'+riga[0]).update({ordinati:(Number(riga[1].ordinati)||0)+x.ordScalati})}
      await S.db.doc('movimenti/'+xid).delete()}
    for(const r of foto){const {id:rid,...corpo}=r;if(S.atlete[corpo.atletaId])await S.db.doc('richieste/'+rid).set(corpo)}
  });
  if(ok)toast(foto.length?'Annullato: la richiesta è di nuovo aperta':'Movimento annullato');
}

/* Serve sia per crearne una sia per correggerne una: quello che cambia e' il

  <div class="field" id="fNum"><label for="rNum">Numero desiderato (facoltativo)</label><input type="number" id="rNum" name="numero" min="0" max="99" inputmode="numeric" value="${vecchia&&vecchia.numeroDesiderato!=null?esc(vecchia.numeroDesiderato):''}"></div>
  <div class="field"><label for="rNote">Nota</label><input type="text" id="rNote" name="note" maxlength="200" value="${esc((vecchia&&vecchia.note)||'')}"></div>

  async(fd,btn)=>{

      numeroDesiderato:isNum&&fd.numero!==''?Number(fd.numero):null,note:fd.note||''};
    if(vecchia){

    const ok=await w(()=>S.db.collection('richieste').add({atletaId:aid,...corpo,ordine:Date.now()}));

  const upd=()=>{const n=$('#rArt').value;const tenuta=$('#rTg').value;

/* Consegna senza passare da una richiesta. In palestra, con l'atleta davanti,
   segnare prima la richiesta e poi consegnarla erano due passaggi per una cosa
   sola. Qui si sceglie il capo e si registra.

   E' anche l'unico posto dove la divisa si sceglie a mano, una per una: la
   consegna che parte da una richiesta propone lei quale capo prendere. */
/* Un movimento scritto a mano. Serve per il materiale che esce dal magazzino verso
   qualcuno che non e' un atleta: un allenatore, un dirigente, un esterno, o lo
   smaltimento di una scorta vecchia. Il magazzino cala lo stesso; quello che
   cambia e' che non finisce nella dotazione di nessuno.

   Solo materiale: una divisa da gara e' un capo fisico con un numero e un
   proprietario, e si assegna dalla scheda dell'atleta. */
function dlgMovimento(nomeFuori){
  // Solo staff ed esterni (Andrea, 25/09/2026: "una strada per ogni cosa"):
  // alle atlete si consegna dalla scheda o da Assegnazioni, che chiudono le
  // richieste e tengono il conto di chi ha cosa; il materiale da smaltire si

  const D=derive();
  const arts=(D.set.articoli||[]).filter(x=>!D.conNumero(x.nome)).sort(perNome);
  if(!arts.length){toast('Nessun articolo di materiale disponibile');return}
  const taglieDi=n=>{const x=arts.find(z=>z.nome===n);const t=new Set(x?x.taglie:[]);
    for(const k of Object.keys(D.stock))if(k.startsWith(n+'|'))t.add(k.split('|')[1]);
    return [...t].sort((p,q)=>szIdx(p)-szIdx(q))};
  const vociTaglia=n=>{const t=taglieDi(n);
    if(!t.length)return '<option value="">nessuna taglia</option>';
    return t.map(x=>{const st=(D.stock[D.key(n,x)]||{ora:0}).ora;
      return `<option value="${esc(x)}">${x==='UNICA'?'taglia unica':esc(x)} — ${st} in magazzino</option>`}).join('')};
  const first=arts[0].nome;
  openDlg(`<h2>Consegna a staff ed esterni</h2><p class="sub">Materiale che esce dal magazzino verso allenatori, dirigenti o esterni, oppure che rientra da loro. Agli atleti si consegna dalla loro scheda, da Assegnazioni o con il foglio delle squadre; il materiale non più utilizzabile si dismette da Magazzino.</p>
  <div class="field"><label for="mTipo">Cosa succede</label><select id="mTipo" name="tipo">
    <option value="CONSEGNA">Esce dal magazzino</option>
    <option value="RIENTRO">Torna in magazzino</option></select></div>
  <div class="field"><label for="mArt">Articolo</label><select id="mArt" name="articolo">${arts.map(x=>`<option value="${esc(x.nome)}">${esc(artLabel(x.nome))}</option>`).join('')}</select></div>
  <div class="two"><div class="field"><label for="mTg">Taglia</label><select id="mTg" name="taglia">${vociTaglia(first)}</select></div>
  <div class="field"><label for="mQta">Quanti pezzi</label><input type="number" id="mQta" name="qta" min="1" max="999" value="1" inputmode="numeric"></div></div>
  <div class="field"><label for="mFuori" id="lChi">A chi: nome e ruolo</label><input type="text" id="mFuori" name="a" maxlength="80" required placeholder="per esempio: allenatore della prima squadra"></div>
  <div class="field"><label for="mNote">Nota</label><input type="text" id="mNote" name="note" maxlength="200"></div>
  ${actions('Registra')}`, async fd=>{
    const chi=(fd.a||'').trim();
    if(!chi){toast('Indicare il destinatario');return false}
    const tg=fd.taglia;if(!tg){toast('Selezionare la taglia');return false}
    const qta=Math.max(1,Number(fd.qta)||1);
    const st=(D.stock[D.key(fd.articolo,tg)]||{ora:0}).ora;
    if(fd.tipo==='CONSEGNA'&&st<qta&&!await chiedi(`In magazzino ne risultano ${st}. Registrare comunque l’uscita di ${qta}?`))return false;
    const ok=await w(()=>mov({tipo:fd.tipo,articolo:fd.articolo,taglia:tg,qta,atletaId:null,a:chi,note:fd.note||''}));
    if(ok)toast(fd.tipo==='CONSEGNA'?`${qta} ${qta===1?'pezzo consegnato':'pezzi consegnati'} a ${chi}`:`${qta} ${qta===1?'pezzo rientrato':'pezzi rientrati'} da ${chi}`);
    return ok});

  if(nomeFuori)$('#mFuori').value=nomeFuori;
  const agg=()=>{$('#mTg').innerHTML=vociTaglia($('#mArt').value);
    $('#lChi').textContent=$('#mTipo').value==='CONSEGNA'?'A chi: nome e ruolo':'Da chi: nome e ruolo'};
  $('#mArt').addEventListener('change',agg);
  $('#mTipo').addEventListener('change',agg);

}
function dlgDiretta(aid){
  const D=derive();const a=S.atlete[aid];
  if(!puoRicevere(a)){toast(a&&a.inUscita?'Eliminazione in attesa di riconsegna: l\u2019atleta non riceve altre consegne':'L\u2019atleta non \u00e8 attivo: non riceve consegne');return}
  const arts=(D.set.articoli||[]).filter(x=>x.distribuibile!==false).sort(perNome);
  if(!arts.length){toast('Non c’è nessun articolo da consegnare');return}

  // Le divise libere del lotto scelto: in magazzino, oppure in rientro da
  // qualcun altro (in quel caso si registra anche la sua restituzione).
  const lottoVero=v=>D.modelloPer({atletaId:aid,modello:v||''});

  const libere=mod=>Object.entries(S.divise)
    .filter(([id,d])=>!d.dismessa&&!(d.fuoriUso&&!d.holder)&&(d.modello||'STANDARD')===mod&&(!d.holder||d.daRestituire)
      &&!occupati.has(Number(d.numero))&&numeroDaDare(D,a.squadra,aid,d))
    .sort((x,y)=>szIdx(x[1].taglia)-szIdx(y[1].taglia)||x[1].numero-y[1].numero);
  const vociDivisa=mod=>{const l=libere(mod);
    if(!l.length)return `<option value="">nessuna disponibile col numero libero in ${esc(teamLabel(a.squadra))}</option>`;
    return l.map(([id,d])=>{const stato=[d.holder?'da ritirare a '+fullName(S.atlete[d.holder]):'',
      D.prenDivisa[id]?'già promessa a '+fullName(S.atlete[S.richieste[D.prenDivisa[id]].atletaId]):''].filter(Boolean);
      return `<option value="${esc(id)}">${esc(d.taglia)} n.${d.numero}${stato.length?' — '+esc(stato.join(', ')):''}</option>`}).join('')};

  const taglieDi=n=>{const x=arts.find(z=>z.nome===n);const t=new Set(x?x.taglie:[]);
    for(const k of Object.keys(D.stock))if(k.startsWith(n+'|'))t.add(k.split('|')[1]);
    return [...t].sort((p,q)=>szIdx(p)-szIdx(q))};
  const vociTaglia=n=>{const t=taglieDi(n);
    if(!t.length)return '<option value="">nessuna taglia</option>';
    return t.map(x=>{const st=(D.stock[D.key(n,x)]||{ora:0}).ora;
      return `<option value="${esc(x)}">${x==='UNICA'?'taglia unica':esc(x)} — ${st} in magazzino</option>`}).join('')};

  const first=arts[0].nome;
  openDlg(`<h2>Consegna diretta</h2><p class="sub">${esc(fullName(a))} · ${esc(teamLabel(a.squadra))}. Registra la consegna adesso, senza passare da una richiesta.</p>
  <div class="field"><label for="dArt">Articolo</label><select id="dArt" name="articolo">${arts.map(x=>`<option value="${esc(x.nome)}">${esc(artLabel(x.nome))}</option>`).join('')}</select></div>
  <div class="field" id="dfMod"><label for="dMod">Tipo di divisa</label><select id="dMod" name="modello">${modelliSceglibili(aid).map(m=>`<option value="${esc(m.v)}">${esc(m.t)}</option>`).join('')}</select></div>
  <div class="field" id="dfCapo"><label for="dCapo">Quale capo</label><select id="dCapo" name="divisaId"></select></div>
  <div class="two" id="dfMat"><div class="field"><label for="dTg">Taglia</label><select id="dTg" name="taglia">${vociTaglia(first)}</select></div>
  <div class="field"><label for="dQta">Quanti pezzi</label><input type="number" id="dQta" name="qta" min="1" max="99" value="1" inputmode="numeric"></div></div>
  <div id="dfRit"></div>
  ${actions('Registra consegna')}`, async fd=>{
    const art=fd.articolo;const isNum=D.conNumero(art);

    const rid=D.order.find(x=>{const r=S.richieste[x];
      if(!r||r.atletaId!==aid||r.articolo!==art)return false;
      // Per le divise conta anche il lotto: un libero non chiude la richiesta
      // della divisa della squadra.
      return isNum?D.modelloPer(r)===lottoVero(fd.modello):r.taglia===fd.taglia});
    const foto=rid?fotoRichiesta(rid):null;
    if(isNum){
      const did=fd.divisaId;if(!did){toast('Selezionare il capo da consegnare');return false}
      const d=S.divise[did];
      // La regola vale anche qui: dentro una squadra un numero non si ripete.
      const occ=(D.occ[a.squadra]||new Set());
      if(occ.has(Number(d.numero))&&!(S.divise[did].holder===aid)){
        toast(`Il numero ${d.numero} è già assegnato a un altro atleta in ${teamLabel(a.squadra)}`);return false}
      const rit=fd._all.getAll('rit');
      const ok=await w(()=>insieme(async()=>{
        if(d.holder&&d.holder!==aid)
          await mov({tipo:'RIENTRO',atletaId:d.holder,articolo:art,taglia:d.taglia,divisaId:did,numero:d.numero,prevHolder:d.holder,prevDR:!!d.daRestituire,prevTC:d.tagliaChiesta||null,note:'Ritirata per riassegnarla'});
        await S.db.doc('divise/'+did).update({holder:aid,daRestituire:false,tagliaChiesta:null});
        await mov({tipo:'CONSEGNA',atletaId:aid,articolo:art,taglia:d.taglia,divisaId:did,numero:d.numero,prevHolder:null,prevDR:false,...(foto?{richiesta:foto}:{})});
        for(const oid of rit){const od=S.divise[oid];if(!od||od.holder!==aid)continue;

          await mov({tipo:'RIENTRO',atletaId:aid,articolo:art,taglia:od.taglia,divisaId:oid,numero:od.numero,prevHolder:aid,prevDR:!!od.daRestituire,prevTC:od.tagliaChiesta||null,note:'Restituita al cambio'})}
        if(rid)await S.db.doc('richieste/'+rid).delete()}));
      if(ok)toast(`Consegnata la ${d.taglia} n.${d.numero}${rid?', richiesta chiusa':''}`);
      return ok}
    const tg=fd.taglia;if(!tg){toast('Selezionare la taglia');return false}

    if(altra&&!await chiedi(`${fullName(a)} ha già ricevuto questo articolo con la scheda di ${teamLabel(S.atlete[altra].squadra)}. Registrare comunque la consegna?`))return false;
    if(st<qta&&!await chiedi(`In magazzino ne risultano ${st}. Registrare comunque la consegna di ${qta}?`))return false;
    const ok=await w(()=>insieme(async()=>{
      await mov({tipo:'CONSEGNA',atletaId:aid,articolo:art,taglia:tg,qta,...(foto?{richiesta:foto}:{})});
      if(rid)await S.db.doc('richieste/'+rid).delete()}));
    if(ok)toast(`${qta} ${qta===1?'pezzo consegnato':'pezzi consegnati'}${rid?', richiesta chiusa':''}`);
    return ok});

  // Divisa o materiale cambiano mezza finestra: si mostra solo quello che serve.
  const agg=()=>{const n=$('#dArt').value;const isN=D.conNumero(n);
    $('#dfMod').style.display=isN?'':'none';
    $('#dfCapo').style.display=isN?'':'none';
    $('#dfMat').style.display=isN?'none':'';
    if(isN){const lot=lottoVero($('#dMod').value);
      $('#dCapo').innerHTML=vociDivisa(lot);
      const own=ownReturning(aid,lot);
      $('#dfRit').innerHTML=own.length?`<p class="sub" style="margin:8px 0 4px">${esc(a.nome)} deve restituire:</p>`
        +own.map(id=>`<label class="check" style="margin:4px 0"><input type="checkbox" name="rit" value="${esc(id)}" checked>${chip(S.divise[id])} ritirata adesso</label>`).join(''):'';
    }else{$('#dTg').innerHTML=vociTaglia(n);$('#dfRit').innerHTML=''}};
  $('#dArt').addEventListener('change',agg);
  $('#dMod').addEventListener('change',agg);
  agg();
}
/* La taglia chiesta non c'e'. Invece di aspettare l'ordine si puo' dare quella
   accanto, e in palestra e' quello che si fa. Qui si vede cosa c'e' davvero,
   partendo dalle taglie piu' vicine a quella chiesta.

   Nell'elenco entrano solo i capi il cui numero e' libero nella squadra: e' la
   regola che non si tocca, un numero non si ripete fra compagne. */
function dlgAltraTaglia(rid){
  const D=derive();const r=S.richieste[rid];if(!r)return;
  const a=S.atlete[r.atletaId];const mod=D.modelloPer(r);
  const occupati=D.occ[a.squadra]||new Set();
  const vicine=Object.entries(S.divise)
    .filter(([id,d])=>!d.dismessa&&!(d.fuoriUso&&!d.holder)&&(d.modello||'STANDARD')===mod&&(!d.holder||d.daRestituire)
      &&!occupati.has(Number(d.numero))&&numeroDaDare(D,a.squadra,r.atletaId,d))
    .sort((x,y)=>Math.abs(szIdx(x[1].taglia)-szIdx(r.taglia))-Math.abs(szIdx(y[1].taglia)-szIdx(r.taglia))
      ||szIdx(x[1].taglia)-szIdx(y[1].taglia)||x[1].numero-y[1].numero);
  if(!vicine.length){toast('Non c’è nessun capo di questo lotto col numero libero in squadra');return}

  const distanza=t=>{const n=szIdx(t)-szIdx(r.taglia);
    return n===0?'la taglia chiesta':n===1?'una taglia in più':n===-1?'una taglia in meno'
      :n>0?n+' taglie in più':(-n)+' taglie in meno'};

  openDlg(`<h2>Altra taglia</h2>

/* Chi lascia la squadra non sparisce con un clic. Prima si segna, capo per
   capo, cosa ha riportato indietro: quello che torna rientra in magazzino
   davvero, con il suo movimento. Finche' manca qualcosa l'atleta resta "in
   uscita" - scritto in chiaro negli elenchi - e si cancella solo quando non
   ha piu' niente in mano.

   Cancellandolo, il suo nome viene scritto sui movimenti che lo riguardano:
   se no il registro direbbe "Atleta rimosso" su consegne e rientri che invece
   raccontano una storia precisa. */
function coseInMano(id){
  const D=derive();const fuori=[];
  for(const did of (D.perAtleta[id]||[])){const d=S.divise[did];if(!d)continue;
    fuori.push({tipo:'divisa',id:did,divisa:d,
      etichetta:`Divisa ${d.taglia} n.${d.numero}${d.daRestituire?' (già segnata da cambiare)':''}`})}
  for(const [k,v] of Object.entries(D.dotazione[id]||{})){if(v<=0)continue;
    const [art,tg]=k.split('|');
    fuori.push({tipo:'materiale',articolo:art,taglia:tg,qta:v,
      etichetta:`${artLabel(art)}${tg&&tg!=='UNICA'?' '+tg:''}${v>1?' ×'+v:''}`})}
  return fuori;
}

async function eliminaAtleta(id){
  const a=S.atlete[id];if(!a)return false;
  const inMano=coseInMano(id);
  if(inMano.length)return dlgUscita(id);
  return cancellaDavvero(id);
}

/* La finestra dell'uscita: si spunta quello che ha riportato. */
function dlgUscita(id){
  const a=S.atlete[id];const inMano=coseInMano(id);
  // I capi partono non spuntati: spuntati in partenza, un clic distratto
  // registrava rientri mai avvenuti. E si puo' confermare senza spuntarne
  // nessuno: l'atleta resta, con l'eliminazione in attesa di riconsegna
  // (richiesta di Andrea, 25/09/2026: prima senza spunte non si andava avanti).
  openDlg(`<h2>Eliminare ${esc(fullName(a))}</h2>
  <p class="sub">L’atleta ha ancora in consegna i capi elencati. Selezionare quelli restituiti, che rientrano subito in magazzino. Se non è stato restituito nulla, si conferma senza selezionare.</p>
  <p class="sub">L’atleta viene cancellato quando ha restituito tutto; fino ad allora resta nell’archivio con l’<b>eliminazione in attesa di riconsegna</b> e non riceve altre consegne.</p>
  <div class="list" style="margin-bottom:10px">${inMano.map((x,i)=>`<label class="item" style="cursor:pointer">
    <input type="checkbox" name="reso" value="${i}" style="margin-right:10px">
    <div class="main"><div class="name">${esc(x.etichetta)}</div></div></label>`).join('')}</div>
  ${actions('Conferma eliminazione')}`, async fd=>{
    const scelti=fd._all.getAll('reso').map(Number);
    if(!scelti.length){
      const ok=await w(()=>S.db.doc('atlete/'+id).update({inUscita:true}));
      if(ok)toast(`Eliminazione in attesa di riconsegna: ${inMano.length===1?'resta un capo da restituire':`restano ${inMano.length} capi da restituire`}`);
      return ok}
    const ok=await w(async()=>{
      for(const i of scelti){const x=inMano[i];
        if(x.tipo==='divisa'){
          await S.db.doc('divise/'+x.id).update({holder:null,daRestituire:false,tagliaChiesta:null});
          await mov({tipo:'RIENTRO',atletaId:id,articolo:artDivisa(),taglia:x.divisa.taglia,
            divisaId:x.id,numero:x.divisa.numero,prevHolder:id,prevDR:!!x.divisa.daRestituire,prevTC:x.divisa.tagliaChiesta||null,
            note:'Restituita lasciando la squadra'});

async function cancellaDavvero(id){

  if(!await chiedi(`Eliminare ${fullName(a)}?${richieste.length?`\n${richieste.length===1?'Viene eliminata anche la sua richiesta aperta.':`Vengono eliminate anche le sue ${richieste.length} richieste aperte.`}`:''}${movimenti.length?`\n${movimenti.length===1?'Il movimento resta':`I ${movimenti.length} movimenti restano`} nel registro con il suo nome.`:''}\nL’operazione non è reversibile.`,{si:'Elimina',pericolo:true}))return false;
  const nome=fullName(a);
  const ok=await w(async()=>{
    for(const r of richieste)await S.db.doc('richieste/'+r).delete();
    // Il nome va scritto sul movimento prima di cancellare la scheda, se no il
    // registro resta con "Atleta rimosso" al posto di chi era.
    for(const [mid] of movimenti)await S.db.doc('movimenti/'+mid).update({atletaId:null,a:nome});

  if(ok){toast('Atleta eliminato');location.hash='#atleti'}
  return ok;
}

    const ok=await w(()=>S.db.collection('divise').add({taglia:fd.taglia,numero:num,modello:fd.modello,holder:null,daRestituire:false,note:fd.note||''}));
    if(ok){toast(`Divisa ${fd.taglia} n.${num} aggiunta`);if(btn==='again'){form.querySelector('#nNum').value='';form.querySelector('#nNum').focus();return false}}return ok});
}
function dlgMat(art,tg){
  const D=derive();const arts=(D.set.articoli||[]).filter(a=>!a.conNumero).sort(perNome);
  const k=art?D.key(art,tg):null;const cur=k&&D.stock[k]?D.stock[k].ora:0;
  const ordOra=k&&D.stock[k]?(D.stock[k].ordinati||0):0;
  const sizesFor=n=>{const x=arts.find(z=>z.nome===n);if(x)return x.taglie;return[...new Set(Object.values(S.materiale).filter(m=>m.articolo===n).map(m=>m.taglia))]};
  const allArts=[...new Set([...arts.map(a=>a.nome),...Object.values(S.materiale).map(m=>m.articolo)])].sort(perNome);
  openDlg(`<h2>${art?esc(artLabel(art))+' · '+(tg==='UNICA'?'unica':esc(tg)):'Carico merce'}</h2>
  ${art?`<p class="sub">In magazzino ora: <b>${cur}</b></p><input type="hidden" name="articolo" value="${esc(art)}"><input type="hidden" name="taglia" value="${esc(tg)}">`:
  `<div class="field"><label for="mArt">Articolo</label><select id="mArt" name="articolo">${allArts.map(a=>`<option value="${esc(a)}">${esc(artLabel(a))}</option>`).join('')}</select></div>
   <div class="field"><label for="mTg">Taglia</label><select id="mTg" name="taglia"></select></div>`}
  ${art?`<div class="seg sceltaMat" role="radiogroup" aria-label="Cosa si registra">
    <label><input type="radio" name="azione" value="arrivo" checked> Arrivo</label>
    <label><input type="radio" name="azione" value="rett"> Inventario</label>
    <label><input type="radio" name="azione" value="butta"> Dismessi</label>
    <label><input type="radio" name="azione" value="ord"> Ordine</label></div>
  <p class="sub" id="mSpiega"></p>`:''}
  <div class="field" id="fQ"><label for="mQ" id="lQ">Quanti pezzi</label><input type="number" id="mQ" name="qta" min="0" step="1" required inputmode="numeric"></div>
  ${art?`<div class="field" id="fOrd"><label for="mOrd">Ordinati al fornitore, in arrivo</label><input type="number" id="mOrd" name="ordinati" min="0" step="1" inputmode="numeric" value="${ordOra||''}" placeholder="0"></div>`:''}
  <div class="field"><label for="mNote">Nota</label><input type="text" id="mNote" name="note" maxlength="200"></div>
  ${actions(art?'Registra arrivo':'Registra carico')}`,async(fd,btn)=>{
    // Una finestra, quattro azioni: si sceglie in cima cosa si registra e c'e'
    // un pulsante solo (Andrea, 26/09/2026: cinque pulsanti per quattro azioni,
    // con caselle diverse, non si capiva quale premere).
    if(art)btn={arrivo:'ok',rett:'rett',butta:'butta',ord:'ord'}[fd.azione]||'ok';
    // Solo la quantita' ordinata al fornitore, senza merce arrivata.
    if(btn==='ord'){
      const o=fd.ordinati===''||fd.ordinati==null?0:Number(fd.ordinati);
      if(!Number.isInteger(o)||o<0){toast('Gli ordinati sono un numero intero, zero o più');return false}
      const righe=Object.entries(S.materiale).filter(([,m])=>m.articolo===fd.articolo&&m.taglia===fd.taglia);
      const ok=await w(async()=>{
        if(!righe.length)await S.db.collection('materiale').add({articolo:fd.articolo,taglia:fd.taglia,iniziale:0,precedente:false,ordinati:o});
        else{for(const [rid2,m] of righe.slice(1))if(Number(m.ordinati))await S.db.doc('materiale/'+rid2).update({ordinati:0});
          await S.db.doc('materiale/'+righe[0][0]).update({ordinati:o})}});
      if(ok)toast(o?`${o} ${o===1?'pezzo ordinato':'pezzi ordinati'}: risultano in arrivo`:'Nessun pezzo in arrivo');return ok}
    // Dismettere e' un'uscita a se': non e' una consegna (non va a nessuno) e
    // non e' un inventario (i pezzi c'erano davvero). Gli ordinati non si toccano.
    if(btn==='butta'){
      const q=Number(fd.qta);const kk=D.key(fd.articolo,fd.taglia);const now=D.stock[kk]?D.stock[kk].ora:0;
      if(!Number.isInteger(q)||q<1){toast('Indicare quanti pezzi dismettere, almeno uno');return false}
      if(q>now){toast(`In magazzino ne risultano ${now}: non è possibile dismetterne ${q}`);return false}
      if(!await chiedi(`Dismettere ${q} ${q===1?'pezzo':'pezzi'} di ${artLabel(fd.articolo)} ${fd.taglia==='UNICA'?'':fd.taglia}? ${q===1?'Esce':'Escono'} definitivamente dal magazzino.`,{si:'Dismetti',pericolo:true}))return false;
      const ok=await w(()=>mov({tipo:'SCARTO',articolo:fd.articolo,taglia:fd.taglia,qta:q,note:fd.note||''}));
      if(ok)toast(`${q} ${q===1?'pezzo dismesso':'pezzi dismessi'}: in magazzino ne ${now-q===1?'resta':'restano'} ${now-q}`);return ok}
    // Lo stesso campo serve a due cose: un carico (almeno un pezzo) e un
    // conteggio reale (che può essere zero, se l'articolo è finito). Numeri
    // negativi non vogliono dire niente né per l'uno né per l'altro: prima
    // passavano, e un carico di -50 faceva crollare la giacenza in silenzio.
    const q=Number(fd.qta);
    if(!Number.isInteger(q)||q<0){toast('Indicare un numero intero, zero o superiore');return false}
    if(btn!=='rett'&&q<1){toast('Un carico è di almeno un pezzo');return false}
    const kk=D.key(fd.articolo,fd.taglia);const now=D.stock[kk]?D.stock[kk].ora:0;
    // Quelli in arrivo: un numero scritto a mano, che cala da solo quando la
    // merce arriva. Se no bisognerebbe ricordarsi di correggerlo ogni volta.
    const ordScritto=fd.ordinati===''||fd.ordinati==null?null:Number(fd.ordinati);
    if(ordScritto!=null&&(!Number.isInteger(ordScritto)||ordScritto<0)){toast('Gli ordinati sono un numero intero, zero o più');return false}
    const ordPrima=D.stock[kk]?(D.stock[kk].ordinati||0):0;
    let ordDopo=ordScritto==null?ordPrima:ordScritto;
    if(btn!=='rett')ordDopo=Math.max(0,ordDopo-q);
    const scalati=btn!=='rett'?(ordScritto==null?ordPrima:ordScritto)-ordDopo:0;
    const ok=await w(async()=>{
      // La riga nuova si crea gia' con gli ordinati: cercarla subito dopo nei
      // dati di prima non la trovava, e il numero andava perso.
      let riga=Object.entries(S.materiale).find(([,m])=>m.articolo===fd.articolo&&m.taglia===fd.taglia);
      if(!riga)await S.db.collection('materiale').add({articolo:fd.articolo,taglia:fd.taglia,iniziale:0,precedente:false,ordinati:ordDopo});
      else if(ordDopo!==ordPrima){
        // Gli ordinati stanno su una riga sola: le altre (stagioni vecchie) a zero.
        const righe=Object.entries(S.materiale).filter(([,m])=>m.articolo===fd.articolo&&m.taglia===fd.taglia);
        for(const [rid2,m] of righe)if(rid2!==riga[0]&&Number(m.ordinati))await S.db.doc('materiale/'+rid2).update({ordinati:0});
        await S.db.doc('materiale/'+riga[0]).update({ordinati:ordDopo});
      }
      if(btn==='rett'){const delta=q-now;if(delta!==0)await mov({tipo:'RETTIFICA',articolo:fd.articolo,taglia:fd.taglia,qta:delta,note:fd.note||'Inventario'})}
      else await mov({tipo:'CARICO',articolo:fd.articolo,taglia:fd.taglia,qta:q,note:fd.note||'',...(scalati>0?{ordScalati:scalati}:{})})});
    if(ok)toast(btn==='rett'?`Giacenza corretta: adesso ne risultano ${q}`
      :`Carico registrato${ordDopo!==ordPrima&&ordScritto==null?`, ne restano ${ordDopo} in arrivo`:''}`);return ok});
  if(!art){const u=()=>{$('#mTg').innerHTML=sizesFor($('#mArt').value).map(t=>`<option>${esc(t)}</option>`).join('')};$('#mArt').addEventListener('change',u);u()}
  else{
    const AZ={arrivo:['Pezzi arrivati','Registra arrivo','primary',`I pezzi arrivati si aggiungono ${cur?`${cur===1?'a quello presente':`ai ${cur} presenti`}`:'al magazzino, oggi vuoto,'} e si tolgono da quelli in arrivo.`],
      rett:['Pezzi contati in magazzino','Correggi giacenza','primary',`La giacenza diventa il numero contato (oggi ne risultano ${cur}).`],
      butta:['Pezzi da dismettere','Dismetti','danger pieno','I pezzi non più utilizzabili escono dal magazzino; nel registro restano quantità e data.'],
      ord:[null,'Salva ordinati','primary','Solo la quantità ordinata al fornitore, ancora in arrivo: la giacenza non cambia.']};
    const agg=()=>{const v=(form.querySelector('input[name="azione"]:checked')||{}).value||'arrivo';const [lq,bt,cl,sp]=AZ[v];
      $('#fQ').hidden=!lq;$('#mQ').required=!!lq;if(lq)$('#lQ').textContent=lq;
      $('#fOrd').hidden=!(v==='arrivo'||v==='ord');$('#mSpiega').textContent=sp;
      const pb=form.querySelector('.dlg-actions button[value="ok"]');pb.textContent=bt;pb.className='btn '+cl;
      form.querySelectorAll('.sceltaMat label').forEach(l=>l.classList.toggle('scelta',l.querySelector('input').checked))};
    form.querySelectorAll('input[name="azione"]').forEach(x=>x.addEventListener('change',agg));agg()}
}

document.addEventListener('input',e=>{const b=e.target.dataset&&e.target.dataset.bind;if(!b)return;
  // Il filtro del numero e' un campo di testo, non "number": un campo number

/* I campi sulla riga dell'atleta salvano quando si esce dal campo, non a ogni
   lettera: la delega generale ascolta solo i clic, questi no. */

document.addEventListener('toggle',e=>{
  const el=e.target;if(el.dataset&&el.dataset.act==='legenda'){(S.ui.legende=S.ui.legende||{})[el.dataset.k]=el.open}},true);

/* Le squadre si correggono sulla riga come gli atleti. Rinominare una squadra
   tocca anche tutte le suoi atleti: il nome e' scritto su ognuna. */
document.addEventListener('change',async e=>{
  const el=e.target;if(!el.dataset||el.dataset.act!=='modSquadra')return;
  const D=derive();const vecchio=el.dataset.n;const campo=el.dataset.f;
  const i=(D.set.squadre||[]).findIndex(y=>y.nome===vecchio);
  if(i<0)return;
  const sq=[...D.set.squadre];const x=sq[i];
  if(campo==='includi'){
    sq[i]={...x,includi:el.checked};
    if(await w(()=>S.db.doc('settings/main').update({squadre:sq})))toast(el.checked?'In distribuzione':'Esclusa dalla distribuzione');
    return}
  if(campo==='ordine'){
    const v=el.value.trim();
    const num=v===''?null:Number(v);
    if(v!==''&&(!Number.isInteger(num)||num<1)){el.value=x.ordine??'';toast('Indicare un numero intero da 1 in su, oppure lasciare vuoto');return}
    sq[i]={...x,ordine:num};
    if(await w(()=>S.db.doc('settings/main').update({squadre:sq})))
      toast(num===null?'Senza ordine: viene servita per ultima':`${teamLabel(vecchio)}: ordine ${num}`);
    return}
  if(campo==='gruppoNumeri'){
    const altra=el.value;
    const vecchioG=x.gruppoNumeri||null;
    // Chi esce dal gruppo: se nel gruppo resta una squadra sola, si scioglie.
    const esci=lista=>{if(!vecchioG)return lista;
      const resto=lista.filter(y=>y.gruppoNumeri===vecchioG&&y.nome!==vecchio);
      return lista.map(y=>y.nome===vecchio?{...y,gruppoNumeri:null}:(resto.length===1&&y.gruppoNumeri===vecchioG?{...y,gruppoNumeri:null}:y))};
    let nuove;
    if(!altra){
      nuove=esci(sq);
    }else{
      const j=sq.findIndex(y=>y.nome===altra);if(j<0)return;
      const g=sq[j].gruppoNumeri||('N'+Date.now().toString(36));
      nuove=esci(sq).map(y=>y.nome===vecchio||y.nome===altra?{...y,gruppoNumeri:g}:y);
      // Prima di unire: i numeri che risulterebbero ripetuti nel gruppo.
      const membri=nuove.filter(y=>y.gruppoNumeri===g).map(y=>y.nome);
      const per={};
      for(const d of Object.values(S.divise)){if(d.dismessa||!d.holder||d.daRestituire)continue;const a=S.atlete[d.holder];if(!a||!membri.includes(a.squadra))continue;
        (per[Number(d.numero)]=per[Number(d.numero)]||new Set()).add(a.squadra)}
      const doppi=Object.entries(per).filter(([,t])=>t.size>1).map(([n])=>n).sort((p,q)=>p-q);
      if(doppi.length&&!await chiedi(`In ${membri.map(teamLabel).join(' e ')} ${doppi.length===1?`il n.${doppi[0]} è già usato in più di una squadra`:`i numeri ${doppi.join(', ')} sono già usati in più di una squadra`}.\nCondividere comunque i numeri? ${doppi.length===1?'Il numero verrà segnalato come doppio':'I numeri verranno segnalati come doppi'} finché non si sistemano.`)){render();return}
    }
    if(await w(()=>S.db.doc('settings/main').update({squadre:nuove})))
      toast(altra?`${teamLabel(vecchio)} e ${teamLabel(altra)}: numeri di maglia in comune`:`${teamLabel(vecchio)}: numeri di maglia propri`);
    return}
  if(campo==='modelloDivisa'){
    sq[i]={...x,modelloDivisa:el.value};
    if(await w(()=>S.db.doc('settings/main').update({squadre:sq})))toast(`${teamLabel(vecchio)}: divise dal lotto ${el.value.toLowerCase()}`);
    return}
  const nome=el.value.trim().toUpperCase();
  if(nome===vecchio)return;
  if(!nome){el.value=vecchio;toast('Il nome non può restare vuoto');return}
  if(sq.some((y,j)=>j!==i&&y.nome===nome)){el.value=vecchio;toast('Esiste già una squadra con questo nome');return}
  sq[i]={...x,nome};
  const ok=await w(async()=>{
    await S.db.doc('settings/main').update({squadre:sq});
    for(const [id,a] of Object.entries(S.atlete))
      if(a.squadra===vecchio)await S.db.doc('atlete/'+id).update({squadra:nome});
  });
  if(ok){toast('Squadra rinominata');form.querySelectorAll('[data-n]').forEach(y=>{if(y.dataset.n===vecchio)y.dataset.n=nome})}
});

      return}
    case'rientroDivisa':{const d=S.divise[id]; // senza domanda: si annulla da Movimenti
      const chi=d.holder;
      if(await w(async()=>{await S.db.doc('divise/'+id).update({holder:null,daRestituire:false,tagliaChiesta:null});await mov({tipo:'RIENTRO',atletaId:d.holder,articolo:artDivisa(),taglia:d.taglia,divisaId:id,numero:d.numero,prevHolder:d.holder,prevDR:!!d.daRestituire,prevTC:d.tagliaChiesta||null})})){toast('Divisa rientrata in magazzino');fineUscita(chi)}return}

/* ============ modelli Excel ============
   Quattro fogli per riempire il programma senza digitare niente a mano. Si
   scaricano gia' pieni di quello che c'e' dentro: cosi' lo stesso file serve
   sia da modello da compilare, sia da controllo di quello che c'e', sia da
   modifica di massa da rimandare indietro.

   L'ordine conta, ed e' scritto nelle istruzioni di ogni foglio: prima gli
   articoli, poi le squadre con gli atleti, poi le divise, poi le richieste. */
const COL=(r,i)=>String((r&&r[i])??'').trim();
const KEY=s=>norm(s).replace(/\s+/g,' ').trim();
/* Il nome di un foglio Excel come lo scrive la parte Rust: al massimo 31
   caratteri, senza : \ / ? * [ ]. Serve saperlo anche qui, per ritrovare la
   squadra quando il file torna indietro. */
const nomeFoglioExcel=n=>String(n??'').replace(/[:\\/?*\[\]]/g,' ').trim().slice(0,31)||'Foglio';
/* Un nome di foglio per squadra, tutti diversi fra loro e diversi da
   "Istruzioni": due squadre che si accorciano uguale non devono scontrarsi. */
function fogliSquadre(nomi){
  const usati=new Set([KEY('Istruzioni')]);
  return nomi.map(nome=>{const base=nomeFoglioExcel(nome);let n=base,i=2;
    while(usati.has(KEY(n))){const suf=` (${i++})`;n=base.slice(0,31-suf.length).trim()+suf}
    usati.add(KEY(n));return n});
}
/* La taglia scritta in un foglio ricondotta a una di quelle dell'articolo,
   senza badare a maiuscole e spazi. null se l'articolo non la prevede: una
   taglia inventata (o una data, se Excel ha trasformato "5-6") non deve
   diventare una taglia nuova. */
function tagliaArticolo(a,t){
  const v=normTaglia(t);if(!v)return '';
  const k=x=>norm(String(x)).replace(/\s+/g,'');
  const ts=(a&&a.taglie)||[];
  if(!ts.length)return k(v)==='unica'?'UNICA':null;
  return ts.find(x=>k(x)===k(v))||null;
}
/* Da un nome scritto nel foglio all'articolo: vale il nome interno, il codice
   corto o il nome come si legge nel programma. */
function articoloDaNome(D,t){
  const k=KEY(t);if(!k)return null;
  return (D.set.articoli||[]).find(a=>KEY(a.nome)===k||(a.codice&&KEY(a.codice)===k)||KEY(artLabel(a.nome))===k)||null;
}
/* Dal nome (squadra, cognome, nome) all'atleta. Due atleti con lo stesso nome
   nella stessa squadra non si possono distinguere da un foglio: invece di
   scegliere a caso il primo, la chiave vale OMONIMI e la riga va segnalata. */
const OMONIMI='__omonimi__';
function indiceAtleti(){
  const m=new Map();
  for(const [id,a] of Object.entries(S.atlete)){const k=KEY(a.squadra+'|'+a.cognome+'|'+a.nome);m.set(k,m.has(k)?OMONIMI:id)}
  return m;
}
/* Le squadre create da un foglio vanno in fondo all'ordine di distribuzione,
   nell'ordine in cui compaiono: senza numero finivano in ordine alfabetico. */
function prossimoOrdine(squadre){return squadre.reduce((m,x)=>Math.max(m,Number(x.ordine)||0),0)+1}

/* ---- controlli comuni ai fogli ---- */
/* Il risultato di un caricamento, di prova o vero. "problemi" sono gli
   errori (la riga non viene caricata), "avvisi" le righe caricate che
   conviene verificare. */
function nuovoEsito(){return {creati:0,aggiornati:0,posseduti:0,tolti:0,consegne:0,saltati:0,problemi:[],avvisi:[],squadreNuove:[],lottiNuovi:[]}}
const SI=v=>/^(s|si|x|1|vero|yes)$/.test(norm(v).trim());
const NO=v=>/^(n|no|0|falso)$/.test(norm(v).trim());
const siNoValido=v=>!String(v??'').trim()||SI(v)||NO(v);
// Excel trasforma "5-6" in una data: una taglia cosi' non e' una taglia.
const sembraData=t=>/^\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4}$/.test(String(t).trim())||/^\d{4}-\d{2}-\d{2}/.test(String(t).trim());
// Una nota non e' il posto per mail e telefoni: sono dati di minorenni.
const sembraRecapito=t=>/@|\+39|\b3\d{2}[\s.]?\d{6,7}\b/.test(String(t||''));
/* Il numero di maglia scritto in una casella: null se vuota, NaN se non e'
   un intero da 0 a 99. */
const numeroMaglia=v=>{const t=String(v??'').trim();if(t==='')return null;const n=Number(t);return Number.isInteger(n)&&n>=0&&n<=99?n:NaN};
const riga0=i=>`riga ${i+2}`;
const quali=(arr,n)=>arr.filter(Boolean).join(n||', ');

/* Le istruzioni dei fogli si scrivono qui come testo semplice, allineato con
   gli spazi; per il foglio Excel ogni riga viene classificata, cosi' la parte
   che scrive il file le impagina (titolo, sezioni, voci su due colonne):
     la prima riga                    il titolo ("TITOLO — sottotitolo")
     "Colonne:" dopo una riga vuota   una sezione
     "Nome      spiegazione"          una voce: due o piu' spazi separano il
                                      nome dalla spiegazione
     riga rientrata di 5+ spazi       continua la spiegazione di sopra
     il resto                         paragrafi, riuniti fino alla riga vuota */
function guidaPerExcel(righe){
  const out=[];let ultimo=null;
  const aggiungi=(tipo,...parti)=>{ultimo={tipo,parti};out.push(ultimo)};
  righe.forEach((riga,i)=>{
    riga=String(riga??'');
    if(i===0){const [t,sotto]=riga.split(/\s+—\s+/);aggiungi('titolo',t.trim());
      if(sotto)aggiungi('testo',sotto.charAt(0).toUpperCase()+sotto.slice(1));ultimo=null;return}
    if(!riga.trim()){out.push(null);ultimo=null;return}
    const seguito=riga.match(/^\s{5,}(\S.*)$/);
    if(seguito&&ultimo){ultimo.parti[ultimo.parti.length-1]+=' '+seguito[1].trim();return}
    const t=riga.trim();
    if(t.endsWith(':')&&t.length<=30&&!String(righe[i-1]??'').trim()){aggiungi('sezione',t.slice(0,-1));ultimo=null;return}
    const voce=riga.match(/^\s{0,4}(\S(?:.*?\S)?)\s{2,}(\S.*)$/);
    if(voce){aggiungi('voce',voce[1],voce[2].trim());return}
    if(ultimo&&ultimo.tipo==='testo'){ultimo.parti[0]+=' '+t;return}
    aggiungi('testo',t)});
  return out.map(x=>x?[x.tipo,...x.parti].join('\t'):'');
}
/* Come si compila ogni colonna di un foglio: chi riempie il file va guidato
   casella per casella, non lasciato a indovinare. Per ogni colonna:
     valori      menu a tendina (con `libero` si puo' scrivere anche altro,
                 per esempio una squadra nuova: Excel avvisa ma accetta)
     intero      [minimo, massimo]: solo numeri interi
     lunghezza   al massimo tanti caratteri
     aiuto       il messaggio che Excel mostra selezionando la casella
   Le colonne obbligatorie (m.obbligatorie) hanno il titolo piu' scuro e
   l'aiuto comincia con "Obbligatoria"; le informative sono grigie. Gli
   elenchi lunghi (cognomi, articoli) finiscono in un foglio nascosto. */
const SI_NO={valori:['sì','no']};
const NOTE_LIBERE={lunghezza:200,aiuto:'Facoltativo. Non inserire recapiti (email, telefoni) né dati medici.'};
const nomiSquadre=D=>(D.set.squadre||[]).map(x=>x.nome);
const elencoOrdinato=v=>[...new Set(v.filter(Boolean).map(x=>String(x).trim()))].sort((a,b)=>norm(a).localeCompare(norm(b)));
const cognomiAtleti=()=>elencoOrdinato(Object.values(S.atlete).map(a=>a.cognome));
const nomiAtleti=()=>elencoOrdinato(Object.values(S.atlete).map(a=>a.nome));
const taglieDi=arts=>[...new Set(arts.flatMap(a=>(a.taglie||[]).filter(Boolean)))].sort((a,b)=>szIdx(a)-szIdx(b)||String(a).localeCompare(String(b)));
const INFORMATIVA={informativa:true,aiuto:'Colonna solo informativa: al caricamento viene ignorata.'};
const GRUPPO_DATI='Da compilare',GRUPPO_INFO='Solo informative: ignorate al caricamento';
function guidaColonne(m,D){
  const g=m.guida?m.guida(D):{};const obbl=new Set(m.obbligatorie||[]);
  return [...m.colonne.map(c=>{const x={...(g[c]||{})};
      if(obbl.has(c)){x.obbligatoria=true;x.aiuto='Obbligatoria. '+(x.aiuto||'')}
      return x}),
    ...(m.info||[]).map(()=>INFORMATIVA)];
}
const gruppiColonne=m=>[...m.colonne.map(()=>GRUPPO_DATI),...(m.info||[]).map(()=>GRUPPO_INFO)];

    if(!Number.isInteger(qn)||qn<0){r.problemi.push(`${q}: quantità "${qs}" non valida: serve un numero intero, zero o più`);continue}
    const cod=COL(riga,4).toUpperCase(),stag=COL(riga,5);
    if(cod&&!/^[A-Z0-9_-]{1,12}$/.test(cod)){r.problemi.push(`${q}: codice "${cod}" non valido: solo lettere e cifre, al massimo 12 caratteri`);continue}
    if(stag&&!/^\d{4}\/\d{2}$/.test(stag))r.avvisi.push(`${q}: stagione "${stag}" non nel formato 2026/27`);
    const kr=KEY(nome)+'|'+kt(scritta);
    if(visti.has(kr)){r.avvisi.push(`${q}: ${nome} ${scritta} compare più volte nel foglio: riga ignorata`);r.saltati++;continue}
    visti.add(kr);
    let a=art.get(KEY(nome));
    if(!a){a={nome,conNumero:conNum,taglie:[]};art.set(KEY(nome),a);r.creati++;cambiato=true}
    else if(esistenti.has(KEY(nome))&&!!a.conNumero!==conNum&&COL(riga,1))
      r.avvisi.push(`${q}: ${nome} nel programma ${a.conNumero?'ha':'non ha'} il numero stampato: impostazione non modificata`);
    // La taglia com'e' gia' scritta sull'articolo, se c'e': "5-6 ANNI" e "5-6
    // anni" sono la stessa taglia.
    let taglia=a.taglie.find(x=>kt(x)===kt(scritta));
    if(!taglia){taglia=scritta;a.taglie.push(taglia);cambiato=true;
      if(esistenti.has(KEY(nome)))r.avvisi.push(`${q}: ${nome}: taglia nuova ${scritta}, verrà aggiunta all'articolo`)}
    if(cod){const altro=[...art.values()].find(x=>x!==a&&String(x.codice||'').toUpperCase()===cod);
      if(altro)r.avvisi.push(`${q}: il codice ${cod} è già dell'articolo ${altro.nome}: non assegnato a ${nome}`);
      else if(a.codice&&String(a.codice).toUpperCase()!==cod)r.avvisi.push(`${q}: ${nome} ha già il codice ${a.codice}: non modificato`);
      else if(!a.codice){a.codice=cod;cambiato=true}}
    if(stag&&!a.stagione){a.stagione=stag;cambiato=true}
    if(a.conNumero){if(qn>0)r.avvisi.push(`${q}: ${nome} ha il numero stampato: le quantità si caricano con il foglio Divise`);continue}
    const esiste=Object.values(S.materiale).some(m=>KEY(m.articolo)===KEY(a.nome)&&kt(m.taglia)===kt(taglia));
    if(esiste){const ora=(D.stock[D.key(a.nome,taglia)]||{ora:0}).ora;
      if(qs!==''&&qn!==ora)r.avvisi.push(`${q}: ${nome} ${taglia}: nel foglio ${qn}, nel programma ${ora}. La giacenza non viene modificata: per correggerla si usa «Correggi giacenza» in Magazzino`);
      r.saltati++;continue}
    if(!prova)await S.db.collection('materiale').add({articolo:a.nome,taglia,iniziale:qn,precedente:false});
    r.aggiornati++}
   if(cambiato&&!prova)await S.db.doc('settings/main').update({articoli:[...art.values()]});
   return r}},

 atlete:{
  nome:'Squadre e atleti',
  foglio:'Atleti',
  colonne:['Squadra','Cognome','Nome','Note','Attivo'],

  voci:{creati:['atleta nuovo','atleti nuovi']},
  istruzioni:[
   'SQUADRE E ATLETI — da caricare dopo gli articoli.',
   '',
   'Una riga per atleta. Le squadre che non esistono vengono create,',
   'nell\'ordine in cui compaiono qui, in fondo all\'ordine di distribuzione.',
   '',
   'Colonne:',
   'Squadra   per esempio: UNDER 14, PRIMA SQUADRA',

   '',
   'Le colonne Divise, In uscita e Gioca anche in sono solo informative: al',

   'Caricamento:',

    .map(([id,a])=>[a.squadra,a.cognome,a.nome,a.note||'',a.attiva===false?'no':'',
      (D.perAtleta[id]||[]).map(x=>{const d=S.divise[x];return`${d.taglia} n.${d.numero}${(d.modello||'STANDARD')!=='STANDARD'?' '+d.modello.toLowerCase():''}${d.daRestituire?' (da cambiare)':''}`}).join(', '),
      a.inUscita?'sì':'',ancheIn(id).join(', ')])},
  async applica(righe,prova,nr=riga0){
   const D=derive();const r=nuovoEsito();
   const squadre=[...(D.set.squadre||[])];
   const viste=new Set(squadre.map(x=>KEY(x.nome)));
   const gia=new Map(Object.values(S.atlete).map(a=>[KEY(a.squadra+'|'+a.cognome+'|'+a.nome),a]));
   const visti=new Set();let sqScritte=false;
   for(const [i,riga] of righe.entries()){

    let nota=COL(riga,3);
    if(sembraRecapito(nota)){r.avvisi.push(`${q}: ${cog} ${nom}: la nota sembra contenere un recapito e non viene caricata (il programma non conserva dati personali)`);nota=''}
    const k=KEY(sq+'|'+cog+'|'+nom);
    if(visti.has(k)){r.avvisi.push(`${q}: ${cog} ${nom} (${sq}) compare più volte nel foglio: riga ignorata`);r.saltati++;continue}
    visti.add(k);
    const esiste=gia.get(k);
    if(esiste){if(COL(riga,4)&&(esiste.attiva===false)!==NO(COL(riga,4)))r.avvisi.push(`${q}: ${cog} ${nom}: nel foglio lo stato attivo è diverso da quello nel programma; non modificato`);
      r.saltati++;continue}
    const altrove=Object.values(S.atlete).filter(a=>KEY(a.cognome+'|'+a.nome)===KEY(cog+'|'+nom)&&KEY(a.squadra)!==KEY(sq));
    if(altrove.length)r.avvisi.push(`${q}: ${cog} ${nom} è già in ${altrove.map(a=>teamLabel(a.squadra)).join(', ')}: viene creata una seconda scheda (atleta in due squadre?)`);
    if(!viste.has(KEY(sq))){squadre.push({nome:sq,includi:true,modelloDivisa:'STANDARD',ordine:prossimoOrdine(squadre)});viste.add(KEY(sq));r.squadreNuove.push(sq)}
    if(!prova){
      // Le squadre prima degli atleti: se il caricamento si interrompe a meta',
      // gli atleti gia' scritti hanno comunque la loro squadra.
      if(r.squadreNuove.length&&!sqScritte){await S.db.doc('settings/main').update({squadre});sqScritte=true}
      await S.db.collection('atlete').add({squadra:sq,cognome:cog,nome:nom,attiva:!NO(COL(riga,4)),note:nota});
    }
    r.creati++}
   if(!prova&&r.squadreNuove.length)await S.db.doc('settings/main').update({squadre});
   return r}},

 divise:{
  nome:'Divise da gara',
