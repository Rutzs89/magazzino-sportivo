[package]
name = "magazzino"
version = "0.3.13"
description = "Magazzino divise e materiale per societa sportive"
authors = ["Andrea Rota"]
edition = "2021"

[lib]
# Il suffisso `_lib` evita il conflitto con il nome del binario su Windows.
name = "magazzino_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
base64 = "0.22"
calamine = { version = "0.26", features = ["dates"] }
rust_xlsxwriter = "0.79"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
